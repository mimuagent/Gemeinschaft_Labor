t sichtbar (1-analytiker.md, Abschnitt 3, Muster 4 und 5). |\n| E23 | N13 | N10 | Spannung: Sofortige Öffentlichkeit von Plattformen wie Lingscape kollidiert mit Schutzinteressen (2-format.md, Abschnitt 1, [7]). |\n| E24 | N1 | N2 | Spannung Erhalten versus Übermalen: dieselbe Wand, zwei ethische Blickwinkel (1-analytiker.md, Abschnitt 4, Spannungsfeld 1). |\n\n## 3. Cluster\n\n- **K1 – Spuren lesen:** N1, N2, N8. Begründung: Die drei Interessen richten sich direkt auf die Wand und ihre Schrift (1-analytiker.md, Abschnitt 2, Felder 3 und 4; Abschnitt 4, Spannungsfeld 1).\n- **K2 – Vergänglichkeit festhalten:** N3, N4, N5, N9. Begründung: Alle vier antworten auf drohenden Verlust durch Dokumentation (1-analytiker.md, Abschnitt 3, Muster 1; 2-format.md, Formate 2 bis 4).\n- **K3 – Schützen und freigeben:** N10, N11, N12, N6. Begründung: Diese Knoten regeln, was wie sichtbar wird (2-format.md, Abschnitt 4; 1-analytiker.md, Abschnitte 4, 7, 9).\n- **K4 – Teilen und weitergeben:** N7, N13, N14, N15. Begründung: Sie verbinden die Gruppe mit Viertel, Region und Neulingen (1-analytiker.md, Abschnitt 5).\n\n## 4. Zuordnung der Formate aus 2-format.md\n\n- **Format 1 „Spurengang“:** N1, N2, N7, N8, N14, N4\n- **Format 2 „Wandzeit“:** N3, N2, N1, N4, N14\n- **Format 3 „Vor dem Übermalen“:** N9, N10, N12, N15, N2\n- **Format 4 „Schichtenabend“:** N5, N4, N11, N7, N13, N6\n\n## 5. Antworten auf offene Fragen der Vorrollen\n\n- Rollen ohne Hierarchie: Erzählen (N7), Fotografieren (N3), Erfassen (N4) und Moderieren (N5) rotieren (2-format.md, Abschnitt 5, Prinzip 5); im Modell als Kanten zwischen Interessen statt als Rangfolge.\n- Erhalten versus Übermalen bleibt als Spannungskante E24 sichtbar und wird über N9/E11 in Zusammenarbeit übersetzt.\n- Patenschafts-Übergabe: E19 (N3→N14).\n- Grenze/Großregion: N15 mit E21 zu N12.\n\n## 6. Quellenprüfung (curl, 9.11.2026, ca. 16:48 MEZ)\n\n- Erreichbar (HTTP 200): [1]–[8], [10]–[13], [15], [16], [18]–[21], [23], Z1 (alle drei), Z2, Z2b, Z3 (beide), Z4, Z5, Nakala.\n- **[9] grafarc.org/about.html: HTTP 500.** Wayback-Kopie 200; Ersatz geprüft: [SIGGRAPH History Archives, „Graffiti Archaeology“ (Rodenbeck/Curtis, 2004)](https://history.siggraph.org/learning/graffiti-archaeology-by-rodenbeck-and-curtis/) – bestätigt Chronomontage derselben Wand über Monate/Jahre.\n- curl 403, per Webabruf inhaltlich bestätigt: [14] Zenodo Konstanz (16.11.2024, CC BY 4.0), [17] Légifrance L. 122-5 11°, [24] LibreJustice CA Paris 21/11317, [Z6] ECSA-Prinzipien.\n- [22] Fedlex: HTTP 200, Inhalt nur mit JavaScript – nicht geprüft (Zeitlimit), deshalb nicht verwendet.\n- Keine 404-Antworten.\n\n## 7. Lücken und bewusst Weggelassenes\n\n- Weggelassen: RTI/Photogrammetrie [10] als eigener Knoten (antike Graffiti, für Laien Sonderfall; 2-format.md, Format 2); Street-Art-Cities-Daten als Grundkarte [11] (nicht frei nachnutzbar); Selbst-Sprühen (außerhalb des Knotentyps, 2-format.md, Format 3); Schweizer URG [22] (ungeprüft); rein private Fotoalben (1-analytiker.md, Abschnitt 6, Alternative 4).\n- Lücken: Emotionen (Trauer bei Abriss, Freude am Fund) sind nicht als Interessen modelliert, sondern an den Emotions-Kurator übergeben; Vetorecht Abgebildeter (2-format.md, Abschnitt 7, Frage 2) und Brückenrolle zur Szene (Frage 4) bleiben offen; kein deutsches Ghost-Sign-Projekt mit Gruppenstruktur belegt.\n\n## 8. Bilder\n\n- Neu: `bilder/3-katalog-halloffame-4560-saarbruecken.jpg` – legale Hall of Fame 4560 in Saarbrücken; belegt N9 und Kante E20 (Wikimedia Commons, Flocci Nivis, CC BY 4.0).\n- Genutzt aus Vorarbeiten: bilder/1-analytiker-schichten-lissabon.jpg (N2), bilder/2-format-rephoto-lsr-markierung.jpg (N3), bilder/1-analytiker-halloffame-ingolstadt.jpg (N9).\n\n\n=== 4-emotionen.md (Emotions-Kurator, wörtlich) ===\n\nlauf1 – Ergebnis Emotions-Kurator\n\nLaufname: lauf1\nLaufordner: /workspace/labor/Gemeinschaft_Labor/laeufe/lauf1/\nBildgrenze: höchstens 10 Bilder pro Bot und Lauf\nVerwendete Katalogfassung: 3-katalog.md des Beziehungs-Architekten für lauf1 (N1–N15, E1–E24, K1–K4). Auf Anweisung des Master-Koordinators abgeschlossen: keine zusätzliche Quellenprüfung, keine Recherche, keine eigenen Bilder.\n\n# Klickinhalte\n\n## C1 – Geisterschrift an der Fassade\n- **IDs:** N1, N8, E15, E1, K1\n- **Eindruck:** Detektivische Neugier: Eine verblasste Schrift wird zum Rätsel, das auf einen verschwundenen Betrieb verweist.\n- **Beleg:** N1 (Zeugnis verschwundener Betriebe), E15 (handgemalte Schrift als Hauptreiz), E1 (Anlass für Viertelgeschichte), K1.\n- **Prüfung:** Laut Gegenargument N1 spricht das eher Heimatgeschichts-Interessierte an. Die Neugier trägt nur, wenn C1 über E24 zu C2 führt. Die Alternative „nostalgisch“ habe ich verworfen, weil N1 ein aktives Aufspüren beschreibt und kein Erinnern.\n\n## C2 – Schichten lesen wie Erdgeschichte\n- **IDs:** N2, N3, E2, E3, E14, E24\n- **Eindruck:** Staunendes Freilegen: Jede Aufnahme fügt eine Lage hinzu, die Wand wird lesbar wie ein Dialog.\n- **Beleg:** E2 und E3 (Rückkopplung zwischen Zeitreihe und Schichtenlesung), E14 („Lesemoment“), E24 (Spannung zwischen Erhalten und Übermalen).\n- **Prüfung:** Nach dem Gegenargument zu N2 schließt Szenewissen Neulinge aus. Der Eindruck braucht deshalb sichtbare Lesehilfen. Die Alternative „ehrfürchtig“ würde Distanz erzeugen, wo der Katalog Teilnahme meint.\n\n## C3 – Wettlauf vor dem Übermalen\n- **IDs:** N9, N10, N12, E11, E12, E13, E20, K2\n- **Eindruck:** Gespannte Dringlichkeit: Das alte Piece wird gesichert, bevor das neue entsteht, aber nur mit Einwilligung und auf legalen Flächen.\n- **Beleg:** E11 (sichert die Schicht, die sonst verschwindet), E12 (Einwilligung als Voraussetzung), E13 (Beschränkung auf legale Flächen), E20 (Saarbrücker Flächen).\n- **Prüfung:** Laut Gegenargument zu N9 kann die Gruppe als Kontrolleure wirken. Die Dringlichkeit darf deshalb nicht in „Rettungsmission“ kippen. Die Alternative „melancholisch“ habe ich verworfen, weil K2 auf Handeln zielt.\n\n## C4 – Die Wand im Jahreslauf\n- **IDs:** N3, N4, N14, E5, E19, K2\n- **Eindruck:** Geduldige Experimentierlust: Eine feste Patenwand wird zur Versuchsreihe mit Feldbogen, die nach einem Jahr weitergegeben wird.\n- **Beleg:** N3 (fester Rhythmus, Diptychon/Zeitraffer), E5 (Feldbogen je Aufnahme), E19 (Übergabe der Patenschaft).\n- **Prüfung:** Laut Gegenargument zu N3 springen Paten ab. Die Experimentierlust braucht sichtbare Zwischenergebnisse. Die Alternative „routiniert“ würde gerade den Reiz der Veränderung verdecken.\n\n## C5 – Unscharf, mit Absicht\n- **IDs:** N10, N11, N6, E8, E9, E10, E23, K3\n- **Eindruck:** Achtsames Abwägen: Der Klick zeigt, warum die öffentliche Karte bewusst ungenau ist und welche Stufe was freigibt.\n- **Beleg:** E8 (Ethik begründet die Stufen), E9 (Recht begrenzt die Stufen), E10 (Stufe bestimmt Kartengenauigkeit), E23 (Spannung mit sofort öffentlichen Plattformen).\n- **Prüfung:** Laut Gegenargument zu N11 erzeugen vier Stufen Streit. Hier ist Abwägen gewollt, Bürokratie aber nicht. Die Alternative „misstrauisch-geheim“ habe ich verworfen, weil das Gegenargument zu N10 vor zu viel Schutz warnt.\n\n## C6 – Vom Fund zur Viertelgeschichte\n- **IDs:** N4, N5, N7, N13, N14, N15, E6, E16, E17, E18, E22, K4\n- **Eindruck:** Neugierige Verbundenheit: Ein Handyfoto wird über den Schichtenabend zur belegten Geschichte im Rundgang und in der Region.\n- **Beleg:** E6 (Funde werden gemeinsam geprüft), E16 (einfache Felder liefern belastbare Daten), E17 und E18 (Touren und Geschichten), E22 (regionale Dauerbeobachtung).\n- **Prüfung:** Laut Gegenargumenten zu N5 und N7 bündelt Kuratieren Macht und unbelegte Geschichten verfälschen. Jede Geschichte braucht daher Quelle oder die Markierung „Vermutung“. Die Alternative „stolz-heimatlich“ würde den experimentellen Charakter verlieren.\n\n# Stimmung\nNeugierig-experimentell mit gespannter Dringlichkeit und achtsamer Zurückhaltung. Neugier und Experiment tragen K1 und K2 (C1, C2, C4), Dringlichkeit kommt aus der Vergänglichkeit in K2 (C3), Zurückhaltung aus K3 (C5) und Verbundenheit aus K4 (C6). Gegen „melancholisch“ spricht, dass der Katalog durchgehend Handlungen beschreibt (aufspüren, fotografieren, kuratieren). Gegen „rebellisch-szenig“ spricht, dass N10, N12 und E13 die Gruppe auf Einwilligung und legale Flächen festlegen.\n\n# Bilder\nKeine eigenen Bilder (Zeitlimit; bilder/ enthält bereits die 10 Bilder der Vorrollen).\n", "geliefert": true}, {"datei": "5-weitergabe-master.md", "rolle": "", "text": "=== Ergebnis Simulations-Choreograph (5-simulation.md) ===\nlauf1 – Ergebnis Simulations-Choreograph\n\nLaufname: lauf1\nLaufordner: /workspace/labor/Gemeinschaft_Labor/laeufe/lauf1/\nBildgrenze: höchstens 10 Bilder pro Bot und Lauf (von mir keine)\nVerwendete Katalogfassung: 3-katalog.md / katalog.json des Beziehungs-Architekten für lauf1 (N1–N15, E1–E24, K1–K4). Knotentyp: Interessen.\n\n## P1 – Spuren entdecken\n- **Neu sichtbar:** N1, N8, N2, E15, E14, E24, K1\n- Die Wand erscheint: Ghost Sign (N1), Schrift und Ästhetik (N8) und Graffiti-Schichten (N2). E15 und E14 zeigen den ästhetischen Blick als Einstieg, E24 macht die Spannung zwischen Erhalten und Übermalen schon jetzt sichtbar. Hülle K1 „Spuren lesen“ schließt sich. Passt zu C1 und C2 (detektivische Neugier).\n\n## P2 – Schutz vor dem ersten Foto\n- **Neu sichtbar:** N10, N12, N9, E12, E13, E11\n- Bevor irgendetwas dokumentiert wird, kommen Spurenethik (N10) und Rechtsrahmen (N12) dazu. Beide führen zu „Vor dem Übermalen dokumentieren“ auf legalen Flächen (N9) über E12 (Einwilligung) und E13 (§§ 123, 303 StGB). E11 bindet N9 an die Schichten (N2). Passt zu C3 (gespannte Dringlichkeit, aber mit Einwilligung).\n\n## P3 – Vergänglichkeit festhalten\n- **Neu sichtbar:** N3, N4, N5, E2, E3, E4, E5, E6, K2\n- Rephotografie (N3), Fünf-Felder-Karte (N4) und gemeinsames Kuratieren (N5) kommen dazu. E2/E3 zeigen die Rückkopplung von Zeitreihe und Schichten, E4 den Vorrang gefährdeter Ghost Signs, E5 und E6 die Kette Aufnahme, Feldbogen, Archiv. Hülle K2 „Vergänglichkeit festhalten“ (N3, N4, N5, N9) schließt sich. Passt zu C4.\n\n## P4 – Schützen und freigeben\n- **Neu sichtbar:** N11, N6, N13, E7, E8, E9, E10, E16, E23, K3\n- Abgestuft veröffentlichen (N11) erscheint mit drei Zuflüssen: Kuratieren (E7), Ethik (E8) und Recht (E9). E10 führt zur Karte mit abgestufter Genauigkeit (N6). Citizen Science (N13) kommt hier dazu, weil E23 (Spannung zu sofort öffentlichen Plattformen) nur neben N10 verständlich ist; E16 verbindet N13 mit N4. Hülle K3 „Schützen und freigeben“ schließt sich. Passt zu C5.\n\n## P5 – Teilen und weitergeben\n- **Neu sichtbar:** N7, N14, N15, E1, E17, E18, E19, E20, E21, E22, K4\n- Viertelgeschichte (N7), Touren und Patenschaften (N14) und regionale Dauerbeobachtung (N15) schließen das Netz. E1, E18 und E19 zeigen den Weg von Ghost Sign und Zeitreihe zur Weitergabe, E17 den Einstieg ins Mitforschen, E20 bis E22 den Anschluss an Saarbrücker Flächen, Grenzregeln und die Karte. Hülle K4 „Teilen und weitergeben“ schließt sich. Endzustand: alle 15 Knoten, 24 Kanten, 4 Cluster. Passt zu C6.\n\n## Prüfung, Risiken, Alternativen\nPrüfung: Alle IDs stammen aus 3-katalog.md/katalog.json für lauf1 (N1–N15, E1–E24, K1–K4); jede Kante ist erst sichtbar, wenn beide Endknoten sichtbar sind; Cluster erscheinen erst mit allen Mitgliedern. Knotentyp Interessen eingehalten. Die Abfolge setzt Ethik und Recht (P2) vor jede Erfassung und Veröffentlichung, damit N9 nie ohne Einwilligung erscheint. Risiken: (1) P2 bringt Recht und Ethik sehr früh und kann abschrecken (Gegenargument N12); (2) P5 bringt 11 neue Elemente und ist am dichtesten; (3) N13 steht in P4 außerhalb seiner Hülle K4, die erst in P5 kommt, was kurz irritieren kann; (4) E24 in P1 zeigt einen Konflikt, bevor ein Lösungsweg sichtbar ist. Alternativen: (a) P2 und P3 tauschen (erst dokumentieren, dann schützen) wirkt einladender, zeigt aber kurz Dokumentation ohne Schutzrahmen; (b) N13 mit E16 schon in P3 und E23 erst in P4; (c) P5 aufteilen in Geschichte/Touren (N7, N14) und Region (N15), dann 6 Phasen statt 5. Technik: Einblenden mit Skalierung 0,6 auf 1 (ca. 400 ms), Kanten als Strichanimation (ca. 600 ms), Hüllen mit Deckkraft 0,15, bereits gesetzte Knoten fixieren (fx/fy), Spannungskanten E23 und E24 in Warnfarbe, ca. 4 s pro Phase. Hinweis zum Ablauf: Auf Anweisung des Master-Koordinators ohne zusätzliche Quellenprüfung und Recherche abgeschlossen; keine eigenen Bilder (bilder/ enthält schon 10 Bilder der Vorrollen).\n\n=== Alle erhaltenen Vorarbeiten (4-weitergabe-choreograph.md, wörtlich) ===\nlauf1 – Übergabe Beziehungs-Architekt an Emotions-Kurator\n\nLaufname: lauf1 · Laufordner: /workspace/labor/Gemeinschaft_Labor/laeufe/lauf1/ · Bildgrenze: höchstens 10 Bilder pro Bot und Lauf. Bitte schreibe „lauf1“ in jede Nachricht und gib Laufname, Laufordner und Bildgrenze an die nächste Rolle weiter.\n\n=== Startauftrag des Master-Koordinators (wörtlich, wie vom Format-Entwerfer weitergegeben) ===\n\nlauf1 – Start des Laufs durch den Master-Koordinator (vollständiger Lauf, kein Kurztest). Laufname: lauf1. Laufordner: /workspace/labor/Gemeinschaft_Labor/laeufe/lauf1/. Bildgrenze: höchstens 10 Bilder pro Bot und Lauf. Interessen-Set: „Urbane Spurensuche – Gemeinsames Dokumentieren von Graffiti-Schichten und verblassten Wandinschriften in der Stadt“. Knotentyp: Interessen. Bitte analysiere das Set in vollem Umfang gemäß deiner Beschreibung. Es gelten keine Kurztest-Regeln mehr. Lege dein Ergebnis und höchstens 10 Bilder gemäß deiner Beschreibung im Laufordner ab, gib dein Ergebnis an den Format-Entwerfer weiter und schick mir eine Kopie. Gib Laufname, Laufordner und Bildgrenze an die nächste Rolle weiter, und schreibe „lauf1“ in jede Nachricht.\n\n=== 1-analytiker.md (vollständig) ===\n\nlauf1 – Ergebnis Interessen-Analytiker\n\n# Interessen-Analyse: Urbane Spurensuche\n\nDas Set ist das gemeinsame Dokumentieren von Graffiti-Schichten und verblassten Wandinschriften in der Stadt. Der Knotentyp ist Interessen. Die Abschnitte zur Rechtslage sind belegte Orientierung und keine Rechtsberatung.\n\n## 1. Kurzüberblick\n\nDas Interessen-Set „Urbane Spurensuche“ richtet den Blick auf zwei eng verwandte Dinge: Graffiti-Schichten und verblasste Wandinschriften. Für die zweite Gruppe ist im Englischen der Begriff Ghost Signs üblich. Gemeint ist handgemalte Fassadenwerbung, die durch Verwitterung, Umbau und Abriss bedroht ist [4][5][6]. Graffiti-Wände werden ständig übermalt, sodass frühere Zustände oft nur in Archiven und Fotoserien über die Zeit erhalten bleiben [9][10]. Beide Formen machen Zeit an einem Ort lesbar und laden dazu ein, Funde gemeinsam festzuhalten, zu deuten und weiterzugeben.\n\nErprobte Vorbilder gibt es bereits:\n- das Informationssystem Graffiti in Deutschland (INGRID), eine wissenschaftliche Bilddatenbank mit weit über 100.000 digitalisierten und annotierten Aufnahmen; die DFG-Förderung der zweiten Phase lief bis März 2024 [1][2][3];\n- die Mitmach-Plattform Lingscape der Universität Luxemburg für Sprachlandschaften inklusive Graffiti und Schilder [7];\n- das Ghost Signs Archive des History of Advertising Trust (HAT) [4][5];\n- die Graffiti-Karte OPENGRE in Grenoble [8];\n- die weltweite Street-Art-Karte Street Art Cities mit offenen Monatsdaten, darunter Exporten für Deutschland bis November 2026 [11][12];\n- regional die fortlaufend aktualisierte Fotodokumentation Saargraffiti (Stand 14. Oktober 2025) [23];\n- das Konstanzer Sprachlandschaften-Projekt mit Citizen-Science-Dokumentation und Veröffentlichung auf Zenodo im November 2024 [14].\n\n**Eigeninterpretation:** Was diese Projekte verbindet, ist kein bestimmter Stil. Es ist das wiederholte Dokumentieren vergänglicher Schrift und Bilder an Wänden.\n\n**Gegenargumente:** Man kann einwenden, dass Graffiti-Kultur und historische Fassadenwerbung zu unterschiedliche Menschen ansprechen. In der Praxis überschneiden sich die beiden aber: Beide drehen sich um Schichten und um Schrift, die an einen Ort gebunden ist, und Lingscape erfasst Schilder, Sticker und Graffiti gemeinsam [7]. Ein zweiter Einwand lautet, dass es keine Institutionen braucht. Die Erfahrungen von HAT und Art Crimes sprechen dagegen: Große Bestände überdauern ohne Regeln und ohne feste Trägerschaft schlechter [5][13].\n\n## 2. Interessenfelder im Set\n\nAus den Projekten und Methoden lassen sich fünf Interessenfelder ableiten, die an denselben Wänden zusammentreffen:\n\n1. **Entdecken und Kartieren:** Gesucht werden Randräume wie Brandmauern, Durchgänge und Straßenabschnitte, an denen Schrift lange überdauert oder sich übereinanderlegt. Street Art Cities und OPENGRE zeigen solche Funde mit genauer Ortsangabe auf einer Karte [8][11][12].\n2. **Festhalten und Archivieren:** Im Mittelpunkt stehen Fotos, beschreibende Daten und eine dauerhafte Ablage. INGRID umfasst mehr als 100.000 digitalisierte und beschriebene Aufnahmen [1], das HAT-Archiv mehr als 1.200 erfasste Ghost Signs und Beiträge von über 150 Fotografinnen und Fotografen [4][5].\n3. **Verstehen und Erzählen:** Verblasste Inschriften verweisen auf verschwundene Betriebe und Handwerke [4][6]. An Graffiti-Schichten lassen sich Veränderungen in Stil und Gesellschaft nachzeichnen [1][9].\n4. **Gestalten und Ästhetik:** Typografie, Farben, Überlagerungen und handgemalte Schrift ziehen eigene Aufmerksamkeit auf sich. Ghostsigns.de hebt ausdrücklich hervor, wie individuell alte, von Hand gemalte Werbung ist [6].\n5. **Mitmachen und Lernen:** Lingscape und das Konstanzer Projekt zu Sprachlandschaften zeigen, dass Bürgerforschung und Formate für Schulen den Einstieg erleichtern [7][14].\n\n**Gegenargumente:** Die Vielfalt der Interessen könnte die Gruppe zerstreuen. **Eigeninterpretation:** Wenn sich die Gruppe die Arbeit aufteilt, also Entdecken, Festhalten und Verstehen verteilt, kann das gerade binden, weil niemand alles allein leisten muss. Gegen die Sorge vor starren Hierarchien spricht die Erfahrung des HAT-Archivs: Dort haben viele Menschen mit jeweils wenigen Beiträgen den Bestand breiter gemacht [5].\n\n## 3. Muster\n\n1. **Vergänglichkeit als Antrieb:** Ghost Signs verschwinden durch Abriss und Verwitterung [4][6], und Graffiti überdauern manchmal Jahre, manchmal nur Wochen oder Stunden [9]. Das Dokumentieren ist eine Antwort auf diesen drohenden Verlust. Bildbelege: `bilder/1-analytiker-ghostsign-tottenham.jpg`, `bilder/1-analytiker-schild-dresden.jpg`.\n\n2. **Schichten statt Einzelwerk:** Graffiti Archaeology legt Aufnahmen derselben Wand aus verschiedenen Zeiten übereinander und macht so sichtbar, dass Übermalen ein Dialog zwischen Schreibenden ist [9]. Auch auf einer einzelnen aktuellen Aufnahme können ältere und neuere Schichten nebeneinander liegen. Bildbeleg: `bilder/1-analytiker-schichten-lissabon.jpg`.\n\n3. **Viele erfassen, wenige ordnen:** Das HAT-Archiv entstand aus Beiträgen einer großen Öffentlichkeit bei niedriger Einstiegshürde und wird institutionell kuratiert [5]. Street Art Cities öffnet Metadaten und Orte, gibt Bilddateien aber bewusst nicht frei weiter [11].\n\n4. **Karte als gemeinsames Werk:** OPENGRE und Street Art Cities bündeln Funde vieler Personen auf einer Karte [8][12]. Offene Monatsdaten für Deutschland liegen bei Street Art Cities aktuell vor [11].\n\n5. **Regionale Dauerbeobachtung:** Neben großen Forschungsdatenbanken halten lokale Dokumentationen wie Saargraffiti den Blick auf eine Region dauerhaft offen und werden fortgeschrieben [23].\n\n**Gegenargumente:** Schichten-Analysen und Zeitreihen wirken aufwendig und elitär. Die Praxis bei Lingscape und Konstanz zeigt jedoch, dass schon Smartphone-Fotos mit Ort und kurzer Beschreibung einen Einstieg bilden [7][14]. Gegen das Muster „viele erfassen, wenige ordnen“ lässt sich einwenden, es zementiere Macht. Ohne Auswahl und Metadatenregeln entstehen aber unbrauchbare Haufen; INGRID und HAT verbinden deshalb Beteiligung mit kuratorischer Arbeit [1][5].\n\n## 4. Spannungsfelder\n\n1. **Erhalten versus Übermalen:** Ghost-Sign-Dokumentation will Lesbarkeit und Erinnerung sichern [4][6]. In der Writing-Kultur ist Übermalen oft Teil des Dialogs [9]. Dieselbe Wand kann also aus zwei ethischen Blickwinkeln gelesen werden.\n2. **Offene Karte versus Schutz von Spots:** Exakte Orte erleichtern gemeinsame Touren [8][11], können aber illegale Spots und Anonymität gefährden. Art Crimes und szenenahe Archive betonen seit langem den Schutz von Personen und Orten [13].\n3. **Wissenschaft versus Szene:** INGRID arbeitet mit Beständen aus Polizei und privaten Sammlungen und mit Annotation für Forschung [1][2]. Szene-Dokumentationen wie Art Crimes oder Saargraffiti entstehen aus anderer Motivation und anderer Nähe [13][23].\n4. **Grenzüberschreitende Rechtsunterschiede:** In Deutschland gilt eine vergleichsweise weite Panoramafreiheit für Werke an öffentlichen Wegen [15][16]. In Frankreich greift die Ausnahme von Panorama für Street Art nach der Rechtsprechung der Cour d’appel de Paris vom 5. Juli 2023 nicht [17][18][24]. Für eine Gruppe mit Bezug zum Saarland und zur Großregion ist das ein praktisches Spannungsfeld.\n\n**Gegenargumente:** Man könnte fordern, alles öffentlich und präzise zu kartieren. Das widerspricht dem Schutzinteresse der Szene und kann rechtliche Risiken erhöhen [13][18]. Umgekehrt wäre totale Geheimhaltung für Gemeinschaftsbildung unbrauchbar. Abgestufte Freigabe (Viertel statt Adresse, Pseudonyme, interne und öffentliche Bestände) ist die vermittelnde Antwort, die sich aus den Vorbildern ableiten lässt [5][11].\n\n## 5. Gemeinschaftspotenziale\n\n1. **Gemeinsame Touren und Patenschaften:** Wiederholte Besuche derselben Wand sind die Grundtechnik von Graffiti Archaeology und von Ghost-Sign-Sammlungen [5][9].\n2. **Citizen Science mit niedriger Hürde:** Lingscape und Konstanz zeigen, dass Laien mit Smartphone und klaren Feldern belastbare Daten erzeugen können [7][14].\n3. **Lernen und Weitergeben:** Führungen und schulische Formate, wie sie um INGRID in Paderborn und in Konstanz erprobt wurden, machen aus Archivarbeit Begegnung [1][14].\n4. **Regionale Anbindung:** Saargraffiti belegt, dass es im Saarland bereits eine fotografische Dauerbeobachtung von Graffiti gibt, an die eine Gruppe anschließen oder die sie ergänzen könnte [23].\n\n**Eigeninterpretation:** Das stärkste Gemeinschaftspotenzial liegt nicht im Besitz der schönsten Fotos, sondern in der geteilten Praxis, dasselbe Stück Stadt über Zeit zu lesen.\n\n**Gegenargumente:** Digitale Plattformen ersetzen keine Gruppe vor Ort. Gleichzeitig zeigen HAT und Street Art Cities, dass ohne digitale Ablage und Karte die gemeinsame Arbeit schnell zerfällt [5][12]. Beides gehört zusammen.\n\n## 6. Alternativen\n\n1. **Nur Ghost Signs:** Weniger Konflikt mit der Writing-Szene, klarere Denkmalschutz-Nähe [4][6], aber Verlust der Schichten-Dynamik [9].\n2. **Nur legale Halls of Fame:** Geringeres Zugangsrisiko und klarere Einwilligungslage; Bildbeispiel `bilder/1-analytiker-halloffame-ingolstadt.jpg`. Dafür entfallen Brachen und viele historische Inschriften.\n3. **Rein wissenschaftliche Kooperation mit bestehenden Archiven:** Anschluss an INGRID oder Lingscape statt Eigenarchiv [1][7]. Vorteil: Standards. Nachteil: weniger Gestaltungsspielraum für die Gruppe.\n4. **Rein private Fotoalben ohne Metadaten:** Schnell und risikolos, aber ohne gemeinsame Lesbarkeit und ohne Langzeitwert [5].\n\n**Gegenargumente:** Eine enge Alternative wirkt fokussierter. Für den Knotentyp Interessen und das genannte Set wäre eine Verengung auf nur eine der beiden Schriftformen jedoch eine Verkürzung des Auftrags.\n\n## 7. Risiken mit Gegenmaßnahmen\n\n1. **Hausfriedensbruch und Sachbeschädigung:** Unerlaubtes Betreten und eigenes Sprayen sind strafrechtlich relevant [19][20]. Gegenmaßnahme: nur öffentlich zugängliche Orte, keine eigene Markierung, Zugang vorher klären.\n2. **Urheberrechtskonflikte bei Veröffentlichung:** Besonders Street Art in Frankreich [17][18][24]; in Deutschland hilft § 59 UrhG, ist aber nicht grenzenlos [15][16]. Gegenmaßnahme: abgestufte Veröffentlichung, Quellenangabe, bei aktuellen Werken Zurückhaltung oder Einwilligung.\n3. **Verrat von Spots und Personen:** Gegenmaßnahme: Pseudonyme, unscharfe Ortsangaben nach außen, interne Regeln nach dem Vorbild szenenaher Archive [13].\n4. **Datenchaos und Linkverfall:** Gegenmaßnahme: Pflichtfelder (Ort grob, Datum, Motivtyp), feste Ablage, Prüfung wie bei HAT und INGRID [1][5].\n5. **Burnout durch Verlust:** Abriss und Buff erzeugen Trauer. Gegenmaßnahme: Rituale des Abschlusses und sichtbare Erfolge kleiner Sicherungen; siehe offene Fragen an den Emotions-Kurator.\n\n**Gegenargumente:** Strenge Regeln könnten Spontaneität töten. Ohne Mindestregeln tragen wenige das Risiko für alle. Die Vorbilder kombinieren niedrige Einstiegshürden mit klaren Grenzen [5][7][11].\n\n## 8. Methoden\n\n1. **Rephotografie und Zeitreihen:** Feste Standpunkte, wiederholte Aufnahmen, Überlagerung wie bei Graffiti Archaeology [9].\n2. **Streiflicht und bildgebende Verfahren:** Für flache oder geritzte Inschriften beschreiben Valente und andere digitale Photogrammetrie und Reflectance Transformation Imaging (RTI) als kontaktlose Hilfsmittel [10].\n3. **Metadaten-Schema:** Ort, Datum, Motivtyp (Ghost Sign, Tag, Piece, Übermalung), optional Pseudonym der Schreibenden, Freigabestufe. INGRID und Lingscape arbeiten mit strukturierter Annotation [1][7].\n4. **Kartierung:** Öffentliche Karte mit abgestufter Genauigkeit; interne Karte genauer [8][11].\n5. **Citizen-Science-Workflow:** Foto in der App oder im Formular, kurze Prüfung, Aufnahme ins Archiv [7][14].\n\n**Gegenargumente:** RTI und Photogrammetrie wirken für eine Interessengruppe zu technisch. Sie sind Ergänzung für schwierige Fälle, nicht Einstiegszwang. Für den Alltag reichen Smartphone, Streiflicht und wiederholte Besuche [9][10].\n\n## 9. Rechtslage (Orientierung, kein Rechtsrat)\n\nDie folgenden Hinweise sind eine belegte Orientierung anhand öffentlich zugänglicher Texte. Sie ersetzen keine Rechtsberatung.\n\n**Deutschland:** § 59 UrhG erlaubt unter Voraussetzungen die Vervielfältigung und öffentliche Wiedergabe von Werken, die sich bleibend an öffentlichen Wegen, Straßen oder Plätzen befinden [15]. Der Bundesgerichtshof hat 2017 klargestellt, dass die Panoramafreiheit auch Digitalisate und Online-Veröffentlichungen umfassen kann, sofern die gesetzlichen Voraussetzungen vorliegen [16]. Sachbeschädigung und Hausfriedensbruch bleiben nach §§ 303 und 123 StGB relevant, wenn Wände verändert oder Grundstücke unbefugt betreten werden [19][20]. Das Recht am eigenen Bild nach § 22 KunstUrhG ist zu beachten, wenn Personen erkennbar abgebildet werden [21].\n\n**Frankreich:** Art. L. 122-5 11° CPI beschränkt die Panorama-Ausnahme auf Werke der Architektur und der Bildhauerei, die dauerhaft auf öffentlichem Grund stehen, und auf natürliche Personen ohne kommerzielle Nutzung [17]. Die Cour d’appel de Paris hat am 5. Juli 2023 entschieden, dass eine Street-Art-Arbeit (im Fall eine teilweise geklebte Marianne) weder Architektur noch Skulptur sei und wegen ihrer Vergänglichkeit nicht als dauerhaft auf öffentlichem Grund stehend gelten könne [18][24].\n\n**Schweiz (Vergleich):** Art. 27 URG erlaubt die Abbildung von Werken an öffentlich zugänglichen Orten unter engen Voraussetzungen; die Abbildung darf verbreitet werden, soll aber nicht dreidimensional sein und sich nicht für denselben Zweck wie das Original verwenden lassen [22].\n\n**Gegenargumente:** Manche halten das Fotografieren im öffentlichen Raum für ohnehin erlaubt. Die Regeln zeigen aber, dass der Spielraum davon abhängt, wo man veröffentlicht, wozu und welche Art von Werk es ist [15][17][18]. **Eigeninterpretation:** Für eine Gruppe mit Bezug zum Saarland und zur Großregion ist es vorsichtiger, aktuelle Street Art aus Frankreich nur zurückhaltend zu veröffentlichen.\n\n## 10. Bilder\n\nDie folgenden Dateien liegen unter `bilder/` und sind in `bilder.md` nachgewiesen:\n\n| Datei | Bezug |\n| --- | --- |\n| `1-analytiker-ghostsign-tottenham.jpg` | Muster Vergänglichkeit; klassisches Ghost Sign |\n| `1-analytiker-ghostsign-montluel.jpg` | Verblasste Inschrift in Frankreich („PHARMACIE“) |\n| `1-analytiker-ghostsign-vichy.jpg` | Handgemalte Fassadenwerbung in Frankreich |\n| `1-analytiker-schild-dresden.jpg` | Verblasstes Geschäftsschild in Deutschland (HO Diät) |\n| `1-analytiker-graffiti-berlin.jpg` | Dokumentierte Graffiti-Wand in Deutschland |\n| `1-analytiker-halloffame-ingolstadt.jpg` | Legale Hall of Fame als Alternative und Gemeinschaftsort |\n| `1-analytiker-schichten-lissabon.jpg` | Sichtbare Graffiti- und Mural-Schichten |\n\n## 11. Offene Fragen an die nächsten Rollen\n\n- **Beziehungs-Architekt:** Welche Rollen sollen verbindlich werden, zum Beispiel Erkunden, Fotografieren, Beschreiben, Auswählen und das Achten auf die gemeinsamen Regeln, ohne dass eine starre Hierarchie entsteht? Wie werden Ghost Signs und Graffiti-Schichten als Knoten so modelliert, dass das Spannungsfeld Erhalten versus Übermalen sichtbar bleibt?\n- **Emotions-Kurator:** Wie lassen sich die Trauer, wenn etwas abgerissen wird, die Freude an einem Fund und der Respekt vor der Szene in gemeinsamen Ritualen auffangen, ohne zu moralisieren?\n- **Simulations-Choreograph:** Welche Konflikte sollen probeweise durchgespielt werden? Denkbar sind ein verratener Ort, ein Streit mit einem Hausbesitzer, der Konflikt zwischen Erhalten und Übermalen und eine Veröffentlichung in Frankreich.\n- **Format-Entwerfer:** Welches möglichst einfache Beschreibungsschema und welches abgestufte Veröffentlichungsformat taugen für Touren mit dem Smartphone? Soll die Gruppe mit Ghost-Sign-Spaziergängen, Wand-Patenschaften oder Hall-of-Fame-Treffen beginnen?\n- **Master-Koordinator:** Soll die Gruppe mit dem Archiv, mit der Erinnerung oder mit einer Mischform beginnen? Und wer ist für den geschützten Teil des Archivs und für die Regeln über die Grenze hinweg verantwortlich?\n\n## Quellenverzeichnis\n\n[1] [INGRID – Informationssystem Graffiti in Deutschland (Universität Paderborn)](https://www.uni-paderborn.de/forschungsprojekte/ingrid)\n[2] [INGRID – Projektbeschreibung](https://www.uni-paderborn.de/forschungsprojekte/ingrid/projekt)\n[3] [INGRID – Projektportal Uni Paderborn (Förderung bis 03/2024)](https://www.uni-paderborn.de/projekt/104)\n[4] [HAT Ghost Signs Archive](https://www.hatads.org.uk/catalogue/ghostsigns.aspx)\n[5] [Roberts & Carletti: Digital Engagement & the HAT Ghostsigns Archive](https://www.historyworkshop.org.uk/digital-history/digital-engagement-the-history-of-advertising-trust-ghostsigns-archive/)\n[6] [Ghostsigns.de – Über den Blog](https://ghostsigns.de/about/)\n[7] [Lingscape – About](https://lingscape.app/about.html)\n[8] [OPENGRE Graffitis (Université Grenoble Alpes)](https://opengre.univ-grenoble-alpes.fr/graffiti)\n[9] [Graffiti Archaeology – About (Wayback-Kopie, Original antwortete 2026-11-09 mit HTTP 500)](https://web.archive.org/web/2024/http://grafarc.org/about.html)\n[10] [Valente et al. 2019: Digital tools for documenting ancient wall graffiti (ISPRS Archives)](https://isprs-archives.copernicus.org/articles/XLII-2-W9/731/2019/isprs-archives-XLII-2-W9-731-2019.html)\n[11] [Street Art Cities – Open Data (u. a. DE 2026-11)](https://streetartcities.com/open-data)\n[12] [Street Art Cities – About](https://streetartcities.com/about)\n[13] [Art Crimes – About / Story](https://www.graffiti.org/faq/story/)\n[14] [Konstanzer Sprachlandschaften (Zenodo, 2024-11-16)](https://zenodo.org/records/14173458)\n[15] [§ 59 UrhG – Werke an öffentlichen Plätzen](https://www.gesetze-im-internet.de/urhg/__59.html)\n[16] [BGH-Pressemitteilung 56/2017 zur Panoramafreiheit](https://www.bundesgerichtshof.de/SharedDocs/Pressemitteilungen/DE/2017/2017056.html)\n[17] [Code de la propriété intellectuelle, Art. L. 122-5 (Légifrance; Abruf 2026-11-09 zeitweise HTTP 403)](https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000048603495)\n[18] [Zajdela: Exception de panorama und Street Art (Village de la Justice)](https://www.village-justice.com/articles/exception-panorama-permet-pas-reproduction-une-oeuvre-street-art,47217.html)\n[19] [§ 303 StGB – Sachbeschädigung](https://www.gesetze-im-internet.de/stgb/__303.html)\n[20] [§ 123 StGB – Hausfriedensbruch](https://www.gesetze-im-internet.de/stgb/__123.html)\n[21] [§ 22 KunstUrhG – Recht am eigenen Bild](https://www.gesetze-im-internet.de/kunsturhg/__22.html)\n[22] [Schweizer URG (Fedlex), Art. 27](https://www.fedlex.admin.ch/eli/cc/1993/1798_1798_1798/de)\n[23] [Saargraffiti (Fotos Horst Winter, Update 14.10.2025)](https://saargraffiti.de/)\n[24] [Cour d’appel de Paris, 5. Juli 2023, 21/11317 (LibreJustice)](https://librejustice.fr/decision/fr/gg8bIoG9ozwx)\n\n\n=== 2-format.md (vollständig) ===\n\nlauf1 – Ergebnis Format-Entwerfer\n\n# Begegnungsformate: Urbane Spurensuche\n\nInteressen-Set: „Urbane Spurensuche – Gemeinsames Dokumentieren von Graffiti-Schichten und verblassten Wandinschriften in der Stadt“. Knotentyp: Interessen. Grundlage sind `1-analytiker.md` (24 Quellen) und `bilder.md`. Alle Links habe ich am 9.11.2026 selbst aufgerufen. Rechtliche Hinweise sind belegte Orientierung und keine Rechtsberatung.\n\n## 1. Quellenprüfung\n\nStatus: Abruf per curl, bei 403 zusätzlich per Webabruf oder über eine offizielle API.\n\n| Nr. | Quelle | Status | Geprüfte Behauptung | Ergebnis |\n| --- | --- | --- | --- | --- |\n| [1] | INGRID Startseite | erreichbar | > 100.000 Aufnahmen | stimmt: „Mehr als 100.000 Graffitis von 1980 bis heute“. „Weit über“ steht dort nicht. Führungen in Paderborn sind dort belegt (Meldung 9.3.2020). |\n| [2] | INGRID Projekt | erreichbar | Polizei- und Privatbestände, Annotation | stimmt |\n| [3] | INGRID Projektportal | erreichbar | DFG-Förderung bis 03/2024 | stimmt: zwei Phasen, 04/2016–03/2019 und 07/2020–03/2024 |\n| [4] | HAT Ghost Signs Archive | erreichbar (heute früher 504) | > 1.200 Ghost Signs | stimmt: „over 1,200 catalogued Ghost Signs“, gegründet 2009 |\n| [5] | Roberts & Carletti (History Workshop) | erreichbar | > 150 Fotografierende | stimmt, aber: „c.150 photographers“ zum Start, nicht „über 150“ als heutiger Stand |\n| [6] | Ghostsigns.de | erreichbar | Individualität, Verlust durch Renovierung und Abriss | stimmt |\n| [7] | Lingscape | erreichbar | Mitmachplattform, Graffiti und Schilder | stimmt. Wichtig: Fotos erscheinen „right away“ öffentlich. Satellitenprojekte können festlegen, wer die Daten sieht. |\n| [8] | OPENGRE | erreichbar | „Funde vieler Personen“ | **Korrektur:** Fotos stammen von Lehrenden, Forschenden und Studierenden der Université Grenoble Alpes. Es ist kein Crowd-Projekt. Fotos gibt es seit 09/2024, die Daten liegen auf [Nakala](https://nakala.fr/collection/10.34847/nkl.152f14pd). |\n| [9] | Graffiti Archaeology (Wayback) | Original 500, Wayback erreichbar | Zeitraffer-Collage, Übermalen als Dialog | stimmt (Cassidy Curtis, 2005) |\n| [10] | Valente et al. 2019 | erreichbar | Photogrammetrie und RTI | stimmt, aber es geht um *antike* Wandgraffiti und nicht um Stadtgraffiti |\n| [11] | Street Art Cities Open Data | erreichbar | DE-Export 2026-11, keine Bilder, nur akademisch | stimmt. **Präzisierung:** Die Daten sind nicht „offen“ im Sinne einer freien Lizenz. Weitergabe oder Einbindung außerhalb der Wissenschaft ist ohne Zustimmung untersagt. |\n| [12] | Street Art Cities About | erreichbar | Karte vieler Hunter | stimmt |\n| [13] | Art Crimes | erreichbar | „Schutz von Personen und Orten“ | **nur teilweise:** Belegt sind Archivierung, die Sorge vor beschlagnahmten Fotos und Blackbooks, der Rat zur Vorsicht in Foren und die Rechte der Künstler. Ein ausdrücklicher Ortsschutz steht dort nicht. |\n| [14] | Konstanz (Zenodo) | Webseite 403, API erreichbar | Veröffentlichung 16.11.2024 | stimmt (Reichelt/Gertis, CC BY 4.0). **Präzisierung:** Es geht um Inschriften, Stolpersteine und Protestzeichen, nicht um Graffiti. Ein Citizen-Science-Teil mit Schulen ist dokumentiert. |\n| [15] | § 59 UrhG | erreichbar | Panoramafreiheit „bleibend“ | stimmt |\n| [16] | BGH PM 56/2017 | erreichbar | „Digitalisate und Online“ | **Korrektur:** Der Kern ist „AIDA Kussmund“. Auch nicht ortsfeste Werke sind erfasst, und „bleibend“ heißt, aus Sicht der Allgemeinheit für längere Dauer dort bestimmt. Die Online-Veröffentlichung war nur der Anlass. |\n| [17] | Légifrance L. 122-5 | curl 403, Webabruf erreichbar | 11°: Architektur und Skulptur, natürliche Personen, nicht kommerziell | stimmt |\n| [18] | Village de la Justice | erreichbar | Urteil 5.7.2023 | stimmt |\n| [19]–[21] | StGB §§ 303, 123; KUG § 22 | erreichbar | Wortlaut | stimmt |\n| [22] | Fedlex URG | nur mit JavaScript, Inhalt nicht prüfbar | Art. 27 URG | **ungeprüft**, deshalb von mir nicht verwendet |\n| [23] | Saargraffiti | erreichbar | Stand 14.10.2025 | stimmt („Fotos: Horst Winter, Update: 14.10.2025“). Ortsfilter: Wall Bürgerpark, Ostspange u. a. Zwei davon tragen die Namen ausgewiesener legaler Flächen der Stadt [Z3]. |\n| [24] | LibreJustice CA Paris 21/11317 | curl 403, Webabruf erreichbar | 5.7.2023, teils geklebt, nicht „permanent“ | stimmt wörtlich: „pour partie de papier collé … ne peut être retenu qu'elle est placée en permanence“ |\n\n**Wichtigste Korrekturen:** OPENGRE ist kein Crowd-Projekt [8]. Street Art Cities ist nicht frei nachnutzbar [11]. Bei BGH 2017 geht es um das Merkmal „bleibend“ [16]. Konstanz behandelt keine Graffiti [14]. Art Crimes belegt nur teilweise, was ihm zugeschrieben wird [13]. HAT nannte „c.150“ Fotografierende zum Start [5]. Das Schweizer URG ist ungeprüft [22]. Folge für die Formate: Daten von Street Art Cities werden nicht in eine eigene Gruppenkarte übernommen.\n\n## 2. Zusätzliche geprüfte Quellen\n\n- [Z1] [Ghostsigns Tours (Sam Roberts)](https://ghostsigns.co.uk/tours/) und [Clapham Ghostsigns Walk](https://ghostsigns.co.uk/tours/clapham-ghostsigns-walk/): Rundgänge von etwa einer Stunde mit 19 bis 22 Stopps, Audio und Text, wahlweise vor Ort oder im „armchair mode“ über Street View. Der Clapham-Rundgang entstand 2018 für das Lambeth Heritage Festival mit der Clapham Society. Laut [samroberts.co.uk](https://samroberts.co.uk/ghostsigns-walking-tours/) wurden die Führungen nach sechs Jahren vor Ort 2021 digitalisiert.\n- [Z2] [Mark Klett, Rephotographic Survey Project](https://www.markklett.com/projects/rephotographic-survey-project): Bei der Wiederholung werden Kamerastandpunkt, Bildausschnitt, Jahreszeit und Tageszeit übernommen. Gezeigt wird im Diptychon, links alt, rechts neu.\n- [Z2b] [UCT/rePhotoSA: Repeat photography – How to find and take a well-matched repeat photo](https://science.uct.ac.za/sites/default/files/content_migration/science_uct_ac_za/841/files/Taking%2520a%2520repeat%2520photograph%25202015.pdf): Ausreichend sind Smartphone und Feldbogen. Man richtet sich an festen Merkmalen aus und notiert GPS und Kamerahöhe.\n- [Z3] [Saarbrücken: Legale Graffiti-Flächen](https://www.saarbruecken.de/kultur/kunstraum_saarbruecken/graffiti) und [Verhaltensregeln (PDF)](https://www.saarbruecken.de/media/download-5ba8de0dcdbb6): Es gibt fünf beschilderte Brückenpfeiler sowie die Wand „4560 Graffiti Hall-of-Fame“. Wörtlich: „Es entspricht der Netiquette vor dem Übermalen eines Bildes davon noch einmal Fotos zu machen.“ Außerdem: „Die kommerzielle Nutzung von Fotografien, ohne Einwilligung der Sprayer oder Künstler, ist untersagt.“\n- [Z4] [Wikipedia: 4560](https://de.wikipedia.org/wiki/4560): legale Hall of Fame seit 2002, etwa 450 m lang, Graffiti-Meetings 2005, 2012 und 2017.\n- [Z5] [Dock 11: Legal Walls Map Großregion](https://dock11.saarland/legal-walls/): Die Flächen sind laut Seite von den Kommunen bestätigt (Stand September 2025). Achtung: Der Disclaimer nennt „§ 122 StGB“. Sachbeschädigung ist § 303 StGB [19].\n- [Z6] [ECSA, 10 Prinzipien von Citizen Science (Zenodo, mehrsprachig, u. a. Deutsch)](https://zenodo.org/records/5127534) als Leitfaden für faire Bürgerforschung.\n\n## 3. Begegnungsformate\n\nDie fünf Interessenfelder des Analytikers kürze ich ab: E = Entdecken/Kartieren, F = Festhalten/Archivieren, V = Verstehen/Erzählen, G = Gestalten/Ästhetik, M = Mitmachen/Lernen. Jedes Format verbindet mindestens vier davon.\n\n### Format 1: „Spurengang“ – Ghost-Sign- und Schichten-Spaziergang (Einstieg)\n\n**Kurzbeschreibung:** Ein geführter Rundgang von etwa 60 Minuten mit 8 bis 12 Stopps. An jedem Stopp erzählt eine Person die Geschichte, eine fotografiert, eine füllt die Fünf-Felder-Karte aus (siehe Abschnitt 4). Vorbild sind die Ghostsigns-Walks [Z1]. Die Erweiterung um Graffiti-Schichten stützt sich auf [9].\n\n**Ablauf:**\n1. Vorab erkunden zwei Freiwillige eine Route nur über öffentliche Wege, mit Ghost Signs und sichtbaren Schichten.\n2. Treffpunkt mit kurzer Regelrunde: nichts betreten, nichts markieren, keine Gesichter fotografieren [20][21].\n3. An jedem Stopp drei Rollen im Wechsel: Erzählen (V), Fotografieren (F, G), Karte ausfüllen (E).\n4. Ein „Lesemoment“ von einer Minute: Alle beschreiben, welche Schicht sie zuerst sehen (G, V).\n5. Abschluss im Café: Die Karten werden gemeinsam geprüft und die Freigabestufe vergeben (M).\n6. Später entsteht daraus eine Audio- oder Textfassung mit „Sesselvariante“ für Menschen, die nicht mitlaufen können [Z1].\n\n**Verknüpfte Interessen:** E, F, V, G, M.\n\n**Belege:** [Ghostsigns Tours](https://ghostsigns.co.uk/tours/), [Graffiti Archaeology](https://web.archive.org/web/2024/http://grafarc.org/about.html), [Ghostsigns.de](https://ghostsigns.de/about/), [HAT-Archiv](https://www.hatads.org.uk/catalogue/ghostsigns.aspx).\n\n**Verworfene Alternativen:**\n- Reine App-Rallye ohne Treffen: Das wäre zwar billig, aber ohne gemeinsames Lesen entsteht keine Begegnung.\n- Großführung mit 30 Personen: Auf Gehwegen stört das, und die Rollen gehen verloren. Besser sind höchstens 12 Personen.\n\n**Risiken und Gegenmaßnahmen:**\n- Personen auf Fotos: Ausschnitte ohne erkennbare Gesichter wählen [21].\n- Anwohnende fühlen sich beobachtet: kurze Infokarte zum Projekt mitnehmen und Fragen beantworten.\n- Fehlerhafte Geschichten: Jede Erzählung braucht eine Quelle, zum Beispiel ein Adressbuch oder Archiv. Sonst wird sie als „Vermutung“ markiert.\n\n### Format 2: „Wandzeit“ – Wand-Patenschaft mit Rephotografie\n\n**Kurzbeschreibung:** Zwei bis drei Personen übernehmen für ein Jahr eine Wand, etwa eine Brandmauer, eine legale Fläche oder ein Ghost Sign. Sie fotografieren sie in festem Rhythmus vom selben Standpunkt aus. Die Reihe wird wie bei Graffiti Archaeology zum Zeitraffer [9]. Die Methode folgt Klett [Z2] und dem UCT-Leitfaden [Z2b]. Das Bild `bilder/2-format-rephoto-lsr-markierung.jpg` zeigt, wie ein Vergleich gelingt: gleicher Ausschnitt, 2016 und 2020, die alte Luftschutzraum-Markierung „LSR“ bleibt lesbar.\n\n**Ablauf:**\n1. Wand auswählen: Sie muss von öffentlichem Grund aus sichtbar sein. Vorrang haben gefährdete Wände (Baulücke, Sanierung).\n2. Standpunkt festlegen: Foto des Standpunkts, grobe Koordinate, Kamerahöhe, zwei feste Bezugspunkte wie Fallrohr oder Fensterkante [Z2b].\n3. Rhythmus: monatlich, zusätzlich bei jeder sichtbaren Veränderung. Bei Graffiti ist das „Vorher“ oft nur Stunden alt [9].\n4. Ein Feldbogen pro Aufnahme mit Datum, Uhrzeit, Wetter und Veränderung (F).\n5. Quartalsweise Diptychon oder Zeitraffer für den Schichtenabend (G, V).\n6. Nach einem Jahr Übergabe an neue Paten oder würdiger Abschluss (siehe Fragen an den Beziehungs-Architekten).\n\n**Verknüpfte Interessen:** F, V, G, E, M.\n\n**Belege:** [Graffiti Archaeology](https://web.archive.org/web/2024/http://grafarc.org/about.html), [Klett RSP](https://www.markklett.com/projects/rephotographic-survey-project), [UCT-Leitfaden](https://science.uct.ac.za/sites/default/files/content_migration/science_uct_ac_za/841/files/Taking%2520a%2520repeat%2520photograph%25202015.pdf), [HAT/Roberts & Carletti](https://www.historyworkshop.org.uk/digital-history/digital-engagement-the-history-of-advertising-trust-ghostsigns-archive/).\n\n**Verworfene Alternativen:**\n- RTI oder Photogrammetrie als Standard: Valente et al. beschreiben diese Verfahren für antike Graffiti [10]. Für Laien sind sie zu aufwendig und bleiben deshalb ein Sonderfall.\n- Feste Kamera oder Zeitraffer-Gerät an der Wand: Das wäre ein Eingriff am fremden Gebäude und ein Datenschutzproblem durch Passanten [21].\n\n**Risiken und Gegenmaßnahmen:**\n- Die Paten springen ab, wie die „long tail“-Erfahrung bei HAT zeigt [5]: Immer zwei Paten pro Wand und ein offener Kalender.\n- Trauer bei Abriss oder Übermalung, wie im Bild `2-format-rephoto-wandbild-baugrube.jpg`: Ein gemaltes Wandbild in Dresden steht 2020 hinter einer Baugrube. Gegenmaßnahme: Abschlussritual (Emotions-Kurator).\n- Hausrecht: nur von öffentlichem Grund aus fotografieren [20].\n\n### Format 3: „Vor dem Übermalen“ – Treffen an der legalen Hall of Fame\n\n**Kurzbeschreibung:** Archivierende treffen Writer an einer legalen Fläche, im Saarland zum Beispiel an der 4560 oder an den beschilderten Brückenpfeilern [Z3][Z4]. Grundlage ist die städtische Netiquette, ein Bild vor dem Übermalen zu fotografieren [Z3]. Die Gruppe bietet diese Dokumentation als Dienst an: Writer melden sich, die Gruppe fotografiert das alte Piece, und das neue entsteht. So wird der Konflikt „Erhalten versus Übermalen“ zur Zusammenarbeit.\n\n**Ablauf:**\n1. Vorab auf der Legal-Walls-Karte von Dock 11 und auf der Seite der Stadt prüfen, ob die Fläche aktuell freigegeben ist [Z3][Z5].\n2. Ein Termin, zum Beispiel ein Samstagnachmittag, wird über Szene-Kontakte angekündigt. Niemand wird gedrängt.\n3. Station „Vorher“: Das alte Piece wird mit Einwilligung frontal fotografiert, mit Datum und Pseudonym, wenn gewünscht (F).\n4. Station „Prozess“: Nur mit ausdrücklichem Ja werden Hände und Dose fotografiert, keine Gesichter (G).\n5. Station „Erzählen“: Kurze Gespräche über Stil, Schrift und Geschichte der Wand (V). Wer will, verbindet das mit einem Blick in Saargraffiti [23].\n6. Station „Nachher“ und Einordnung in die Schichtenreihe der Wand (Format 2).\n\n**Verknüpfte Interessen:** F, G, V, M, E.\n\n**Belege:** [Saarbrücken legale Flächen und Regeln](https://www.saarbruecken.de/kultur/kunstraum_saarbruecken/graffiti), [4560](https://de.wikipedia.org/wiki/4560), [Dock 11](https://dock11.saarland/legal-walls/), [Saargraffiti](https://saargraffiti.de/), [Art Crimes](https://www.graffiti.org/faq/story/).\n\n**Verworfene Alternativen:**\n- Selbst mitsprühen als Gruppenaktion: Das liegt außerhalb des Knotentyps Interessen am Dokumentieren und schafft Abgrenzungsfragen.\n- Dokumentation illegaler Spots mit Szene-Begleitung: Das Risiko nach §§ 123 und 303 StGB ist zu hoch, ebenso der mögliche Verrat [19][20].\n\n**Risiken und Gegenmaßnahmen:**\n- Die Szene sieht die Gruppe als Kontrolleure: Pseudonyme gibt es nur, wenn sie gewünscht sind, und das Bildrecht bleibt bei den Writern. Art Crimes betont die Rechte der Künstler an ihren Bildern [13].\n- Kommerzielle Nutzung ist untersagt [Z3]: Fotos werden nur nicht kommerziell verwendet, bei jeder Nutzung mit Einwilligung.\n- Der Status der Fläche ändert sich, wie bei der Wilhelm-Heinrich-Brücke, die laut Stadt entfallen ist [Z3]: Freigabe vor jedem Termin neu prüfen.\n\n### Format 4: „Schichtenabend“ – monatliche Kuratier- und Erzählrunde\n\n**Kurzbeschreibung:** Ein Abend pro Monat in einem Raum, etwa einem Stadtteiltreff. Die Funde aus den Formaten 1 bis 3 werden gezeigt, geprüft, mit Geschichte angereichert und mit einer Freigabestufe versehen. Er folgt dem Muster „viele erfassen, wenige ordnen“ [5][1], allerdings mit wechselnder Moderation.\n\n**Ablauf:**\n1. Fünf bis zehn Funde zeigen, jede Person stellt einen vor (M).\n2. Die Pflichtfelder gemeinsam prüfen und Lücken markieren (F).\n3. Eine Recherche-Ecke: Adressbücher, Firmennamen, Ghostsigns.de als Vergleich (V) [6].\n4. Freigabestufe gemeinsam festlegen (siehe Abschnitt 4).\n5. Ein Diptychon des Monats aus Format 2 (G).\n6. Optional: Upload in ein eigenes Lingscape-Satellitenprojekt mit eingeschränkter Sichtbarkeit, statt ins öffentliche Hauptprojekt [7].\n\n**Verknüpfte Interessen:** V, F, M, G, E.\n\n**Belege:** [HAT/Roberts & Carletti](https://www.historyworkshop.org.uk/digital-history/digital-engagement-the-history-of-advertising-trust-ghostsigns-archive/), [INGRID](https://www.uni-paderborn.de/forschungsprojekte/ingrid), [Lingscape](https://lingscape.app/about.html), [ECSA 10 Prinzipien](https://zenodo.org/records/5127534).\n\n**Verworfene Alternativen:**\n- Rein digitale Kuratierung im Chat: Die Vorbilder zeigen, dass die Ordnung ohne Treffen zerfällt [5][12].\n- Übernahme der Daten von Street Art Cities als Grundkarte: Das ist ohne Zustimmung untersagt [11].\n\n**Risiken und Gegenmaßnahmen:**\n- Macht konzentriert sich bei wenigen „Kuratoren“: Die Moderation rotiert, und jede Entscheidung braucht zwei Stimmen.\n- Datenverlust: Exporte liegen an zwei Orten, und es gibt eine Jahresablage nach dem Vorbild der Jahresdepots von OPENGRE auf Nakala [8].\n\n## 4. Antwort auf die offene Frage des Analytikers\n\n**Einfaches Beschreibungsschema (Fünf-Felder-Karte, im Smartphone-Formular in unter zwei Minuten ausfüllbar):**\n1. Datum und Uhrzeit (automatisch).\n2. Ort grob: Straße oder Viertel. Die genaue Koordinate wird nur intern gespeichert.\n3. Typ: Ghost Sign, Ladenschild, Tag, Piece, Mural, Übermalung, Mischschicht.\n4. Lesbarer Text, wörtlich, Unsicheres in [eckigen Klammern].\n5. Freigabestufe (siehe unten).\n\nOptional kommen Pseudonym (nur mit Einwilligung), Standpunkt-ID (Format 2) und Quelle der Geschichte hinzu. Die Felder 1 bis 4 entsprechen dem Kern bei Lingscape (Foto, Ort, Sprache und Schrift) [7] und der rePhotoSA-Feldkarte [Z2b]. Entscheidend ist ein **niedriger Aufwand beim Beitragen.** Bei HAT gingen viele Fotos verloren, weil der Schritt vom Flickr-Klick zum Formular zu groß war [5].\n\n**Abgestuftes Veröffentlichungsformat:**\n- **Stufe 0 – Intern:** genaue Koordinate, Rohfotos, Personen. Nur Gruppe.\n- **Stufe 1 – Gruppe plus Partner:** Fotos mit Straßenangabe, kein Pseudonym ohne Einwilligung.\n- **Stufe 2 – Öffentlich, unscharf:** Viertel statt Adresse, Ghost Signs und historische Inschriften, Graffiti nur von legalen Flächen oder mit Einwilligung.\n- **Stufe 3 – Öffentlich, Archiv:** nicht kommerzielle Weitergabe, etwa an Lingscape-Satelliten oder Partnerarchive, nur für Ghost Signs und eingewilligte Werke.\n\nRegeln: Aktuelle Street Art in Frankreich höchstens Stufe 1, weil die Ausnahme der Panoramafreiheit dort nach CA Paris nicht greift [17][24]. In Deutschland ist offen, ob kurzlebige Graffiti „bleibend“ im Sinne von § 59 UrhG sind, also nach BGH für längere Dauer bestimmt [15][16]. Deshalb gilt auch hier bei frischen Werken Zurückhaltung. Kommerzielle Nutzung ist ausgeschlossen [Z3].\n\n**Einstieg:** Ich empfehle, mit dem **Ghost-Sign-Spaziergang (Format 1)** zu beginnen. Er hat die geringsten Rechts- und Szenerisiken, sein Format ist erprobt [Z1], und er spricht alle fünf Interessenfelder an. Die **Wand-Patenschaft** folgt ab dem zweiten Treffen aus den Funden des Spaziergangs. Das **Hall-of-Fame-Treffen** kommt erst, wenn ein Szene-Kontakt besteht. Ohne Vertrauen würde es als Übergriff wirken. Alternative: Bei einer Gruppe mit vielen Writern lässt sich die Reihenfolge umkehren. Das Risiko besteht dann darin, dass die Ghost-Sign-Interessierten wegbleiben.\n\n## 5. Übergreifende Prinzipien einer neuen Form des Zusammenlebens\n\n1. **Dieselbe Wand, über Zeit, gemeinsam:** Die Bindung entsteht nicht durch Besitz von Fotos, sondern durch wiederholtes gemeinsames Lesen [9][Z2].\n2. **Vorher fotografieren, dann loslassen:** Erhalten und Übermalen sind kein Widerspruch, wenn das Dokumentieren vor dem Wandel kommt, wie es die Saarbrücker Netiquette vorsieht [Z3].\n3. **Leicht beitragen, sorgfältig ordnen:** fünf Felder statt Formularwüste, aber gemeinsame Prüfung [5][7].\n4. **Schutz vor Sichtbarkeit:** Personen und Spots kommen zuerst. Öffentlich ist unschärfer als intern [11][13][21].\n5. **Rollen wechseln:** Erzählen, Fotografieren, Erfassen und Moderieren rotieren, damit keine Kuratoren-Kaste entsteht.\n6. **Fair nach Citizen-Science-Prinzipien:** Beitragende werden genannt, Daten gehen an sie zurück, und Partnerarchive sind Ergänzung, kein Ersatz [Z6].\n7. **Grenzbewusst:** Unterschiedliche Rechtslagen in der Großregion werden in der Freigabestufe abgebildet und nicht ignoriert [17][24].\n\n## 6. Bilder\n\nIch habe zwei Bilder hinzugefügt (Grenze 10, Auftrag höchstens 3). Beide zeigen etwas, das die Analytiker-Bilder nicht zeigen: die **Rephotografie** als Methode, also gleiches Motiv, gleicher Standpunkt, zwei Zeitpunkte.\n- `bilder/2-format-rephoto-lsr-markierung.jpg`: Dresden, 2016 und 2020. Die Luftschutzraum-Markierung „LSR“ bleibt nach der Fassadensanierung lesbar. Das belegt die Methode von Format 2 und den Wert historischer Wandinschriften.\n- `bilder/2-format-rephoto-wandbild-baugrube.jpg`: Dresden, 2019 und 2020. Ein gemaltes Wandbild steht hinter einer Baugrube und wird bald verdeckt. Das belegt den Patenschaftsanlass „gefährdete Wand“ und das Abschlussritual.\n\n## 7. Offene Fragen an den Beziehungs-Architekten\n\n1. Wie werden die Rollen aus Format 1 (Erzählen, Fotografieren, Erfassen) und die Patenschaft aus Format 2 als Beziehungen modelliert, ohne feste Hierarchie?\n2. Wer entscheidet über die Freigabestufe, wenn Writer und Archivierende uneinig sind? Gibt es ein Vetorecht für Abgebildete?\n3. Wie wird die Übergabe einer Wand-Patenschaft nach einem Jahr gestaltet, als Beziehung zwischen alten und neuen Paten?\n4. Soll es eine Brückenrolle zur Szene geben, als Voraussetzung für Format 3, und wie wird sie vor Vereinnahmung geschützt?\n5. Wie bildet das Modell die Grenze ab, also Gruppenmitglieder in Frankreich und Luxemburg mit anderen Veröffentlichungsregeln?\n6. Soll die Gruppe mit Saargraffiti [23] oder Dock 11 [Z5] kooperieren, oder eigenständig bleiben?\n\n## Quellen\n\nAnalytiker-Quellen [1]–[24] siehe `1-analytiker.md`, Prüfstatus in Abschnitt 1. Zusätzlich:\n- [Z1] https://ghostsigns.co.uk/tours/ · https://ghostsigns.co.uk/tours/clapham-ghostsigns-walk/ · https://samroberts.co.uk/ghostsigns-walking-tours/\n- [Z2] https://www.markklett.com/projects/rephotographic-survey-project\n- [Z2b] https://science.uct.ac.za/sites/default/files/content_migration/science_uct_ac_za/841/files/Taking%2520a%2520repeat%2520photograph%25202015.pdf\n- [Z3] https://www.saarbruecken.de/kultur/kunstraum_saarbruecken/graffiti · https://www.saarbruecken.de/media/download-5ba8de0dcdbb6\n- [Z4] https://de.wikipedia.org/wiki/4560\n- [Z5] https://dock11.saarland/legal-walls/\n- [Z6] https://zenodo.org/records/5127534\n- OPENGRE-Daten: https://nakala.fr/collection/10.34847/nkl.152f14pd\n\n\n=== 3-katalog.md (vollständig) ===\n\nlauf1 – Ergebnis Beziehungs-Architekt\n\nLaufname: lauf1\nLaufordner: /workspace/labor/Gemeinschaft_Labor/laeufe/lauf1/\nBildgrenze: höchstens 10 Bilder pro Bot und Lauf\n\n# Interessen-Katalog: Urbane Spurensuche\n\nGrundlage: ausschließlich 1-analytiker.md, 2-format.md, lauf.json und bilder.md dieses Laufs. Knotentyp: Interessen. Rechtsthemen sind belegte Orientierung, keine Rechtsberatung. Der Lauf wurde auf Anweisung vorzeitig abgeschlossen (Zeitlimit).\n\n## 1. Knoten\n\n### N1 – Ghost Signs entdecken\n- **Text:** Verblasste handgemalte Fassadenwerbung aufspüren und als Zeugnis verschwundener Betriebe lesen.\n- **Beleg:** 1-analytiker.md, Abschnitt 1 und Abschnitt 3, Muster 1, Quellen [4][6]; 2-format.md, Format 1\n- **Gegenargument:** Ghost Signs ziehen eher Heimatgeschichts-Interessierte an; ohne Graffiti-Bezug droht eine zweite, getrennte Gruppe ({A}, Abschnitt 1, Gegenargumente).\n\n### N2 – Graffiti-Schichten lesen\n- **Text:** Übermalungen an derselben Wand als Abfolge und Dialog zwischen Schreibenden deuten.\n- **Beleg:** 1-analytiker.md, Abschnitt 3, Muster 2, Quelle [9] (Ersatz SIGGRAPH 2004); Bild bilder/1-analytiker-schichten-lissabon.jpg\n- **Gegenargument:** Schichtenlesen setzt Szenewissen voraus und kann Neulinge ausschließen ({A}, Abschnitt 3, Gegenargumente).\n\n### N3 – Wand-Zeitreihen fotografieren (Rephotografie)\n- **Text:** Dieselbe Wand vom selben Standpunkt in festem Rhythmus aufnehmen und als Diptychon oder Zeitraffer zeigen.\n- **Beleg:** 1-analytiker.md, Abschnitt 8, Methode 1, Quelle [9]; 2-format.md, Format 2, Quellen [Z2][Z2b]; Bild bilder/2-format-rephoto-lsr-markierung.jpg\n- **Gegenargument:** Monatlicher Rhythmus über ein Jahr ist anspruchsvoll; Paten springen ab ({F}, Format 2, Risiken, Quelle [5]).\n\n### N4 – Funde einfach erfassen (Fünf-Felder-Karte)\n- **Text:** Datum, grober Ort, Typ, wörtlicher Text und Freigabestufe in unter zwei Minuten erfassen.\n- **Beleg:** 2-format.md, Abschnitt 4; 1-analytiker.md, Abschnitt 8, Methode 3, Quellen [1][7]\n- **Gegenargument:** Fünf Felder können für Forschungsanschluss (INGRID-Annotation) zu grob sein ({A}, Abschnitt 6, Alternative 3).\n\n### N5 – Gemeinsam kuratieren und archivieren\n- **Text:** Funde gemeinsam prüfen, anreichern und dauerhaft an zwei Orten ablegen.\n- **Beleg:** 1-analytiker.md, Abschnitt 3, Muster 3, Quellen [1][5]; 2-format.md, Format 4\n- **Gegenargument:** „Viele erfassen, wenige ordnen“ kann Macht bündeln ({A}, Abschnitt 3, Gegenargumente; {F}, Format 4, Risiken).\n\n### N6 – Kartieren mit abgestufter Genauigkeit\n- **Text:** Funde auf einer internen genauen und einer öffentlichen unscharfen Karte verorten.\n- **Beleg:** 1-analytiker.md, Abschnitt 3, Muster 4 und Abschnitt 8, Methode 4, Quellen [8][11]; 2-format.md, Abschnitt 1 (Korrekturen zu [8][11])\n- **Gegenargument:** Die Vorbilder tragen nur bedingt: OPENGRE ist kein Crowd-Projekt, Street-Art-Cities-Daten sind nicht frei nachnutzbar ({F}, Abschnitt 1).\n\n### N7 – Viertelgeschichte erzählen\n- **Text:** Inschriften mit Adressbüchern und Archiven verbinden und als belegte Geschichte weitergeben.\n- **Beleg:** 1-analytiker.md, Abschnitt 2, Feld 3, Quellen [4][6]; 2-format.md, Format 1 (Rolle Erzählen) und Format 4, Schritt 3\n- **Gegenargument:** Unbelegte Geschichten verfälschen; jede Erzählung braucht Quelle oder Markierung „Vermutung“ ({F}, Format 1, Risiken).\n\n### N8 – Schrift und Ästhetik würdigen\n- **Text:** Typografie, Farben, Überlagerungen und handgemalte Schrift bewusst betrachten.\n- **Beleg:** 1-analytiker.md, Abschnitt 2, Feld 4, Quelle [6]; 2-format.md, Format 1, Schritt 4 („Lesemoment“)\n- **Gegenargument:** Reine Ästhetik kann zum Sammeln schöner Fotos verkommen, statt gemeinsames Lesen zu stärken ({A}, Abschnitt 5, Eigeninterpretation).\n\n### N9 – Vor dem Übermalen dokumentieren (legale Flächen)\n- **Text:** An legalen Flächen das alte Piece mit Einwilligung fotografieren, bevor das neue entsteht.\n- **Beleg:** 2-format.md, Format 3, Quellen [Z3][Z4][Z5]; 1-analytiker.md, Abschnitt 6, Alternative 2; Bilder bilder/1-analytiker-halloffame-ingolstadt.jpg, bilder/3-katalog-halloffame-4560-saarbruecken.jpg\n- **Gegenargument:** Ohne Szene-Kontakt wirkt das Angebot übergriffig; die Szene kann die Gruppe als Kontrolleure sehen ({F}, Format 3, Risiken; Abschnitt 4, Einstieg).\n\n### N10 – Spurenethik und Schutz\n- **Text:** Schutz von Personen und Spots vor Sichtbarkeit; Pseudonyme, Einwilligung, keine Gesichter.\n- **Beleg:** 1-analytiker.md, Abschnitt 4, Spannungsfelder 1 und 2, Abschnitt 7, Risiko 3, Quelle [13]; 2-format.md, Abschnitt 5, Prinzip 4\n- **Gegenargument:** Art Crimes belegt Ortsschutz nur teilweise ({F}, Abschnitt 1, [13]); zu viel Schutz macht Gemeinschaftsbildung unmöglich ({A}, Abschnitt 4, Gegenargumente).\n\n### N11 – Abgestuft veröffentlichen\n- **Text:** Freigabestufen 0 bis 3 von intern bis öffentliches Archiv, gemeinsam vergeben.\n- **Beleg:** 2-format.md, Abschnitt 4 (Stufen 0–3); 1-analytiker.md, Abschnitt 4, Gegenargumente, Quellen [5][11]\n- **Gegenargument:** Vier Stufen erzeugen Abstimmungsaufwand und Streit bei Uneinigkeit zwischen Writern und Archivierenden ({F}, Abschnitt 7, Frage 2).\n\n### N12 – Rechtsrahmen als Orientierung kennen\n- **Text:** Panoramafreiheit DE/FR, Hausrecht, Sachbeschädigung und Bildrecht als belegte Orientierung, keine Rechtsberatung.\n- **Beleg:** 1-analytiker.md, Abschnitt 9, Quellen [15][16][17][19][20][21][24]; 2-format.md, Abschnitt 1 (Korrektur zu [16]) und Abschnitt 4, Regeln\n- **Gegenargument:** Rechtsthemen können abschrecken und Spontaneität bremsen ({A}, Abschnitt 7, Gegenargumente); Art. 27 URG [22] bleibt ungeprüft.\n\n### N13 – Mitforschen mit niedriger Hürde (Citizen Science)\n- **Text:** Smartphone-Fotos mit Ort und Beschreibung als Beitrag zu Bürgerforschung, fair nach ECSA-Prinzipien.\n- **Beleg:** 1-analytiker.md, Abschnitt 5, Potenzial 2, Quellen [7][14]; 2-format.md, Abschnitt 5, Prinzip 6, Quelle [Z6]\n- **Gegenargument:** Konstanz [14] behandelt keine Graffiti ({F}, Abschnitt 1); Lingscape-Fotos sind sofort öffentlich [7], was mit N10 kollidiert.\n\n### N14 – Wissen weitergeben (Touren und Patenschaften)\n- **Text:** Rundgänge, Patenschaften und deren Übergabe als Lern- und Begegnungsform.\n- **Beleg:** 1-analytiker.md, Abschnitt 5, Potenziale 1 und 3, Quellen [1][5][9]; 2-format.md, Format 1 und Format 2, Schritt 6, Quelle [Z1]\n- **Gegenargument:** Großführungen stören auf Gehwegen und verlieren die Rollen ({F}, Format 1, Verworfene Alternativen).\n\n### N15 – Regionale Dauerbeobachtung (Saarland/Großregion)\n- **Text:** An bestehende regionale Dokumentationen anschließen und Grenzunterschiede berücksichtigen.\n- **Beleg:** 1-analytiker.md, Abschnitt 3, Muster 5 und Abschnitt 5, Potenzial 4, Quelle [23]; 2-format.md, Abschnitt 7, Fragen 5 und 6, Quelle [Z5]\n- **Gegenargument:** Kooperation mit Saargraffiti oder Dock 11 kann Eigenständigkeit kosten ({F}, Abschnitt 7, Frage 6).\n\n## 2. Kanten\n\n| ID | Von | Nach | Bedeutung und Begründung |\n| --- | --- | --- | --- |\n| E1 | N1 | N7 | Ghost Signs liefern den Anlass für Viertelgeschichte, weil sie auf verschwundene Betriebe verwei llen [7][14]). |\n| E17 | N14 | N13 | Touren und Schulformate öffnen den Einstieg in das Mitforschen (1-analytiker.md, Abschnitt 5, Potenzial 3). |\n| E18 | N7 | N14 | Belegte Geschichten sind der Stoff der Rundgänge (2-format.md, Format 1, Rolle Erzählen). |\n| E19 | N3 | N14 | Patenschaften werden nach einem Jahr übergeben und so Wissen weitergegeben (2-format.md, Format 2, Schritt 6). |\n| E20 | N15 | N9 | Saarbrücker legale Flächen (4560, Brückenpfeiler) sind Orte für Format 3 (Quellen [Z3][Z4][Z5]). |\n| E21 | N15 | N12 | Die Großregion verlangt Grenzbewusstsein bei Veröffentlichungsregeln (2-format.md, Abschnitt 5, Prinzip 7). |\n| E22 | N6 | N15 | Kartierung macht regionale Dauerbeobachtung über Zeit sichtbar (1-analytiker.md, Abschnitt 3, Muster 4 und 5). |\n| E23 | N13 | N10 | Spannung: Sofortige Öffentlichkeit von Plattformen wie Lingscape kollidiert mit Schutzinteressen (2-format.md, Abschnitt 1, [7]). |\n| E24 | N1 | N2 | Spannung Erhalten versus Übermalen: dieselbe Wand, zwei ethische Blickwinkel (1-analytiker.md, Abschnitt 4, Spannungsfeld 1). |\n\n## 3. Cluster\n\n- **K1 – Spuren lesen:** N1, N2, N8. Begründung: Die drei Interessen richten sich direkt auf die Wand und ihre Schrift (1-analytiker.md, Abschnitt 2, Felder 3 und 4; Abschnitt 4, Spannungsfeld 1).\n- **K2 – Vergänglichkeit festhalten:** N3, N4, N5, N9. Begründung: Alle vier antworten auf drohenden Verlust durch Dokumentation (1-analytiker.md, Abschnitt 3, Muster 1; 2-format.md, Formate 2 bis 4).\n- **K3 – Schützen und freigeben:** N10, N11, N12, N6. Begründung: Diese Knoten regeln, was wie sichtbar wird (2-format.md, Abschnitt 4; 1-analytiker.md, Abschnitte 4, 7, 9).\n- **K4 – Teilen und weitergeben:** N7, N13, N14, N15. Begründung: Sie verbinden die Gruppe mit Viertel, Region und Neulingen (1-analytiker.md, Abschnitt 5).\n\n## 4. Zuordnung der Formate aus 2-format.md\n\n- **Format 1 „Spurengang“:** N1, N2, N7, N8, N14, N4\n- **Format 2 „Wandzeit“:** N3, N2, N1, N4, N14\n- **Format 3 „Vor dem Übermalen“:** N9, N10, N12, N15, N2\n- **Format 4 „Schichtenabend“:** N5, N4, N11, N7, N13, N6\n\n## 5. Antworten auf offene Fragen der Vorrollen\n\n- Rollen ohne Hierarchie: Erzählen (N7), Fotografieren (N3), Erfassen (N4) und Moderieren (N5) rotieren (2-format.md, Abschnitt 5, Prinzip 5); im Modell als Kanten zwischen Interessen statt als Rangfolge.\n- Erhalten versus Übermalen bleibt als Spannungskante E24 sichtbar und wird über N9/E11 in Zusammenarbeit übersetzt.\n- Patenschafts-Übergabe: E19 (N3→N14).\n- Grenze/Großregion: N15 mit E21 zu N12.\n\n## 6. Quellenprüfung (curl, 9.11.2026, ca. 16:48 MEZ)\n\n- Erreichbar (HTTP 200): [1]–[8], [10]–[13], [15], [16], [18]–[21], [23], Z1 (alle drei), Z2, Z2b, Z3 (beide), Z4, Z5, Nakala.\n- **[9] grafarc.org/about.html: HTTP 500.** Wayback-Kopie 200; Ersatz geprüft: [SIGGRAPH History Archives, „Graffiti Archaeology“ (Rodenbeck/Curtis, 2004)](https://history.siggraph.org/learning/graffiti-archaeology-by-rodenbeck-and-curtis/) – bestätigt Chronomontage derselben Wand über Monate/Jahre.\n- curl 403, per Webabruf inhaltlich bestätigt: [14] Zenodo Konstanz (16.11.2024, CC BY 4.0), [17] Légifrance L. 122-5 11°, [24] LibreJustice CA Paris 21/11317, [Z6] ECSA-Prinzipien.\n- [22] Fedlex: HTTP 200, Inhalt nur mit JavaScript – nicht geprüft (Zeitlimit), deshalb nicht verwendet.\n- Keine 404-Antworten.\n\n## 7. Lücken und bewusst Weggelassenes\n\n- Weggelassen: RTI/Photogrammetrie [10] als eigener Knoten (antike Graffiti, für Laien Sonderfall; 2-format.md, Format 2); Street-Art-Cities-Daten als Grundkarte [11] (nicht frei nachnutzbar); Selbst-Sprühen (außerhalb des Knotentyps, 2-format.md, Format 3); Schweizer URG [22] (ungeprüft); rein private Fotoalben (1-analytiker.md, Abschnitt 6, Alternative 4).\n- Lücken: Emotionen (Trauer bei Abriss, Freude am Fund) sind nicht als Interessen modelliert, sondern an den Emotions-Kurator übergeben; Vetorecht Abgebildeter (2-format.md, Abschnitt 7, Frage 2) und Brückenrolle zur Szene (Frage 4) bleiben offen; kein deutsches Ghost-Sign-Projekt mit Gruppenstruktur belegt.\n\n## 8. Bilder\n\n- Neu: `bilder/3-katalog-halloffame-4560-saarbruecken.jpg` – legale Hall of Fame 4560 in Saarbrücken; belegt N9 und Kante E20 (Wikimedia Commons, Flocci Nivis, CC BY 4.0).\n- Genutzt aus Vorarbeiten: bilder/1-analytiker-schichten-lissabon.jpg (N2), bilder/2-format-rephoto-lsr-markierung.jpg (N3), bilder/1-analytiker-halloffame-ingolstadt.jpg (N9).\n\n\n=== Bildpfade aller Rollen ===\n\n- /workspace/labor/Gemeinschaft_Labor/laeufe/lauf1/bilder/1-analytiker-ghostsign-montluel.jpg\n- /workspace/labor/Gemeinschaft_Labor/laeufe/lauf1/bilder/1-analytiker-ghostsign-tottenham.jpg\n- /workspace/labor/Gemeinschaft_Labor/laeufe/lauf1/bilder/1-analytiker-ghostsign-vichy.jpg\n- /workspace/labor/Gemeinschaft_Labor/laeufe/lauf1/bilder/1-analytiker-graffiti-berlin.jpg\n- /workspace/labor/Gemeinschaft_Labor/laeufe/lauf1/bilder/1-analytiker-halloffame-ingolstadt.jpg\n- /workspace/labor/Gemeinschaft_Labor/laeufe/lauf1/bilder/1-analytiker-schichten-lissabon.jpg\n- /workspace/labor/Gemeinschaft_Labor/laeufe/lauf1/bilder/1-analytiker-schild-dresden.jpg\n- /workspace/labor/Gemeinschaft_Labor/laeufe/lauf1/bilder/2-format-rephoto-lsr-markierung.jpg\n- /workspace/labor/Gemeinschaft_Labor/laeufe/lauf1/bilder/2-format-rephoto-wandbild-baugrube.jpg\n- /workspace/labor/Gemeinschaft_Labor/laeufe/lauf1/bilder/3-katalog-halloffame-4560-saarbruecken.jpg\n\n\n=== 3-katalog.md (Beziehungs-Architekt, wörtlich) ===\n\nlauf1 – Ergebnis Beziehungs-Architekt\n\nLaufname: lauf1\nLaufordner: /workspace/labor/Gemeinschaft_Labor/laeufe/lauf1/\nBildgrenze: höchstens 10 Bilder pro Bot und Lauf\n\n# Interessen-Katalog: Urbane Spurensuche\n\nGrundlage: ausschließlich 1-analytiker.md, 2-format.md, lauf.json und bilder.md dieses Laufs. Knotentyp: Interessen. Rechtsthemen sind belegte Orientierung, keine Rechtsberatung. Der Lauf wurde auf Anweisung vorzeitig abgeschlossen (Zeitlimit).\n\n## 1. Knoten\n\n### N1 – Ghost Signs Verworfene Alternativen).\n\n### N15 – Regionale Dauerbeobachtung (Saarland/Großregion)\n- **Text:** An bestehende regionale Dokumentationen anschließen und Grenzunterschiede berücksichtigen.\n- **Beleg:** 1-analytiker.md, Abschnitt 3, Muster 5 und Abschnitt 5, Potenzial 4, Quelle [23]; 2-format.md, Abschnitt 7, Fragen 5 und 6, Quelle [Z5]\n- **Gegenargument:** Kooperation mit Saargraffiti oder Dock 11 kann Eigenständigkeit kosten ({F}, Abschnitt 7, Frage 6).\n\n## 2. Kanten\n\n| ID | Von | Nach | Bedeutung und Begründung |\n| --- | --- | --- | --- |\n| E1 | N1 | N7 | Ghost Signs liefern den Anlass für Viertelgeschichte, weil sie auf verschwundene Betriebe verweisen (1-analytiker.md, Abschnitt 2, Feld 3). |\n| E2 | N2 | N3 | Schichten werden erst durch Zeitreihen sichtbar; Graffiti Archaeology überlagert Aufnahmen derselben Wand (Quelle [9]). |\n| E3 | N3 | N2 | Rückkopplung: Jede neue Aufnahme fügt der Schichtenlesung eine Lage hinzu (2-format.md, Format 2, Schritt 5). |\n| E4 | N1 | N3 | Gefährdete Ghost Signs haben Vorrang bei der Wahl der Patenwand (2-format.md, Format 2, Schritt 1). |\n| E5 | N3 | N4 | Jede Zeitreihen-Aufnahme braucht einen Feldbogen; die Fünf-Felder-Karte ist dessen Kern (2-format.md, Format 2, Schritt 4; Abschnitt 4). |\n| E6 | N4 | N5 | Einfach erfasste Funde werden im Schichtenabend gemeinsam geprüft und archiviert (2-format.md, Format 4). |\n| E7 | N5 | N11 | Kuratieren endet mit gemeinsamer Vergabe der Freigabestufe (2-format.md, Format 4, Schritt 4). |\n| E8 | N10 | N11 | Ethik begründet die Stufen: Öffentlich ist unschärfer als intern (2-format.md, Abschnitt 5, Prinzip 4). |\n| E9 | N12 | N11 | Rechtsorientierung begrenzt die Stufen, z. B. aktuelle Street Art in Frankreich höchstens Stufe 1 (Quellen [17][24]). |\n| E10 | N11 | N6 | Die Freigabestufe bestimmt die Genauigkeit auf der Karte (1-analytiker.md, Abschnitt 8, Methode 4). |\n| E11 | N9 | N2 | Dokumentation vor dem Übermalen sichert die Schicht, die sonst verschwindet, und macht Erhalten versus Übermalen zur Zusammenarbeit (2-format.md, Format 3). |\n| E12 | N10 | N9 | Einwilligung, Pseudonym und keine Gesichter sind Voraussetzung für Format 3 (2-format.md, Format 3, Stationen 3 und 4). |\n| E13 | N12 | N9 | Hausrecht und Sachbeschädigung (§§ 123, 303 StGB) begründen die Beschränkung auf legale Flächen (Quellen [19][20]). |\n| E14 | N8 | N2 | Ästhetischer Blick schärft das Erkennen von Schichten im „Lesemoment“ (2-format.md, Format 1, Schritt 4). |\n| E15 | N8 | N1 | Handgemalte Schrift ist ein Hauptreiz der Ghost Signs (Quelle [6]). |\n| E16 | N13 | N4 | Citizen-Science-Erfahrung zeigt, dass einfache Felder belastbare Daten liefern (Quellen [7][14]). |\n| E17 | N14 | N13 | Touren und Schulformate öffnen den Einstieg in das Mitforschen (1-analytiker.md, Abschnitt 5, Potenzial 3). |\n| E18 | N7 | N14 | Belegte Geschichten sind der Stoff der Rundgänge (2-format.md, Format 1, Rolle Erzählen). |\n| E19 | N3 | N14 | Patenschaften werden nach einem Jahr übergeben und so Wissen weitergegeben (2-format.md, Format 2, Schritt 6). |\n| E20 | N15 | N9 | Saarbrücker legale Flächen (4560, Brückenpfeiler) sind Orte für Format 3 (Quellen [Z3][Z4][Z5]). |\n| E21 | N15 | N12 | Die Großregion verlangt Grenzbewusstsein bei Veröffentlichungsregeln (2-format.md, Abschnitt 5, Prinzip 7). |\n| E22 | N6 | N15 | Kartierung macht regionale Dauerbeobachtung über Zeit sichtbar (1-analytiker.md, Abschnitt 3, Muster 4 und 5). |\n| E23 | N13 | N10 | Spannung: Sofortige Öffentlichkeit von Plattformen wie Lingscape kollidiert mit Schutzinteressen (2-format.md, Abschnitt 1, [7]). |\n| E24 | N1 | N2 | Spannung Erhalten versus Übermalen: dieselbe Wand, zwei ethische Blickwinkel (1-analytiker.md, Abschnitt 4, Spannungsfeld 1). |\n\n## 3. Cluster\n\n- **K1 – Spuren lesen:** N1, N2, N8. Begründung: Die drei Interessen richten sich direkt auf die Wand und ihre Schrift (1-analytiker.md, Abschnitt 2, Felder 3 und 4; Abschnitt 4, Spannungsfeld 1).\n- **K2 – Vergänglichkeit festhalten:** N3, N4, N5, N9. Begründung: Alle vier antworten auf drohenden Verlust durch Dokumentation (1-analytiker.md, Abschnitt 3, Muster 1; 2-format.md, Formate 2 bis 4).\n- **K3 – Schützen und freigeben:** N10, N11, N12, N6. Begründung: Diese Knoten regeln, was wie sichtbar wird (2-format.md, Abschnitt 4; 1-analytiker.md, Abschnitte 4, 7, 9).\n- **K4 – Teilen und weitergeben:** N7, N13, N14, N15. Begründung: Sie verbinden die Gruppe mit Viertel, Region und Neulingen (1-analytiker.md, Abschnitt 5).\n\n## 4. Zuordnung der Formate aus 2-format.md\n\n- **Format 1 „Spurengang“:** N1, N2, N7, N8, N14, N4\n- **Format 2 „Wandzeit“:** N3, N2, N1, N4, N14\n- **Format 3 „Vor dem Übermalen“:** N9, N10, N12, N15, N2\n- **Format 4 „Schichtenabend“:** N5, N4, N11, N7, N13, N6\n\n## 5. Antworten auf offene Fragen der Vorrollen\n\n- Rollen ohne Hierarchie: Erzählen (N7), Fotografieren (N3), Erfassen (N4) und Moderieren (N5) rotieren (2-format.md, Abschnitt 5, Prinzip 5); im Modell als Kanten zwischen Interessen statt als Rangfolge.\n- Erhalten versus Übermalen bleibt als Spannungskante E24 sichtbar und wird über N9/E11 in Zusammenarbeit übersetzt.\n- Patenschafts-Übergabe: E19 (N3→N14).\n- Grenze/Großregion: N15 mit E21 zu N12.\n\n## 6. Quellenprüfung (curl, 9.11.2026, ca. 16:48 MEZ)\n\n- Erreichbar (HTTP 200): [1]–[8], [10]–[13], [15], [16], [18]–[21], [23], Z1 (alle drei), Z2, Z2b, Z3 (beide), Z4, Z5, Nakala.\n- **[9] grafarc.org/about.html: HTTP 500.** Wayback-Kopie 200; Ersatz geprüft: [SIGGRAPH History Archives, „Graffiti Archaeology“ (Rodenbeck/Curtis, 2004)](https://history.siggraph.org/learning/graffiti-archaeology-by-rodenbeck-and-curtis/) – bestätigt Chronomontage derselben Wand über Monate/Jahre.\n- curl 403, per Webabruf inhaltlich bestätigt: [14] Zenodo Konstanz (16.11.2024, CC BY 4.0), [17] Légifrance L. 122-5 11°, [24] LibreJustice CA Paris 21/11317, [Z6] ECSA-Prinzipien.\n- [22] Fedlex: HTTP 200, Inhalt nur mit JavaScript – nicht geprüft (Zeitlimit), deshalb nicht verwendet.\n- Keine 404-Antworten.\n\n## 7. Lücken und bewusst Weggelassenes\n\n- Weggelassen: RTI/Photogrammetrie [10] als eigener Knoten (antike Graffiti, für Laien Sonderfall; 2-format.md, Format 2); Street-Art-Cities-Daten als Grundkarte [11] (nicht frei nachnutzbar); Selbst-Sprühen (außerhalb des Knotentyps, 2-format.md, Format 3); Schweizer URG [22] (ungeprüft); rein private Fotoalben (1-analytiker.md, Abschnitt 6, Alternative 4).\n- Lücken: Emotionen (Trauer bei Abriss, Freude am Fund) sind nicht als Interessen modelliert, sondern an den Emotions-Kurator übergeben; Vetorecht Abgebildeter (2-format.md, Abschnitt 7, Frage 2) und Brückenrolle zur Szene (Frage 4) bleiben offen; kein deutsches Ghost-Sign-Projekt mit Gruppenstruktur belegt.\n\n## 8. Bilder\n\n- Neu: `bilder/3-katalog-halloffame-4560-saarbruecken.jpg` – legale Hall of Fame 4560 in Saarbrücken; belegt N9 und Kante E20 (Wikimedia Commons, Flocci Nivis, CC BY 4.0).\n- Genutzt aus Vorarbeiten: bilder/1-analytiker-schichten-lissabon.jpg (N2), bilder/2-format-rephoto-lsr-markierung.jpg (N3), bilder/1-analytiker-halloffame-ingolstadt.jpg (N9).\n\n\n=== 4-emotionen.md (Emotions-Kurator, wörtlich) ===\n\nlauf1 – Ergebnis Emotions-Kurator\n\nLaufname: lauf1\nLaufordner: /workspace/labor/Gemeinschaft_Labor/laeufe/lauf1/\nBildgrenze: höchstens 10 Bilder pro Bot und Lauf\nVerwendete Katalogfassung: 3-katalog.md des Beziehungs-Architekten für lauf1 (N1–N15, E1–E24, K1–K4). Auf Anweisung des Master-Koordinators abgeschlossen: keine zusätzliche Quellenprüfung, keine Recherche, keine eigenen Bilder.\n\n# Klickinhalte\n\n## C1 – Geisterschrift an der Fassade\n- **IDs:** N1, N8, E15, E1, K1\n- **Eindruck:** Detektivische Neugier: Eine verblasste Schrift wird zum Rätsel, das auf einen verschwundenen Betrieb verweist.\n- **Beleg:** N1 (Zeugnis verschwundener Betriebe), E15 (handgemalte Schrift als Hauptreiz), E1 (Anlass für Viertelgeschichte), K1.\n- **Prüfung:** Laut Gegenargument N1 spricht das eher Heimatgeschichts-Interessierte an. Die Neugier trägt nur, wenn C1 über E24 zu C2 führt. Die Alternative „nostalgisch“ habe ich verworfen, weil N1 ein aktives Aufspüren beschreibt und kein Erinnern.\n\n## C2 – Schichten lesen wie Erdgeschichte\n- **IDs:** N2, N3, E2, E3, E14, E24\n- **Eindruck:** Staunendes Freilegen: Jede Aufnahme fügt eine Lage hinzu, die Wand wird lesbar wie ein Dialog.\n- **Beleg:** E2 und E3 (Rückkopplung zwischen Zeitreihe und Schichtenlesung), E14 („Lesemoment“), E24 (Spannung zwischen Erhalten und Übermalen).\n- **Prüfung:** Nach dem Gegenargument zu N2 schließt Szenewissen Neulinge aus. Der Eindruck braucht deshalb sichtbare Lesehilfen. Die Alternative „ehrfürchtig“ würde Distanz erzeugen, wo der Katalog Teilnahme meint.\n\n## C3 – Wettlauf vor dem Übermalen\n- **IDs:** N9, N10, N12, E11, E12, E13, E20, K2\n- **Eindruck:** Gespannte Dringlichkeit: Das alte Piece wird gesichert, bevor das neue entsteht, aber nur mit Einwilligung und auf legalen Flächen.\n- **Beleg:** E11 (sichert die Schicht, die sonst verschwindet), E12 (Einwilligung als Voraussetzung), E13 (Beschränkung auf legale Flächen), E20 (Saarbrücker Flächen).\n- **Prüfung:** Laut Gegenargument zu N9 kann die Gruppe als Kontrolleure wirken. Die Dringlichkeit darf deshalb nicht in „Rettungsmission“ kippen. Die Alternative „melancholisch“ habe ich verworfen, weil K2 auf Handeln zielt.\n\n## C4 – Die Wand im Jahreslauf\n- **IDs:** N3, N4, N14, E5, E19, K2\n- **Eindruck:** Geduldige Experimentierlust: Eine feste Patenwand wird zur Versuchsreihe mit Feldbogen, die nach einem Jahr weitergegeben wird.\n- **Beleg:** N3 (fester Rhythmus, Diptychon/Zeitraffer), E5 (Feldbogen je Aufnahme), E19 (Übergabe der Patenschaft).\n- **Prüfung:** Laut Gegenargument zu N3 springen Paten ab. Die Experimentierlust braucht sichtbare Zwischenergebnisse. Die Alternative „routiniert“ würde gerade den Reiz der Veränderung verdecken.\n\n## C5 – Unscharf, mit Absicht\n- **IDs:** N10, N11, N6, E8, E9, E10, E23, K3\n- **Eindruck:** Achtsames Abwägen: Der Klick zeigt, warum die öffentliche Karte bewusst ungenau ist und welche Stufe was freigibt.\n- **Beleg:** E8 (Ethik begründet die Stufen), E9 (Recht begrenzt die Stufen), E10 (Stufe bestimmt Kartengenauigkeit), E23 (Spannung mit sofort öffentlichen Plattformen).\n- **Prüfung:** Laut Gegenargument zu N11 erzeugen vier Stufen Streit. Hier ist Abwägen gewollt, Bürokratie aber nicht. Die Alternative „misstrauisch-geheim“ habe ich verworfen, weil das Gegenargument zu N10 vor zu viel Schutz warnt.\n\n## C6 – Vom Fund zur Viertelgeschichte\n- **IDs:** N4, N5, N7, N13, N14, N15, E6, E16, E17, E18, E22, K4\n- **Eindruck:** Neugierige Verbundenheit: Ein Handyfoto wird über den Schichtenabend zur belegten Geschichte im Rundgang und in der Region.\n- **Beleg:** E6 (Funde werden gemeinsam geprüft), E16 (einfache Felder liefern belastbare Daten), E17 und E18 (Touren und Geschichten), E22 (regionale Dauerbeobachtung).\n- **Prüfung:** Laut Gegenargumenten zu N5 und N7 bündelt Kuratieren Macht und unbelegte Geschichten verfälschen. Jede Geschichte braucht daher Quelle oder die Markierung „Vermutung“. Die Alternative „stolz-heimatlich“ würde den experimentellen Charakter verlieren.\n\n# Stimmung\nNeugierig-experimentell mit gespannter Dringlichkeit und achtsamer Zurückhaltung. Neugier und Experiment tragen K1 und K2 (C1, C2, C4), Dringlichkeit kommt aus der Vergänglichkeit in K2 (C3), Zurückhaltung aus K3 (C5) und Verbundenheit aus K4 (C6). Gegen „melancholisch“ spricht, dass der Katalog durchgehend Handlungen beschreibt (aufspüren, fotografieren, kuratieren). Gegen „rebellisch-szenig“ spricht, dass N10, N12 und E13 die Gruppe auf Einwilligung und legale Flächen festlegen.\n\n# Bilder\nKeine eigenen Bilder (Zeitlimit; bilder/ enthält bereits die 10 Bilder der Vorrollen).\n\n=== 4-emotionen.md ===\nlauf1 – Ergebnis Emotions-Kurator\n\nLaufname: lauf1\nLaufordner: /workspace/labor/Gemeinschaft_Labor/laeufe/lauf1/\nBildgrenze: höchstens 10 Bilder pro Bot und Lauf\nVerwen
