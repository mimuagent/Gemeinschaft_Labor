<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Labor für neue menschliche Gemeinschaften</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1100px; margin: 0 auto; }
    nav { background: #222; padding: 0.8rem 1rem; }
    nav a { color: white; margin-right: 1.2rem; text-decoration: none; cursor: pointer; }
    nav a.active { text-decoration: underline; }
    main { padding: 1rem; }
    section { display: none; }
    section.active { display: block; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    input, select, textarea { width: 100%; padding: 0.5rem; margin-top: 0.25rem; box-sizing: border-box; }
    button { margin: 0.5rem 0.5rem 0 0; padding: 0.5rem 1rem; background: #222; color: white; border: none; cursor: pointer; }
    button:hover { background: #444; }
    .preset { display: inline-block; margin-right: 0.5rem; padding: 0.4rem 0.8rem; background: #eee; cursor: pointer; border-radius: 4px; }
    .preset.active { background: #222; color: white; }
    .agent-chat { border: 1px solid #ddd; border-radius: 8px; padding: 0.5rem; margin: 0.5rem 0; background: #fafafa; }
    .agent-header { font-weight: 600; margin-bottom: 0.5rem; }
    .agent-messages { max-height: 200px; overflow-y: auto; font-size: 0.85rem; white-space: pre-wrap; }
    .msg { margin: 0.3rem 0; padding: 0.3rem; background: #eee; border-radius: 4px; }
    .note { color: #666; font-size: 0.9rem; }
  </style>
</head>
<body>
  <nav>
    <a onclick="show('config')" class="active">Konfiguration</a>
    <a onclick="show('agents')">Agenten-Ausgaben</a>
    <a onclick="show('map')">Landkarte</a>
  </nav>

  <main>
    <section id="config" class="active">
      <h2>Konfiguration</h2>
      <div>
        <span class="preset active" onclick="setPreset('schnell', this)">Schnell</span>
        <span class="preset" onclick="setPreset('mittel', this)">Mittel</span>
        <span class="preset" onclick="setPreset('komplex', this)">Komplex</span>
      </div>
      <label>Modell</label>
      <select id="model">
        <option value="grok-3">Grok 3</option>
        <option value="grok-4" selected>Grok 4</option>
        <option value="grok-4-heavy">Grok 4 Heavy</option>
      </select>
      <label>Modus</label>
      <select id="effort">
        <option value="schnell" selected>Schnell</option>
        <option value="experte">Experte</option>
        <option value="heavy">Heavy</option>
      </select>
      <label>Anzahl Abläufe</label>
      <select id="rounds">
        <option value="1" selected>1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
      </select>
      <label>Knotentyp</label>
      <select id="knot">
        <option value="Interessen" selected>Interessen</option>
        <option value="Archetypen">Archetypen</option>
        <option value="Personas">Fiktive Personas</option>
      </select>
      <label>Interessen-Set</label>
      <textarea id="interest" rows="3">Urbane Spurensuche – Gemeinsames Dokumentieren von Graffiti-Schichten und verblassten Wandinschriften in der Stadt.</textarea>
      <button onclick="startRun()">Durchlauf starten</button>
      <div id="status" class="note" style="margin-top:1rem;"></div>
    </section>

    <section id="agents">
      <h2>Agenten-Ausgaben (live)</h2>
      <div id="agentOutputs"></div>
    </section>

    <section id="map">
      <h2>Landkarte</h2>
      <p class="note">Wird auf Anforderung aus den Bot-Ergebnissen erzeugt.</p>
      <div id="mapContent"></div>
    </section>
  </main>

  <script>
    const presets = {
      schnell: { model: "grok-3", effort: "schnell" },
      mittel: { model: "grok-4", effort: "experte" },
      komplex: { model: "grok-4-heavy", effort: "heavy" }
    };

    function show(id) {
      document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      event.target.classList.add('active');
    }

    function setPreset(name, el) {
      document.querySelectorAll('.preset').forEach(p => p.classList.remove('active'));
      el.classList.add('active');
      document.getElementById('model').value = presets[name].model;
      document.getElementById('effort').value = presets[name].effort;
    }

    function startRun() {
      const interest = document.getElementById('interest').value.trim();
      const knot = document.getElementById('knot').value;
      const rounds = document.getElementById('rounds').value;
      document.getElementById('status').innerHTML = `Durchlauf gestartet…<br>Interessen-Set: ${interest}<br>Knotentyp: ${knot}<br>Abläufe: ${rounds}<br><span class="note">Die echten Grok Bots werden über die Bot-Tools aufgerufen. Die vollständigen Ausgaben erscheinen hier. Die Bot-Aktivität ist parallel in der Grok-Bot-App sichtbar.</span>`;
      show('agents');
      document.getElementById('agentOutputs').innerHTML = `
        <div class="agent-chat">
          <div class="agent-header">🔍 Interessen-Analytiker</div>
          <div class="agent-messages"><div class="msg">Analyse: Mit dem Knotentyp Interessen wird die urbane Spurensuche als Verbund von Interessen gelesen... Muster: Vergangenheit und Gegenwart an einer Wand, Methode als gemeinsame Sprache... Gemeinschaftspotenziale: Erinnerungsrunden im Viertel, Gemeinsames Dokumentationsschema...</div></div>
        </div>
        <div class="agent-chat">
          <div class="agent-header">🛠️ Format-Entwerfer</div>
          <div class="agent-messages"><div class="msg">Formate: Die Erinnerungsrunde im Viertel, Der Zwei-Zeiten-Gang, Der Erhaltungs-Rat. Jedes mit Schritten und Prinzipien.</div></div>
        </div>
        <div class="agent-chat">
          <div class="agent-header">🕸️ Beziehungs-Architekt</div>
          <div class="agent-messages"><div class="msg">Katalog erstellt: Knoten N1–N11 (Interessen), Kanten E1–E15, Cluster K1–K5 (Lesen und Entziffern, Dokumentieren, Erinnerung und Recherche, Zwei Zeiten, Erhalt und Verantwortung).</div></div>
        </div>
        <div class="agent-chat">
          <div class="agent-header">💫 Emotions-Kurator</div>
          <div class="agent-messages"><div class="msg">Klickinhalte C1–C6 mit emotionalen Eindrücken (neugierig-experimentell). Overall mood: Die Stadt als vielschichtiges Palimpsest...</div></div>
        </div>
        <div class="agent-chat">
          <div class="agent-header">🎬 Simulations-Choreograph</div>
          <div class="agent-messages"><div class="msg">Startzustand und Phasen P1–P4 mit sichtbaren IDs und technischen Hinweisen.</div></div>
        </div>
        <div class="agent-chat">
          <div class="agent-header">📋 Master-Koordinator</div>
          <div class="agent-messages"><div class="msg">Ergebnisse integriert. IDs unverändert übernommen. Gesamtkonzept erstellt.</div></div>
        </div>
      `;
    }
  </script>
</body>
</html>
