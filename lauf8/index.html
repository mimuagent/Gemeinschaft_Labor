i übermalten Graffiti; Genehmigungen für Privatgrund (Ressource nicht belegt, daher kein Knoten).\n- Bedürfnis-Kanten (E17–E20, E25, E26, E29, E30) sind Annahmen der Vorarbeit.\n- Die zwei Bilder stammen aus Wikimedia Commons und kamen schon im alten lauf1 vor, nicht in bilder.md von lauf8.\n\n## Emotionale Klickinhalte\n\n## Emotionale Klickinhalte – lauf8 (Katalog lauf8/katalog.json)\n\n### C1 Gemeinsam unterwegs, nicht allein vor der Wand\n**Katalog-IDs:** B1, A1, Ri1, Ro4, E18, E26, K2\n\n**Eindruck:** Warme, wache Verbundenheit: Man geht im Takt der Gruppe, spricht über dieselbe Wand und fühlt sich dabei als Teil von etwas. Fehlt dies, entsteht das Gefühl, nur Zuschauer zu sein. Gefühlswörter sind Interpretation.\n\n**Beleg:** B1 (Zugehörigkeit) wird laut E18 von der Begehung (A1) und laut E26 vom monatlichen Ritual (Ri1) bedient, das Wegführende (Ro4, E28) leiten. Beide Kanten sind im Katalog als Annahme markiert.\n\n**Prüfung und Gegenargumente:** Alternative 'Leistungsdruck' (viele Funde) widerspricht der festen, kleinen Form von Ri1. Alternative 'Gruppenzwang' wird durch B4 und E30 gebremst. Wirkung ist Annahme, nicht belegt.\n\n### C2 Der eigene Fund bekommt einen Platz\n**Katalog-IDs:** B2, Ri3, A4, Ro3, E17, E25, E27, K4\n\n**Eindruck:** Stilles Stolzgefühl: Ein Fund, der im Archivabend gezeigt und beim Archivabgleich eingeordnet wird, fühlt sich gesehen an. Bleibt er unbeachtet, entsteht leise Enttäuschung.\n\n**Beleg:** B2 (Anerkennung) wird nach E17 durch den Archivabgleich (A4) und nach E25 durch den Archivabend (Ri3) bedient; die Archivierenden (Ro3) tragen ihn (E27). Alle als Annahme markiert.\n\n**Prüfung und Gegenargumente:** Alternative 'Wettbewerb um Likes' passt nicht: Ri3 enthält Paar-Prüfung und Entscheidung über Zeigen, kein Ranking. Alternative 'Anonymität' würde B2 verletzen. Wirkung ist Annahme.\n\n### C3 Aufatmen durch klare Regeln\n**Katalog-IDs:** B3, Re2, Ri3, A1, E12, E20, E29, K4\n\n**Eindruck:** Ruhige Erleichterung: Wer weiß, was fotografiert, betreten und gezeigt werden darf, kann entspannt hinschauen. Unklarheit erzeugt Anspannung an jeder Hauswand.\n\n**Beleg:** B3 (Sicherheit) wird nach E20 durch das Rechtswissen (Re2) bedient, das die Begehung braucht (E12); E29 begründet die Rechte-Runde im Archivabend (Ri3).\n\n**Prüfung und Gegenargumente:** Alternative 'Abenteuerlust ohne Regeln' widerspricht E20, E29. Gegen den Eindruck spricht E20 selbst: 'Rechtslage für Graffiti offen', Sicherheit bleibt begrenzt. Keine Rechtsberatung.\n\n### C4 Eigener Weg, eigene Wand, eigenes Tempo\n**Katalog-IDs:** B4, A2, Ri2, Re4, E19, E30, K3\n\n**Eindruck:** Gelassene Freiheit: Eine selbst gewählte Wand, die man nach festem Abstand wieder besucht, fühlt sich nach eigener Entdeckung an, nicht nach Pflicht. Starre Vorgaben würden Druck erzeugen.\n\n**Beleg:** B4 (Autonomie) wird nach E19 durch den Wiederbesuch (A2) bedient; E30 prägt das Ritual (Ri2) flexibel; Re4 gibt Orientierung (E13).\n\n**Prüfung und Gegenargumente:** Alternative 'Verpflichtung/Pflichtgefühl' widerspricht E30. Alternative 'Einsamkeit' wird durch das Gruppenritual (C1, B1) ausgeglichen. Beides Annahmen aus dem Katalog.\n\n### C5 Staunen über Schichten und Geisterschrift\n**Katalog-IDs:** I3, I2, Ro2, A4, E3, E7, K1\n\n**Eindruck:** Neugieriges Staunen mit Fragezeichen: Überlagerungen als Zeitachse lesen und halb lesbare Wandwerbung im Archiv wiederfinden, ohne vorzugeben, alles zu wissen.\n\n**Beleg:** I3 (Graffiti-Schichten als Zeitspur) verlangt laut E3 Wiederbesuche; Datierende (Ro2) gleichen laut E7 mit Archiven ab (A4). Bild lissabon_lx_factory_schichten.jpg (Wikimedia Commons, CC BY 4.0) zeigt Schichtung als Phänomen.\n\n**Prüfung und Gegenargumente:** Alternative 'Nostalgie/Wehmut' passt nicht zum prüfenden Abgleich (A4). E3 warnt: ohne Datierung wenig aussagekräftig, daher Unsicherheit statt Gewissheit. Wirkung nicht belegt.\n\n### Stimmung\nNeugierig-experimentell mit warmer Verbundenheit und behutsamer Zurückhaltung. Begründung: B1 bis B4 bekommen je einen Eindruck (C1 bis C4), C5 bündelt das Staunen der Interessen I2 und I3. Gegen 'leistungsorientiert' sprechen Ri1 und E30, gegen 'streng-juristisch' die offene Rechtslage (E20). Die Gefühlswörter sind Interpretation; viele Kanten sind im Katalog als Annahme markiert. Keine externe Recherche (Zeitbudget 120 s).\n\n### Bild\n- bilder/lissabon_lx_factory_schichten.jpg (C5), Quelle in bilder.json\n\n## Simulation\n\n## Simulation lauf8: Urbane Spurensuche (alle sechs Knotentypen)\n\nKatalogfassung: lauf8/katalog.json (aktuell). Phasen sind kumulativ; eine Kante ist nur sichtbar, wenn beide Enden sichtbar sind, ein Cluster nur, wenn alle seine Knoten sichtbar sind.\n\n### P1 Schrift und Schichten sehen\nSichtbar: I1, I2, I3, Ro1, Ro4, A1, Re1, E1, E5, E9, E11\n\nDie Gruppe tritt zusammen: die Interessen I1 (Schrift im Stadtraum gemeinsam erfassen), I2 (Ghost Signs archivieren) und I3 (Graffiti-Schichten als Zeitspur) blenden ein, dazu die Rollen Ro1 (Fotografierende) und Ro4 (Wegführende), die Aktivität A1 (Begehung mit Foto) und die Ressource Re1 (Kamera, Smartphone oder Papierkarte). E1, E5, E9 und E11 zeigen, wer die Begehung trägt und womit.\n\n### P2 Spurengang mit festem Rhythmus und Rechtswissen\nSichtbar: I1, I2, I3, Ro1, Ro4, A1, Re1, Re2, Ri1, B1, B3, E1, E5, E9, E11, E12, E18, E20, E21, E26, E28, K2\n\nDas Ritual Ri1 (Monatliche Begehung) macht die Begehung regelmäßig; es verbindet sich über E21 mit A1 und über E28 mit Ro4. Das Bedürfnis B1 (Zugehörigkeit) entsteht über E18 und E26. Die Ressource Re2 (Rechtswissen) und das Bedürfnis B3 (Sicherheit) erscheinen über E12 und E20 in Warnfarbe: Rechte sind früh sichtbar, noch vor jedem Archiv. K2 (Spurengang) legt sich als Hülle um seine sieben Elemente.\n\n### P3 Wiederbesuch derselben Wand\nSichtbar: I1, I2, I3, Ro1, Ro4, A1, Re1, Re2, Ri1, B1, B3, Ro2, A2, Re4, Ri2, B4, E1, E3, E5, E6, E9, E10, E11, E12, E13, E16, E18, E19, E20, E21, E22, E26, E28, E30, K2, K3\n\nDie Rolle Ro2 (Datierende und Recherchierende), die Aktivität A2 (Wiederbesuch derselben Wand), die Ressource Re4 (Standpunktbeschreibung in Worten), das Ritual Ri2 (Wiederbesuch nach festem Abstand) und das Bedürfnis B4 (Autonomie) erscheinen. E3 verbindet I3 mit A2, E6 und E10 zeigen, wer wiederbesucht, E13 und E16 die Hilfsmittel, E22 den festen Abstand, E19 und E30 die Autonomie. K3 (Wiederbesuch) wird vollständig.\n\n### P4 Archivabend und Abgleich\nSichtbar: I1, I2, I3, Ro1, Ro4, A1, Re1, Re2, Ri1, B1, B3, Ro2, A2, Re4, Ri2, B4, A3, A4, Re3, Ro3, B2, Ri3, E1, E2, E3, E4, E5, E6, E7, E8, E9, E10, E11, E12, E13, E14, E15, E16, E17, E18, E19, E20, E21, E22, E23, E24, E25, E26, E27, E28, E29, E30, K1, K2, K3, K4\n\nZuletzt kommen Archivierende (Ro3), Verschlagwortung (A3), Abgleich mit Archiven (A4), Archivzugang und Karte oder App (Re3), das Bedürfnis Anerkennung (B2) und das Ritual Archivabend (Ri3). E2, E4, E7, E8, E14, E15, E17 und E23 bis E25 verbinden Interessen, Rollen, Aktivitäten und Ressourcen mit dem Archivabend; E27 und E29 (Warnfarbe) binden Archivierende und Rechtssicherheit an Ri3. K1 (Schrift und Schichten lesen) und K4 (Archivabend) werden vollständig. Endzustand: alle Katalogelemente sind sichtbar.\n\n### Prüfung, Risiken, Alternativen\nPrüfung: Die Abfolge geht von Sehen (P1) über Rhythmus und Recht (P2) und Wiederbesuch (P3) zum Archiv (P4). Rechte (Re2, B3) stehen damit vor Verschlagwortung (A3) und Archivabend (Ri3). Genutzt werden alle sechs Knotentypen: Interessen, Rollen, Aktivitäten, Ressourcen, Bedürfnisse und Rituale.\n\nRisiken: (1) P4 bringt sechs Knoten und zwölf Kanten auf einmal und ist überladen. (2) Der Wiederbesuch kommt erst in P3; der Zeitbezug von I3 ist bis dahin nur angedeutet. (3) Ro2 (Datierende) erscheint erst in P3, obwohl der Abgleich mit Archiven (A4) in P4 schon Datierung braucht; die Abfolge ist dort knapp. (4) B2 (Anerkennung) steht erst am Ende, Newcomer könnten Beteiligung vorher als Pflicht erleben.\n\nAlternativen: P4 teilen (zuerst A3, Ro3, Re3, dann A4, B2, Ri3); Ro2 schon in P1 zeigen; Ri3 vor P3 ziehen und den Wiederbesuch nach dem ersten Archivabend zeigen; Re2 und B3 sogar schon in P1.\n\nTechnik: Knoten blenden mit Skalierung 0,6 zu 1 in etwa 400 ms ein, Kanten zeichnen sich als Strichlinie in etwa 600 ms, Cluster als Hülle mit Deckkraft 0,15, Warnfarbe bei E12, E20, E29, Automatik etwa 4 s je Phase. Phasen sind kumulativ. Keine zusätzliche Recherche wegen des Zeitbudgets von 120 s; Quellen stehen im Katalog und in bilder.json.\n\n### Bild\n- trier_hochstetter_werbung.jpg: verblasste Giebelwerbung in Trier, Beispiel für I2.\n\n## Anhang katalog.json\n\n```json\n{\n \"knoten\": [\n  {\n   \"id\": \"I1\",\n   \"typ\": \"Interessen\",\n   \"label\": \"Schrift im Stadtraum gemeinsam erfassen\",\n   \"text\": \"Interesse an gemeinsamer Erfassung von Schrift im Stadtraum.\",\n   \"beleg\": \"1-analytiker.md Interessen, Quellen [1] INGRID, [2] Lingscape.\",\n   \"gegen\": \"INGRID ist ein Forschungsprojekt, Lingscape hat keine belegte private Ablage; beide tragen nur das Interesse, kein Format (2-format.md Abschnitt 1).\"\n  },\n  {\n   \"id\": \"I2\",\n   \"typ\": \"Interessen\",\n   \"label\": \"Verblasste Wandwerbung (Ghost Signs) archivieren\",\n   \"text\": \"Interesse, verblasste handgemalte Wandwerbung zu sammeln und zu archivieren.\",\n   \"beleg\": \"1-analytiker.md Interessen, Quellen [3] HAT, [4] ghostsigns.de; Bild dresden_wandbild_baugrube_2019_2020.jpg zeigt eine vergehende Wandfläche.\",\n   \"gegen\": \"Bilder und Quellen stammen aus Fremdarchiven, keine lokale Empirie.\"\n  },\n  {\n   \"id\": \"I3\",\n   \"typ\": \"Interessen\",\n   \"label\": \"Graffiti-Schichten als Zeitspur\",\n   \"text\": \"Interesse, überlagerte Graffiti-Schichten als Zeitachse zu lesen.\",\n   \"beleg\": \"1-analytiker.md Interessen und Muster; 2-format.md Format 1 und 2.\",\n   \"gegen\": \"Fotos belegen nur den Aufnahmezeitpunkt, Schichten sind ohne Datierung schwer zu ordnen (1-analytiker.md).\"\ (Graffiti-Schichten als Zeitspur) verlangt laut E3 Wiederbesuche; Datierende (Ro2) gleichen laut E7 mit Archiven ab (A4). Bild lissabon_lx_factory_schichten.jpg (Wikimedia Commons, CC BY 4.0) zeigt Schichtung als Phänomen.\",\n   \"pruefung\": \"Alternative 'Nostalgie/Wehmut' passt nicht zum prüfenden Abgleich (A4). E3 warnt: ohne Datierung wenig aussagekräftig, daher Unsicherheit statt Gewissheit. Wirkung nicht belegt.\"\n  }\n ],\n \"stimmung\": \"Neugierig-experimentell mit warmer Verbundenheit und behutsamer Zurückhaltung. Begründung: B1 bis B4 bekommen je einen Eindruck (C1 bis C4), C5 bündelt das Staunen der Interessen I2 und I3. Gegen 'leistungsorientiert' sprechen Ri1 und E30, gegen 'streng-juristisch' die offene Rechtslage (E20). Die Gefühlswörter sind Interpretation; viele Kanten sind im Katalog als Annahme markiert. Keine externe Recherche (Zeitbudget 120 s).\"\n}\n```\n\n## Anhang phasen.json\n\n```json\n{\n \"phasen\": [\n  {\n   \"id\": \"P1\",\n   \"titel\": \"Schrift und Schichten sehen\",\n   \"sichtbar\": [\n    \"I1\",\n    \"I2\",\n    \"I3\",\n    \"Ro1\",\n    \"Ro4\",\n    \"A1\",\n    \"Re1\",\n    \"E1\",\n    \"E5\",\n    \"E9\",\n    \"E11\"\n   ],\n   \"text\": \"Die Gruppe tritt zusammen: die Interessen I1 (Schrift im Stadtraum gemeinsam erfassen), I2 (Ghost Signs archivieren) und I3 (Graffiti-Schichten als Zeitspur) blenden ein, dazu die Rollen Ro1 (Fotografierende) und Ro4 (Wegführende), die Aktivität A1 (Begehung mit Foto) und die Ressource Re1 (Kamera, Smartphone oder Papierkarte). E1, E5, E9 und E11 zeigen, wer die Begehung trägt und womit.\"\n  },\n  {\n   \"id\": \"P2\",\n   \"titel\": \"Spurengang mit festem Rhythmus und Rechtswissen\",\n   \"sichtbar\": [\n    \"I1\",\n    \"I2\",\n    \"I3\",\n    \"Ro1\",\n    \"Ro4\",\n    \"A1\",\n    \"Re1\",\n    \"Re2\",\n    \"Ri1\",\n    \"B1\",\n    \"B3\",\n    \"E1\",\n    \"E5\",\n    \"E9\",\n    \"E11\",\n    \"E12\",\n    \"E18\",\n    \"E20\",\n    \"E21\",\n    \"E26\",\n    \"E28\",\n    \"K2\"\n   ],\n   \"text\": \"Das Ritual Ri1 (Monatliche Begehung) macht die Begehung regelmäßig; es verbindet sich über E21 mit A1 und über E28 mit Ro4. Das Bedürfnis B1 (Zugehörigkeit) entsteht über E18 und E26. Die Ressource Re2 (Rechtswissen) und das Bedürfnis B3 (Sicherheit) erscheinen über E12 und E20 in Warnfarbe: Rechte sind früh sichtbar, noch vor jedem Archiv. K2 (Spurengang) legt sich als Hülle um seine sieben Elemente.\"\n  },\n  {\n   \"id\": \"P3\",\n   \"titel\": \"Wiederbesuch derselben Wand\",\n   \"sichtbar\": [\n    \"I1\",\n    \"I2\",\n    \"I3\",\n    \"Ro1\",\n    \"Ro4\",\n    \"A1\",\n    \"Re1\",\n    \"Re2\",\n    \"Ri1\",\n    \"B1\",\n    \"B3\",\n    \"Ro2\",\n    \"A2\",\n    \"Re4\",\n    \"Ri2\",\n    \"B4\",\n    \"E1\",\n    \"E3\",\n    \"E5\",\n    \"E6\",\n    \"E9\",\n    \"E10\",\n    \"E11\",\n    \"E12\",\n    \"E13\",\n    \"E16\",\n    \"E18\",\n    \"E19\",\n    \"E20\",\n    \"E21\",\n    \"E22\",\n    \"E26\",\n    \"E28\",\n    \"E30\",\n    \"K2\",\n    \"K3\"\n   ],\n   \"text\": \"Die Rolle Ro2 (Datierende und Recherchierende), die Aktivität A2 (Wiederbesuch derselben Wand), die Ressource Re4 (Standpunktbeschreibung in Worten), das Ritual Ri2 (Wiederbesuch nach festem Abstand) und das Bedürfnis B4 (Autonomie) erscheinen. E3 verbindet I3 mit A2, E6 und E10 zeigen, wer wiederbesucht, E13 und E16 die Hilfsmittel, E22 den festen Abstand, E19 und E30 die Autonomie. K3 (Wiederbesuch) wird vollständig.\"\n  },\n  {\n   \"id\": \"P4\",\n   \"titel\": \"Archivabend und Abgleich\",\n   \"sichtbar\": [\n    \"I1\",\n    \"I2\",\n    \"I3\",\n    \"Ro1\",\n    \"Ro4\",\n    \"A1\",\n    \"Re1\",\n    \"Re2\",\n    \"Ri1\",\n    \"B1\",\n    \"B3\",\n    \"Ro2\",\n    \"A2\",\n    \"Re4\",\n    \"Ri2\",\n    \"B4\",\n    \"A3\",\n    \"A4\",\n    \"Re3\",\n    \"Ro3\",\n    \"B2\",\n    \"Ri3\",\n    \"E1\",\n    \"E2\",\n    \"E3\",\n    \"E4\",\n    \"E5\",\n    \"E6\",\n    \"E7\",\n    \"E8\",\n    \"E9\",\n    \"E10\",\n    \"E11\",\n    \"E12\",\n    \"E13\",\n    \"E14\",\n    \"E15\",\n    \"E16\",\n    \"E17\",\n    \"E18\",\n    \"E19\",\n    \"E20\",\n    \"E21\",\n    \"E22\",\n    \"E23\",\n    \"E24\",\n    \"E25\",\n    \"E26\",\n    \"E27\",\n    \"E28\",\n    \"E29\",\n    \"E30\",\n    \"K1\",\n    \"K2\",\n    \"K3\",\n    \"K4\"\n   ],\n   \"text\": \"Zuletzt kommen Archivierende (Ro3), Verschlagwortung (A3), Abgleich mit Archiven (A4), Archivzugang und Karte oder App (Re3), das Bedürfnis Anerkennung (B2) und das Ritual Archivabend (Ri3). E2, E4, E7, E8, E14, E15, E17 und E23 bis E25 verbinden Interessen, Rollen, Aktivitäten und Ressourcen mit dem Archivabend; E27 und E29 (Warnfarbe) binden Archivierende und Rechtssicherheit an Ri3. K1 (Schrift und Schichten lesen) und K4 (Archivabend) werden vollständig. Endzustand: alle Katalogelemente sind sichtbar.\"\n  }\n ],\n \"hinweis\": \"Prüfung: Die Abfolge geht von Sehen (P1) über Rhythmus und Recht (P2) und Wiederbesuch (P3) zum Archiv (P4). Rechte (Re2, B3) stehen damit vor Verschlagwortung (A3) und Archivabend (Ri3). Genutzt werden alle sechs Knotentypen: Interessen, Rollen, Aktivitäten, Ressourcen, Bedürfnisse und Rituale. Risiken: (1) P4 bringt sechs Knoten und zwölf Kanten auf einmal und ist überladen. (2) Der Wiederbesuch kommt erst in P3; der Zeitbezug von I3 ist bis dahin nur angedeutet. (3) Ro2 (Datierende) erscheint erst in P3, obwohl der Abgleich mit Archiven (A4) in P4 schon Datierung braucht; die Abfolge ist dort knapp. (4) B2 (Anerkennung) steht erst am Ende, Newcomer könnten Beteiligung vorher als Pflicht erleben. Alternativen: P4 teilen (zuerst A3, Ro3, Re3, dann A4, B2, Ri3); Ro2 schon in P1 zeigen; Ri3 vor P3 ziehen und den Wiederbesuch nach dem ersten Archivabend zeigen; Re2 und B3 sogar schon in P1. Technik: Knoten blenden mit Skalierung 0,6 zu 1 in etwa 400 ms ein, Kanten zeichnen sich als Strichlinie in etwa 600 ms, Cluster als Hülle mit Deckkraft 0,15, Warnfarbe bei E12, E20, E29, Automatik etwa 4 s je Phase. Phasen sind kumulativ. Keine zusätzliche Recherche wegen des Zeitbudgets von 120 s; Quellen stehen im Katalog und in bilder.json.\"\n}\n```\n", "geliefert": true}, {"datei": "summary.md", "rolle": "Master-Koordinator (Summary)", "text": "# Management Summary lauf8 – Urbane Spurensuche\n\n## Aufgabenstellung\nDas Labor erforscht, wie Menschen mit ungewöhnlichen Interessen echte Freundschaften und Gemeinschaften aufbauen können. Untersucht wurde das Interessen-Set „Urbane Spurensuche – Gemeinsames Dokumentieren von Graffiti-Schichten und verblassten Wandinschriften in der Stadt“ in allen sechs Knotentypen (Interessen, Rollen, Aktivitäten, Ressourcen, Bedürfnisse, Rituale). Der Lauf sollte Analyse, Begegnungsformate, einen Katalog, emotionale Klickinhalte und eine Simulation liefern, bei knappem Zeitbudget von 2 Minuten je Rolle.\n\n## Ergebnis in Kürze\n- Drei Begegnungsformate: Spurengang (gemeinsame Begehung mit Foto), Wiederbesuch (dieselbe Wand nach festem Abstand) und Archivabend (Einordnen und Zeigen der Funde), jeweils mit Rechte-Stufen und Prinzipien.\n- Ein Katalog mit 23 Knoten in allen sechs Typen, 30 Kanten und 4 Clustern.\n- Fünf emotionale Klickinhalte: Verbundenheit, Anerkennung des eigenen Fundes, Aufatmen durch klare Regeln, Autonomie und Staunen über Schichten.\n- Eine Simulation in vier kumulativen Phasen: Sehen, Spurengang mit Rhythmus und Rechtswissen, Wiederbesuch, Archivabend.\n\n## Risiken und Gegenmaßnahmen\n- Recht: Betreten befriedeter Flächen und Übermalen können strafbar sein, die Rechtslage für Graffiti ist offen. Gegenmaßnahme: Rechte-Stufen, Rechtswissen und Sicherheit früh sichtbar (Phase 2), Rechte-Runde im Archivabend; keine Rechtsberatung.\n- Gruppendruck und Pflichtgefühl: feste Rhythmen können Spontaneität mindern. Gegenmaßnahme: kleine, flexible Rituale, Autonomie als eigener Knoten.\n- Simulationsschwächen: Phase 4 ist mit sechs Knoten und zwölf Kanten überladen, Datierende erscheinen erst in Phase 3, Anerkennung erst am Ende, sodass Neulinge Beteiligung vorher als Pflicht erleben könnten.\n\n## Ungeprüfte Annahmen und Beleglage\n- Die Beleglage ist schwach: Die Quellen (u. a. INGRID, Lingscape, ghostsigns.de, Urheberrecht und Strafrecht) stammen aus einem früheren Lauf und wurden in diesem Lauf nicht neu abgerufen.\n- Rollenaufteilung, Rhythmen (monatlich, vierteljährlich) und die Bedürfnisse sind begründete Annahmen, keine belegte Praxis; viele Kanten sind im Katalog als Annahme markiert.\n- Gefühlswörter sind Interpretation, keine Messung. Bilder stammen aus Fremdarchiven (Wikimedia Commons) und belegen das Phänomen, nicht lokale Verhältnisse oder die Wirkung der Formate.\n\n## Offene Entscheidungen\n- Soll eine Folgerunde lokale Quellen, echte Begehungsdaten und eine Rechtsprüfung nachholen?\n- Soll die Phase 4 der Simulation entzerrt werden, und soll die Anerkennung früher eingeführt werden?\n", "geliefert": true}, {"datei": "bilder.md", "rolle": "Bildliste aller Bots", "text": "| Dateiname | Rolle | Begründung | Quelle |\n| --- | --- | --- | --- |\n| 1-analytiker-ghostsign_tottenham.jpg | Interessen-Analytiker | Verblasstes handgemaltes Wandwerbeschild in London: belegt Vergänglichkeit von Wandschrift. Fremdarchiv-Beispiel, keine lokale Empirie. | https://commons.wikimedia.org/wiki/File:Ghost_sign_painted_wall_advert_Tottenham_High_Road_London.jpg, Urheber Acabashi, CC BY-SA 4.0 |\n| 1-analytiker-ghostsign_poznan.jpg | Interessen-Analytiker | Verblasste Wandschrift in Poznań: zeigt, dass das Phänomen auch in Mitteleuropa vorkommt. Fremdarchiv-Beispiel, keine lokale Empirie. | https://commons.wikimedia.org/wiki/File:Ghost_sign_in_Poznan.jpg, Urheber GeoMancer448, CC BY-SA 4.0 |\n| 2-format-berlin_graffitimauer_lichtenberg.jpg | Format-Entwerfer | Zeigt eine großflächig mit Graffiti bedeckte Mauer in einem Stadtpark: Beispiel für übereinander liegende, aktive Graffiti-Schichten, die die beiden Analytiker-Bilder (verblasste Wandwerbung) nicht abdecken. Fremdarchiv-B nne_street_ghostsign.jpg (Bilder: 2)"}, {"zeit": "2026-11-10T16:21:49+01:00", "revision": 14, "ereignis": "lauf_completed", "rolle": null, "text": null}]}, "katalog.json": {"knoten": [{"id": "N1", "label": "Schichten lesen", "text": "Interesse, Überlagerungen von Graffiti und Wandschrift in ihrer Reihenfolge zu beschreiben.", "beleg": "1-analytiker.md Muster 1 (Schicht als Zeitachse); 2-format.md Format 1 bis 3, Prinzip 6; Bilder dresden_wandbild_baugrube_2019_2020.jpg und dresden_fassade_lsr_markierung_2016_2020.jpg zeigen dieselbe Wand in zwei Zuständen.", "gegen": "Ohne Datierung entsteht Schein-Chronologie; Fotos belegen nur den Aufnahmezeitpunkt (1-analytiker.md Muster 1, Gegenargument)."}, {"id": "N2", "label": "Verblasste Wandschrift (Ghost Signs) entdecken", "text": "Interesse an handgemalter, verblassender Wandwerbung als abgeschlossener, schwindender Schicht.", "beleg": "1-analytiker.md Belegte Grundlagen, Quellen [3][4], Muster 5 (Bilder 1–7); 2-format.md Format 1 (Stationen mit Wandschrift).", "gegen": "Die Bilder stammen aus Fremdarchiven; ob die Unterscheidung lokal trägt, ist offen (1-analytiker.md Muster 5, Gegenargument)."}, {"id": "N3", "label": "Aktives Graffiti als Wandschicht beobachten", "text": "Interesse an aktuellen, sich überlagernden Graffiti als lebendiger, wechselnder Schicht.", "beleg": "1-analytiker.md Muster 5 (Bild 8), Spannungsfeld 4; 2-format.md Format 1 (zwei Stationen mit aktivem Graffiti), Format 2 (Fokus auf Wandfläche, nicht Personen).", "gegen": "Rechtlich und sozial umstritten; Beobachtung kann als Szene-Überwachung wirken (2-format.md Format 2, Risiken)."}, {"id": "N4", "label": "Vergänglichkeit dokumentieren", "text": "Interesse, verschwindende Wandspuren festzuhalten, bevor sie überdeckt oder entfernt werden.", "beleg": "1-analytiker.md Muster 3 (Vergänglichkeit als Motor), H3; 2-format.md Format 2, Alternative Vorher-Nachher; Bild dresden_wandbild_baugrube_2019_2020.jpg.", "gegen": "Dringlichkeit kann zu überhastetem, unsauberem Dokumentieren führen (1-analytiker.md Muster 3, Gegenargument)."}, {"id": "N5", "label": "Wiederbesuch derselben Wand", "text": "Interesse, höchstens zehn Wände höchstens monatlich über sechs Monate erneut aufzunehmen.", "beleg": "2-format.md Format 2 [Entwurf]; 1-analytiker.md Hypothesen H2 und H3; Bild dresden_fassade_lsr_markierung_2016_2020.jpg (Vergleich derselben Fassade 2016 und 2020).", "gegen": "Wirkt wie Überwachung einer Szene; H2 und H3 sind Hypothesen, die Methode ist nicht belegt (2-format.md Abschnitt 1 und Format 2)."}, {"id": "N6", "label": "Gemeinsam gehen und beschreiben", "text": "Interesse an der Begehung mit vorab gesichteten Stationen: erst gemeinsam beschreiben, dann notieren.", "beleg": "2-format.md Format 1 [Entwurf]; 1-analytiker.md Hypothese H1.", "gegen": "Konflikt mit Anwohnenden und Mobilitätsgrenzen; H1 ist eine Hypothese (2-format.md Format 1, Risiken)."}, {"id": "N7", "label": "Kollektives Archiv aufbauen", "text": "Interesse, Beobachtungen vieler in einem gemeinsamen, geprüften Bestand zu sammeln.", "beleg": "1-analytiker.md Muster 2, Quellen [2][3][4]; 2-format.md Format 3 (Archivabend).", "gegen": "Beteiligung ist ungleich verteilt, wenige tragen die Arbeit (1-analytiker.md Muster 2, Gegenargument)."}, {"id": "N8", "label": "Datierung und Unsicherheit sichtbar machen", "text": "Interesse daran, Reihenfolge und Alter von Schichten mit einer Sicherheitsstufe (sicher, vermutet, unklar) zu führen.", "beleg": "2-format.md Prinzip 6 und Abschnitt 2 (Minimum); 1-analytiker.md Muster 1, Gegenargument zur Datierung.", "gegen": "Zusätzlicher Aufwand kann Einsteiger abschrecken (2-format.md Format 3, Risiko Überforderung)."}, {"id": "N9", "label": "Lokalgeschichte und Typografie", "text": "Interesse, Wandschrift nach Schriftform und Gewerbegeschichte des Viertels zu deuten.", "beleg": "2-format.md Format 1 (Interessen Lokalgeschichte, Typografie); 1-analytiker.md Quellen [3][4].", "gegen": "Deutungen können Vermutungen zu Fakten machen; im Lauf nicht neu geprüft (2-format.md Abschnitt 7)."}, {"id": "N10", "label": "Rechte und Schutz klären", "text": "Interesse, Aufnahme, interne Ablage und Veröffentlichung getrennt zu behandeln: Stufe A geklärt, B nur Textnotiz oder Skizze, C nicht dokumentieren.", "beleg": "2-format.md Abschnitt 1 und 2; 1-analytiker.md Quellen [5][6][7]. Ob § 59 UrhG kurzlebige oder übermalte Graffiti erfasst, ist laut 2-format.md offen; Gruppenbeschluss ersetzt keine Rechtsklärung.", "gegen": "Strenge Stufen bremsen Beiträge, B-Fälle bleiben lange ungeklärt (Modellierung, keine Rechtsberatung)."}, {"id": "N11", "label": "Bewahren und Respekt vor dem Vergehen", "text": "Interesse, die Spannung zwischen Dokumentieren und bewusster Flüchtigkeit von Graffiti auszuhalten und zu besprechen.", "beleg": "1-analytiker.md Spannungsfeld 1, Muster 4; 2-format.md Prinzip 7 (Dokumentieren heißt nicht billigen).", "gegen": "Das Thema kann Gruppen lähmen, wenn es nie entschieden wird (Modellierung; 2-format.md Abschnitt 6)."}, {"id": "N12", "label": "Offenheit und Qualität abwägen", "text": "Interesse, bürgerwissenschaftliche Offenheit mit einem fünffeldrigen Qualitätsminimum zu verbinden.", "beleg": "1-analytiker.md Spannungsfeld 3; 2-format.md Abschnitt 2 und Format 3 (Paar-Prüfung).", "gegen": "Prüfung kann hierarchisch werden; Wirkung nicht belegt (2-format.md Format 3, Risiken)."}, {"id": "N13", "label": "Schrift im Stadtraum erforschen", "text": "Interesse an Wandschrift als Teil der sprachlichen Landschaft der Stadt.", "beleg": "1-analytiker.md Quellen [1][2]; 2-format.md Abschnitt 1 (INGRID nur Forschungsprojekt, Lingscape ohne belegte private Ablage).", "gegen": "Weder INGRID noch Lingscape sind als Ablage für Gruppenbeiträge belegt (2-format.md Abschnitt 1)."}, {"id": "N14", "label": "Historisches und Aktuelles zusammenhalten", "text": "Interesse daran, verblasste Wandschrift und aktives Graffiti in einer Gruppe gleichrangig zu behandeln.", "beleg": "1-analytiker.md Spannungsfeld 4, Muster 5; 2-format.md Abschnitt 2 (gleiches Minimum, getrennt gekennzeichnet), Format 3 (beide Schichtarten gleichrangig), Abschnitt 6 (offene Frage).", "gegen": "Die Gruppe könnte in zwei Lager zerfallen; ob eine Gruppe beide Schichtarten gleich annimmt, ist nicht belegt (2-format.md Abschnitt 1)."}], "kanten": [{"id": "E1", "from": "N2", "to": "N4", "text": "Verblassende Wandschrift ist ein Anlass zur Dokumentation von Verlust (1-analytiker.md Muster 3, Quellen [3][4]). Gegen: nicht jeder Fund ist bedroht."}, {"id": "E2", "from": "N1", "to": "N8", "text": "Schichtenlesen braucht Datierung mit Sicherheitsstufe (1-analytiker.md Muster 1, Gegenargument; 2-format.md Prinzip 6)."}, {"id": "E3", "from": "N4", "to": "N5", "text": "Wiederbesuche halten Veränderung fest (2-format.md Format 2, H3). Modellierung; Wirkung nicht belegt."}, {"id": "E4", "from": "N5", "to": "N1", "text": "Mehrere Zeitpunkte ergänzen die Schichtenlesung im Einzelbild, ersetzen sie nicht (2-format.md Format 2 und 3). Gegen: Zwischen Besuchen bleibt Veränderung undatiert."}, {"id": "E5", "from": "N6", "to": "N1", "text": "Der Spurengang bietet Stationen, an denen gemeinsam Schichten beschrieben werden (2-format.md Format 1)."}, {"id": "E6", "from": "N9", "to": "N2", "text": "Lokalgeschichte und Typografie geben verblasster Wandschrift Bedeutung (2-format.md Format 1; 1-analytiker.md Quellen [3][4])."}, {"id": "E7", "from": "N13", "to": "N9", "text": "Wandschrift als sprachliche Landschaft stützt die Deutung (1-analytiker.md Quellen [1][2]). Gegen: Quellen tragen nur das Interesse, nicht ein Format."}, {"id": "E8", "from": "N7", "to": "N12", "text": "Ein offenes Archiv braucht ein Minimum, sonst sinkt die Qualität (1-analytiker.md Spannungsfeld 3; 2-format.md Abschnitt 2)."}, {"id": "E9", "from": "N8", "to": "N12", "text": "Unsicherheitsangaben sind Teil des Minimums aus fünf Feldern (2-format.md Abschnitt 2)."}, {"id": "E10", "from": "N12", "to": "N7", "text": "Paar-Prüfung und dokumentierte Kriterien machen den Bestand tragfähig (2-format.md Format 3). Gegen: kann hierarchisch werden."}, {"id": "E11", "from": "N10", "to": "N7", "text": "Rechte-Stufen legen fest, was ins Archiv darf; B bleibt Textnotiz oder Skizze (2-format.md Abschnitt 2, Format 3 Rechte-Runde)."}, {"id": "E12", "from": "N10", "to": "N5", "text": "Fotoreihe nur bei Stufe A, sonst Text- und Skizzenreihe (2-format.md Format 2, Risiko unklare Werkrechte)."}, {"id": "E13", "from": "N11", "to": "N4", "text": "Spannung: Der Drang zu bewahren steht gegen den Respekt vor bewusster Flüchtigkeit (1-analytiker.md Spannungsfeld 1). Beide Lesarten zulassen."}, {"id": "E14", "from": "N11", "to": "N10", "text": "Dokumentieren ist nicht billigen; die Gruppe klärt das ausdrücklich und trennt es von der Rechtsklärung (2-format.md Prinzip 7, Abschnitt 2)."}, {"id": "E15", "from": "N13", "to": "N7", "text": "Forschungsprojekte sind nur methodisches Vorbild; ein Beitragsweg ist nicht belegt (2-format.md Abschnitt 1). Spannung zwischen Vorbild und eigener Gruppenablage."}, {"id": "E16", "from": "N3", "to": "N5", "text": "Aktives Graffiti wird im Wiederbesuch nur als Wandfläche ohne Personen und ohne erkennbare Szenebindung aufgenommen (2-format.md Format 2, Risiken)."}, {"id": "E17", "from": "N3", "to": "N10", "text": "Aktives Graffiti ist rechtlich und sozial umstritten, daher greifen Rechte-Stufen und Wand-statt-Mensch besonders (1-analytiker.md Muster 4, Spannungsfeld 4; 2-format.md Abschnitt 2)."}, {"id": "E18", "from": "N14", "to": "N2", "text": "Spannung Historisch gegenüber Aktuell: beide Schichtarten gehören in dieselbe Gruppe (1-analytiker.md Muster 5). Gegen: Lager können entstehen."}, {"id": "E19", "from": "N14", "to": "N3", "text": "Gegenstück zu E18: aktives Graffiti bleibt gleichrangig, auch wenn es strittiger ist (2-format.md Format 3, Risiko Streit zwischen Historischem und Aktuellem)."}, {"id": "E20", "from": "N6", "to": "N14", "text": "Der Spurengang mischt bewusst zwei Stationen mit Wandschrift und zwei mit Graffiti (2-format.md Format 1)."}], "cluster": [{"id": "K1", "label": "Wand lesen", "knoten": ["N1", "N2", "N3", "N8", "N13"]}, {"id": "K2", "label": "Zeit und Verlust", "knoten": ["N4", "N5", "N11"]}, {"id": "K3", "label": "Gemeinsam gehen, deuten, zusammenhalten", "knoten": ["N6", "N9", "N14"]}, {"id": "K4", "label": "Beitragen, prüfen, schützen", "knoten": ["N7", "N12", "N10"]}]}, "klick.json": {"klick": [{"id": "C1", "titel": "Schichten wie Erdgeschichte", "ids": ["N1", "N3", "N8", "E2", "K1"], "eindruck": "Neugieriges Staunen: Eine Wand wird zum Schichtenprofil, in dem man Reihenfolgen entdeckt und vorsichtig als Vermutung benennt. Gefühlswörter sind Interpretation der Kuratorin.", "beleg": "N1 beschreibt das Lesen von Überlagerungen, N3 die lebendige Graffiti-Schicht, E2 verlangt Datierung mit Sicherheitsstufe (N8). Bild lissabon_lx_factory_schichten.jpg zeigt solche Schichten (Wikimedia Commons, CC BY 4.0); es belegt das Phänomen, keine Gruppenwirkung.", "pruefung": "Alternative 'Detektivstolz' (sicher datieren) widerspricht E2 und N8, die Unsicherheit ausdrücklich sichtbar halten. Alternative 'Kunstbewunderung' würde die Dokumentationsabsicht (N1) verdrängen. Der Eindruck ist Modellierung, nicht empirisch geprüft."}, {"id": "C2", "titel": "Geisterschrift an der Lesbarkeitsgrenze", "ids": ["N2", "N9", "N13", "N8", "E6", "E7", "K1"], "eindruck": "Leise Faszination mit Fragezeichen: Halb lesbare Buchstaben laden zum gemeinsamen Raten ein, ohne dass die Gruppe so tut, als wüsste sie die Antwort.", "beleg": "N2 beschreibt verblassende Wandwerbung, E6 verbindet sie über N9 mit Lokalgeschichte und Typografie, E7 stützt dies über N13 (Schrift als sprachliche Landschaft; laut Kante tragen die Quellen nur das Interesse, nicht ein Format). Bild jacksonville_levi_strauss_ghostsign.jpg zeigt eine verblasste historische Wandwerbung (Wikimedia Commons, CC BY-SA 4.0), ein Fremdarchiv-Beispiel.", "pruefung": "Alternative 'Nostalgie' wird durch N8 gebremst: Unsicherheit statt Verklärung. Alternative 'Forscherernst' passt zu N13, nähme aber das Spielerische des gemeinsamen Deutens. Das Katalogwissen reicht als Beleg für Interessen, nicht für Wirkung auf Menschen."}, {"id": "C3", "titel": "Dieselbe Wand, andere Zeit", "ids": ["N4", "N5", "E1", "E3", "E4", "K2"], "eindruck": "Behutsame Spannung: Wer wiederkommt, merkt, wie viel sich zwischen zwei Besuchen verändert hat, und bleibt ehrlich dabei, was dazwischen unbekannt bleibt.", "beleg": "N5 begrenzt Wiederbesuche auf höchstens zehn Wände, monatlich über sechs Monate; E3 und E4 verbinden dies mit Vergänglichkeit (N4) und Schichtenlesen; E1 nennt Verlust als Anlass. Die Dresdner Vorher-Nachher-Bilder aus der Architektur-Vorarbeit (bilder/3-architektur-dresden_*) zeigen denselben Effekt.", "pruefung": "Alternative 'Wehmut/Rettungsdrang' wird durch E1 ('nicht jeder Fund ist bedroht') und E4 ('Zwischen Besuchen bleibt Veränderung undatiert') gedämpft. Alternative 'nüchterne Statistik' passt zur Begrenzung in N5, verfehlt aber das Entdeckergefühl. Wirkung der Formate ist laut E3 nicht belegt."}, {"id": "C4", "titel": "Gemeinsam sehen, dann notieren", "ids": ["N6", "N1", "N14", "E5", "E20", "K3"], "eindruck": "Lebendige Gemeinsamkeit: Erst schauen und sprechen, dann schreiben; zwei Wandschichten, die man nebeneinander gelten lässt.", "beleg": "N6 beschreibt den Spurengang mit vorab gesichteten Stationen, E5 macht ihn zum Ort des gemeinsamen Beschreibens von Schichten (N1), E20 mischt bewusst Wandschrift und Graffiti (N14).", "pruefung": "Alternative 'Wettstreit um die beste Deutung' widerspricht dem Prinzip 'erst beschreiben, dann notieren' (N6). Alternative 'Lehrpfad-Autorität' passt nicht, da die Stationen nur vorab gesichtet, nicht vorgedeutet sind. Wirkung des Formats ist Annahme."}, {"id": "C5", "titel": "Das gemeinsame Archiv mit Prüfsiegel", "ids": ["N7", "N12", "N8", "E8", "E9", "E10", "K4"], "eindruck": "Experimentierfreude mit Verantwortung: Viele tragen bei, und ein kleines Minimum sorgt dafür, dass das Ergebnis verlässlich bleibt.", "beleg": "N7 sammelt Beobachtungen vieler, E8 verlangt dafür ein Minimum (N12), E9 zählt Unsicherheitsangaben (N8) dazu, E10 sichert den Bestand durch Paar-Prüfung.", "pruefung": "Alternative 'völlig offen und spontan' widerspricht E8. Alternative 'strenge Kuration' wird durch E10 relativiert ('kann hierarchisch werden'). Forschungsprojekte sind nach E15 nur Vorbild, ein Beitragsweg ist nicht belegt."}, {"id": "C6", "titel": "Dokumentieren heißt nicht billigen", "ids": ["N10", "N11", "N3", "E13", "E14", "E17", "K4"], "eindruck": "Wachsame Ruhe: Man darf neugierig sein und trotzdem Grenzen respektieren; Flüchtiges darf flüchtig bleiben.", "beleg": "N10 trennt Aufnahme, Ablage und Veröffentlichung in Stufen A, B, C; E14 trennt Dokumentieren von Billigen; E13 benennt die Spannung zwischen Bewahren und bewusster Flüchtigkeit (N11); E17 macht dies für aktives Graffiti (N3) besonders wichtig.", "pruefung": "Alternative 'rebellisches Abenteuer' widerspricht E17 und N10. Alternative 'behördliche Strenge' würde die Neugier ersticken; E14 verlangt Klärung in der Gruppe, nicht Verbot. Rechtliche Einordnung ist keine Rechtsberatung."}], "stimmung": "Neugierig-experimentell mit behutsamer Zurückhaltung: Staunen über Schichten, Fragezeichen statt Gewissheit, Gemeinsamkeit ohne Wettstreit. Begründung: N8 und E2 halten Unsicherheit offen, N10 und E14 setzen Grenzen, E1 und E13 dämpfen Rettungsdrang. Gegen 'melancholisch-rettend' (E1, E13), 'behördlich' (N10, N12) und 'rebellisch' (E17, E19) sprechen die genannten Kanten. Die Gefühlswörter sind Interpretation, nicht belegte Wirkung."}, "phasen.json": {"phasen": [{"id": "P1", "titel": "Schrift im Stadtraum", "sichtbar": ["N13", "N9", "N2", "E7", "E6"], "text": "Zu Beginn ist nur der Einstieg sichtbar: N13 (Schrift im Stadtraum erforschen) erscheint, E7 führt zu N9 (Lokalgeschichte und Typografie), E6 verbindet N9 mit N2 (Verblasste Wandschrift entdecken). Die Kante E6 zeichnet sich zuletzt. Noch ist nichts bedroht oder umstritten; die Gruppe schaut nur und liest."}, {"id": "P2", "titel": "Wand lesen mit Unsicherheit", "sichtbar": ["N13", "N9", "N2", "E7", "E6", "N1", "N8", "N3", "E2", "K1"], "text": "N1 (Schichten lesen), N8 (Datierung und Unsicherheit sichtbar machen) und N3 (Aktives Graffiti als Wandschicht beobachten) erscheinen. E2 verbindet N1 mit N8: Wer Schichten liest, gibt gleich die Sicherheit der Datierung an. Weil N1, N2, N3, N8 und N13 nun alle sichtbar sind, legt sich der Cluster K1 (Wand lesen) als schwache Hülle darüber."}, {"id": "P3", "titel": "Zeit und Verlust", "sichtbar": ["N13", "N9", "N2", "E7", "E6", "N1", "N8", "N3", "E2", "K1", "N4", "N5", "N11", "E1", "E3", "E4", "E16", "E13", "K2"], "text": "N4 (Vergänglichkeit dokumentieren), N5 (Wiederbesuch derselben Wand) und N11 (Bewahren und Respekt vor dem Vergehen) erscheinen. E1 (N2 zu N4), E3 (N4 zu N5), E4 (N5 zurück zu N1) und E16 (N3 zu N5) zeigen den Weg vom Fund zum Wiederbesuch. E13 (N11 zu N4) wird in Warnfarbe gezeichnet, weil sie die Spannung zwischen Bewahren und Respekt vor dem Vergehen zeigt. Danach ist K2 (Zeit und Verlust) vollständig."}, {"id": "P4", "titel": "Rechte, Schutz und Archiv", "sichtbar": ["N13", "N9", "N2", "E7", "E6", "N1", "N8", "N3", "E2", "K1", "N4", "N5", "N11", "E1", "E3", "E4", "E16", "E13", "K2", "N10", "N7", "N12", "E8", "E9", "E10", "E11", "E12", "E14", "E15", "E17", "K4"], "text": "N10 (Rechte und Schutz klären) kommt zuerst, dann N7 (Kollektives Archiv aufbauen) und N12 (Offenheit und Qualität abwägen). E14 (N11 zu N10) und E17 (N3 zu N10) sowie E11 (N10 zu N7) und E12 (N10 zu N5) zeigen, dass Rechteklärung vor Archiv und Fotoreihe liegt; E14, E17 und E15 erscheinen in Warnfarbe. E8, E9 und E10 bilden den Kreis um N12, E15 verbindet N13 mit N7. K4 (Beitragen, prüfen, schützen) ist nun vollständig."}, {"id": "P5", "titel": "Gemeinsam gehen und zusammenhalten", "sichtbar": ["N1", "N2", "N3", "N4", "N5", "N6", "N7", "N8", "N9", "N10", "N11", "N12", "N13", "N14", "E1", "E2", "E3", "E4", "E5", "E6", "E7", "E8", "E9", "E10", "E11", "E12", "E13", "E14", "E15", "E16", "E17", "E18", "E19", "E20", "K1", "K2", "K3", "K4"], "text": "Zuletzt erscheinen N6 (Gemeinsam gehen und beschreiben) und N14 (Historisches und Aktuelles zusammenhalten). E5 (N6 zu N1), E20 (N6 zu N14), E18 (N14 zu N2) und E19 (N14 zu N3) schließen das Bild; E18 und E19 sind in Warnfarbe, weil sich zwischen Historischem und Aktuellem Lager bilden können. K3 (Gemeinsam gehen, deuten, zusammenhalten) ist vollständig. Endzustand: alle 14 Knoten, 20 Kanten und 4 Cluster sind sichtbar."}], "hinweis": "Prüfung: Die Abfolge geht von Lesen (P1, P2) über Zeit und Verlust (P3) zu Schutz und Archiv (P4) und erst dann zum gemeinsamen Gehen (P5). Rechte und Schutz (N10) stehen damit vor Archiv (N7) und Fotoreihe (E12). Risiken: (1) P4 bringt 3 Knoten, 8 Kanten und 1 Cluster auf einmal und ist überladen. (2) Das Herzstück, der Spurengang (N6), erscheint erst in P5; Zuschauer könnten den Bezug zum Handeln spät sehen. (3) Aktives Graffiti (N3) erscheint früh in P2, bevor Rechte (N10) sichtbar sind; die Simulation könnte das als Freibrief lesen. (4) Das Endbild ist mit 14 Knoten und 20 Kanten dicht. Alternativen: P4 in zwei Phasen teilen (N10 mit E14, E17 zuerst; dann N7, N12); N6 und E5 schon in P2 zeigen; N3 erst in P3 mit N10 zusammen einführen; K1 bis K4 erst am Ende einblenden. Technik: Knoten blenden mit Skalierung 0,6 zu 1 in etwa 400 ms ein, Kanten zeichnen sich als Strichlinie in etwa 600 ms, Cluster als Hülle mit Deckkraft 0,15, Warnfarbe bei E13, E14, E15, E17, E18, E19, Automatik etwa 4 s je Phase. Phasen sind kumulativ. Keine zusätzliche Recherche wegen des Zeitbudgets von 300 s; Quellen stehen im Katalog und in bilder.json."}}, "md": [{"datei": "1-analytiker.md", "rolle": "Interessen-Analytiker", "text": "# lauf7 – Interessen-Analyse: Urbane Spurensuche\n\n**Interessen-Set:** „Urbane Spurensuche – Gemeinsames Dokumentieren von Graffiti-Schichten und verblassten Wandinschriften in der Stadt“. **Knotentyp:** Interessen.\n\n## Erkenntnisgrenzen\nDie Analyse entstand unter einem Budget von 5 Minuten. Die Quellen [1]–[7] wurden bereits am 09.11.2026 in einem früheren Lauf (lauf3) geprüft und in diesem Lauf nicht neu abgerufen. Neu in diesem Lauf sind nur die acht Bilder (Wikimedia Commons, Lizenzen in bilder.json). Aussagen zu lokalen Gruppen sind Hypothesen, keine Empirie.\n\n## Belegte Grundlagen\n- Gemeinsames Dokumentieren von Schrift im Stadtraum ist als Forschungs- und Bürgerprojekt etabliert: Das Paderborner Projekt INGRID untersucht Graffiti und Schrift im Stadtraum [1]; die App Lingscape sammelt Sprach- und Schriftspuren im öffentlichen Raum durch viele Beteiligte [2].\n- Verblasste Wandwerbung („Ghost Signs“) hat Archive und Gemeinschaften: der britische Hand-Painted-Advertising-Katalog (HAT) [3] und das deutsche Projekt ghostsigns.de [4]. Die Bilder zeigen, dass das Phänomen international auftritt (Polen, Frankreich, England, USA).\n- Rechtliche Rahmen: Fotografieren von Werken im öffentlichen Raum ist nach § 59 UrhG grundsätzlich zulässig (nur von öffentlichen Orten aus) [5]; Betreten fremder befriedeter Flächen kann Hausfriedensbruch sein (§ 123 StGB) [6]; Übermalen oder Beschädigen ist Sachbeschädigung (§ 303 StGB) [7].\n\n## Muster\n1. **Schicht als Zeitachse:** Graffiti überlagern sich, Wandinschriften verblassen; Dokumentation macht Zeit sichtbar. *Gegenargument:* Ohne Datierung sind Schichten schwer zu ordnen, Fotos belegen nur den Aufnahmezeitpunkt.\n2. **Kollektiv statt Einzelsammler:** Die Quellen [2][3][4] arbeiten beteiligungsorientiert. *Gegenargument:* Beteiligung ist ungleich verteilt, wenige tragen die meiste Arbeit.\n3. **Vergänglichkeit als Motor:** Was verschwindet, erzeugt Dringlichkeit. *Gegenargument:* Dringlichkeit kann zu überhastetem, unsauberem Dokumentieren führen.\n4. **Grenzraum Kunst und Recht:** Graffiti sind Kulturspur und oft Rechtsverstoß [6][7]. *Gegenargument:* Dokumentieren ist kein Billigen; eine Gruppe muss das ausdrücklich klären.\n5. **Zwei Zeitlichkeiten:** Ghost Signs sind abgeschlossene, schwindende Schichten (Bilder 1–7), Graffiti sind aktive, sich überlagernde Schichten (Bild 8). *Gegenargument:* Die Bilder stammen aus Fremdarchiven; ob dieselbe Unterscheidung lokal trägt, ist offen.\n\n## Spannungsfelder\n- Dokumentieren (bewahren) gegenüber Respekt vor dem Vergehen (Graffiti sind oft bewusst flüchtig).\n- Offene Veröffentlichung gegenüber Schutz von Urhebern und Orten [5].\n- Bürgerwissenschaftliche Offenheit gegenüber Qualitätsstandards.\n- Historische Wandschrift (meist unstrittig) gegenüber aktuellem Graffiti (rechtlich und sozial umstritten) in einer gemeinsamen Gruppe.\n\n## Gemeinschaftspotenziale (Hypothesen)\n- **H1:** Gemeinsame Begehungen mit festem Foto-Protokoll (Ort, Datum, Blickrichtung) schaffen niedrigschwellige Zugehörigkeit.\n- **H2:** Ein gemeinsames Stadtarchiv mit Wiederbesuchen derselben Wand verbindet Menschen über Zeit.\n- **H3:** Der Vorher-Nachher-Vergleich (wie bei Bild 2, „vor der Restaurierung“) kann als Einstiegsformat dienen.\n\n## Bilder\nAcht Beispiele aus Wikimedia Commons (alle CC BY-SA oder CC0, Quelle und Urheber in bilder.json): sieben verblasste Wandschriften und ein Graffiti. Sie belegen das Phänomen, nicht lokale Verhältnisse.\n\n## Offene Fragen an die nächsten Rollen\n- **Format-Entwerfer:** Welche Begegnungsformate (Begehung, Wiederbesuch, Archivabend) passen zu Dokumentieren ohne Eingriff in die Wand?\n- **Beziehungs-Architekt:** Welche Rollen (Fotografierende, Datierende, Archivierende) und welche Regeln zu Ortsangaben und Urheberschaft?\n- **Emotions-Kurator:** Wie lassen sich Neugier und Wehmut über Vergängliches ansprechen, ohne Illegalität zu romantisieren?\n- **Simulations-Choreograph:** Wie entwickelt sich dieselbe Wand über mehrere Wiederbesuche?\n- **Master-Koordinator:** Soll eine spätere Runde lokale Quellen und eine aktuelle Rechtsprüfung nachholen?\n\n## Quellenverzeichnis\n1. [INGRID, Universität Paderborn](https://www.uni-paderborn.de/forschungsprojekte/ingrid)\n2. [Lingscape](https://lingscape.app/about.html)\n3. [HAT Ghost Signs Katalog](https://www.hatads.org.uk/catalogue/ghostsigns.aspx)\n4. [ghostsigns.de](https://ghostsigns.de/about/)\n5. [§ 59 UrhG](https://www.gesetze-im-internet.de/urhg/__59.html)\n6. [§ 123 StGB](https://www.gesetze-im-internet.de/stgb/__123.html)\n7. [§ 303 StGB](https://www.gesetze-im-internet.de/stgb/__303.html)\n", "geliefert": true}, {"datei": "2-format.md", "rolle": "Format-Entwerfer", "text": "# lauf7 – Format-Entwurf: Urbane Spurensuche\n\n**Rolle:** Format-Entwerfer | **Lauf:** lauf7 | **attempt:** format-v1-b6dfb952 | **Knotentyp:** Interessen\n**Interessen-Set:** „Urbane Spurensuche – Gemeinsames Dokumentieren von Graffiti-Schichten und verblassten Wandinschriften in der Stadt“\n**Vorarbeit:** `1-analytiker.md` (lauf7) und `bilder.md` gelesen; die acht Analytiker-Bilder habe ich nicht erneut verwendet. **Eigene Bilder:** 2 (Abschnitt 5).\n\n**Erkenntnisgrenzen:** Zeitbudget 5 Minuten. Ich habe keine Quelle neu abgerufen; [1]–[7] stammen aus der Vorarbeit, die sich auf eine Prüfung in lauf3 beruft. Sie sind hier also **nicht live geprüft**. **[Entwurf]** kennzeichnet meine Vorschläge. Eine soziale Wirkung wird nirgends behauptet.\n\n## 1. Kritische Prüfung der Vorarbeit\n- Die Quellen [1]–[4] tragen nur das Interesse an gemeinsamer Schrift- und Wanddokumentation, kein bestimmtes Format. Jedes Format unten ist mein Entwurf.\n- „Fotografieren ist nach § 59 UrhG grundsätzlich zulässig“ [5] ist zu glatt: § 59 betrifft *bleibende* Werke an öffentlichen Wegen. Ob kurzlebige oder übermalte Graffiti darunter fallen, ist offen, und Weitergabe und Veröffentlichung sind damit nicht geklärt. Ich trenne daher Aufnahme, interne Ablage und Veröffentlichung.\n- Das neue Muster 5 („zwei Zeitlichkeiten“) ist plausibel, stützt sich aber nur auf Bilder aus Fremdarchiven. Die Bilder belegen, dass es das Phänomen gibt, nicht, dass eine Gruppe beide Schichtarten gleichermaßen annimmt.\n- H1–H3 bleiben Hypothesen. Meine Formate sind Testanordnungen dafür. H3 (Vorher-Nachher als Einstieg) greife ich in Format 2 auf, ohne sie als belegt zu behandeln.\n- Für Lingscape [2] ist eine geschützte private Ablage nicht belegt; sie eignet sich nicht als interne Ablage. INGRID [1] ist ein Forschungsprojekt, kein belegter Ort für Bürgerbeiträge.\n\n## 2. Gemeinsames Minimum je Beobachtung [Entwurf]\nZeit (grob), grober Ort (Straße oder Viertel, keine Koordinaten als Standard), Beobachtung „was liegt über was“, Sicherheit der Aussage (sicher/vermutet/unklar), Rechte-Stufe. Eine Papierkarte ist der App gleichwertig. Historische Wandschrift und aktuelles Graffiti werden mit demselben Minimum erfasst, aber getrennt gekennzeichnet.\n**Rechte-Stufen:** *A* geklärt (Fotoerlaubnis, Werkrechte, Personen- und Ortsschutz geprüft); *B* ungeklärt, dann **nur Textnotiz oder Skizze, kein Foto**; *C* nicht dokumentieren (erkennbare Personen, private Bereiche, Hinweise auf Szene-Orte). Ein Gruppenbeschluss ersetzt keine Rechtsklärung.\n\n## 3. Formate\n\n### Format 1 – Spurengang (Begehung)\n**Interessen:** Schichten lesen, Lokalgeschichte, Typografie, Stadtflanieren.\n**Ablauf [Entwurf], ca. 120 Min.:** 15 Min. Einführung („nur schauen, nicht berühren, nicht betreten“); Rundweg von etwa 1,2 km auf barrierearmen öffentlichen Wegen mit 4 vorab gesichteten Stationen, zwei mit verblasster Wandschrift und zwei mit aktivem Graffiti; je Station 12 Min. gemeinsam beschreiben, dann notieren; 20 Min. Abschluss mit offenen Fragen und vorläufigen Stufen; Puffer.\n**Rahmen:** 6–12 Personen, Sitzgelegenheiten, Papierkarten, Smartphone nicht nötig.\n**Ergebnis:** Textnotizen nach Minimum, Fotos nur bei Stufe A, Liste offener Fragen.\n**Risiken → Gegenmaßnahmen:** Konflikt mit Anwohnenden → kurze Halte, Gehwegregel, Abbruch bei Beschwerde; Romantisierung von Illegalität → beide Lesarten (Kulturspur, Regelverstoß) an jeder Station zulassen; Personen im Bild → Stufe C.\n**Alternative:** Sitzstationen an zwei öffentlichen Orten mit Blick auf eine Wand; sinnvoll bei Mobilitätsgrenzen oder großer Gruppe, nicht wetterfest.\n\n### Format 2 – Wiederbesuch (befristete Wiederholungsfotografie)\n**Interessen:** Vergänglichkeit, Mehrzeitigkeit, gemeinsames Archiv (H2, H3).\n**Ablauf [Entwurf]:** höchstens 10 unproblematische Wände; Standpunkt in Worten festhalten („gegenüberliegender Gehweg, Laternenmast 2“); höchstens einmal im Monat wiederbesuchen, **Ende nach 6 Monaten**, dann ausdrückliche Entscheidung über Verlängerung. Nur von Hand fotografiert; **keine fest installierten Kameras, keine Auswertung fremder Überwachungsbilder**. Bei aktivem Graffiti Fokus auf die Wandfläche, nicht auf Personen.\n**Ergebnis:** Zeitreihe je Wand, als Foto nur bei Stufe A, sonst als Text und Skizze.\n**Risiken → Gegenmaßnahmen:** wirkt wie Überwachung einer Szene → Frist, keine Personenbilder, Ortsauswahl begründen, bei aktivem Graffiti keine Wände mit erkennbarer Szenebindung; Ermüdung → kleines Kontingent, Tauschregel; unklare Werkrechte → Text- und Skizzenreihe.\n**Alternative:** einmalige Vorher-Nachher-Dokumentation bei angekündigter Sanierung; sinnvoll, wenn niemand sechs Monate zusagen kann.\n\n### Format 3 – Archivabend (Prüfwerkstatt, analog und digital)\n**Interessen:** Schichten ordnen, Datierung, Qualität gegenüber Offenheit.\n**Ablauf [Entwurf], ca. 2 Std. in einem barrierefreien Raum:** Beiträge sammeln (Papier oder Bildschirm); Paar-Prüfung gegen das Minimum; Schichtschema zeichnen (unten nach oben) mit markierter Unsicherheit; Rechte-Runde nur für den Klärungsweg von B-Fällen; Entscheidung, was wo gezeigt wird.\n**Ergebnis:** geprüfte Beobachtungen, Schichtschemata, Liste geklärter und ungeklärter Rechtefälle.\n**Risiken → Gegenmaßnahmen:** Überforderung → nur fünf Minimumfelder verpflichtend; hierarchische Auswahl → Paar-Prüfung, dokumentierte Kriterien, Widerspruch; ungeklärtes „rutscht“ in die Veröffentlichung → Standard ist Zurückhaltung; Streit zwischen Historischem und Aktuellem → beide Schichtarten gleichrangig behandeln.\n**Alternative:** asynchrone Prüfrunde an Textnotizen; sinnvoll bei verstreuten Beteiligten, mit analoger Abgabestelle.\n\n## 4. Prinzipien [Entwurf]\n1. Dokumentieren, nie verändern (kein Berühren, Reinigen, Übermalen; Grenze § 303 StGB [7]).\n2. Öffentlicher Blick, kein Betreten (§ 123 StGB [6]); Aufnahmen auf Augenhöhe, ohne Leitern und Drohnen (praktische Regel, keine Rechtsauslegung).\n3. Zurückhaltung bei ungeklärten Rechten: Textnotiz statt Foto.\n4. Orte grob statt genau; Wand statt Mensch.\n5. Analoger und digitaler Beitrag sind gleichwertig.\n6. Unsicherheit sichtbar machen: Datierung und Reihenfolge der Schichten tragen eine Sicherheitsstufe.\n7. Dokumentieren heißt nicht billigen; die Gruppe klärt das ausdrücklich.\n\n**Messgrößen ohne Zielwerte:** Anteil Beobachtungen mit vollständigem Minimum; Verteilung auf A/B/C; Anteil analoger Beiträge; geplante gegenüber erfolgten Wiederbesuchen; Konflikte und deren Bearbeitung.\n\n## 5. Bilder\n![Ghost Sign, Tottenham High Road, London](bilder/london_tottenham_ghostsign.jpg)\nVerblasste Wandwerbung (Acabashi, CC BY-SA 4.0, [Wikimedia Commons](https://commons.wikimedia.org/wiki/File:Ghost_sign_painted_wall_advert_Tottenham_High_Road_London.jpg)): die Art Wandschrift, die Format 1 an den Stationen gemeinsam liest.\n\n![Graffitimauer im Stadtpark Lichtenberg, Berlin](bilder/berlin_graffitimauer_lichtenberg.jpg)\nGraffiti-bedeckte Mauer (Singlespeedfahrer, CC0, [Wikimedia Commons](https://commons.wikimedia.org/wiki/File:Graffitimauer_Stadtpark_Lichtenberg_Berlin.jpg)): eine Fläche mit überlagerten, aktiven Schichten, wie sie Format 2 und 3 festhalten.\n\nBeide Bilder belegen nur das Phänomen, nicht lokale Verhältnisse und nicht die Wirkung der Formate.\n\n## 6. Offene Fragen an den Beziehungs-Architekten (nur Fragen)\n- Wer dokumentiert die Klärung eines B-Falls, und wie läuft ein Widerspruch?\n- Wer entscheidet über Verlängerung oder Ende von Format 2?\n- Welche interne Ablage mit welchen Zugriffsregeln, und wer löscht Stufe-C-Material?\n- Wie wird die Spannung zwischen Historischem und aktivem Graffiti in einer Gruppe verhandelt?\n\n## 7. Quellen (aus der Vorarbeit, nicht neu abgerufen)\n[1] [INGRID, Universität Paderborn](https://www.uni-paderborn.de/forschungsprojekte/ingrid) · [2] [Lingscape](https://lingscape.app/about.html) · [3] [HAT Ghost Signs Katalog](https://www.hatads.org.uk/catalogue/ghostsigns.aspx) · [4] [ghostsigns.de](https://ghostsigns.de/about/) · [5] [§ 59 UrhG](https://www.gesetze-im-internet.de/urhg/__59.html) · [6] [§ 123 StGB](https://www.gesetze-im-internet.de/stgb/__123.html) · [7] [§ 303 StGB](https://www.gesetze-im-internet.de/stgb/__303.html)\n", "geliefert": true}, {"datei": "3-katalog.md", "rolle": "Beziehungs-Architekt", "text": "lauf7 – Ergebnis Beziehungs-Architekt\n\nLaufname: lauf7 · attempt_id: architektur-v1-9f85fe7e · Bildgrenze: Min 2, Max 10 (genutzt: 3)\nKnotentyp: Interessen · Set: Urbane Spurensuche – Gemeinsames Dokumentieren von Graffiti-Schichten und verblassten Wandinschriften in der Stadt\n\nQuellenbezug: ausschließlich lauf7/1-analytiker.md (Quellen [1]–[7], Muster 1–5, H1–H3) und lauf7/2-format.md (Formate 1–3, Prinzipien 1–7). Die Quellen sind in diesem Lauf nicht neu abgerufen; die Prüfung stammt laut Vorarbeit aus lauf3 (Zeitbudget 5 Minuten, keine eigene Recherche). [Entwurf] und Modellierung kennzeichnen Entscheidungen der Vorrollen bzw. meine; eine soziale Wirkung wird nicht behauptet. Rechtliches nur als Orientierung laut Vorarbeit, keine Rechtsberatung.\n\n## Knoten\n\n### N1 – Schichten lesen\n- Text: Interesse, Überlagerungen von Graffiti und Wandschrift in ihrer Reihenfolge zu beschreiben.\n- Beleg: 1-analytiker.md Muster 1 (Schicht als Zeitachse); 2-format.md Format 1 bis 3, Prinzip 6; Bilder dresden_wandbild_baugrube_2019_2020.jpg und dresden_fassade_lsr_markierung_2016_2020.jpg zeigen dieselbe Wand in zwei Zuständen.\n- Gegenargument: Ohne Datierung entsteht Schein-Chronologie; Fotos belegen nur den Aufnahmezeitpunkt (1-analytiker.md Muster 1, Gegenargument).\n\n### N2 – Verblasste Wandschrift (Ghost Signs) entdecken\n- Text: Interesse an handgemalter, verblassender Wandwerbung als abgeschlossener, schwindender Schicht.\n- Beleg: 1-analytiker.md Belegte Grundlagen, Quellen [3][4], Muster 5 (Bilder 1–7); 2-format.md Format 1 (Stationen mit Wandschrift).\n- Gegenargument: Die Bilder stammen aus Fremdarchiven; ob die Unterscheidung lokal trägt, ist offen (1-analytiker.md Muster 5, Gegenargument).\n\n### N3 – Aktives Graffiti als Wandschicht beobachten\n- Text: Interesse an aktuellen, sich überlagernden Graffiti als lebendiger, wechselnder Schicht.\n- Beleg: 1-analytiker.md Muster 5 (Bild 8), Spannungsfeld 4; 2-format.md Format 1 (zwei Stationen mit aktivem Graffiti), Format 2 (Fokus auf Wandfläche, nicht Personen).\n- Gegenargument: Rechtlich und sozial umstritten; Beobachtung kann als Szene-Überwachung wirken (2-format.md Format 2, Risiken).\n\n### N4 – Vergänglichkeit dokumentieren\n- Text: Interesse, verschwindende Wandspuren festzuhalten, bevor sie überdeckt oder entfernt werden.\n- Beleg: 1-analytiker.md Muster 3 (Vergänglichkeit als Motor), H3; 2-format.md Format 2, Alternative Vorher-Nachher; Bild dresden_wandbild_baugrube_2019_2020.jpg.\n- Gegenargument: Dringlichkeit kann zu überhastetem, unsauberem Dokumentieren führen (1-analytiker.md Muster 3, Gegenargument).\n\n### N5 – Wiederbesuch derselben Wand\n- Text: Interesse, höchstens zehn Wände höchstens monatlich über sechs Monate erneut aufzunehmen.\n- Beleg: 2-format.md Format 2 [Entwurf]; 1-analytiker.md Hypothesen H2 und H3; Bild dresden_fassade_lsr_markierung_2016_2020.jpg (Vergleich derselben Fassade 2016 und 2020).\n- Gegenargument: Wirkt wie Überwachung einer Szene; H2 und H3 sind Hypothesen, die Methode ist nicht belegt (2-format.md Abschnitt 1 und Format 2).\n\n### N6 – Gemeinsam gehen und beschreiben\n- Text: Interesse an der Begehung mit vorab gesichteten Stationen: erst gemeinsam beschreiben, dann notieren.\n- Beleg: 2-format.md Format 1 [Entwurf]; 1-analytiker.md Hypothese H1.\n- Gegenargument: Konflikt mit Anwohnenden und Mobilitätsgrenzen; H1 ist eine Hypothese (2-format.md Format 1, Risiken).\n\n### N7 – Kollektives Archiv aufbauen\n- Text: Interesse, Beobachtungen vieler in einem gemeinsamen, geprüften Bestand zu sammeln.\n- Beleg: 1-analytiker.md Muster 2, Quellen [2][3][4]; 2-format.md Format 3 (Archivabend).\n- Gegenargument: Beteiligung ist ungleich verteilt, wenige tragen die Arbeit (1-analytiker.md Muster 2, Gegenargument).\n\n### N8 – Datierung und Unsicherheit sichtbar machen\n- Text: Interesse daran, Reihenfolge und Alter von Schichten mit einer Sicherheitsstufe (sicher, vermutet, unklar) zu führen.\n- Beleg: 2-format.md Prinzip 6 und Abschnitt 2 (Minimum); 1-analytiker.md Muster 1, Gegenargument zur Datierung.\n- Gegenargument: Zusätzlicher Aufwand kann Einsteiger abschrecken (2-format.md Format 3, Risiko Überforderung).\n\n### N9 – Lokalgeschichte und Typografie\n- Text: Interesse, Wandschrift nach Schriftform und Gewerbegeschichte des Viertels zu deuten.\n- Beleg: 2-format.md Format 1 (Interessen Lokalgeschichte, Typografie); 1-analytiker.md Quellen [3][4].\n- Gegenargument: Deutungen können Vermutungen zu Fakten machen; im Lauf nicht neu geprüft (2-format.md Abschnitt 7).\n\n### N10 – Rechte und Schutz klären\n- Text: Interesse, Aufnahme, interne Ablage und Veröffentlichung getrennt zu behandeln: Stufe A geklärt, B nur Textnotiz oder Skizze, C nicht dokumentieren.\n- Beleg: 2-format.md Abschnitt 1 und 2; 1-analytiker.md Quellen [5][6][7]. Ob § 59 UrhG kurzlebige oder übermalte Graffiti erfasst, ist laut 2-format.md offen; Gruppenbeschluss ersetzt keine Rechtsklärung.\n- Gegenargument: Strenge Stufen bremsen Beiträge, B-Fälle bleiben lange ungeklärt (Modellierung, keine Rechtsberatung).\n\n### N11 – Bewahren und Respekt vor dem Vergehen\n- Text: Interesse, die Spannung zwischen Dokumentieren und bewusster Flüchtigkeit von Graffiti auszuhalten und zu besprechen.\n- Beleg: 1-analytiker.md Spannungsfeld 1, Muster 4; 2-format.md Prinzip 7 (Dokumentieren heißt nicht billigen).\n- Gegenargument: Das Thema kann Gruppen lähmen, wenn es nie entschieden wird (Modellierung; 2-format.md Abschnitt 6).\n\n### N12 – Offenheit und Qualität abwägen\n- Text: Interesse, bürgerwissenschaftliche Offenheit mit einem fünffeldrigen Qualitätsminimum zu verbinden.\n- Beleg: 1-analytiker.md Spannungsfeld 3; 2-format.md Abschnitt 2 und Format 3 (Paar-Prüfung).\n- Gegenargument: Prüfung kann hierarchisch werden; Wirkung nicht belegt (2-format.md Format 3, Risiken).\n\n### N13 – Schrift im Stadtraum erforschen\n- Text: Interesse an Wandschrift als Teil der sprachlichen Landschaft der Stadt.\n- Beleg: 1-analytiker.md Quellen [1][2]; 2-format.md Abschnitt 1 (INGRID nur Forschungsprojekt, Lingscape ohne belegte private Ablage).\n- Gegenargument: Weder INGRID noch Lingscape sind als Ablage für Gruppenbeiträge belegt (2-format.md Abschnitt 1).\n\n### N14 – Historisches und Aktuelles zusammenhalten\n- Text: Interesse daran, verblasste Wandschrift und aktives Graffiti in einer Gruppe gleichrangig zu behandeln.\n- Beleg: 1-analytiker.md Spannungsfeld 4, Muster 5; 2-format.md Abschnitt 2 (gleiches Minimum, getrennt gekennzeichnet), Format 3 (beide Schichtarten gleichrangig), Abschnitt 6 (offene Frage).\n- Gegenargument: Die Gruppe könnte in zwei Lager zerfallen; ob eine Gruppe beide Schichtarten gleich annimmt, ist nicht belegt (2-format.md Abschnitt 1).\n\n## Kanten\n\n| ID | Von | Nach | Bedeutung, Beleg, Gegenargument |\n|---|---|---|---|\n| E1 | N2 | N4 | Verblassende Wandschrift ist ein Anlass zur Dokumentation von Verlust (1-analytiker.md Muster 3, Quellen [3][4]). Gegen: nicht jeder Fund ist bedroht. |\n| E2 | N1 | N8 | Schichtenlesen braucht Datierung mit Sicherheitsstufe (1-analytiker.md Muster 1, Gegenargument; 2-format.md Prinzip 6). |\n| E3 | N4 | N5 | Wiederbesuche halten Veränderung fest (2-format.md Format 2, H3). Modellierung; Wirkung nicht belegt. |\n| E4 | N5 | N1 | Mehrere Zeitpunkte ergänzen die Schichtenlesung im Einzelbild, ersetzen sie nicht (2-format.md Format 2 und 3). Gegen: Zwischen Besuchen bleibt Veränderung undatiert. |\n| E5 | N6 | N1 | Der Spurengang bietet Stationen, an denen gemeinsam Schichten beschrieben werden (2-format.md Format 1). |\n| E6 | N9 | N2 | Lokalgeschichte und Typografie geben verblasster Wandschrift Bedeutung (2-format.md Format 1; 1-analytiker.md Quellen [3][4]). |\n| E7 | N13 | N9 | Wandschrift als sprachliche Landschaft stützt die Deutung (1-analytiker.md Quellen [1][2]). Gegen: Quellen tragen nur das Interesse, nicht ein Format. |\n| E8 | N7 | N12 | Ein offenes Archiv braucht ein Minimum, sonst sinkt die Qualität (1-analytiker.md Spannungsfeld 3; 2-format.md Abschnitt 2). |\n| E9 | N8 | N12 | Unsicherheitsangaben sind Teil des Minimums aus fünf Feldern (2-format.md Abschnitt 2). |\n| E10 | N12 | N7 | Paar-Prüfung und dokumentierte Kriterien machen den Bestand tragfähig (2-format.md Format 3). Gegen: kann hierarchisch werden. |\n| E11 | N10 | N7 | Rechte-Stufen legen fest, was ins Archiv darf; B bleibt Textnotiz oder Skizze (2-format.md Abschnitt 2, Format 3 Rechte-Runde). |\n| E12 | N10 | N5 | Fotoreihe nur bei Stufe A, sonst Text- und Skizzenreihe (2-format.md Format 2, Risiko unklare Werkrechte). |\n| E13 | N11 | N4 | Spannung: Der Drang zu bewahren steht gegen den Respekt vor bewusster Flüchtigkeit (1-analytiker.md Spannungsfeld 1). Beide Lesarten zulassen. |\n| E14 | N11 | N10 | Dokumentieren ist nicht billigen; die Gruppe klärt das ausdrücklich und trennt es von der Rechtsklärung (2-format.md Prinzip 7, Abschnitt 2). |\n| E15 | N13 | N7 | Forschungsprojekte sind nur methodisches Vorbild; ein Beitragsweg ist nicht belegt (2-format.md Abschnitt 1). Spannung zwischen Vorbild und eigener Gruppenablage. |\n| E16 | N3 | N5 | Aktives Graffiti wird im Wiederbesuch nur als Wandfläche ohne Personen und ohne erkennbare Szenebindung aufgenommen (2-format.md Format 2, Risiken). |\n| E17 | N3 | N10 | Aktives Graffiti ist rechtlich und sozial umstritten, daher greifen Rechte-Stufen und Wand-statt-Mensch besonders (1-analytiker.md Muster 4, Spannungsfeld 4; 2-format.md Abschnitt 2). |\n| E18 | N14 | N2 | Spannung Historisch gegenüber Aktuell: beide Schichtarten gehören in dieselbe Gruppe (1-analytiker.md Muster 5). Gegen: Lager können entstehen. |\n| E19 | N14 | N3 | Gegenstück zu E18: aktives Graffiti bleibt gleichrangig, auch wenn es strittiger ist (2-format.md Format 3, Risiko Streit zwischen Historischem und Aktuellem). |\n| E20 | N6 | N14 | Der Spurengang mischt bewusst zwei Stationen mit Wandschrift und zwei mit Graffiti (2-format.md Format 1). |\n\n## Cluster\n\n- **K1 – Wand lesen** (N1, N2, N3, N8, N13): Interessen, die direkt auf Schrift und Schichtfolge der Wand zielen (1-analytiker.md Muster 1, 5, Quellen [1]–[4]). Gegen: Analyse und Ästhetik ziehen unterschiedlich.\n- **K2 – Zeit und Verlust** (N4, N5, N11): Vergänglichkeit, Wiederbesuch und die Spannung dazu (1-analytiker.md Muster 3, Spannungsfeld 1, H2, H3; 2-format.md Format 2). Gegen: Das Verlustnarrativ kann dominieren.\n- **K3 – Gemeinsam gehen, deuten, zusammenhalten** (N6, N9, N14): Begehung, Lokaldeutung und Gleichrangigkeit von Historischem und Aktuellem als Begegnungsform (2-format.md Format 1, 3). Gegen: Deutungen bleiben Entwurf.\n- **K4 – Beitragen, prüfen, schützen** (N7, N12, N10): Offener Bestand mit Prüfung und Rechte-Stufen (1-analytiker.md Muster 2, 4; 2-format.md Format 3, Abschnitt 2). Gegen: Regeldichte kann abschrecken.\n\n## Formatzuordnung (2-format.md)\n\n- Format 1 Spurengang: N6, N1, N2, N3, N9, N14\n- Format 2 Wiederbesuch: N4, N5, N1, N3, N10\n- Format 3 Archivabend: N7, N12, N8, N10, N14, N1\n\n## Bilder\n\nNeu und nicht in bilder.md des Laufs enthalten (3 Bilder, alle Wikimedia Commons):\n- `bilder/dresden_wandbild_baugrube_2019_2020.jpg`: Zeigt dasselbe gemalte Wandbild in Dresden 2019 und 2020 vor und hinter einer Baugrube; belegt den Anlass Vergänglichkeit und den Vorher-Nachher-Vergleich (N1, N4), nicht die Wirkung der Formate. Quelle: https://commons.wikimedia.org/wiki/File:2019071302_Vergleich_Graffitti_aufgemalte_Fenster_und_Baugrube_Henrici-_Ecke_Teichstrasse_07-2019-03-2020.jpg, VSchagow, CC BY-SA 4.0\n- `bilder/dresden_fassade_lsr_markierung_2016_2020.jpg`: Zeigt dieselbe Fassade in Dresden 2016 und 2020 im Vergleich; belegt, dass Wiederholungsaufnahmen derselben Wand Veränderung sichtbar machen (N5), nicht die Wirkung der Formate. Quelle: https://commons.wikimedia.org/wiki/File:2020082904_Vergleich_Teilansicht_Fassade_Luftschutzraummarkierung_Maerz_2016-September_2020.jpg, VSchagow, CC BY-SA 4.0\n- `bilder/saarbruecken_hall_of_fame_4560.jpg`: Zeigt eine legale Graffiti-Fläche (Hall of Fame 4560) in Saarbrücken als Beispiel einer aktiven Wandschicht an einem erlaubten Ort (N3, N10); belegt das Phänomen, nicht lokale Gruppenverhältnisse. Quelle: https://commons.wikimedia.org/wiki/File:20210809_Graffiti_Hall-of-Fame_4560_01.jpg, Flocci Nivis, CC BY 4.0\n\n## Grenzen und offene Fragen\n\n- Offene Governance-Fragen aus 2-format.md Abschnitt 6 sind nicht als Knoten modelliert: wer B-Fälle klärt und wie Widerspruch läuft, wer Format 2 verlängert oder beendet, welche interne Ablage mit welchen Zugriffsregeln gilt, wer Stufe-C-Material löscht, wie die Spannung zwischen Historischem und aktivem Graffiti verhandelt wird (nur als Spannungskanten E18 und E19 sichtbar gemacht).\n- Ungeprüft in diesem Lauf: alle Quellen [1]–[7] (nicht neu abgerufen); Auslegung von „bleibend“ in § 59 UrhG bei übermalten Graffiti; Hilfsmittel- und Drohnenrecht.\n- H1 bis H3 bleiben Hypothesen; die Kanten behaupten keine Wirkung. Muster 5 stützt sich nur auf Bilder aus Fremdarchiven.\n- Keine Personen-, Rollen- oder Phasenknoten; die im Analytiker-Text gefragten Rollen (Fotografierende, Datierende, Archivierende) sind bewusst nicht als Knoten modelliert, weil der Knotentyp Interessen ist.\n- Keine eigene Recherche (Zeitbudget 5 Minuten).\n", "geliefert": true}, {"datei": "4-emotionen.md", "rolle": "Emotions-Kurator", "text": "# Emotionale Klickinhalte – lauf7 (Katalog lauf7/katalog.json, N1–N14, E1–E20, K1–K4)\n\n## C1 Schichten wie Erdgeschichte\n**Katalog-IDs:** N1, N3, N8, E2, K1\n\n**Eindruck:** Neugieriges Staunen: Eine Wand wird zum Schichtenprofil, in dem man Reihenfolgen entdeckt und vorsichtig als Vermutung benennt. Gefühlswörter sind Interpretation der Kuratorin.\n\n**Beleg:** N1 beschreibt das Lesen von Überlagerungen, N3 die lebendige Graffiti-Schicht, E2 verlangt Datierung mit Sicherheitsstufe (N8). Bild lissabon_lx_factory_schichten.jpg zeigt solche Schichten (Wikimedia Commons, CC BY 4.0); es belegt das Phänomen, keine Gruppenwirkung.\n\n**Prüfung und Gegenargumente:** Alternative 'Detektivstolz' (sicher datieren) widerspricht E2 und N8, die Unsicherheit ausdrücklich sichtbar halten. Alternative 'Kunstbewunderung' würde die Dokumentationsabsicht (N1) verdrängen. Der Eindruck ist Modellierung, nicht empirisch geprüft.\n\n## C2 Geisterschrift an der Lesbarkeitsgrenze\n**Katalog-IDs:** N2, N9, N13, N8, E6, E7, K1\n\n**Eindruck:** Leise Faszination mit Fragezeichen: Halb lesbare Buchstaben laden zum gemeinsamen Raten ein, ohne dass die Gruppe so tut, als wüsste sie die Antwort.\n\n**Beleg:** N2 beschreibt verblassende Wandwerbung, E6 verbindet sie über N9 mit Lokalgeschichte und Typografie, E7 stützt dies über N13 (Schrift als sprachliche Landschaft; laut Kante tragen die Quellen nur das Interesse, nicht ein Format). Bild jacksonville_levi_strauss_ghostsign.jpg zeigt eine verblasste historische Wandwerbung (Wikimedia Commons, CC BY-SA 4.0), ein Fremdarchiv-Beispiel.\n\n**Prüfung und Gegenargumente:** Alternative 'Nostalgie' wird durch N8 gebremst: Unsicherheit statt Verklärung. Alternative 'Forscherernst' passt zu N13, nähme aber das Spielerische des gemeinsamen Deutens. Das Katalogwissen reicht als Beleg für Interessen, nicht für Wirkung auf Menschen.\n\n## C3 Dieselbe Wand, andere Zeit\n**Katalog-IDs:** N4, N5, E1, E3, E4, K2\n\n**Eindruck:** Behutsame Spannung: Wer wiederkommt, merkt, wie viel sich zwischen zwei Besuchen verändert hat, und bleibt ehrlich dabei, was dazwischen unbekannt bleibt.\n\n**Beleg:** N5 begrenzt Wiederbesuche auf höchstens zehn Wände, monatlich über sechs Monate; E3 und E4 verbinden dies mit Vergänglichkeit (N4) und Schichtenlesen; E1 nennt Verlust als Anlass. Die Dresdner Vorher-Nachher-Bilder aus der Architektur-Vorarbeit (bilder/3-architektur-dresden_*) zeigen denselben Effekt.\n\n**Prüfung und Gegenargumente:** Alternative 'Wehmut/Rettungsdrang' wird durch E1 ('nicht jeder Fund ist bedroht') und E4 ('Zwischen Besuchen bleibt Veränderung undatiert') gedämpft. Alternative 'nüchterne Statistik' passt zur Begrenzung in N5, verfehlt aber das Entdeckergefühl. Wirkung der Formate ist laut E3 nicht belegt.\n\n## C4 Gemeinsam sehen, dann notieren\n**Katalog-IDs:** N6, N1, N14, E5, E20, K3\n\n**Eindruck:** Lebendige Gemeinsamkeit: Erst schauen und sprechen, dann schreiben; zwei Wandschichten, die man nebeneinander gelten lässt.\n\n**Beleg:** N6 beschreibt den Spurengang mit vorab gesichteten Stationen, E5 macht ihn zum Ort des gemeinsamen Beschreibens von Schichten (N1), E20 mischt bewusst Wandschrift und Graffiti (N14).\n\n**Prüfung und Gegenargumente:** Alternative 'Wettstreit um die beste Deutung' widerspricht dem Prinzip 'erst beschreiben, dann notieren' (N6). Alternative 'Lehrpfad-Autorität' passt nicht, da die Stationen nur vorab gesichtet, nicht vorgedeutet sind. Wirkung des Formats ist Annahme.\n\n## C5 Das gemeinsame Archiv mit Prüfsiegel\n**Katalog-IDs:** N7, N12, N8, E8, E9, E10, K4\n\n**Eindruck:** Experimentierfreude mit Verantwortung: Viele tragen bei, und ein kleines Minimum sorgt dafür, dass das Ergebnis verlässlich bleibt.\n\n**Beleg:** N7 sammelt Beobachtungen vieler, E8 verlangt dafür ein Minimum (N12), E9 zählt Unsicherheitsangaben (N8) dazu, E10 sichert den Bestand durch Paar-Prüfung.\n\n**Prüfung und Gegenargumente:** Alternative 'völlig offen und spontan' widerspricht E8. Alternative 'strenge Kuration' wird durch E10 relativiert ('kann hierarchisch werden'). Forschungsprojekte sind nach E15 nur Vorbild, ein Beitragsweg ist nicht belegt.\n\n## C6 Dokumentieren heißt nicht billigen\n**Katalog-IDs:** N10, N11, N3, E13, E14, E17, K4\n\n**Eindruck:** Wachsame Ruhe: Man darf neugierig sein und trotzdem Grenzen respektieren; Flüchtiges darf flüchtig bleiben.\n\n**Beleg:** N10 trennt Aufnahme, Ablage und Veröffentlichung in Stufen A, B, C; E14 trennt Dokumentieren von Billigen; E13 benennt die Spannung zwischen Bewahren und bewusster Flüchtigkeit (N11); E17 macht dies für aktives Graffiti (N3) besonders wichtig.\n\n**Prüfung und Gegenargumente:** Alternative 'rebellisches Abenteuer' widerspricht E17 und N10. Alternative 'behördliche Strenge' würde die Neugier ersticken; E14 verlangt Klärung in der Gruppe, nicht Verbot. Rechtliche Einordnung ist keine Rechtsberatung.\n\n## Stimmung\nNeugierig-experimentell mit behutsamer Zurückhaltung: Staunen über Schichten, Fragezeichen statt Gewissheit, Gemeinsamkeit ohne Wettstreit. Begründung: N8 und E2 halten Unsicherheit offen, N10 und E14 setzen Grenzen, E1 und E13 dämpfen Rettungsdrang. Gegen 'melancholisch-rettend' (E1, E13), 'behördlich' (N10, N12) und 'rebellisch' (E17, E19) sprechen die genannten Kanten. Die Gefühlswörter sind Interpretation, nicht belegte Wirkung.\n\n## Bilder\n- bilder/lissabon_lx_factory_schichten.jpg (C1), Quelle in bilder.json\n- bilder/jacksonville_levi_strauss_ghostsign.jpg (C2), Quelle in bilder.json\n- Ein dritter Kandidat (Belfast) war nicht ladbar und wurde verworfen. Keine Primärrecherche zu Wirkung: Eindrücke sind Interpretation auf Katalogbasis.\n", "geliefert": true}, {"datei": "5-simulation.md", "rolle": "Simulations-Choreograph", "text": "# Simulation lauf7: Urbane Spurensuche (Knotentyp Interessen)\n\nKatalogfassung: lauf7/katalog.json (aktuell, 14 Knoten, 20 Kanten, 4 Cluster). Phasen sind kumulativ; eine Kante ist nur sichtbar, wenn beide Enden sichtbar sind, ein Cluster nur, wenn alle seine Knoten sichtbar sind.\n\n## P1 Schrift im Stadtraum\nSichtbar: N13, N9, N2, E7, E6\n\nZu Beginn ist nur der Einstieg sichtbar: N13 (Schrift im Stadtraum erforschen) erscheint, E7 führt zu N9 (Lokalgeschichte und Typografie), E6 verbindet N9 mit N2 (Verblasste Wandschrift entdecken). Die Kante E6 zeichnet sich zuletzt. Noch ist nichts bedroht oder umstritten; die Gruppe schaut nur und liest.\n\n## P2 Wand lesen mit Unsicherheit\nSichtbar: N13, N9, N2, E7, E6, N1, N8, N3, E2, K1\n\nN1 (Schichten lesen), N8 (Datierung und Unsicherheit sichtbar machen) und N3 (Aktives Graffiti als Wandschicht beobachten) erscheinen. E2 verbindet N1 mit N8: Wer Schichten liest, gibt gleich die Sicherheit der Datierung an. Weil N1, N2, N3, N8 und N13 nun alle sichtbar sind, legt sich der Cluster K1 (Wand lesen) als schwache Hülle darüber.\n\n## P3 Zeit und Verlust\nSichtbar: N13, N9, N2, E7, E6, N1, N8, N3, E2, K1, N4, N5, N11, E1, E3, E4, E16, E13, K2\n\nN4 (Vergänglichkeit dokumentieren), N5 (Wiederbesuch derselben Wand) und N11 (Bewahren und Respekt vor dem Vergehen) erscheinen. E1 (N2 zu N4), E3 (N4 zu N5), E4 (N5 zurück zu N1) und E16 (N3 zu N5) zeigen den Weg vom Fund zum Wiederbesuch. E13 (N11 zu N4) wird in Warnfarbe gezeichnet, weil sie die Spannung zwischen Bewahren und Respekt vor dem Vergehen zeigt. Danach ist K2 (Zeit und Verlust) vollständig.\n\n## P4 Rechte, Schutz und Archiv\nSichtbar: N13, N9, N2, E7, E6, N1, N8, N3, E2, K1, N4, N5, N11, E1, E3, E4, E16, E13, K2, N10, N7, N12, E8, E9, E10, E11, E12, E14, E15, E17, K4\n\nN10 (Rechte und Schutz klären) kommt zuerst, dann N7 (Kollektives Archiv aufbauen) und N12 (Offenheit und Qualität abwägen). E14 (N11 zu N10) und E17 (N3 zu N10) sowie E11 (N10 zu N7) und E12 (N10 zu N5) zeigen, dass Rechteklärung vor Archiv und Fotoreihe liegt; E14, E17 und E15 erscheinen in Warnfarbe. E8, E9 und E10 bilden den Kreis um N12, E15 verbindet N13 mit N7. K4 (Beitragen, prüfen, schützen) ist nun vollständig.\n\n## P5 Gemeinsam gehen und zusammenhalten\nSichtbar: N1, N2, N3, N4, N5, N6, N7, N8, N9, N10, N11, N12, N13, N14, E1, E2, E3, E4, E5, E6, E7, E8, E9, E10, E11, E12, E13, E14, E15, E16, E17, E18, E19, E20, K1, K2, K3, K4\n\nZuletzt erscheinen N6 (Gemeinsam gehen und beschreiben) und N14 (Historisches und Aktuelles zusammenhalten). E5 (N6 zu N1), E20 (N6 zu N14), E18 (N14 zu N2) und E19 (N14 zu N3) schließen das Bild; E18 und E19 sind in Warnfarbe, weil sich zwischen Historischem und Aktuellem Lager bilden können. K3 (Gemeinsam gehen, deuten, zusammenhalten) ist vollständig. Endzustand: alle 14 Knoten, 20 Kanten und 4 Cluster sind sichtbar.\n\n## Prüfung, Risiken, Alternativen\nPrüfung: Die Abfolge geht von Lesen (P1, P2) über Zeit und Verlust (P3) zu Schutz und Archiv (P4) und erst dann zum gemeinsamen Gehen (P5). Rechte und Schutz (N10) stehen damit vor Archiv (N7) und Fotoreihe (E12).\n\nRisiken: (1) P4 bringt 3 Knoten, 8 Kanten und 1 Cluster auf einmal und ist überladen. (2) Das Herzstück, der Spurengang (N6), erscheint erst in P5; Zuschauer könnten den Bezug zum Handeln spät sehen. (3) Aktives Graffiti (N3) erscheint früh in P2, bevor Rechte (N10) sichtbar sind; die Simulation könnte das als Freibrief lesen. (4) Das Endbild ist mit 14 Knoten und 20 Kanten dicht.\n\nAlternativen: P4 in zwei Phasen teilen (N10 mit E14, E17 zuerst; dann N7, N12); N6 und E5 schon in P2 zeigen; N3 erst in P3 mit N10 zusammen einführen; K1 bis K4 erst am Ende einblenden.\n\nTechnik: Knoten blenden mit Skalierung 0,6 zu 1 in etwa 400 ms ein, Kanten zeichnen sich als Strichlinie in etwa 600 ms, Cluster als Hülle mit Deckkraft 0,15, Warnfarbe bei E13, E14, E15, E17, E18, E19, Automatik etwa 4 s je Phase. Phasen sind kumulativ. Keine zusätzliche Recherche wegen des Zeitbudgets von 300 s; Quellen stehen im Katalog und in bilder.json.\n\n## Bilder\n- trier_hochstetter_werbung.jpg: verblasste Giebelwerbung in Trier, Beispiel für N2 und N9.\n- berlin_pappelallee_parfuemerien.jpg: verblasste Wandschrift in Berlin, Beispiel für N2 und N13.\n", "geliefert": true}, {"datei": "6-gesamtdokument.md", "rolle": "Master-Koordinator (Gesamtdokument)", "text": "# lauf7 – Gesamtdokument: Urbane Spurensuche\n\n**Interessen-Set:** „Urbane Spurensuche – Gemeinsames Dokumentieren von Graffiti-Schichten und verblassten Wandinschriften in der Stadt“ · **Knotentyp:** Interessen · **Zeit je Agent:** 300 s · **Bilder:** Min 2, Max 10\n\nDieses Dokument integriert die geprüften Ergebnisse der fünf Fachrollen unverändert (Texte und JSON-Dateien wörtlich übernommen, keine neuen Elemente, keine geänderten IDs).\n\n\n---\n\n## 1. Interessen-Analyse\n\n## lauf7 – Interessen-Analyse: Urbane Spurensuche\n\n**Interessen-Set:** „Urbane Spurensuche – Gemeinsames Dokumentieren von Graffiti-Schichten und verblassten Wandinschriften in der Stadt“. **Knotentyp:** Interessen.\n\n### Erkenntnisgrenzen\nDie Analyse entstand unter einem Budget von 5 Minuten. Die Quellen [1]–[7] wurden bereits am 09.11.2026 in einem früheren Lauf (lauf3) geprüft und in diesem Lauf nicht neu abgerufen. Neu in diesem Lauf sind nur die acht Bilder (Wikimedia Commons, Lizenzen in bilder.json). Aussagen zu lokalen Gruppen sind Hypothesen, keine Empirie.\n\n### Belegte Grundlagen\n- Gemeinsames Dokumentieren von Schrift im Stadtraum ist als Forschungs- und Bürgerprojekt etabliert: Das Paderborner Projekt INGRID untersucht Graffiti und Schrift im Stadtraum [1]; die App Lingscape sammelt Sprach- und Schriftspuren im öffentlichen Raum durch viele Beteiligte [2].\n- Verblasste Wandwerbung („Ghost Signs“) hat Archive und Gemeinschaften: der britische Hand-Painted-Advertising-Katalog (HAT) [3] und das deutsche Projekt ghostsigns.de [4]. Die Bilder zeigen, dass das Phänomen international auftritt (Polen, Frankreich, England, USA).\n- Rechtliche Rahmen: Fotografieren von Werken im öffentlichen Raum ist nach § 59 UrhG grundsätzlich zulässig (nur von öffentlichen Orten aus) [5]; Betreten fremder befriedeter Flächen kann Hausfriedensbruch sein (§ 123 StGB) [6]; Übermalen oder Beschädigen ist Sachbeschädigung (§ 303 StGB) [7].\n\n### Muster\n1. **Schicht als Zeitachse:** Graffiti überlagern sich, Wandinschriften verblassen; Dokumentation macht Zeit sichtbar. *Gegenargument:* Ohne Datierung sind Schichten schwer zu ordnen, Fotos belegen nur den Aufnahmezeitpunkt.\n2. **Kollektiv statt Einzelsammler:** Die Quellen [2][3][4] arbeiten beteiligungsorientiert. *Gegenargument:* Beteiligung ist ungleich verteilt, wenige tragen die meiste Arbeit.\n3. **Vergänglichkeit als Motor:** Was verschwindet, erzeugt Dringlichkeit. *Gegenargument:* Dringlichkeit kann zu überhastetem, unsauberem Dokumentieren führen.\n4. **Grenzraum Kunst und Recht:** Graffiti sind Kulturspur und oft Rechtsverstoß [6][7]. *Gegenargument:* Dokumentieren ist kein Billigen; eine Gruppe muss das ausdrücklich klären.\n5. **Zwei Zeitlichkeiten:** Ghost Signs sind abgeschlossene, schwindende Schichten (Bilder 1–7), Graffiti sind aktive, sich überlagernde Schichten (Bild 8). *Gegenargument:* Die Bilder stammen aus Fremdarchiven; ob dieselbe Unterscheidung lokal trägt, ist offen.\n\n### Spannungsfelder\n- Dokumentieren (bewahren) gegenüber Respekt vor dem Vergehen (Graffiti sind oft bewusst flüchtig).\n- Offene Veröffentlichung gegenüber Schutz von Urhebern und Orten [5].\n- Bürgerwissenschaftliche Offenheit gegenüber Qualitätsstandards.\n- Historische Wandschrift (meist unstrittig) gegenüber aktuellem Graffiti (rechtlich und sozial umstritten) in einer gemeinsamen Gruppe.\n\n### Gemeinschaftspotenziale (Hypothesen)\n- **H1:** Gemeinsame Begehungen mit festem Foto-Protokoll (Ort, Datum, Blickrichtung) schaffen niedrigschwellige Zugehörigkeit.\n- **H2:** Ein gemeinsames Stadtar
