text": "Funktion in Spurengang und Wiederbesuch: Wand und Beobachtung aufnehmen, Fotos nur bei Rechte-Stufe A.", "beleg": "1-analytiker.md Rollen (Vorschlag); 2-format.md Format 1 und 2; Beteiligung vieler belegt in [2][3][4], die Rollenaufteilung selbst nicht (Annahme, nicht belegt).", "gegen": "Beteiligung ist ungleich verteilt, wenige tragen die Arbeit."}, {"id": "Ro2", "typ": "Rollen", "label": "Datierende und Recherchierende", "text": "Funktion: Alter und Reihenfolge der Schichten einschätzen, Wandschrift mit Archiven abgleichen.", "beleg": "1-analytiker.md Rollen, Aktivitäten (Archivabgleich [3][4]); 2-format.md Format 1 bis 3.", "gegen": "Datierung bleibt oft vermutet; die Rolle erzeugt Scheinsicherheit, wenn die Sicherheitsstufe fehlt."}, {"id": "Ro3", "typ": "Rollen", "label": "Archivierende", "text": "Funktion: Beiträge verschlagworten, ordnen und im Archivabend vorlegen.", "beleg": "1-analytiker.md Rollen und Aktivitäten (Verschlagwortung); 2-format.md Format 3.", "gegen": "Wer archiviert, bestimmt, was sichtbar wird; hierarchische Auswahl möglich (2-format.md Format 3, Risiken)."}, {"id": "Ro4", "typ": "Rollen", "label": "Wegführende (Moderation)", "text": "Wechselnde Funktion: Spurengang moderieren, Regeln nennen, Haltezeiten einhalten.", "beleg": "1-analytiker.md Rollen; 2-format.md Abschnitt 1 (Moderation, keine Hierarchie), Format 1.", "gegen": "Kann trotz Wechsel zur informellen Leitung werden."}, {"id": "A1", "typ": "Aktivitäten", "label": "Begehung mit Foto", "text": "Gemeinsames Gehen von etwa vier vorab gesichteten Stationen mit Beschreiben, Notieren und Foto nur bei Stufe A.", "beleg": "1-analytiker.md Aktivitäten; 2-format.md Format 1 (ca. 120 Min., 12 Min. je Station).", "gegen": "Konflikt mit Anwohnenden und Mobilitätsgrenzen; Wirkung nicht belegt."}, {"id": "A2", "typ": "Aktivitäten", "label": "Wiederbesuch derselben Wand", "text": "Dieselbe Wand vom beschriebenen Standpunkt erneut dokumentieren, höchstens zehn Wände, Frist sechs Monate.", "beleg": "1-analytiker.md Aktivitäten; 2-format.md Format 2; Bild dresden_wandbild_baugrube_2019_2020.jpg zeigt denselben Ort 2019 und 2020.", "gegen": "Wirkt wie Überwachung einer Szene; Ermüdung (2-format.md Format 2, Risiken)."}, {"id": "A3", "typ": "Aktivitäten", "label": "Verschlagwortung", "text": "Beobachtungen mit Schlagworten und Sicherheitsstufe versehen und ordnen.", "beleg": "1-analytiker.md Aktivitäten; 2-format.md Format 3.", "gegen": "Kann Einsteiger überfordern (2-format.md: nur fünf Minimumfelder verpflichtend)."}, {"id": "A4", "typ": "Aktivitäten", "label": "Abgleich mit Archiven", "text": "Funde mit HAT und ghostsigns.de vergleichen.", "beleg": "1-analytiker.md Aktivitäten, Quellen [3][4]; 2-format.md Format 3.", "gegen": "Quellen nicht neu abgerufen; Archivzugang nur als Vorschlag nutzbar."}, {"id": "Re1", "typ": "Ressourcen", "label": "Kamera, Smartphone oder Papierkarte", "text": "Mittel zum Aufnehmen und Verorten; Papierkarte und App sind gleichwertig.", "beleg": "1-analytiker.md Ressourcen; 2-format.md Abschnitt 2 und Prinzip 5.", "gegen": "Nicht alle haben ein Smartphone; Papier erschwert die Weitergabe."}, {"id": "Re2", "typ": "Ressourcen", "label": "Rechtswissen zu Foto, Betreten und Übermalen", "text": "Wissen: Foto im öffentlichen Raum grundsätzlich zulässig nach § 59 UrhG, Betreten befriedeter Flächen kann strafbar sein (§ 123 StGB), Übermalen ist Sachbeschädigung (§ 303 StGB).", "beleg": "1-analytiker.md Ressourcen, Quellen [5][6][7]; 2-format.md Abschnitt 1 und 2.", "gegen": "Die Vorarbeit selbst nennt § 59 UrhG zu glatt: für kurzlebige oder übermalte Graffiti offen; keine Rechtsberatung, Quellen nicht neu abgerufen."}, {"id": "Re3", "typ": "Ressourcen", "label": "Archivzugang und Karte oder App", "text": "Zugang zu HAT und ghostsigns.de sowie Karte oder App zum Abgleich und Verorten.", "beleg": "1-analytiker.md Ressourcen, Quellen [2][3][4]; 2-format.md Format 3.", "gegen": "Lingscape bietet laut Vorarbeit keine belegte private Ablage; interne Ablage offen."}, {"id": "Re4", "typ": "Ressourcen", "label": "Standpunktbeschreibung in Worten", "text": "Schriftliche Angabe, von wo die Wand aufgenommen wird, zum erneuten Auffinden.", "beleg": "2-format.md Format 2 (z. B. gegenüberliegender Gehweg, Laternenmast 2) [Entwurf].", "gegen": "Beschreibungen veralten, wenn sich die Umgebung ändert."}, {"id": "B1", "typ": "Bedürfnisse", "label": "Zugehörigkeit", "text": "Bedürfnis nach gemeinsamer Sammlung und Gruppe.", "beleg": "1-analytiker.md Bedürfnisse (begründete Annahme, direkter Beleg fehlt); 2-format.md Format 1 und 3.", "gegen": "Keine Belege aus der Szene; Beteiligung ungleich verteilt."}, {"id": "B2", "typ": "Bedürfnisse", "label": "Anerkennung", "text": "Bedürfnis, dass ein Fund sichtbar wird und gewürdigt wird.", "beleg": "1-analytiker.md Bedürfnisse (Annahme); 2-format.md Format 2 und 3.", "gegen": "Sichtbarkeit kollidiert mit Orts- und Urheberschutz."}, {"id": "B3", "typ": "Bedürfnisse", "label": "Sicherheit (Rechtsklarheit)", "text": "Bedürfnis nach klaren Regeln, was erlaubt ist.", "beleg": "1-analytiker.md Bedürfnisse, Quellen [5][6][7] (Annahme); 2-format.md Abschnitt 2 und Format 1, 3.", "gegen": "Regeldichte kann abschrecken; Gruppenbeschluss ersetzt keine Rechtsklärung."}, {"id": "B4", "typ": "Bedürfnisse", "label": "Autonomie", "text": "Bedürfnis nach eigenem Fund und eigenem Weg.", "beleg": "1-analytiker.md Bedürfnisse (Annahme); 2-format.md Format 2.", "gegen": "Steht gegen feste Rhythmen und gemeinsame Regeln."}, {"id": "Ri1", "typ": "Rituale", "rhythmus": "monatlich", "label": "Monatliche Begehung", "text": "Spurengang mit fester Form (Einführung, Stationen, Abschluss).", "beleg": "1-analytiker.md Rituale (Vorschlag); 2-format.md Format 1.", "gegen": "Belege für feste Rhythmen in [1]–[4] nicht vorhanden; starre Rhythmen mindern Spontaneität."}, {"id": "Ri2", "typ": "Rituale", "rhythmus": "vierteljährlich", "label": "Wiederbesuch nach festem Abstand", "text": "Dieselbe Wand wird nach festem Abstand erneut dokumentiert, Entscheidung über Verlängerung nach 6 Monaten.", "beleg": "1-analytiker.md Rituale (Vorschlag); 2-format.md Format 2.", "gegen": "Rhythmus ist Hypothese; zwischendurch Besuche bleiben erlaubt."}, {"id": "Ri3", "typ": "Rituale", "rhythmus": "monatlich", "label": "Archivabend", "text": "Feste Form: Beiträge sammeln, Paar-Prüfung, Schichtschema, Rechte-Runde, Entscheidung über Zeigen.", "beleg": "1-analytiker.md Rituale (Vorschlag); 2-format.md Format 3.", "gegen": "Rhythmus ist Hypothese; Raum und Zeit binden Beteiligte."}], "kanten": [{"id": "E1", "from": "I1", "to": "A1", "text": "Interesse treibt Aktivität an: gemeinsame Schrifterfassung speist die Begehung (1-analytiker.md Interessen [1][2])."}, {"id": "E2", "from": "I2", "to": "A4", "text": "Interesse treibt Aktivität an: Ghost-Sign-Archivierung führt zum Archivabgleich (1-analytiker.md [3][4])."}, {"id": "E3", "from": "I3", "to": "A2", "text": "Interesse treibt Aktivität an: Schichten als Zeitspur verlangen Wiederbesuche (2-format.md Format 2). Gegen: ohne Datierung wenig aussagekräftig."}, {"id": "E4", "from": "I2", "to": "A3", "text": "Interesse treibt Aktivität an: Archivieren braucht Verschlagwortung (2-format.md Format 3)."}, {"id": "E5", "from": "Ro1", "to": "A1", "text": "Rolle führt Aktivität aus: Fotografierende nehmen auf der Begehung auf (1-analytiker.md Aktivitäten)."}, {"id": "E6", "from": "Ro1", "to": "A2", "text": "Rolle führt Aktivität aus: Fotografierende dokumentieren beim Wiederbesuch (2-format.md Format 2)."}, {"id": "E7", "from": "Ro2", "to": "A4", "text": "Rolle führt Aktivität aus: Recherchierende gleichen mit Archiven ab (2-format.md Format 3)."}, {"id": "E8", "from": "Ro3", "to": "A3", "text": "Rolle führt Aktivität aus: Archivierende verschlagworten (1-analytiker.md Aktivitäten)."}, {"id": "E9", "from": "Ro4", "to": "A1", "text": "Rolle führt Aktivität aus: Wegführende moderieren die Begehung (2-format.md Format 1)."}, {"id": "E10", "from": "Ro2", "to": "A2", "text": "Rolle führt Aktivität aus: Datierende beurteilen die Schichtfolge beim Wiederbesuch (2-format.md Format 2)."}, {"id": "E11", "from": "A1", "to": "Re1", "text": "Aktivität braucht Ressource: Kamera, Smartphone oder Papierkarte (1-analytiker.md Ressourcen)."}, {"id": "E12", "from": "A1", "to": "Re2", "text": "Aktivität braucht Ressource: Rechtswissen zu § 59, § 123, § 303 (1-analytiker.md Ressourcen)."}, {"id": "E13", "from": "A2", "to": "Re4", "text": "Aktivität braucht Ressource: Standpunktbeschreibung (2-format.md Format 2)."}, {"id": "E14", "from": "A4", "to": "Re3", "text": "Aktivität braucht Ressource: Archivzugang, Karte oder App (1-analytiker.md Ressourcen, [3][4])."}, {"id": "E15", "from": "A3", "to": "Re3", "text": "Aktivität braucht Ressource: Karte oder App und Archiv zum Ordnen (2-format.md Format 3)."}, {"id": "E16", "from": "A2", "to": "Re1", "text": "Aktivität braucht Ressource: Kamera oder Smartphone für die Zeitreihe (2-format.md Format 2)."}, {"id": "E17", "from": "A4", "to": "B2", "text": "Aktivität bedient Bedürfnis: Archivabgleich macht Funde sichtbar (Annahme, 1-analytiker.md Bedürfnisse)."}, {"id": "E18", "from": "A1", "to": "B1", "text": "Aktivität bedient Bedürfnis: gemeinsames Gehen stärkt Zugehörigkeit (Annahme, 2-format.md Format 1)."}, {"id": "E19", "from": "A2", "to": "B4", "text": "Aktivität bedient Bedürfnis: eigener Weg zu einer eigenen Wand (Annahme, 2-format.md Format 2)."}, {"id": "E20", "from": "Re2", "to": "B3", "text": "Ressource bedient Bedürfnis: klare Regeln geben Sicherheit (Annahme, 1-analytiker.md [5][6][7]). Gegen: Rechtslage für Graffiti offen."}, {"id": "E21", "from": "Ri1", "to": "A1", "text": "Ritual besteht aus Aktivität: die monatliche Begehung ist die wiederkehrende Begehung mit Foto (2-format.md Format 1)."}, {"id": "E22", "from": "Ri2", "to": "A2", "text": "Ritual besteht aus Aktivität: der Wiederbesuch wird nach festem Abstand wiederholt (2-format.md Format 2)."}, {"id": "E23", "from": "Ri3", "to": "A3", "text": "Ritual besteht aus Aktivität: Verschlagwortung im Archivabend (2-format.md Format 3)."}, {"id": "E24", "from": "Ri3", "to": "A4", "text": "Ritual besteht aus Aktivität: Archivabgleich im Archivabend (2-format.md Format 3)."}, {"id": "E25", "from": "Ri3", "to": "B2", "text": "Ritual bedient Bedürfnis: der Archivabend macht Funde sichtbar (Annahme, 2-format.md Format 3)."}, {"id": "E26", "from": "Ri1", "to": "B1", "text": "Ritual bedient Bedürfnis: wiederkehrende Gruppentreffen für Zugehörigkeit (Annahme, 2-format.md Format 1)."}, {"id": "E27", "from": "Ro3", "to": "Ri3", "text": "Rolle führt Ritual aus: Archivierende tragen den Archivabend (2-format.md Format 3)."}, {"id": "E28", "from": "Ro4", "to": "Ri1", "text": "Rolle führt Ritual aus: Wegführende leiten die monatliche Begehung (2-format.md Format 1)."}, {"id": "E29", "from": "B3", "to": "Ri3", "text": "Bedürfnis prägt Ritual: Rechtsklarheit verlangt die Rechte-Runde im Archivabend (Annahme, 2-format.md Format 3)."}, {"id": "E30", "from": "B4", "to": "Ri2", "text": "Bedürfnis prägt Ritual: Autonomie spricht für flexible, kleine Wiederbesuche statt starrer Pflicht (Annahme, 2-format.md Format 2, Risiken)."}], "cluster": [{"id": "K1", "label": "Schrift und Schichten lesen", "knoten": ["I1", "I2", "I3", "A4", "Re3"]}, {"id": "K2", "label": "Spurengang", "knoten": ["Ro1", "Ro4", "A1", "Re1", "Re2", "Ri1", "B1"]}, {"id": "K3", "label": "Wiederbesuch", "knoten": ["Ro1", "Ro2", "A2", "Re4", "Ri2", "B4", "I3"]}, {"id": "K4", "label": "Archivabend", "knoten": ["Ro3", "Ro2", "A3", "A4", "Ri3", "B2", "B3", "Re3"]}]}, "klick.json": {"klick": [{"id": "C1", "titel": "Gemeinsam unterwegs, nicht allein vor der Wand", "ids": ["B1", "A1", "Ri1", "Ro4", "E18", "E26", "K2"], "eindruck": "Warme, wache Verbundenheit: Man geht im Takt der Gruppe, spricht über dieselbe Wand und fühlt sich dabei als Teil von etwas. Fehlt dies, entsteht das Gefühl, nur Zuschauer zu sein. Gefühlswörter sind Interpretation.", "beleg": "B1 (Zugehörigkeit) wird laut E18 von der Begehung (A1) und laut E26 vom monatlichen Ritual (Ri1) bedient, das Wegführende (Ro4, E28) leiten. Beide Kanten sind im Katalog als Annahme markiert.", "pruefung": "Alternative 'Leistungsdruck' (viele Funde) widerspricht der festen, kleinen Form von Ri1. Alternative 'Gruppenzwang' wird durch B4 und E30 gebremst. Wirkung ist Annahme, nicht belegt."}, {"id": "C2", "titel": "Der eigene Fund bekommt einen Platz", "ids": ["B2", "Ri3", "A4", "Ro3", "E17", "E25", "E27", "K4"], "eindruck": "Stilles Stolzgefühl: Ein Fund, der im Archivabend gezeigt und beim Archivabgleich eingeordnet wird, fühlt sich gesehen an. Bleibt er unbeachtet, entsteht leise Enttäuschung.", "beleg": "B2 (Anerkennung) wird nach E17 durch den Archivabgleich (A4) und nach E25 durch den Archivabend (Ri3) bedient; die Archivierenden (Ro3) tragen ihn (E27). Alle als Annahme markiert.", "pruefung": "Alternative 'Wettbewerb um Likes' passt nicht: Ri3 enthält Paar-Prüfung und Entscheidung über Zeigen, kein Ranking. Alternative 'Anonymität' würde B2 verletzen. Wirkung ist Annahme."}, {"id": "C3", "titel": "Aufatmen durch klare Regeln", "ids": ["B3", "Re2", "Ri3", "A1", "E12", "E20", "E29", "K4"], "eindruck": "Ruhige Erleichterung: Wer weiß, was fotografiert, betreten und gezeigt werden darf, kann entspannt hinschauen. Unklarheit erzeugt Anspannung an jeder Hauswand.", "beleg": "B3 (Sicherheit) wird nach E20 durch das Rechtswissen (Re2) bedient, das die Begehung braucht (E12); E29 begründet die Rechte-Runde im Archivabend (Ri3).", "pruefung": "Alternative 'Abenteuerlust ohne Regeln' widerspricht E20, E29. Gegen den Eindruck spricht E20 selbst: 'Rechtslage für Graffiti offen', Sicherheit bleibt begrenzt. Keine Rechtsberatung."}, {"id": "C4", "titel": "Eigener Weg, eigene Wand, eigenes Tempo", "ids": ["B4", "A2", "Ri2", "Re4", "E19", "E30", "K3"], "eindruck": "Gelassene Freiheit: Eine selbst gewählte Wand, die man nach festem Abstand wieder besucht, fühlt sich nach eigener Entdeckung an, nicht nach Pflicht. Starre Vorgaben würden Druck erzeugen.", "beleg": "B4 (Autonomie) wird nach E19 durch den Wiederbesuch (A2) bedient; E30 prägt das Ritual (Ri2) flexibel; Re4 gibt Orientierung (E13).", "pruefung": "Alternative 'Verpflichtung/Pflichtgefühl' widerspricht E30. Alternative 'Einsamkeit' wird durch das Gruppenritual (C1, B1) ausgeglichen. Beides Annahmen aus dem Katalog."}, {"id": "C5", "titel": "Staunen über Schichten und Geisterschrift", "ids": ["I3", "I2", "Ro2", "A4", "E3", "E7", "K1"], "eindruck": "Neugieriges Staunen mit Fragezeichen: Überlagerungen als Zeitachse lesen und halb lesbare Wandwerbung im Archiv wiederfinden, ohne vorzugeben, alles zu wissen.", "beleg": "I3 (Graffiti-Schichten als Zeitspur) verlangt laut E3 Wiederbesuche; Datierende (Ro2) gleichen laut E7 mit Archiven ab (A4). Bild lissabon_lx_factory_schichten.jpg (Wikimedia Commons, CC BY 4.0) zeigt Schichtung als Phänomen.", "pruefung": "Alternative 'Nostalgie/Wehmut' passt nicht zum prüfenden Abgleich (A4). E3 warnt: ohne Datierung wenig aussagekräftig, daher Unsicherheit statt Gewissheit. Wirkung nicht belegt."}], "stimmung": "Neugierig-experimentell mit warmer Verbundenheit und behutsamer Zurückhaltung. Begründung: B1 bis B4 bekommen je einen Eindruck (C1 bis C4), C5 bündelt das Staunen der Interessen I2 und I3. Gegen 'leistungsorientiert' sprechen Ri1 und E30, gegen 'streng-juristisch' die offene Rechtslage (E20). Die Gefühlswörter sind Interpretation; viele Kanten sind im Katalog als Annahme markiert. Keine externe Recherche (Zeitbudget 120 s)."}, "phasen.json": {"phasen": [{"id": "P1", "titel": "Schrift und Schichten sehen", "sichtbar": ["I1", "I2", "I3", "Ro1", "Ro4", "A1", "Re1", "E1", "E5", "E9", "E11"], "text": "Die Gruppe tritt zusammen: die Interessen I1 (Schrift im Stadtraum gemeinsam erfassen), I2 (Ghost Signs archivieren) und I3 (Graffiti-Schichten als Zeitspur) blenden ein, dazu die Rollen Ro1 (Fotografierende) und Ro4 (Wegführende), die Aktivität A1 (Begehung mit Foto) und die Ressource Re1 (Kamera, Smartphone oder Papierkarte). E1, E5, E9 und E11 zeigen, wer die Begehung trägt und womit."}, {"id": "P2", "titel": "Spurengang mit festem Rhythmus und Rechtswissen", "sichtbar": ["I1", "I2", "I3", "Ro1", "Ro4", "A1", "Re1", "Re2", "Ri1", "B1", "B3", "E1", "E5", "E9", "E11", "E12", "E18", "E20", "E21", "E26", "E28", "K2"], "text": "Das Ritual Ri1 (Monatliche Begehung) macht die Begehung regelmäßig; es verbindet sich über E21 mit A1 und über E28 mit Ro4. Das Bedürfnis B1 (Zugehörigkeit) entsteht über E18 und E26. Die Ressource Re2 (Rechtswissen) und das Bedürfnis B3 (Sicherheit) erscheinen über E12 und E20 in Warnfarbe: Rechte sind früh sichtbar, noch vor jedem Archiv. K2 (Spurengang) legt sich als Hülle um seine sieben Elemente."}, {"id": "P3", "titel": "Wiederbesuch derselben Wand", "sichtbar": ["I1", "I2", "I3", "Ro1", "Ro4", "A1", "Re1", "Re2", "Ri1", "B1", "B3", "Ro2", "A2", "Re4", "Ri2", "B4", "E1", "E3", "E5", "E6", "E9", "E10", "E11", "E12", "E13", "E16", "E18", "E19", "E20", "E21", "E22", "E26", "E28", "E30", "K2", "K3"], "text": "Die Rolle Ro2 (Datierende und Recherchierende), die Aktivität A2 (Wiederbesuch derselben Wand), die Ressource Re4 (Standpunktbeschreibung in Worten), das Ritual Ri2 (Wiederbesuch nach festem Abstand) und das Bedürfnis B4 (Autonomie) erscheinen. E3 verbindet I3 mit A2, E6 und E10 zeigen, wer wiederbesucht, E13 und E16 die Hilfsmittel, E22 den festen Abstand, E19 und E30 die Autonomie. K3 (Wiederbesuch) wird vollständig."}, {"id": "P4", "titel": "Archivabend und Abgleich", "sichtbar": ["I1", "I2", "I3", "Ro1", "Ro4", "A1", "Re1", "Re2", "Ri1", "B1", "B3", "Ro2", "A2", "Re4", "Ri2", "B4", "A3", "A4", "Re3", "Ro3", "B2", "Ri3", "E1", "E2", "E3", "E4", "E5", "E6", "E7", "E8", "E9", "E10", "E11", "E12", "E13", "E14", "E15", "E16", "E17", "E18", "E19", "E20", "E21", "E22", "E23", "E24", "E25", "E26", "E27", "E28", "E29", "E30", "K1", "K2", "K3", "K4"], "text": "Zuletzt kommen Archivierende (Ro3), Verschlagwortung (A3), Abgleich mit Archiven (A4), Archivzugang und Karte oder App (Re3), das Bedürfnis Anerkennung (B2) und das Ritual Archivabend (Ri3). E2, E4, E7, E8, E14, E15, E17 und E23 bis E25 verbinden Interessen, Rollen, Aktivitäten und Ressourcen mit dem Archivabend; E27 und E29 (Warnfarbe) binden Archivierende und Rechtssicherheit an Ri3. K1 (Schrift und Schichten lesen) und K4 (Archivabend) werden vollständig. Endzustand: alle Katalogelemente sind sichtbar."}], "hinweis": "Prüfung: Die Abfolge geht von Sehen (P1) über Rhythmus und Recht (P2) und Wiederbesuch (P3) zum Archiv (P4). Rechte (Re2, B3) stehen damit vor Verschlagwortung (A3) und Archivabend (Ri3). Genutzt werden alle sechs Knotentypen: Interessen, Rollen, Aktivitäten, Ressourcen, Bedürfnisse und Rituale. Risiken: (1) P4 bringt sechs Knoten und zwölf Kanten auf einmal und ist überladen. (2) Der Wiederbesuch kommt erst in P3; der Zeitbezug von I3 ist bis dahin nur angedeutet. (3) Ro2 (Datierende) erscheint erst in P3, obwohl der Abgleich mit Archiven (A4) in P4 schon Datierung braucht; die Abfolge ist dort knapp. (4) B2 (Anerkennung) steht erst am Ende, Newcomer könnten Beteiligung vorher als Pflicht erleben. Alternativen: P4 teilen (zuerst A3, Ro3, Re3, dann A4, B2, Ri3); Ro2 schon in P1 zeigen; Ri3 vor P3 ziehen und den Wiederbesuch nach dem ersten Archivabend zeigen; Re2 und B3 sogar schon in P1. Technik: Knoten blenden mit Skalierung 0,6 zu 1 in etwa 400 ms ein, Kanten zeichnen sich als Strichlinie in etwa 600 ms, Cluster als Hülle mit Deckkraft 0,15, Warnfarbe bei E12, E20, E29, Automatik etwa 4 s je Phase. Phasen sind kumulativ. Keine zusätzliche Recherche wegen des Zeitbudgets von 120 s; Quellen stehen im Katalog und in bilder.json."}}, "md": [{"datei": "1-analytiker.md", "rolle": "Interessen-Analytiker", "text": "# lauf8 – Interessen-Analyse: Urbane Spurensuche\n\n**Interessen-Set:** „Urbane Spurensuche – Gemeinsames Dokumentieren von Graffiti-Schichten und verblassten Wandinschriften in der Stadt“. **Knotentypen:** Interessen, Rollen, Aktivitäten, Ressourcen, Bedürfnisse, Rituale.\n\n## Erkenntnisgrenzen\nBudget 2 Minuten. Die Quellen [1]–[7] wurden am 09.11.2026 (lauf3) geprüft und jetzt nicht neu abgerufen. Alles Lokale sind Hypothesen. Was nicht belegbar ist, ist so markiert.\n\n## Interessen\n- Schrift im Stadtraum gemeinsam erfassen: INGRID [1], Lingscape [2].\n- Verblasste Wandwerbung („Ghost Signs“) archivieren: HAT [3], ghostsigns.de [4].\n- Graffiti-Schichten als Zeitspur. *Gegenargument:* Fotos belegen nur den Aufnahmezeitpunkt, Schichten sind ohne Datierung schwer zu ordnen.\n\n## Rollen\n- Fotografierende, Datierende/Recherchierende, Archivierende, Wegführende (Begehungen). Belegt ist Beteiligung vieler bei [2][3][4]; die konkrete Rollenaufteilung ist **nicht belegt**, sie ist ein Vorschlag. *Gegenargument:* Beteiligung ist oft ungleich verteilt.\n\n## Aktivitäten\n- Begehung mit Foto, Wiederbesuch derselben Wand, Verschlagwortung, Abgleich mit Archiven [3][4]. Beziehung: Rolle Fotografierende führt Begehung aus; Archivierende führen Verschlagwortung aus.\n\n## Ressourcen\n- Kamera/Smartphone, Karte oder App [2], Archivzugang [3][4], Wissen zu Recht: Foto im öffentlichen Raum grundsätzlich zulässig [5], Betreten befriedeter Flächen kann strafbar sein [6], Übermalen ist Sachbeschädigung [7]. Genehmigungen für Privatgrund sind **nicht belegt**, sie müssen im Einzelfall geklärt werden. Beziehung: Begehung braucht Kamera und Rechtswissen.\n\n## Bedürfnisse (nur Bedürfnisse, keine Emotionen)\n- Zugehörigkeit (gemeinsame Sammlung), Anerkennung (Fund wird sichtbar), Sicherheit (Rechtsklarheit [5][6][7]), Autonomie (eigener Fund, eigener Weg). Direkte Belege für diese Bedürfnisse in der Szene fehlen; es sind **begründete Annahmen**. Beziehung: Archivabgleich bedient Anerkennung; klare Regeln bedienen Sicherheit.\n\n## Rituale\n- Monatliche Begehung (**rhythmus: monatlich**, Vorschlag), Wiederbesuch derselben Wand nach festem Abstand (**rhythmus: vierteljährlich**, Vorschlag), Archivabend (**rhythmus: monatlich**). Belege für feste Rhythmen in [1]–[4] **nicht vorhanden**; alle Rhythmen sind Hypothesen. *Gegenargument:* Zu starre Rhythmen können die Spontaneität des Fundes mindern.\n\n## Muster und Spannungen\n- Schicht als Zeitachse; Vergänglichkeit als Motor; Kunst gegenüber Recht [6][7]; Bewahren gegenüber Respekt vor dem Vergehen; offene Veröffentlichung gegenüber Ortsschutz [5].\n\n## Bilder\nZwei Ghost Signs aus Wikimedia Commons (CC BY-SA 4.0, Details in bilder.json): Tottenham (London) und Poznań. Sie belegen das Phänomen, nicht lokale Verhältnisse.\n\n## Offene Fragen\n- **Beziehungs-Architekt:** Welche Kanten zwischen Rollen, Aktivitäten, Ressourcen und Bedürfnissen sind zulässig?\n- **Emotions-Kurator:** Wie wirkt Vergänglichkeit emotional, ohne Illegalität zu romantisieren?\n- **Simulations-Choreograph:** Wie entwickelt sich eine Wand über mehrere Wiederbesuche?\n- **Format-Entwerfer:** Welche Formate tragen die Rituale ohne Eingriff in die Wand?\n- **Master-Koordinator:** Soll eine spätere Runde lokale Quellen und Rechtsprüfung nachholen?\n\n## Quellenverzeichnis\n1. [INGRID](https://www.uni-paderborn.de/forschungsprojekte/ingrid)\n2. [Lingscape](https://lingscape.app/about.html)\n3. [HAT Ghost Signs](https://www.hatads.org.uk/catalogue/ghostsigns.aspx)\n4. [ghostsigns.de](https://ghostsigns.de/about/)\n5. [§ 59 UrhG](https://www.gesetze-im-internet.de/urhg/__59.html)\n6. [§ 123 StGB](https://www.gesetze-im-internet.de/stgb/__123.html)\n7. [§ 303 StGB](https://www.gesetze-im-internet.de/stgb/__303.html)\n", "geliefert": true}, {"datei": "2-format.md", "rolle": "Format-Entwerfer", "text": "# lauf8 – Format-Entwurf: Urbane Spurensuche\n\n**Rolle:** Format-Entwerfer | **Lauf:** lauf8 | **attempt:** format-v1-26522ee6\n**Knotentypen:** Interessen, Rollen, Aktivitäten, Ressourcen, Bedürfnisse, Rituale\n**Interessen-Set:** „Urbane Spurensuche – Gemeinsames Dokumentieren von Graffiti-Schichten und verblassten Wandinschriften in der Stadt“\n**Vorarbeit:** `1-analytiker.md` (lauf8) und `bilder.md` gelesen. **Eigene Bilder:** 1 (Abschnitt 5).\n\n**Erkenntnisgrenzen:** Zeitbudget 2 Minuten. Ich habe keine Quelle neu abgerufen; [1]–[7] stammen aus der Vorarbeit (Prüfung in lauf3) und sind hier **nicht live geprüft**. **[Entwurf]** kennzeichnet meine Vorschläge, keine belegte Wirkung.\n**Knoten-IDs:** Die Vorarbeit enthält **keine Knoten-IDs**. Ich erfinde keine und verweise auf Knoten mit Typ und Namen aus der Vorarbeit, z. B. *Aktivität „Begehung“*. Der Beziehungs-Architekt kann die IDs vergeben.\n\n## 1. Kritische Prüfung der Vorarbeit\n- Die Quellen [1]–[4] belegen Interesse und Beteiligung vieler beim Erfassen von Schrift und Ghost Signs, aber **keine Rollenaufteilung, keine Bedürfnisse und keine Rhythmen**. Das stellt die Vorarbeit selbst klar; ich übernehme es: Rollen, Bedürfnisse und Rhythmen sind Annahmen.\n- „Foto im öffentlichen Raum grundsätzlich zulässig“ [5] ist zu glatt: § 59 UrhG betrifft *bleibende* Werke an öffentlichen Wegen; für kurzlebige oder übermalte Graffiti ist das offen. Aufnahme, interne Ablage und Veröffentlichung sind getrennt zu klären.\n- Die vorgeschlagene Rolle „Wegführende“ ist als Moderation gedacht, nicht als Hierarchie (Gegenargument der Vorarbeit: Beteiligung ist ungleich verteilt).\n- Lingscape [2] bietet laut Vorarbeit keine belegte private Ablage; es dient nicht als interne Ablage.\n\n## 2. Gemeinsames Minimum und Rechte-Stufen [Entwurf]\nJe Beobachtung: Zeit (grob), grober Ort (Straße oder Viertel, keine Koordinaten als Standard), Beobachtung „was liegt über was“, Sicherheit (sicher/vermutet/unklar), Rechte-Stufe. **A** geklärt (Fotoerlaubnis, Werkrechte, Personen- und Ortsschutz); **B** ungeklärt, dann nur Textnotiz oder Skizze, kein Foto; **C** nicht dokumentieren (erkennbare Personen, private Bereiche). Ein Gruppenbeschluss ersetzt keine Rechtsklärung. Papierkarte und App sind gleichwertig.\n\n## 3. Formate\nJedes Format verbindet die Typen so: *wer* (Rolle) tut *was* (Aktivität) mit *welchen Mitteln* (Ressource) für *welches Bedürfnis* in *welchem Ritual*.\n\n### Format 1 – Spurengang\n- **Interessen:** Schrift im Stadtraum gemeinsam erfassen; Ghost Signs archivieren; Graffiti-Schichten als Zeitspur.\n- **Rollen:** Wegführende (moderiert, wechselnd), Fotografierende, Datierende/Recherchierende.\n- **Aktivität:** Begehung mit Foto. **Ressourcen:** Kamera/Smartphone oder Papierkarte, Rechtswissen (§ 59, § 123, § 303 [5][6][7]).\n- **Bedürfnisse (Annahme):** Zugehörigkeit, Sicherheit durch klare Regeln. **Ritual:** monatliche Begehung (Rhythmus ist Vorschlag).\n- **Ablauf [Entwurf], ca. 120 Min.:** 15 Min. Einführung („nur schauen, nicht berühren, nicht betreten“); Rundweg von etwa 1,2 km auf barrierearmen öffentlichen Wegen mit 4 vorab gesichteten Stationen; je Station 12 Min. gemeinsam beschreiben, dann notieren; 20 Min. Abschluss mit offenen Fragen und vorläufigen Stufen; Puffer.\n- **Ergebnis:** Textnotizen nach Minimum, Fotos nur bei Stufe A.\n- **Risiken → Gegenmaßnahmen:** Konflikt mit Anwohnenden → kurze Halte, Gehwegregel; Betreten befriedeter Flächen → Route nur auf öffentlichen Wegen; Romantisierung von Illegalität → Dokumentieren heißt nicht billigen.\n- **Alternative:** Sitzstationen an zwei öffentlichen Orten; sinnvoll bei Mobilitätsgrenzen, nicht wetterfest.\n\n### Format 2 – Wiederbesuch\n- **Interessen:** Graffiti-Schichten als Zeitspur; Vergänglichkeit.\n- **Rollen:** Fotografierende, Datierende/Recherchierende. **Aktivität:** Wiederbesuch derselben Wand. **Ressourcen:** Kamera/Smartphone, Standpunktbeschreibung in Worten.\n- **Bedürfnisse (Annahme):** Autonomie (eigener Fund, eigener Weg), Anerkennung. **Ritual:** Wiederbesuch nach festem Abstand, vierteljährlich als Vorschlag; Frist nach 6 Monaten, dann ausdrückliche Entscheidung über Verlängerung.\n- **Ablauf [Entwurf]:** höchstens 10 unproblematische Wände; Standpunkt beschreiben („gegenüberliegender Gehweg, Laternenmast 2“); nur von Hand fotografieren, **keine fest installierten Kameras**; Fokus auf die Wand, nicht auf Personen.\n- **Ergebnis:** Zeitreihe je Wand, Foto nur bei Stufe A, sonst Text und Skizze.\n- **Risiken → Gegenmaßnahmen:** wirkt wie Überwachung einer Szene → Frist, keine Personenbilder, Ortsauswahl begründen; Ermüdung → kleines Kontingent; starre Rhythmen mindern Spontaneität → Wiederbesuch auch zwischendurch erlaubt.\n- **Alternative:** einmalige Vorher-Nachher-Dokumentation bei angekündigter Sanierung.\n\n### Format 3 – Archivabend\n- **Interessen:** Ghost Signs archivieren; Schrift gemeinsam erfassen.\n- **Rollen:** Archivierende, Datierende/Recherchierende, wechselnd Wegführende. **Aktivitäten:** Verschlagwortung, Abgleich mit Archiven [3][4]. **Ressourcen:** Archivzugang [3][4], Karte oder App [2], Papierkarten.\n- **Bedürfnisse (Annahme):** Anerkennung (Fund wird sichtbar), Sicherheit (Rechtsklarheit), Zugehörigkeit. **Ritual:** monatlicher Archivabend (Vorschlag).\n- **Ablauf [Entwurf], ca. 2 Std., barrierefreier Raum:** Beiträge sammeln; Paar-Prüfung gegen das Minimum; Schichtschema zeichnen (unten nach oben) mit markierter Unsicherheit; Rechte-Runde nur für den Klärungsweg von B-Fällen; Entscheidung, was wo gezeigt wird.\n- **Ergebnis:** geprüfte Beobachtungen, Schichtschemata, Liste geklärter und ungeklärter Rechtefälle.\n- **Risiken → Gegenmaßnahmen:** hierarchische Auswahl → Paar-Prüfung, dokumentierte Kriterien, Widerspruch; ungeklärtes „rutscht“ in die Veröffentlichung → Standard ist Zurückhaltung; Überforderung → nur fünf Minimumfelder verpflichtend.\n- **Alternative:** asynchrone Prüfrunde an Textnotizen, mit analoger Abgabestelle.\n\n## 4. Prinzipien [Entwurf]\n1. Dokumentieren, nie verändern (kein Berühren oder Übermalen; Grenze § 303 StGB [7]).\n2. Öffentlicher Blick, kein Betreten (§ 123 StGB [6]); Augenhöhe, keine Leitern, keine Drohnen (praktische Regel, keine Rechtsauslegung).\n3. Zurückhaltung bei ungeklärten Rechten: Textnotiz statt Foto.\n4. Orte grob statt genau; Wand statt Mensch.\n5. Analoger und digitaler Beitrag sind gleichwertig; Rollen wechseln.\n6. Unsicherheit sichtbar machen.\n7. Dokumentieren heißt nicht billigen; die Gruppe klärt das ausdrücklich.\n\n**Messgrößen ohne Zielwerte:** Anteil Beobachtungen mit vollständigem Minimum; Verteilung auf A/B/C; Anteil analoger Beiträge; geplante gegenüber erfolgten Wiederbesuchen; Konflikte und deren Bearbeitung.\n\n## 5. Bild\n![Graffitimauer im Stadtpark Lichtenberg, Berlin](bilder/berlin_graffitimauer_lichtenberg.jpg)\nGraffiti-bedeckte Mauer (Singlespeedfahrer, CC0, [Wikimedia Commons](https://commons.wikimedia.org/wiki/File:Graffitimauer_Stadtpark_Lichtenberg_Berlin.jpg)): aktive, überlagerte Schichten, wie sie Format 2 und 3 festhalten. Die zwei Analytiker-Bilder zeigen nur verblasste Wandwerbung. Das Bild belegt das Phänomen, nicht lokale Verhältnisse und nicht die Wirkung der Formate.\n\n## 6. Offene Fragen an den Beziehungs-Architekten (nur Fragen)\n- Welche IDs tragen die Knoten (die Vorarbeit liefert keine), und welche Kanten zwischen Rolle, Aktivität, Ressource, Bedürfnis und Ritual sind zulässig?\n- Wer dokumentiert die Klärung eines B-Falls, und wie läuft ein Widerspruch?\n- Wer entscheidet über Verlängerung oder Ende von Format 2?\n\n## 7. Quellen (aus der Vorarbeit, nicht neu abgerufen)\n[1] [INGRID](https://www.uni-paderborn.de/forschungsprojekte/ingrid) · [2] [Lingscape](https://lingscape.app/about.html) · [3] [HAT Ghost Signs](https://www.hatads.org.uk/catalogue/ghostsigns.aspx) · [4] [ghostsigns.de](https://ghostsigns.de/about/) · [5] [§ 59 UrhG](https://www.gesetze-im-internet.de/urhg/__59.html) · [6] [§ 123 StGB](https://www.gesetze-im-internet.de/stgb/__123.html) · [7] [§ 303 StGB](https://www.gesetze-im-internet.de/stgb/__303.html)\n", "geliefert": true}, {"datei": "3-katalog.md", "rolle": "Beziehungs-Architekt", "text": "lauf8 – Ergebnis Beziehungs-Architekt\n\nLaufname: lauf8 · attempt_id: architektur-v1-b9c52eaa · Bildgrenze: Min 1, Max 2 (genutzt: 2)\nKnotentypen: Interessen, Rollen, Aktivitäten, Ressourcen, Bedürfnisse, Rituale (alle sechs modelliert; jeder Typ ist durch die Vorarbeiten getragen). Set: Urbane Spurensuche – Gemeinsames Dokumentieren von Graffiti-Schichten und verblassten Wandinschriften in der Stadt\n\nQuellenbezug: nur lauf8/1-analytiker.md und lauf8/2-format.md (Quellen [1]–[7] dort, in lauf3 geprüft, hier nicht neu abgerufen; Zeitbudget 2×2 Minuten, keine eigene Recherche). Rollen, Bedürfnisse und Rhythmen sind laut Vorarbeit Annahmen oder Vorschläge, keine belegte Wirkung. Rechtliches nur als Orientierung, keine Rechtsberatung. Antwort auf die IDs-Frage des Format-Entwerfers: Vorsilben I, Ro, A, Re, B, Ri; die IDs stehen unten.\n\n## Knoten\n\n### I1 – Schrift im Stadtraum gemeinsam erfassen (Interessen)\n- Text: Interesse an gemeinsamer Erfassung von Schrift im Stadtraum.\n- Beleg: 1-analytiker.md Interessen, Quellen [1] INGRID, [2] Lingscape.\n- Gegenargument: INGRID ist ein Forschungsprojekt, Lingscape hat keine belegte private Ablage; beide tragen nur das Interesse, kein Format (2-format.md Abschnitt 1).\n\n### I2 – Verblasste Wandwerbung (Ghost Signs) archivieren (Interessen)\n- Text: Interesse, verblasste handgemalte Wandwerbung zu sammeln und zu archivieren.\n- Beleg: 1-analytiker.md Interessen, Quellen [3] HAT, [4] ghostsigns.de; Bild dresden_wandbild_baugrube_2019_2020.jpg zeigt eine vergehende Wandfläche.\n- Gegenargument: Bilder und Quellen stammen aus Fremdarchiven, keine lokale Empirie.\n\n### I3 – Graffiti-Schichten als Zeitspur (Interessen)\n- Text: Interesse, überlagerte Graffiti-Schichten als Zeitachse zu lesen.\n- Beleg: 1-analytiker.md Interessen und Muster; 2-format.md Format 1 und 2.\n- Gegenargument: Fotos belegen nur den Aufnahmezeitpunkt, Schichten sind ohne Datierung schwer zu ordnen (1-analytiker.md).\n\n### Ro1 – Fotografierende (Rollen)\n- Text: Funktion in Spurengang und Wiederbesuch: Wand und Beobachtung aufnehmen, Fotos nur bei Rechte-Stufe A.\n- Beleg: 1-analytiker.md Rollen (Vorschlag); 2-format.md Format 1 und 2; Beteiligung vieler belegt in [2][3][4], die Rollenaufteilung selbst nicht (Annahme, nicht belegt).\n- Gegenargument: Beteiligung ist ungleich verteilt, wenige tragen die Arbeit.\n\n### Ro2 – Datierende und Recherchierende (Rollen)\n- Text: Funktion: Alter und Reihenfolge der Schichten einschätzen, Wandschrift mit Archiven abgleichen.\n- Beleg: 1-analytiker.md Rollen, Aktivitäten (Archivabgleich [3][4]); 2-format.md Format 1 bis 3.\n- Gegenargument: Datierung bleibt oft vermutet; die Rolle erzeugt Scheinsicherheit, wenn die Sicherheitsstufe fehlt.\n\n### Ro3 – Archivierende (Rollen)\n- Text: Funktion: Beiträge verschlagworten, ordnen und im Archivabend vorlegen.\n- Beleg: 1-analytiker.md Rollen und Aktivitäten (Verschlagwortung); 2-format.md Format 3.\n- Gegenargument: Wer archiviert, bestimmt, was sichtbar wird; hierarchische Auswahl möglich (2-format.md Format 3, Risiken).\n\n### Ro4 – Wegführende (Moderation) (Rollen)\n- Text: Wechselnde Funktion: Spurengang moderieren, Regeln nennen, Haltezeiten einhalten.\n- Beleg: 1-analytiker.md Rollen; 2-format.md Abschnitt 1 (Moderation, keine Hierarchie), Format 1.\n- Gegenargument: Kann trotz Wechsel zur informellen Leitung werden.\n\n### A1 – Begehung mit Foto (Aktivitäten)\n- Text: Gemeinsames Gehen von etwa vier vorab gesichteten Stationen mit Beschreiben, Notieren und Foto nur bei Stufe A.\n- Beleg: 1-analytiker.md Aktivitäten; 2-format.md Format 1 (ca. 120 Min., 12 Min. je Station).\n- Gegenargument: Konflikt mit Anwohnenden und Mobilitätsgrenzen; Wirkung nicht belegt.\n\n### A2 – Wiederbesuch derselben Wand (Aktivitäten)\n- Text: Dieselbe Wand vom beschriebenen Standpunkt erneut dokumentieren, höchstens zehn Wände, Frist sechs Monate.\n- Beleg: 1-analytiker.md Aktivitäten; 2-format.md Format 2; Bild dresden_wandbild_baugrube_2019_2020.jpg zeigt denselben Ort 2019 und 2020.\n- Gegenargument: Wirkt wie Überwachung einer Szene; Ermüdung (2-format.md Format 2, Risiken).\n\n### A3 – Verschlagwortung (Aktivitäten)\n- Text: Beobachtungen mit Schlagworten und Sicherheitsstufe versehen und ordnen.\n- Beleg: 1-analytiker.md Aktivitäten; 2-format.md Format 3.\n- Gegenargument: Kann Einsteiger überfordern (2-format.md: nur fünf Minimumfelder verpflichtend).\n\n### A4 – Abgleich mit Archiven (Aktivitäten)\n- Text: Funde mit HAT und ghostsigns.de vergleichen.\n- Beleg: 1-analytiker.md Aktivitäten, Quellen [3][4]; 2-format.md Format 3.\n- Gegenargument: Quellen nicht neu abgerufen; Archivzugang nur als Vorschlag nutzbar.\n\n### Re1 – Kamera, Smartphone oder Papierkarte (Ressourcen)\n- Text: Mittel zum Aufnehmen und Verorten; Papierkarte und App sind gleichwertig.\n- Beleg: 1-analytiker.md Ressourcen; 2-format.md Abschnitt 2 und Prinzip 5.\n- Gegenargument: Nicht alle haben ein Smartphone; Papier erschwert die Weitergabe.\n\n### Re2 – Rechtswissen zu Foto, Betreten und Übermalen (Ressourcen)\n- Text: Wissen: Foto im öffentlichen Raum grundsätzlich zulässig nach § 59 UrhG, Betreten befriedeter Flächen kann strafbar sein (§ 123 StGB), Übermalen ist Sachbeschädigung (§ 303 StGB).\n- Beleg: 1-analytiker.md Ressourcen, Quellen [5][6][7]; 2-format.md Abschnitt 1 und 2.\n- Gegenargument: Die Vorarbeit selbst nennt § 59 UrhG zu glatt: für kurzlebige oder übermalte Graffiti offen; keine Rechtsberatung, Quellen nicht neu abgerufen.\n\n### Re3 – Archivzugang und Karte oder App (Ressourcen)\n- Text: Zugang zu HAT und ghostsigns.de sowie Karte oder App zum Abgleich und Verorten.\n- Beleg: 1-analytiker.md Ressourcen, Quellen [2][3][4]; 2-format.md Format 3.\n- Gegenargument: Lingscape bietet laut Vorarbeit keine belegte private Ablage; interne Ablage offen.\n\n### Re4 – Standpunktbeschreibung in Worten (Ressourcen)\n- Text: Schriftliche Angabe, von wo die Wand aufgenommen wird, zum erneuten Auffinden.\n- Beleg: 2-format.md Format 2 (z. B. gegenüberliegender Gehweg, Laternenmast 2) [Entwurf].\n- Gegenargument: Beschreibungen veralten, wenn sich die Umgebung ändert.\n\n### B1 – Zugehörigkeit (Bedürfnisse)\n- Text: Bedürfnis nach gemeinsamer Sammlung und Gruppe.\n- Beleg: 1-analytiker.md Bedürfnisse (begründete Annahme, direkter Beleg fehlt); 2-format.md Format 1 und 3.\n- Gegenargument: Keine Belege aus der Szene; Beteiligung ungleich verteilt.\n\n### B2 – Anerkennung (Bedürfnisse)\n- Text: Bedürfnis, dass ein Fund sichtbar wird und gewürdigt wird.\n- Beleg: 1-analytiker.md Bedürfnisse (Annahme); 2-format.md Format 2 und 3.\n- Gegenargument: Sichtbarkeit kollidiert mit Orts- und Urheberschutz.\n\n### B3 – Sicherheit (Rechtsklarheit) (Bedürfnisse)\n- Text: Bedürfnis nach klaren Regeln, was erlaubt ist.\n- Beleg: 1-analytiker.md Bedürfnisse, Quellen [5][6][7] (Annahme); 2-format.md Abschnitt 2 und Format 1, 3.\n- Gegenargument: Regeldichte kann abschrecken; Gruppenbeschluss ersetzt keine Rechtsklärung.\n\n### B4 – Autonomie (Bedürfnisse)\n- Text: Bedürfnis nach eigenem Fund und eigenem Weg.\n- Beleg: 1-analytiker.md Bedürfnisse (Annahme); 2-format.md Format 2.\n- Gegenargument: Steht gegen feste Rhythmen und gemeinsame Regeln.\n\n### Ri1 – Monatliche Begehung (Rituale)\n- Rhythmus: monatlich\n- Text: Spurengang mit fester Form (Einführung, Stationen, Abschluss).\n- Beleg: 1-analytiker.md Rituale (Vorschlag); 2-format.md Format 1.\n- Gegenargument: Belege für feste Rhythmen in [1]–[4] nicht vorhanden; starre Rhythmen mindern Spontaneität.\n\n### Ri2 – Wiederbesuch nach festem Abstand (Rituale)\n- Rhythmus: vierteljährlich\n- Text: Dieselbe Wand wird nach festem Abstand erneut dokumentiert, Entscheidung über Verlängerung nach 6 Monaten.\n- Beleg: 1-analytiker.md Rituale (Vorschlag); 2-format.md Format 2.\n- Gegenargument: Rhythmus ist Hypothese; zwischendurch Besuche bleiben erlaubt.\n\n### Ri3 – Archivabend (Rituale)\n- Rhythmus: monatlich\n- Text: Feste Form: Beiträge sammeln, Paar-Prüfung, Schichtschema, Rechte-Runde, Entscheidung über Zeigen.\n- Beleg: 1-analytiker.md Rituale (Vorschlag); 2-format.md Format 3.\n- Gegenargument: Rhythmus ist Hypothese; Raum und Zeit binden Beteiligte.\n\n## Kanten\n\n| ID | Von | Nach | Art der Beziehung, Beleg, Gegenargument |\n|---|---|---|---|\n| E1 | I1 | A1 | Interesse treibt Aktivität an: gemeinsame Schrifterfassung speist die Begehung (1-analytiker.md Interessen [1][2]). |\n| E2 | I2 | A4 | Interesse treibt Aktivität an: Ghost-Sign-Archivierung führt zum Archivabgleich (1-analytiker.md [3][4]). |\n| E3 | I3 | A2 | Interesse treibt Aktivität an: Schichten als Zeitspur verlangen Wiederbesuche (2-format.md Format 2). Gegen: ohne Datierung wenig aussagekräftig. |\n| E4 | I2 | A3 | Interesse treibt Aktivität an: Archivieren braucht Verschlagwortung (2-format.md Format 3). |\n| E5 | Ro1 | A1 | Rolle führt Aktivität aus: Fotografierende nehmen auf der Begehung auf (1-analytiker.md Aktivitäten). |\n| E6 | Ro1 | A2 | Rolle führt Aktivität aus: Fotografierende dokumentieren beim Wiederbesuch (2-format.md Format 2). |\n| E7 | Ro2 | A4 | Rolle führt Aktivität aus: Recherchierende gleichen mit Archiven ab (2-format.md Format 3). |\n| E8 | Ro3 | A3 | Rolle führt Aktivität aus: Archivierende verschlagworten (1-analytiker.md Aktivitäten). |\n| E9 | Ro4 | A1 | Rolle führt Aktivität aus: Wegführende moderieren die Begehung (2-format.md Format 1). |\n| E10 | Ro2 | A2 | Rolle führt Aktivität aus: Datierende beurteilen die Schichtfolge beim Wiederbesuch (2-format.md Format 2). |\n| E11 | A1 | Re1 | Aktivität braucht Ressource: Kamera, Smartphone oder Papierkarte (1-analytiker.md Ressourcen). |\n| E12 | A1 | Re2 | Aktivität braucht Ressource: Rechtswissen zu § 59, § 123, § 303 (1-analytiker.md Ressourcen). |\n| E13 | A2 | Re4 | Aktivität braucht Ressource: Standpunktbeschreibung (2-format.md Format 2). |\n| E14 | A4 | Re3 | Aktivität braucht Ressource: Archivzugang, Karte oder App (1-analytiker.md Ressourcen, [3][4]). |\n| E15 | A3 | Re3 | Aktivität braucht Ressource: Karte oder App und Archiv zum Ordnen (2-format.md Format 3). |\n| E16 | A2 | Re1 | Aktivität braucht Ressource: Kamera oder Smartphone für die Zeitreihe (2-format.md Format 2). |\n| E17 | A4 | B2 | Aktivität bedient Bedürfnis: Archivabgleich macht Funde sichtbar (Annahme, 1-analytiker.md Bedürfnisse). |\n| E18 | A1 | B1 | Aktivität bedient Bedürfnis: gemeinsames Gehen stärkt Zugehörigkeit (Annahme, 2-format.md Format 1). |\n| E19 | A2 | B4 | Aktivität bedient Bedürfnis: eigener Weg zu einer eigenen Wand (Annahme, 2-format.md Format 2). |\n| E20 | Re2 | B3 | Ressource bedient Bedürfnis: klare Regeln geben Sicherheit (Annahme, 1-analytiker.md [5][6][7]). Gegen: Rechtslage für Graffiti offen. |\n| E21 | Ri1 | A1 | Ritual besteht aus Aktivität: die monatliche Begehung ist die wiederkehrende Begehung mit Foto (2-format.md Format 1). |\n| E22 | Ri2 | A2 | Ritual besteht aus Aktivität: der Wiederbesuch wird nach festem Abstand wiederholt (2-format.md Format 2). |\n| E23 | Ri3 | A3 | Ritual besteht aus Aktivität: Verschlagwortung im Archivabend (2-format.md Format 3). |\n| E24 | Ri3 | A4 | Ritual besteht aus Aktivität: Archivabgleich im Archivabend (2-format.md Format 3). |\n| E25 | Ri3 | B2 | Ritual bedient Bedürfnis: der Archivabend macht Funde sichtbar (Annahme, 2-format.md Format 3). |\n| E26 | Ri1 | B1 | Ritual bedient Bedürfnis: wiederkehrende Gruppentreffen für Zugehörigkeit (Annahme, 2-format.md Format 1). |\n| E27 | Ro3 | Ri3 | Rolle führt Ritual aus: Archivierende tragen den Archivabend (2-format.md Format 3). |\n| E28 | Ro4 | Ri1 | Rolle führt Ritual aus: Wegführende leiten die monatliche Begehung (2-format.md Format 1). |\n| E29 | B3 | Ri3 | Bedürfnis prägt Ritual: Rechtsklarheit verlangt die Rechte-Runde im Archivabend (Annahme, 2-format.md Format 3). |\n| E30 | B4 | Ri2 | Bedürfnis prägt Ritual: Autonomie spricht für flexible, kleine Wiederbesuche statt starrer Pflicht (Annahme, 2-format.md Format 2, Risiken). |\n\n## Cluster (typenmischend)\n\n- **K1 – Schrift und Schichten lesen**: I1, I2, I3, A4, Re3\n- **K2 – Spurengang**: Ro1, Ro4, A1, Re1, Re2, Ri1, B1\n- **K3 – Wiederbesuch**: Ro1, Ro2, A2, Re4, Ri2, B4, I3\n- **K4 – Archivabend**: Ro3, Ro2, A3, A4, Ri3, B2, B3, Re3\n\n## Formatzuordnung (2-format.md)\n\n- Format 1 Spurengang: K2 (Ri1, A1, Ro1, Ro4, Re1, Re2, B1, B3)\n- Format 2 Wiederbesuch: K3 (Ri2, A2, Ro1, Ro2, Re4, B4, B2)\n- Format 3 Archivabend: K4 (Ri3, A3, A4, Ro3, Ro2, Re3, B2, B3)\n\n## Bilder\n\n- `bilder/dresden_wandbild_baugrube_2019_2020.jpg`: Zeigt dasselbe gemalte Wandbild in Dresden 2019 und 2020 und belegt, dass dieselbe Wand sich zwischen Besuchen verändert (A2, I2); belegt nicht die Wirkung der Formate. Quelle: https://commons.wikimedia.org/wiki/File:2019071302_Vergleich_Graffitti_aufgemalte_Fenster_und_Baugrube_Henrici-_Ecke_Teichstrasse_07-2019-03-2020.jpg, VSchagow, CC BY-SA 4.0\n- `bilder/saarbruecken_hall_of_fame_4560.jpg`: Zeigt eine legale Graffiti-Fläche (Hall of Fame 4560) in Saarbrücken als aktive Wandschicht an einem erlaubten Ort (I3, A1, Re2); belegt das Phänomen, nicht lokale Gruppenverhältnisse. Quelle: https://commons.wikimedia.org/wiki/File:20210809_Graffiti_Hall-of-Fame_4560_01.jpg, Flocci Nivis, CC BY 4.0\n\n## Grenzen und offene Fragen\n\n- Nicht als Knoten modelliert (nur Fragen der Vorarbeit): wer B-Fälle klärt und wie Widerspruch läuft, wer Format 2 verlängert oder beendet, welche interne Ablage gilt.\n- Ungeprüft: alle Quellen [1]–[7]; Auslegung von § 59 UrhG bei übermalten Graffiti; Genehmigungen für Privatgrund (Ressource nicht belegt, daher kein Knoten).\n- Bedürfnis-Kanten (E17–E20, E25, E26, E29, E30) sind Annahmen der Vorarbeit.\n- Die zwei Bilder stammen aus Wikimedia Commons und kamen schon im alten lauf1 vor, nicht in bilder.md von lauf8.\n", "geliefert": true}, {"datei": "4-emotionen.md", "rolle": "Emotions-Kurator", "text": "# Emotionale Klickinhalte – lauf8 (Katalog lauf8/katalog.json)\n\n## C1 Gemeinsam unterwegs, nicht allein vor der Wand\n**Katalog-IDs:** B1, A1, Ri1, Ro4, E18, E26, K2\n\n**Eindruck:** Warme, wache Verbundenheit: Man geht im Takt der Gruppe, spricht über dieselbe Wand und fühlt sich dabei als Teil von etwas. Fehlt dies, entsteht das Gefühl, nur Zuschauer zu sein. Gefühlswörter sind Interpretation.\n\n**Beleg:** B1 (Zugehörigkeit) wird laut E18 von der Begehung (A1) und laut E26 vom monatlichen Ritual (Ri1) bedient, das Wegführende (Ro4, E28) leiten. Beide Kanten sind im Katalog als Annahme markiert.\n\n**Prüfung und Gegenargumente:** Alternative 'Leistungsdruck' (viele Funde) widerspricht der festen, kleinen Form von Ri1. Alternative 'Gruppenzwang' wird durch B4 und E30 gebremst. Wirkung ist Annahme, nicht belegt.\n\n## C2 Der eigene Fund bekommt einen Platz\n**Katalog-IDs:** B2, Ri3, A4, Ro3, E17, E25, E27, K4\n\n**Eindruck:** Stilles Stolzgefühl: Ein Fund, der im Archivabend gezeigt und beim Archivabgleich eingeordnet wird, fühlt sich gesehen an. Bleibt er unbeachtet, entsteht leise Enttäuschung.\n\n**Beleg:** B2 (Anerkennung) wird nach E17 durch den Archivabgleich (A4) und nach E25 durch den Archivabend (Ri3) bedient; die Archivierenden (Ro3) tragen ihn (E27). Alle als Annahme markiert.\n\n**Prüfung und Gegenargumente:** Alternative 'Wettbewerb um Likes' passt nicht: Ri3 enthält Paar-Prüfung und Entscheidung über Zeigen, kein Ranking. Alternative 'Anonymität' würde B2 verletzen. Wirkung ist Annahme.\n\n## C3 Aufatmen durch klare Regeln\n**Katalog-IDs:** B3, Re2, Ri3, A1, E12, E20, E29, K4\n\n**Eindruck:** Ruhige Erleichterung: Wer weiß, was fotografiert, betreten und gezeigt werden darf, kann entspannt hinschauen. Unklarheit erzeugt Anspannung an jeder Hauswand.\n\n**Beleg:** B3 (Sicherheit) wird nach E20 durch das Rechtswissen (Re2) bedient, das die Begehung braucht (E12); E29 begründet die Rechte-Runde im Archivabend (Ri3).\n\n**Prüfung und Gegenargumente:** Alternative 'Abenteuerlust ohne Regeln' widerspricht E20, E29. Gegen den Eindruck spricht E20 selbst: 'Rechtslage für Graffiti offen', Sicherheit bleibt begrenzt. Keine Rechtsberatung.\n\n## C4 Eigener Weg, eigene Wand, eigenes Tempo\n**Katalog-IDs:** B4, A2, Ri2, Re4, E19, E30, K3\n\n**Eindruck:** Gelassene Freiheit: Eine selbst gewählte Wand, die man nach festem Abstand wieder besucht, fühlt sich nach eigener Entdeckung an, nicht nach Pflicht. Starre Vorgaben würden Druck erzeugen.\n\n**Beleg:** B4 (Autonomie) wird nach E19 durch den Wiederbesuch (A2) bedient; E30 prägt das Ritual (Ri2) flexibel; Re4 gibt Orientierung (E13).\n\n**Prüfung und Gegenargumente:** Alternative 'Verpflichtung/Pflichtgefühl' widerspricht E30. Alternative 'Einsamkeit' wird durch das Gruppenritual (C1, B1) ausgeglichen. Beides Annahmen aus dem Katalog.\n\n## C5 Staunen über Schichten und Geisterschrift\n**Katalog-IDs:** I3, I2, Ro2, A4, E3, E7, K1\n\n**Eindruck:** Neugieriges Staunen mit Fragezeichen: Überlagerungen als Zeitachse lesen und halb lesbare Wandwerbung im Archiv wiederfinden, ohne vorzugeben, alles zu wissen.\n\n**Beleg:** I3 (Graffiti-Schichten als Zeitspur) verlangt laut E3 Wiederbesuche; Datierende (Ro2) gleichen laut E7 mit Archiven ab (A4). Bild lissabon_lx_factory_schichten.jpg (Wikimedia Commons, CC BY 4.0) zeigt Schichtung als Phänomen.\n\n**Prüfung und Gegenargumente:** Alternative 'Nostalgie/Wehmut' passt nicht zum prüfenden Abgleich (A4). E3 warnt: ohne Datierung wenig aussagekräftig, daher Unsicherheit statt Gewissheit. Wirkung nicht belegt.\n\n## Stimmung\nNeugierig-experimentell mit warmer Verbundenheit und behutsamer Zurückhaltung. Begründung: B1 bis B4 bekommen je einen Eindruck (C1 bis C4), C5 bündelt das Staunen der Interessen I2 und I3. Gegen 'leistungsorientiert' sprechen Ri1 und E30, gegen 'streng-juristisch' die offene Rechtslage (E20). Die Gefühlswörter sind Interpretation; viele Kanten sind im Katalog als Annahme markiert. Keine externe Recherche (Zeitbudget 120 s).\n\n## Bild\n- bilder/lissabon_lx_factory_schichten.jpg (C5), Quelle in bilder.json\n", "geliefert": true}, {"datei": "5-simulation.md", "rolle": "Simulations-Choreograph", "text": "# Simulation lauf8: Urbane Spurensuche (alle sechs Knotentypen)\n\nKatalogfassung: lauf8/katalog.json (aktuell). Phasen sind kumulativ; eine Kante ist nur sichtbar, wenn beide Enden sichtbar sind, ein Cluster nur, wenn alle seine Knoten sichtbar sind.\n\n## P1 Schrift und Schichten sehen\nSichtbar: I1, I2, I3, Ro1, Ro4, A1, Re1, E1, E5, E9, E11\n\nDie Gruppe tritt zusammen: die Interessen I1 (Schrift im Stadtraum gemeinsam erfassen), I2 (Ghost Signs archivieren) und I3 (Graffiti-Schichten als Zeitspur) blenden ein, dazu die Rollen Ro1 (Fotografierende) und Ro4 (Wegführende), die Aktivität A1 (Begehung mit Foto) und die Ressource Re1 (Kamera, Smartphone oder Papierkarte). E1, E5, E9 und E11 zeigen, wer die Begehung trägt und womit.\n\n## P2 Spurengang mit festem Rhythmus und Rechtswissen\nSichtbar: I1, I2, I3, Ro1, Ro4, A1, Re1, Re2, Ri1, B1, B3, E1, E5, E9, E11, E12, E18, E20, E21, E26, E28, K2\n\nDas Ritual Ri1 (Monatliche Begehung) macht die Begehung regelmäßig; es verbindet sich über E21 mit A1 und über E28 mit Ro4. Das Bedürfnis B1 (Zugehörigkeit) entsteht über E18 und E26. Die Ressource Re2 (Rechtswissen) und das Bedürfnis B3 (Sicherheit) erscheinen über E12 und E20 in Warnfarbe: Rechte sind früh sichtbar, noch vor jedem Archiv. K2 (Spurengang) legt sich als Hülle um seine sieben Elemente.\n\n## P3 Wiederbesuch derselben Wand\nSichtbar: I1, I2, I3, Ro1, Ro4, A1, Re1, Re2, Ri1, B1, B3, Ro2, A2, Re4, Ri2, B4, E1, E3, E5, E6, E9, E10, E11, E12, E13, E16, E18, E19, E20, E21, E22, E26, E28, E30, K2, K3\n\nDie Rolle Ro2 (Datierende und Recherchierende), die Aktivität A2 (Wiederbesuch derselben Wand), die Ressource Re4 (Standpunktbeschreibung in Worten), das Ritual Ri2 (Wiederbesuch nach festem Abstand) und das Bedürfnis B4 (Autonomie) erscheinen. E3 verbindet I3 mit A2, E6 und E10 zeigen, wer wiederbesucht, E13 und E16 die Hilfsmittel, E22 den festen Abstand, E19 und E30 die Autonomie. K3 (Wiederbesuch) wird vollständig.\n\n## P4 Archivabend und Abgleich\nSichtbar: I1, I2, I3, Ro1, Ro4, A1, Re1, Re2, Ri1, B1, B3, Ro2, A2, Re4, Ri2, B4, A3, A4, Re3, Ro3, B2, Ri3, E1, E2, E3, E4, E5, E6, E7, E8, E9, E10, E11, E12, E13, E14, E15, E16, E17, E18, E19, E20, E21, E22, E23, E24, E25, E26, E27, E28, E29, E30, K1, K2, K3, K4\n\nZuletzt kommen Archivierende (Ro3), Verschlagwortung (A3), Abgleich mit Archiven (A4), Archivzugang und Karte oder App (Re3), das Bedürfnis Anerkennung (B2) und das Ritual Archivabend (Ri3). E2, E4, E7, E8, E14, E15, E17 und E23 bis E25 verbinden Interessen, Rollen, Aktivitäten und Ressourcen mit dem Archivabend; E27 und E29 (Warnfarbe) binden Archivierende und Rechtssicherheit an Ri3. K1 (Schrift und Schichten lesen) und K4 (Archivabend) werden vollständig. Endzustand: alle Katalogelemente sind sichtbar.\n\n## Prüfung, Risiken, Alternativen\nPrüfung: Die Abfolge geht von Sehen (P1) über Rhythmus und Recht (P2) und Wiederbesuch (P3) zum Archiv (P4). Rechte (Re2, B3) stehen damit vor Verschlagwortung (A3) und Archivabend (Ri3). Genutzt werden alle sechs Knotentypen: Interessen, Rollen, Aktivitäten, Ressourcen, Bedürfnisse und Rituale.\n\nRisiken: (1) P4 bringt sechs Knoten und zwölf Kanten auf einmal und ist überladen. (2) Der Wiederbesuch kommt erst in P3; der Zeitbezug von I3 ist bis dahin nur angedeutet. (3) Ro2 (Datierende) erscheint erst in P3, obwohl der Abgleich mit Archiven (A4) in P4 schon Datierung braucht; die Abfolge ist dort knapp. (4) B2 (Anerkennung) steht erst am Ende, Newcomer könnten Beteiligung vorher als Pflicht erleben.\n\nAlternativen: P4 teilen (zuerst A3, Ro3, Re3, dann A4, B2, Ri3); Ro2 schon in P1 zeigen; Ri3 vor P3 ziehen und den Wiederbesuch nach dem ersten Archivabend zeigen; Re2 und B3 sogar schon in P1.\n\nTechnik: Knoten blenden mit Skalierung 0,6 zu 1 in etwa 400 ms ein, Kanten zeichnen sich als Strichlinie in etwa 600 ms, Cluster als Hülle mit Deckkraft 0,15, Warnfarbe bei E12, E20, E29, Automatik etwa 4 s je Phase. Phasen sind kumulativ. Keine zusätzliche Recherche wegen des Zeitbudgets von 120 s; Quellen stehen im Katalog und in bilder.json.\n\n## Bild\n- trier_hochstetter_werbung.jpg: verblasste Giebelwerbung in Trier, Beispiel für I2.\n", "geliefert": true}, {"datei": "6-gesamtdokument.md", "rolle": "Master-Koordinator (Gesamtdokument)", "text": "# Gesamtdokument lauf8 – Urbane Spurensuche (alle sechs Knotentypen)\n\nIntegration der geprüften Rollenergebnisse ohne neue Inhalte.\n\n## Interessen-Analyse\n\n## lauf8 – Interessen-Analyse: Urbane Spurensuche\n\n**Interessen-Set:** „Urbane Spurensuche – Gemeinsames Dokumentieren von Graffiti-Schichten und verblassten Wandinschriften in der Stadt“. **Knotentypen:** Interessen, Rollen, Aktivitäten, Ressourcen, Bedürfnisse, Rituale.\n\n### Erkenntnisgrenzen\nBudget 2 Minuten. Die Quellen [1]–[7] wurden am 09.11.2026 (lauf3) geprüft und jetzt nicht neu abgerufen. Alles Lokale sind Hypothesen. Was nicht belegbar ist, ist so markiert.\n\n### Interessen\n- Schrift im Stadtraum gemeinsam erfassen: INGRID [1], Lingscape [2].\n- Verblasste Wandwerbung („Ghost Signs“) archivieren: HAT [3], ghostsigns.de [4].\n- Graffiti-Schichten als Zeitspur. *Gegenargument:* Fotos belegen nur den Aufnahmezeitpunkt, Schichten sind ohne Datierung schwer zu ordnen.\n\n### Rollen\n- Fotografierende, Datierende/Recherchierende, Archivierende, Wegführende (Begehungen). Belegt ist Beteiligung vieler bei [2][3][4]; die konkrete Rollenaufteilung ist **nicht belegt**, sie ist ein Vorschlag. *Gegenargument:* Beteiligung ist oft ungleich verteilt.\n\n### Aktivitäten\n- Begehung mit Foto, Wiederbesuch derselben Wand, Verschlagwortung, Abgleich mit Archiven [3][4]. Beziehung: Rolle Fotografierende führt Begehung aus; Archivierende führen Verschlagwortung aus.\n\n### Ressourcen\n- Kamera/Smartphone, Karte oder App [2], Archivzugang [3][4], Wissen zu Recht: Foto im öffentlichen Raum grundsätzlich zulässig [5], Betreten befriedeter Flächen kann strafbar sein [6], Übermalen ist Sachbeschädigung [7]. Genehmigungen für Privatgrund sind **nicht belegt**, sie müssen im Einzelfall geklärt werden. Beziehung: Begehung braucht Kamera und Rechtswissen.\n\n### Bedürfnisse (nur Bedürfnisse, keine Emotionen)\n- Zugehörigkeit (gemeinsame Sammlung), Anerkennung (Fund wird sichtbar), Sicherheit (Rechtsklarheit [5][6][7]), Autonomie (eigener Fund, eigener Weg). Direkte Belege für diese Bedürfnisse in der Szene fehlen; es sind **begründete Annahmen**. Beziehung: Archivabgleich bedient Anerkennung; klare Regeln bedienen Sicherheit.\n\n### Rituale\n- Monatliche Begehung (**rhythmus: monatlich**, Vorschlag), Wiederbesuch derselben Wand nach festem Abstand (**rhythmus: vierteljährlich**, Vorschlag), Archivabend (**rhythmus: monatlich**). Belege für feste Rhythmen in [1]–[4] **nicht vorhanden**; alle Rhythmen sind Hypothesen. *Gegenargument:* Zu starre Rhythmen können die Spontaneität des Fundes mindern.\n\n### Muster und Spannungen\n- Schicht als Zeitachse; Vergänglichkeit als Motor; Kunst gegenüber Recht [6][7]; Bewahren gegenüber Respekt vor dem Vergehen; offene Veröffentlichung gegenüber Ortsschutz [5].\n\n### Bilder\nZwei Ghost Signs aus Wikimedia Commons (CC BY-SA 4.0, Details in bilder.json): Tottenham (London) und Poznań. Sie belegen das Phänomen, nicht lokale Verhältnisse.\n\n### Offene Fragen\n- **Beziehungs-Architekt:** Welche Kanten zwischen Rollen, Aktivitäten, Ressourcen und Bedürfnissen sind zulässig?\n- **Emotions-Kurator:** Wie wirkt Vergänglichkeit emotional, ohne Illegalität zu romantisieren?\n- **Simulations-Choreograph:** Wie entwickelt sich eine Wand über mehrere Wiederbesuche?\n- **Format-Entwerfer:** Welche Formate tragen die Rituale ohne Eingriff in die Wand?\n- **Master-Koordinator:** Soll eine spätere Runde lokale Quellen und Rechtsprüfung nachholen?\n\n### Quellenverzeichnis\n1. [INGRID](https://www.uni-paderborn.de/forschungsprojekte/ingrid)\n2. [Lingscape](https://lingscape.app/about.html)\n3. [HAT Ghost Signs](https://www.hatads.org.uk/catalogue/ghostsigns.aspx)\n4. [ghostsigns.de](https://ghostsigns.de/about/)\n5. [§ 59 UrhG](https://www.gesetze-im-internet.de/urhg/__59.html)\n6. [§ 123 StGB](https://www.gesetze-im-internet.de/stgb/__123.html)\n7. [§ 303 StGB](https://www.gesetze-im-internet.de/stgb/__303.html)\n\n## Formate\n\n## lauf8 – Format-Entwurf: Urbane Spurensuche\n\n**Rolle:** Format-Entwerfer | **Lauf:** lauf8 | **attempt:** format-v1-26522ee6\n**Knotentypen:** Interessen, Rollen, Aktivitäten, Ressourcen, Bedürfnisse, Rituale\n**Interessen-Set:** „Urbane Spurensuche – Gemeinsames Dokumentieren von Graffiti-Schichten und verblassten Wandinschriften in der Stadt“\n**Vorarbeit:** `1-analytiker.md` (lauf8) und `bilder.md` gelesen. **Eigene Bilder:** 1 (Abschnitt 5).\n\n**Erkenntnisgrenzen:** Zeitbudget 2 Minuten. Ich habe keine Quelle neu abgerufen; [1]–[7] stammen aus der Vorarbeit (Prüfung in lauf3) und sind hier **nicht live geprüft**. **[Entwurf]** kennzeichnet meine Vorschläge, keine belegte Wirkung.\n**Knoten-IDs:** Die Vorarbeit enthält **keine Knoten-IDs**. Ich erfinde keine und verweise auf Knoten mit Typ und Namen aus der Vorarbeit, z. B. *Aktivität „Begehung“*. Der Beziehungs-Architekt kann die IDs vergeben.\n\n### 1. Kritische Prüfung der Vorarbeit\n- Die Quellen [1]–[4] belegen Interesse und Beteiligung vieler beim Erfassen von Schrift und Ghost Signs, aber **keine Rollenaufteilung, keine Bedürfnisse und keine Rhythmen**. Das stellt die Vorarbeit selbst klar; ich übernehme es: Rollen, Bedürfnisse und Rhythmen sind Annahmen.\n- „Foto im öffentlichen Raum grundsätzlich zulässig“ [5] ist zu glatt: § 59 UrhG betrifft *bleibende* Werke an öffentlichen Wegen; für kurzlebige oder übermalte Graffiti ist das offen. Aufnahme, interne Ablage und Veröffentlichung sind getrennt zu klären.\n- Die vorgeschlagene Rolle „Wegführende“ ist als Moderation gedacht, nicht als Hierarchie (Gegenargument der Vorarbeit: Beteiligung ist ungleich verteilt).\n- Lingscape [2] bietet laut Vorarbeit keine belegte private Ablage; es dient nicht als interne Ablage.\n\n### 2. Gemeinsames Minimum und Rechte-Stufen [Entwurf]\nJe Beobachtung: Zeit (grob), grober Ort (Straße oder Viertel, keine Koordinaten als Standard), Beobachtung „was liegt über was“, Sicherheit (sicher/vermutet/unklar), Rechte-Stufe. **A** geklärt (Fotoerlaubnis, Werkrechte, Personen- und Ortsschutz); **B** ungeklärt, dann nur Textnotiz oder Skizze, kein Foto; **C** nicht dokumentieren (erkennbare Personen, private Bereiche). Ein Gruppenbeschluss ersetzt keine Rechtsklärung. Papierkarte und App sind gleichwertig.\n\n### 3. Formate\nJedes Format verbindet die Typen so: *wer* (Rolle) tut *was* (Aktivität) mit *welchen Mitteln* (Ressource) für *welches Bedürfnis* in *welchem Ritual*.\n\n#### Format 1 – Spurengang\n- **Interessen:** Schrift im Stadtraum gemeinsam erfassen; Ghost Signs archivieren; Graffiti-Schichten als Zeitspur.\n- **Rollen:** Wegführende (moderiert, wechselnd), Fotografierende, Datierende/Recherchierende.\n- **Aktivität:** Begehung mit Foto. **Ressourcen:** Kamera/Smartphone oder Papierkarte, Rechtswissen (§ 59, § 123, § 303 [5][6][7]).\n- **Bedürfnisse (Annahme):** Zugehörigkeit, Sicherheit durch klare Regeln. **Ritual:** monatliche Begehung (Rhythmus ist Vorschlag).\n- **Ablauf [Entwurf], ca. 120 Min.:** 15 Min. Einführung („nur schauen, nicht berühren, nicht betreten“); Rundweg von etwa 1,2 km auf barrierearmen öffentlichen Wegen mit 4 vorab gesichteten Stationen; je Station 12 Min. gemeinsam beschreiben, dann notieren; 20 Min. Abschluss mit offenen Fragen und vorläufigen Stufen; Puffer.\n- **Ergebnis:** Textnotizen nach Minimum, Fotos nur bei Stufe A.\n- **Risiken → Gegenmaßnahmen:** Konflikt mit Anwohnenden → kurze Halte, Gehwegregel; Betreten befriedeter Flächen → Route nur auf öffentlichen Wegen; Romantisierung von Illegalität → Dokumentieren heißt nicht billigen.\n- **Alternative:** Sitzstationen an zwei öffentlichen Orten; sinnvoll bei Mobilitätsgrenzen, nicht wetterfest.\n\n#### Format 2 – Wiederbesuch\n- **Interessen:** Graffiti-Schichten als Zeitspur; Vergänglichkeit.\n- **Rollen:** Fotografierende, Datierende/Recherchierende. **Aktivität:** Wiederbesuch derselben Wand. **Ressourcen:** Kamera/Smartphone, Standpunktbeschreibung in Worten.\n- **Bedürfnisse (Annahme):** Autonomie (eigener Fund, eigener Weg), Anerkennung. **Ritual:** Wiederbesuch nach festem Abstand, vierteljährlich als Vorschlag; Frist nach 6 Monaten, dann ausdrückliche Entscheidung über Verlängerung.\n- **Ablauf [Entwurf]:** höchstens 10 unproblematische Wände; Standpunkt beschreiben („gegenüberliegender Gehweg, Laternenmast 2“); nur von Hand fotografieren, **keine fest installierten Kameras**; Fokus auf die Wand, nicht auf Personen.\n- **Ergebnis:** Zeitreihe je Wand, Foto nur bei Stufe A, sonst Text und Skizze.\n- **Risiken → Gegenmaßnahmen:** wirkt wie Überwachung einer Szene → Frist, keine Personenbilder, Ortsauswahl begründen; Ermüdung → kleines Kontingent; starre Rhythmen mindern Spontaneität → Wiederbesuch auch zwischendurch erlaubt.\n- **Alternative:** einmalige Vorher-Nachher-Dokumentation bei angekündigter Sanierung.\n\n#### Format 3 – Archivabend\n- **Interessen:** Ghost Signs archivieren; Schrift gemeinsam erfassen.\n- **Rollen:** Archivierende, Datierende/Recherchierende, wechselnd Wegführende. **Aktivitäten:** Verschlagwortung, Abgleich mit Archiven [3][4]. **Ressourcen:** Archivzugang [3][4], Karte oder App [2], Papierkarten.\n- **Bedürfnisse (Annahme):** Anerkennung (Fund wird sichtbar), Sicherheit (Rechtsklarheit), Zugehörigkeit. **Ritual:** monatlicher Archivabend (Vorschlag).\n- **Ablauf [Entwurf], ca. 2 Std., barrierefreier Raum:** Beiträge sammeln; Paar-Prüfung gegen das Minimum; Schichtschema zeichnen (unten nach oben) mit markierter Unsicherheit; Rechte-Runde nur für den Klärungsweg von B-Fällen; Entscheidung, was wo gezeigt wird.\n- **Ergebnis:** geprüfte Beobachtungen, Schichtschemata, Liste geklärter und ungeklärter Rechtefälle.\n- **Risiken → Gegenmaßnahmen:** hierarchische Auswahl → Paar-Prüfung, dokumentierte Kriterien, Widerspruch; ungeklärtes „rutscht“ in die Veröffentlichung → Standard ist Zurückhaltung; Überforderung → nur fünf Minimumfelder verpflichtend.\n- **Alternative:** asynchrone Prüfrunde an Textnotizen, mit analoger Abgabestelle.\n\n### 4. Prinzipien [Entwurf]\n1. Dokumentieren, nie verändern (kein Berühren oder Übermalen; Grenze § 303 StGB [7]).\n2. Öffentlicher Blick, kein Betreten (§ 123 StGB [6]); Augenhöhe, keine Leitern, keine Drohnen (praktische Regel, keine Rechtsauslegung).\n3. Zurückhaltung bei ungeklärten Rechten: Textnotiz statt Foto.\n4. Orte grob statt genau; Wand statt Mensch.\n5. Analoger und digitaler Beitrag sind gleichwertig; Rollen wechseln.\n6. Unsicherheit sichtbar machen.\n7. Dokumentieren heißt nicht billigen; die Gruppe klärt das ausdrücklich.\n\n**Messgrößen ohne Zielwerte:** Anteil Beobachtungen mit vollständigem Minimum; Verteilung auf A/B/C; Anteil analoger Beiträge; geplante gegenüber erfolgten Wiederbesuchen; Konflikte und deren Bearbeitung.\n\n### 5. Bild\n![Graffitimauer im Stadtpark Lichtenberg, Berlin](bilder/berlin_graffitimauer_lichtenberg.jpg)\nGraffiti-bedeckte Mauer (Singlespeedfahrer, CC0, [Wikimedia Commons](https://commons.wikimedia.org/wiki/File:Graffitimauer_Stadtpark_Lichtenberg_Berlin.jpg)): aktive, überlagerte Schichten, wie sie Format 2 und 3 festhalten. Die zwei Analytiker-Bilder zeigen nur verblasste Wandwerbung. Das Bild belegt das Phänomen, nicht lokale Verhältnisse und nicht die Wirkung der Formate.\n\n### 6. Offene Fragen an den Beziehungs-Architekten (nur Fragen)\n- Welche IDs tragen die Knoten (die Vorarbeit liefert keine), und welche Kanten zwischen Rolle, Aktivität, Ressource, Bedürfnis und Ritual sind zulässig?\n- Wer dokumentiert die Klärung eines B-Falls, und wie läuft ein Widerspruch?\n- Wer entscheidet über Verlängerung oder Ende von Format 2?\n\n### 7. Quellen (aus der Vorarbeit, nicht neu abgerufen)\n[1] [INGRID](https://www.uni-paderborn.de/forschungsprojekte/ingrid) · [2] [Lingscape](https://lingscape.app/about.html) · [3] [HAT Ghost Signs](https://www.hatads.org.uk/catalogue/ghostsigns.aspx) · [4] [ghostsigns.de](https://ghostsigns.de/about/) · [5] [§ 59 UrhG](https://www.gesetze-im-internet.de/urhg/__59.html) · [6] [§ 123 StGB](https://www.gesetze-im-internet.de/stgb/__123.html) · [7] [§ 303 StGB](https://www.gesetze-im-internet.de/stgb/__303.html)\n\n## Katalog (Knoten nach Typ, Kanten, Cluster)\n\nlauf8 – Ergebnis Beziehungs-Architekt\n\nLaufname: lauf8 · attempt_id: architektur-v1-b9c52eaa · Bildgrenze: Min 1, Max 2 (genutzt: 2)\nKnotentypen: Interessen, Rollen, Aktivitäten, Ressourcen, Bedürfnisse, Rituale (alle sechs modelliert; jeder Typ ist durch die Vorarbeiten getragen). Set: Urbane Spurensuche – Gemeinsames Dokumentieren von Graffiti-Schichten und verblassten Wandinschriften in der Stadt\n\nQuellenbezug: nur lauf8/1-analytiker.md und lauf8/2-format.md (Quellen [1]–[7] dort, in lauf3 geprüft, hier nicht neu abgerufen; Zeitbudget 2×2 Minuten, keine eigene Recherche). Rollen, Bedürfnisse und Rhythmen sind laut Vorarbeit Annahmen oder Vorschläge, keine belegte Wirkung. Rechtliches nur als Orientierung, keine Rechtsberatung. Antwort auf die IDs-Frage des Format-Entwerfers: Vorsilben I, Ro, A, Re, B, Ri; die IDs stehen unten.\n\n### Knoten\n\n#### I1 – Schrift im Stadtraum gemeinsam erfassen (Interessen)\n- Text: Interesse an gemeinsamer Erfassung von Schrift im Stadtraum.\n- Beleg: 1-analytiker.md Interessen, Quellen [1] INGRID, [2] Lingscape.\n- Gegenargument: INGRID ist ein Forschungsprojekt, Lingscape hat keine belegte private Ablage; beide tragen nur das Interesse, kein Format (2-format.md Abschnitt 1).\n\n#### I2 – Verblasste Wandwerbung (Ghost Signs) archivieren (Interessen)\n- Text: Interesse, verblasste handgemalte Wandwerbung zu sammeln und zu archivieren.\n- Beleg: 1-analytiker.md Interessen, Quellen [3] HAT, [4] ghostsigns.de; Bild dresden_wandbild_baugrube_2019_2020.jpg zeigt eine vergehende Wandfläche.\n- Gegenargument: Bilder und Quellen stammen aus Fremdarchiven, keine lokale Empirie.\n\n#### I3 – Graffiti-Schichten als Zeitspur (Interessen)\n- Text: Interesse, überlagerte Graffiti-Schichten als Zeitachse zu lesen.\n- Beleg: 1-analytiker.md Interessen und Muster; 2-format.md Format 1 und 2.\n- Gegenargument: Fotos belegen nur den Aufnahmezeitpunkt, Schichten sind ohne Datierung schwer zu ordnen (1-analytiker.md).\n\n#### Ro1 – Fotografierende (Rollen)\n- Text: Funktion in Spurengang und Wiederbesuch: Wand und Beobachtung aufnehmen, Fotos nur bei Rechte-Stufe A.\n- Beleg: 1-analytiker.md Rollen (Vorschlag); 2-format.md Format 1 und 2; Beteiligung vieler belegt in [2][3][4], die Rollenaufteilung selbst nicht (Annahme, nicht belegt).\n- Gegenargument: Beteiligung ist ungleich verteilt, wenige tragen die Arbeit.\n\n#### Ro2 – Datierende und Recherchierende (Rollen)\n- Text: Funktion: Alter und Reihenfolge der Schichten einschätzen, Wandschrift mit Archiven abgleichen.\n- Beleg: 1-analytiker.md Rollen, Aktivitäten (Archivabgleich [3][4]); 2-format.md Format 1 bis 3.\n- Gegenargument: Datierung bleibt oft vermutet; die Rolle erzeugt Scheinsicherheit, wenn die Sicherheitsstufe fehlt.\n\n#### Ro3 – Archivierende (Rollen)\n- Text: Funktion: Beiträge verschlagworten, ordnen und im Archivabend vorlegen.\n- Beleg: 1-analytiker.md Rollen und Aktivitäten (Verschlagwortung); 2-format.md Format 3.\n- Gegenargument: Wer archiviert, bestimmt, was sichtbar wird; hierarchische Auswahl möglich (2-format.md Format 3, Risiken).\n\n#### Ro4 – Wegführende (Moderation) (Rollen)\n- Text: Wechselnde Funktion: Spurengang moderieren, Regeln nennen, Haltezeiten einhalten.\n- Beleg: 1-analytiker.md Rollen; 2-format.md Abschnitt 1 (Moderation, keine Hierarchie), Format 1.\n- Gegenargument: Kann trotz Wechsel zur informellen Leitung werden.\n\n#### A1 – Begehung mit Foto (Aktivitäten)\n- Text: Gemeinsames Gehen von etwa vier vorab gesichteten Stationen mit Beschreiben, Notieren und Foto nur bei Stufe A.\n- Beleg: 1-analytiker.md Aktivitäten; 2-format.md Format 1 (ca. 120 Min., 12 Min. je Station).\n- Gegenargument: Konflikt mit Anwohnenden und Mobilitätsgrenzen; Wirkung nicht belegt.\n\n#### A2 – Wiederbesuch derselben Wand (Aktivitäten)\n- Text: Dieselbe Wand vom beschriebenen Standpunkt erneut dokumentieren, höchstens zehn Wände, Frist sechs Monate.\n- Beleg: 1-analytiker.md Aktivitäten; 2-format.md Format 2; Bild dresden_wandbild_baugrube_2019_2020.jpg zeigt denselben Ort 2019 und 2020.\n- Gegenargument: Wirkt wie Überwachung einer Szene; Ermüdung (2-format.md Format 2, Risiken).\n\n#### A3 – Verschlagwortung (Aktivitäten)\n- Text: Beobachtungen mit Schlagworten und Sicherheitsstufe versehen und ordnen.\n- Beleg: 1-analytiker.md Aktivitäten; 2-format.md Format 3.\n- Gegenargument: Kann Einsteiger überfordern (2-format.md: nur fünf Minimumfelder verpflichtend).\n\n#### A4 – Abgleich mit Archiven (Aktivitäten)\n- Text: Funde mit HAT und ghostsigns.de vergleichen.\n- Beleg: 1-analytiker.md Aktivitäten, Quellen [3][4]; 2-format.md Format 3.\n- Gegenargument: Quellen nicht neu abgerufen; Archivzugang nur als Vorschlag nutzbar.\n\n#### Re1 – Kamera, Smartphone oder Papierkarte (Ressourcen)\n- Text: Mittel zum Aufnehmen und Verorten; Papierkarte und App sind gleichwertig.\n- Beleg: 1-analytiker.md Ressourcen; 2-format.md Abschnitt 2 und Prinzip 5.\n- Gegenargument: Nicht alle haben ein Smartphone; Papier erschwert die Weitergabe.\n\n#### Re2 – Rechtswissen zu Foto, Betreten und Übermalen (Ressourcen)\n- Text: Wissen: Foto im öffentlichen Raum grundsätzlich zulässig nach § 59 UrhG, Betreten befriedeter Flächen kann strafbar sein (§ 123 StGB), Übermalen ist Sachbeschädigung (§ 303 StGB).\n- Beleg: 1-analytiker.md Ressourcen, Quellen [5][6][7]; 2-format.md Abschnitt 1 und 2.\n- Gegenargument: Die Vorarbeit selbst nennt § 59 UrhG zu glatt: für kurzlebige oder übermalte Graffiti offen; keine Rechtsberatung, Quellen nicht neu abgerufen.\n\n#### Re3 – Archivzugang und Karte oder App (Ressourcen)\n- Text: Zugang zu HAT und ghostsigns.de sowie Karte oder App zum Abgleich und Verorten.\n- Beleg: 1-analytiker.md Ressourcen, Quellen [2][3][4]; 2-format.md Format 3.\n- Gegenargument: Lingscape bietet laut Vorarbeit keine belegte private Ablage; interne Ablage offen.\n\n#### Re4 – Standpunktbeschreibung in Worten (Ressourcen)\n- Text: Schriftliche Angabe, von wo die Wand aufgenommen wird, zum erneuten Auffinden.\n- Beleg: 2-format.md Format 2 (z. B. gegenüberliegender Gehweg, Laternenmast 2) [Entwurf].\n- Gegenargument: Beschreibungen veralten, wenn sich die Umgebung ändert.\n\n#### B1 – Zugehörigkeit (Bedürfnisse)\n- Text: Bedürfnis nach gemeinsamer Sammlung und Gruppe.\n- Beleg: 1-analytiker.md Bedürfnisse (begründete Annahme, direkter Beleg fehlt); 2-format.md Format 1 und 3.\n- Gegenargument: Keine Belege aus der Szene; Beteiligung ungleich verteilt.\n\n#### B2 – Anerkennung (Bedürfnisse)\n- Text: Bedürfnis, dass ein Fund sichtbar wird und gewürdigt wird.\n- Beleg: 1-analytiker.md Bedürfnisse (Annahme); 2-format.md Format 2 und 3.\n- Gegenargument: Sichtbarkeit kollidiert mit Orts- und Urheberschutz.\n\n#### B3 – Sicherheit (Rechtsklarheit) (Bedürfnisse)\n- Text: Bedürfnis nach klaren Regeln, was erlaubt ist.\n- Beleg: 1-analytiker.md Bedürfnisse, Quellen [5][6][7] (Annahme); 2-format.md Abschnitt 2 und Format 1, 3.\n- Gegenargument: Regeldichte kann abschrecken; Gruppenbeschluss ersetzt keine Rechtsklärung.\n\n#### B4 – Autonomie (Bedürfnisse)\n- Text: Bedürfnis nach eigenem Fund und eigenem Weg.\n- Beleg: 1-analytiker.md Bedürfnisse (Annahme); 2-format.md Format 2.\n- Gegenargument: Steht gegen feste Rhythmen und gemeinsame Regeln.\n\n#### Ri1 – Monatliche Begehung (Rituale)\n- Rhythmus: monatlich\n- Text: Spurengang mit fester Form (Einführung, Stationen, Abschluss).\n- Beleg: 1-analytiker.md Rituale (Vorschlag); 2-format.md Format 1.\n- Gegenargument: Belege für feste Rhythmen in [1]–[4] nicht vorhanden; starre Rhythmen mindern Spontaneität.\n\n#### Ri2 – Wiederbesuch nach festem Abstand (Rituale)\n- Rhythmus: vierteljährlich\n- Text: Dieselbe Wand wird nach festem Abstand erneut dokumentiert, Entscheidung über Verlängerung nach 6 Monaten.\n- Beleg: 1-analytiker.md Rituale (Vorschlag); 2-format.md Format 2.\n- Gegenargument: Rhythmus ist Hypothese; zwischendurch Besuche bleiben erlaubt.\n\n#### Ri3 – Archivabend (Rituale)\n- Rhythmus: monatlich\n- Text: Feste Form: Beiträge sammeln, Paar-Prüfung, Schichtschema, Rechte-Runde, Entscheidung über Zeigen.\n- Beleg: 1-analytiker.md Rituale (Vorschlag); 2-format.md Format 3.\n- Gegenargument: Rhythmus ist Hypothese; Raum und Zeit binden Beteiligte.\n\n### Kanten\n\n| ID | Von | Nach | Art der Beziehung, Beleg, Gegenargument |\n|---|---|---|---|\n| E1 | I1 | A1 | Interesse treibt Aktivität an: gemeinsame Schrifterfassung speist die Begehung (1-analytiker.md Interessen [1][2]). |\n| E2 | I2 | A4 | Interesse treibt Aktivität an: Ghost-Sign-Archivierung führt zum Archivabgleich (1-analytiker.md [3][4]). |\n| E3 | I3 | A2 | Interesse treibt Aktivität an: Schichten als Zeitspur verlangen Wiederbesuche (2-format.md Format 2). Gegen: ohne Datierung wenig aussagekräftig. |\n| E4 | I2 | A3 | Interesse treibt Aktivität an: Archivieren braucht Verschlagwortung (2-format.md Format 3). |\n| E5 | Ro1 | A1 | Rolle führt Aktivität aus: Fotografierende nehmen auf der Begehung auf (1-analytiker.md Aktivitäten). |\n| E6 | Ro1 | A2 | Rolle führt Aktivität aus: Fotografierende dokumentieren beim Wiederbesuch (2-format.md Format 2). |\n| E7 | Ro2 | A4 | Rolle führt Aktivität aus: Recherchierende gleichen mit Archiven ab (2-format.md Format 3). |\n| E8 | Ro3 | A3 | Rolle führt Aktivität aus: Archivierende verschlagworten (1-analytiker.md Aktivitäten). |\n| E9 | Ro4 | A1 | Rolle führt Aktivität aus: Wegführende moderieren die Begehung (2-format.md Format 1). |\n| E10 | Ro2 | A2 | Rolle führt Aktivität aus: Datierende beurteilen die Schichtfolge beim Wiederbesuch (2-format.md Format 2). |\n| E11 | A1 | Re1 | Aktivität braucht Ressource: Kamera, Smartphone oder Papierkarte (1-analytiker.md Ressourcen). |\n| E12 | A1 | Re2 | Aktivität braucht Ressource: Rechtswissen zu § 59, § 123, § 303 (1-analytiker.md Ressourcen). |\n| E13 | A2 | Re4 | Aktivität braucht Ressource: Standpunktbeschreibung (2-format.md Format 2). |\n| E14 | A4 | Re3 | Aktivität braucht Ressource: Archivzugang, Karte oder App (1-analytiker.md Ressourcen, [3][4]). |\n| E15 | A3 | Re3 | Aktivität braucht Ressource: Karte oder App und Archiv zum Ordnen (2-format.md Format 3). |\n| E16 | A2 | Re1 | Aktivität braucht Ressource: Kamera oder Smartphone für die Zeitreihe (2-format.md Format 2). |\n| E17 | A4 | B2 | Aktivität bedient Bedürfnis: Archivabgleich macht Funde sichtbar (Annahme, 1-analytiker.md Bedürfnisse). |\n| E18 | A1 | B1 | Aktivität bedient Bedürfnis: gemeinsames Gehen stärkt Zugehörigkeit (Annahme, 2-format.md Format 1). |\n| E19 | A2 | B4 | Aktivität bedient Bedürfnis: eigener Weg zu einer eigenen Wand (Annahme, 2-format.md Format 2). |\n| E20 | Re2 | B3 | Ressource bedient Bedürfnis: klare Regeln geben Sicherheit (Annahme, 1-analytiker.md [5][6][7]). Gegen: Rechtslage für Graffiti offen. |\n| E21 | Ri1 | A1 | Ritual besteht aus Aktivität: die monatliche Begehung ist die wiederkehrende Begehung mit Foto (2-format.md Format 1). |\n| E22 | Ri2 | A2 | Ritual besteht aus Aktivität: der Wiederbesuch wird nach festem Abstand wiederholt (2-format.md Format 2). |\n| E23 | Ri3 | A3 | Ritual besteht aus Aktivität: Verschlagwortung im Archivabend (2-format.md Format 3). |\n| E24 | Ri3 | A4 | Ritual besteht aus Aktivität: Archivabgleich im Archivabend (2-format.md Format 3). |\n| E25 | Ri3 | B2 | Ritual bedient Bedürfnis: der Archivabend macht Funde sichtbar (Annahme, 2-format.md Format 3). |\n| E26 | Ri1 | B1 | Ritual bedient Bedürfnis: wiederkehrende Gruppentreffen für Zugehörigkeit (Annahme, 2-format.md Format 1). |\n| E27 | Ro3 | Ri3 | Rolle führt Ritual aus: Archivierende tragen den Archivabend (2-format.md Format 3). |\n| E28 | Ro4 | Ri1 | Rolle führt Ritual aus: Wegführende leiten die monatliche Begehung (2-format.md Format 1). |\n| E29 | B3 | Ri3 | Bedürfnis prägt Ritual: Rechtsklarheit verlangt die Rechte-Runde im Archivabend (Annahme, 2-format.md Format 3). |\n| E30 | B4 | Ri2 | Bedürfnis prägt Ritual: Autonomie spricht für flexible, kleine Wiederbesuche statt starrer Pflicht (Annahme, 2-format.md Format 2, Risiken). |\n\n### Cluster (typenmischend)\n\n- **K1 – Schrift und Schichten lesen**: I1, I2, I3, A4, Re3\n- **K2 – Spurengang**: Ro1, Ro4, A1, Re1, Re2, Ri1, B1\n- **K3 – Wiederbesuch**: Ro1, Ro2, A2, Re4, Ri2, B4, I3\n- **K4 – Archivabend**: Ro3, Ro2, A3, A4, Ri3, B2, B3, Re3\n\n### Formatzuordnung (2-format.md)\n\n- Format 1 Spurengang: K2 (Ri1, A1, Ro1, Ro4, Re1, Re2, B1, B3)\n- Format 2 Wiederbesuch: K3 (Ri2, A2, Ro1, Ro2, Re4, B4, B2)\n- Format 3 Archivabend: K4 (Ri3, A3, A4, Ro3, Ro2, Re3, B2, B3)\n\n### Bilder\n\n- `bilder/dresden_wandbild_baugrube_2019_2020.jpg`: Zeigt dasselbe gemalte Wandbild in Dresden 2019 und 2020 und belegt, dass dieselbe Wand sich zwischen Besuchen verändert (A2, I2); belegt nicht die Wirkung der Formate. Quelle: https://commons.wikimedia.org/wiki/File:2019071302_Vergleich_Graffitti_aufgemalte_Fenster_und_Baugrube_Henrici-_Ecke_Teichstrasse_07-2019-03-2020.jpg, VSchagow, CC BY-SA 4.0\n- `bilder/saarbruecken_hall_of_fame_4560.jpg`: Zeigt eine legale Graffiti-Fläche (Hall of Fame 4560) in Saarbrücken als aktive Wandschicht an einem erlaubten Ort (I3, A1, Re2); belegt das Phänomen, nicht lokale Gruppenverhältnisse. Quelle: https://commons.wikimedia.org/wiki/File:20210809_Graffiti_Hall-of-Fame_4560_01.jpg, Flocci Nivis, CC BY 4.0\n\n### Grenzen und offene Fragen\n\n- Nicht als Knoten modelliert (nur Fragen der Vorarbeit): wer B-Fälle klärt und wie Widerspruch läuft, wer Format 2 verlängert oder beendet, welche interne Ablage gilt.\n- Ungeprüft: alle Quellen [1]–[7]; Auslegung von § 59 UrhG be
