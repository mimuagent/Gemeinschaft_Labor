[4]; 2-format.md Format 3 (Archivabend).", "gegen": "Beteiligung ist ungleich verteilt, wenige tragen die Arbeit (1-analytiker.md Muster 2, Gegenargument)."}, {"id": "N7", "label": "Datierung und Unsicherheit sichtbar machen", "text": "Interesse daran, Reihenfolge und Alter von Schichten mit einer Sicherheitsstufe (sicher, vermutet, unklar) zu führen.", "beleg": "2-format.md Prinzip 6 und Abschnitt 2 (Minimum); 1-analytiker.md Muster 1, Gegenargument zur Datierung.", "gegen": "Zusätzlicher Aufwand kann Einsteiger abschrecken (2-format.md Format 3, Risiko Überforderung)."}, {"id": "N8", "label": "Lokalgeschichte und Typografie", "text": "Interesse, Wandschrift nach Schriftform und Gewerbegeschichte des Viertels zu deuten.", "beleg": "2-format.md Format 1 (Interessen Lokalgeschichte, Typografie); 1-analytiker.md Quellen [3][4].", "gegen": "Deutungen können Vermutungen zu Fakten machen; ohne Quellenangabe nicht belegt (2-format.md Abschnitt 7, nicht neu abgerufen)."}, {"id": "N9", "label": "Rechte und Schutz klären", "text": "Interesse, Aufnahme, interne Ablage und Veröffentlichung getrennt zu behandeln: Stufe A geklärt, B nur Textnotiz oder Skizze, C nicht dokumentieren.", "beleg": "2-format.md Abschnitt 1 und 2; 1-analytiker.md Quellen [5][6][7]. § 59 UrhG für übermalte Graffiti ist laut 2-format.md offen; Gruppenbeschluss ersetzt keine Rechtsklärung.", "gegen": "Strenge Stufen bremsen Beiträge, B-Fälle bleiben lange ungeklärt (Modellierung, keine Rechtsberatung)."}, {"id": "N10", "label": "Bewahren und Respekt vor dem Vergehen", "text": "Interesse, die Spannung zwischen Dokumentieren und bewusster Flüchtigkeit von Graffiti auszuhalten und zu besprechen.", "beleg": "1-analytiker.md Spannungsfelder 1 und Muster 4; 2-format.md Prinzip 7 (Dokumentieren heißt nicht billigen).", "gegen": "Das Thema kann Gruppen lähmen, wenn es nie entschieden wird (Modellierung, 2-format.md Abschnitt 6)."}, {"id": "N11", "label": "Offenheit und Qualität abwägen", "text": "Interesse, bürgerwissenschaftliche Offenheit mit einem fünffeldrigen Qualitätsminimum zu verbinden.", "beleg": "1-analytiker.md Spannungsfeld 3; 2-format.md Abschnitt 2 und Format 3 (Paar-Prüfung).", "gegen": "Prüfung kann subjektiv oder hierarchisch werden; Wirkung nicht belegt (2-format.md Format 3)."}, {"id": "N12", "label": "Schrift im Stadtraum erforschen", "text": "Interesse an Wandschrift als Teil der sprachlichen Landschaft der Stadt.", "beleg": "1-analytiker.md Quellen [1][2]; 2-format.md Abschnitt 1 (INGRID nur Forschungsprojekt, Lingscape ohne belegte private Ablage).", "gegen": "Weder INGRID noch Lingscape sind als Ablage für Gruppenbeiträge belegt (2-format.md Abschnitt 1)."}], "kanten": [{"id": "E1", "from": "N2", "to": "N3", "text": "Verblassende Wandschrift ist ein Anlass zur Dokumentation von Verlust (1-analytiker.md Muster 3, Quellen [3][4]). Gegen: nicht jeder Fund ist bedroht."}, {"id": "E2", "from": "N1", "to": "N7", "text": "Schichtenlesen braucht Datierung mit Sicherheitsstufe (1-analytiker.md Muster 1, Gegenargument; 2-format.md Prinzip 6)."}, {"id": "E3", "from": "N3", "to": "N4", "text": "Wiederbesuche halten Veränderung fest (2-format.md Format 2). Modellierung; Wirkung nicht belegt."}, {"id": "E4", "from": "N4", "to": "N1", "text": "Mehrere Zeitpunkte ergänzen die Schichtenlesung im Einzelbild, ersetzen sie nicht (2-format.md Format 2, Format 3). Gegen: Zwischen Besuchen bleibt Veränderung undatiert."}, {"id": "E5", "from": "N5", "to": "N1", "text": "Der Spurengang bietet Stationen, an denen gemeinsam Schichten beschrieben werden (2-format.md Format 1)."}, {"id": "E6", "from": "N8", "to": "N2", "text": "Lokalgeschichte und Typografie geben verblasster Wandschrift Bedeutung (2-format.md Format 1; 1-analytiker.md Quellen [3][4])."}, {"id": "E7", "from": "N12", "to": "N8", "text": "Wandschrift als sprachliche Landschaft stützt die Deutung von Schrift (1-analytiker.md Quellen [1][2]). Gegen: Quellen tragen nur das Interesse, nicht ein Format."}, {"id": "E8", "from": "N6", "to": "N11", "text": "Ein offenes Archiv braucht ein Minimum, sonst sinkt die Qualität (1-analytiker.md Spannungsfeld 3; 2-format.md Abschnitt 2)."}, {"id": "E9", "from": "N7", "to": "N11", "text": "Unsicherheitsangaben sind Teil des Minimums (fünf Felder) (2-format.md Abschnitt 2)."}, {"id": "E10", "from": "N11", "to": "N6", "text": "Paar-Prüfung und dokumentierte Kriterien machen den Bestand tragfähig (2-format.md Format 3). Gegen: kann hierarchisch werden."}, {"id": "E11", "from": "N9", "to": "N6", "text": "Rechte-Stufen legen fest, was ins Archiv darf; B bleibt Textnotiz oder Skizze (2-format.md Abschnitt 2, Format 3 Rechte-Runde)."}, {"id": "E12", "from": "N9", "to": "N4", "text": "Fotoreihe nur bei Stufe A, sonst Text- und Skizzenreihe (2-format.md Format 2, Risiko unklare Werkrechte)."}, {"id": "E13", "from": "N10", "to": "N3", "text": "Spannung: Der Drang zu bewahren steht gegen den Respekt vor bewusster Flüchtigkeit (1-analytiker.md Spannungsfeld 1). Beide Lesarten zulassen."}, {"id": "E14", "from": "N10", "to": "N9", "text": "Dokumentieren ist nicht billigen; die Gruppe klärt das ausdrücklich und trennt es von der Rechtsklärung (2-format.md Prinzip 7, Abschnitt 2)."}, {"id": "E15", "from": "N12", "to": "N6", "text": "Forschungsprojekte sind nur methodisches Vorbild; ein Beitragsweg ist nicht belegt (2-format.md Abschnitt 1). Spannung zwischen Vorbild und eigener Gruppenablage."}], "cluster": [{"id": "K1", "label": "Wand lesen", "knoten": ["N1", "N2", "N7", "N12"]}, {"id": "K2", "label": "Zeit und Verlust", "knoten": ["N3", "N4", "N10"]}, {"id": "K3", "label": "Gemeinsam beschreiben und deuten", "knoten": ["N5", "N8"]}, {"id": "K4", "label": "Beitragen, prüfen, schützen", "knoten": ["N6", "N11", "N9"]}]}, "klick.json": {"klick": [{"id": "C1", "titel": "Schichten wie Erdgeschichte", "ids": ["N1", "N7", "E2", "E4", "K1"], "eindruck": "Staunendes Freilegen: Übereinanderliegende Schichten werden Lage für Lage gelesen, mit offen gezeigter Sicherheitsstufe.", "beleg": "N1 (Schichten lesen), N7 (Sicherheitsstufe sicher/vermutet/unklar), E2 (Schichtenlesen braucht Datierung), E4 (mehrere Zeitpunkte ergänzen das Einzelbild), Cluster K1. Bild: Lissabon-Wand mit Graffiti-Schichten. „Staunen“ ist Interpretation des Kurators, nicht im Katalog belegt.", "pruefung": "Gegen „archäologisch-sicher“: N1 warnt vor Schein-Chronologie, E4 nennt undatierte Lücken zwischen Besuchen. Gegen „überfordernd-akribisch“: N7 kann Einsteiger abschrecken, daher die Stufen als Spiel mit Unsicherheit statt als Pflicht rahmen."}, {"id": "C2", "titel": "Geisterschrift mit Fragezeichen", "ids": ["N2", "N8", "N12", "E6", "E7", "K1"], "eindruck": "Detektivische Neugier: Verblasste Wandschrift wird als Spur von Gewerbe und Stadtwandel entziffert, Deutungen bleiben Hypothesen.", "beleg": "N2 (Ghost Signs entdecken), N8 (Lokalgeschichte und Typografie), N12 (sprachliche Landschaft), E6 (Bedeutung durch Lokalgeschichte), E7 (Wandschrift stützt die Deutung, trägt aber kein Format), Cluster K1. Der Eindruck „detektivisch“ ist Interpretation.", "pruefung": "Gegen „nostalgisch-heimatlich“: N2 warnt, Heritage-Rahmung kann aktuelle Graffiti-Praxis abwerten; N8 warnt vor Vermutungen als Fakten. Neugierig-experimentell bleibt näher am Katalog."}, {"id": "C3", "titel": "Dieselbe Wand, andere Zeit", "ids": ["N3", "N4", "E3", "E12", "K2"], "eindruck": "Geduldige Experimentierlust: Eine Wand wird höchstens monatlich über sechs Monate wieder besucht und der Wandel beobachtet.", "beleg": "N3 (Vergänglichkeit dokumentieren), N4 (Wiederbesuch, höchstens zehn Wände), E3 (Wiederbesuche halten Veränderung fest), E12 (Fotoreihe nur bei Stufe A, sonst Text- und Skizzenreihe), Cluster K2. N4 ist laut Katalog ein Entwurf, Wirkung nicht belegt.", "pruefung": "Gegen „Rettungsdringlichkeit“: N3 warnt vor überhastetem Dokumentieren. Gegen „Überwachungsgefühl“: N4 nennt dieses Risiko ausdrücklich, daher Befristung und Skizzenalternative (E12) betonen."}, {"id": "C4", "titel": "Gemeinsam sehen, dann notieren", "ids": ["N5", "N1", "E5", "K3"], "eindruck": "Leichte gemeinsame Aufmerksamkeit: Bei der Begehung wird zuerst gemeinsam beschrieben und erst dann notiert.", "beleg": "N5 (gemeinsam gehen und beschreiben), N1 (Schichten lesen), E5 (Spurengang bietet Stationen), Cluster K3. N5 ist Entwurf und Hypothese H1, die Wirkung ist nicht belegt.", "pruefung": "Gegen „Event-Spektakel“: N5 nennt Konflikte mit Anwohnenden und Mobilitätsgrenzen. Gegen „stilles Einzelsammeln“: der Katalog stellt das gemeinsame Beschreiben vor das Notieren."}, {"id": "C5", "titel": "Das gemeinsame Archiv mit Prüfsiegel", "ids": ["N6", "N11", "E8", "E9", "E10", "K4"], "eindruck": "Achtsames Ausprobieren: Viele tragen bei, ein Minimum aus fünf Feldern und eine Paar-Prüfung halten den Bestand tragfähig.", "beleg": "N6 (kollektives Archiv), N11 (Offenheit und Qualität), E8 (offenes Archiv braucht Minimum), E9 (Unsicherheitsangaben gehören zum Minimum), E10 (Paar-Prüfung macht tragfähig), Cluster K4. Die Wirkung ist laut Katalog nicht belegt.", "pruefung": "Gegen „behördlich-kontrollierend“: N11 und E10 warnen, dass Prüfung hierarchisch werden kann; die Gruppe muss Kriterien offenlegen. Gegen „Gemeinschaftseuphorie“: N6 nennt ungleiche Verteilung der Arbeit."}, {"id": "C6", "titel": "Dokumentieren heißt nicht billigen", "ids": ["N10", "N9", "E13", "E14", "K2", "K4"], "eindruck": "Nachdenkliche Behutsamkeit: Die Spannung zwischen Bewahren und bewusster Flüchtigkeit wird offen besprochen und von der Rechtsklärung getrennt.", "beleg": "N10 (Respekt vor dem Vergehen), N9 (Rechte und Schutz, Stufen A, B, C), E13 (Spannung zu N3, beide Lesarten zulassen), E14 (Dokumentieren ist nicht billigen), Cluster K2 und K4. N9 ist Modellierung und keine Rechtsberatung.", "pruefung": "Gegen „moralisierend-schwer“: N10 warnt, dass ungelöste Debatten die Gruppe lähmen können. Gegen „rebellisch-szenig“: N9 bindet an Rechte-Stufen, E14 trennt Haltung und Recht."}], "stimmung": "Neugierig-experimentell mit behutsamer Zurückhaltung: Schichten und Zeitfenster ausprobieren, Unsicherheit sichtbar lassen, ohne Rettungs-, Kontroll- oder Szene-Pathos. Gegen „melancholisch-rettend“ sprechen N3 und E1 (nicht jeder Fund ist bedroht), gegen „behördlich“ N11 und E10, gegen „rebellisch“ N9 und E14. Die Gefühlswörter sind Interpretation; der Katalog belegt Interessen und Beziehungen, teils nur als Entwurf oder Hypothese."}, "phasen.json": {"phasen": [{"id": "P1", "titel": "Schrift im Stadtraum", "sichtbar": ["N12", "N8", "N2", "E7", "E6"], "text": "Start bei der Schrift: Schrift im Stadtraum erforschen (N12) führt über E7 zu Lokalgeschichte und Typografie (N8), die über E6 verblasste Wandschrift (N2) erklärt. Noch kein Cluster, kein Archiv, keine Veröffentlichung: erst Neugier und Lesen."}, {"id": "P2", "titel": "Wand lesen mit Unsicherheit", "sichtbar": ["N12", "N8", "N2", "N1", "N7", "E7", "E6", "E2", "K1"], "text": "Neu: Schichten lesen (N1) und Datierung und Unsicherheit sichtbar machen (N7), verbunden über E2. Damit sind alle Mitglieder von K1 „Wand lesen“ (N1, N2, N7, N12) sichtbar und die Hülle erscheint. Unsicherheit wird gleich mitgelesen, damit Deutungen nicht als Tatsachen gelten."}, {"id": "P3", "titel": "Zeit, Verlust und Schutz", "sichtbar": ["N12", "N8", "N2", "N1", "N7", "N3", "N4", "N10", "N9", "E7", "E6", "E2", "E1", "E3", "E4", "E12", "E13", "E14", "K1", "K2"], "text": "Neu: Vergänglichkeit dokumentieren (N3), Wiederbesuch derselben Wand (N4), Bewahren und Respekt vor dem Vergehen (N10) und Rechte und Schutz klären (N9). E1 führt von Wandschrift zu Verlust, E3 zum Wiederbesuch, E4 bringt ihn zurück zu den Schichten. N10 steuert über E13 die Haltung zum Verlust und über E14 den Schutz bei; E12 bindet den Wiederbesuch an geklärte Rechte. K2 „Zeit und Verlust“ erscheint. Recht und Schutz stehen damit vor Archiv und Veröffentlichung."}, {"id": "P4", "titel": "Gemeinsam deuten, archivieren und abwägen", "sichtbar": ["N1", "N2", "N3", "N4", "N5", "N6", "N7", "N8", "N9", "N10", "N11", "N12", "E1", "E2", "E3", "E4", "E5", "E6", "E7", "E8", "E9", "E10", "E11", "E12", "E13", "E14", "E15", "K1", "K2", "K3", "K4"], "text": "Neu: Gemeinsam gehen und beschreiben (N5), Kollektives Archiv aufbauen (N6) und Offenheit und Qualität abwägen (N11). E5 speist das Gehen in die Schichtenlesung, E15 und E11 führen Schrift und Rechte ins Archiv, E8 bis E10 koppeln Archiv, Unsicherheit und Offenheit. K3 und K4 schließen das Netz. Endzustand: alle 12 Knoten, 15 Kanten und 4 Cluster aus dem Katalog."}], "hinweis": "Prüfung: Katalogfassung lauf6/3-katalog.md und katalog.json des Beziehungs-Architekten (N1–N12, E1–E15, K1–K4; Knotentyp Interessen); nur IDs dieser Fassung, jede Phase kumulativ, Kanten erst mit beiden Endknoten, Cluster erst mit allen Mitgliedern, Endzustand alle IDs. Keine zusätzliche Recherche wegen 180 s Zeitbudget; Belege stehen in den Vorarbeiten. Risiken: (1) P3 bringt 11 neue Elemente und ist überladen; (2) Schutz und Rechte (N9, N10) erscheinen erst in P3, ein früher Wiederbesuch wäre vorher nicht abgesichert; (3) N7 früh zeigt Unsicherheit, kann Einsteiger bremsen; (4) E8 bis E11 im Endbild sind dicht und schwer lesbar. Alternativen: (A) P3 teilen in Zeit und Verlust (N3, N4, N10) und Rechte und Schutz (N9), dann 5 Phasen; (B) N9 schon in P2 zeigen; (C) N5 mit E5 früher in P2, damit das Gemeinsame vor der Archivierung steht. Technik: Einblenden ca. 400 ms, Kanten als Strichanimation ca. 600 ms, Hüllen mit Deckkraft 0,15, ca. 4 s pro Phase. Bild: ein Beispiel aus einem Fremdarchiv (Dresden, Wandbild 2019/2020), belegt Vergänglichkeit und Wiederbesuch, nicht die Wirkung der Formate."}}, "md": [{"datei": "1-analytiker.md", "rolle": "Interessen-Analytiker", "text": "# lauf6 – Interessen-Analyse: Urbane Spurensuche\n\n**Interessen-Set:** „Urbane Spurensuche – Gemeinsames Dokumentieren von Graffiti-Schichten und verblassten Wandinschriften in der Stadt“. **Knotentyp:** Interessen.\n\n## Erkenntnisgrenzen\nDie Analyse entstand unter einem Budget von 3 Minuten. Es wurden keine neuen Seiten abgerufen; die Quellen [1]–[7] wurden bereits am 09.11.2026 in einem früheren Lauf (lauf3) geprüft. Aussagen zu lokalen Gruppen sind Hypothesen, keine Empirie.\n\n## Belegte Grundlagen\n- Gemeinsames Dokumentieren von Schrift im Stadtraum ist als Forschungs- und Bürgerprojekt etabliert: Das Paderborner Projekt INGRID untersucht Graffiti und Schrift im Stadtraum [1]; die App Lingscape sammelt Sprach- und Schriftspuren im öffentlichen Raum durch Beteiligung vieler [2].\n- Verblasste Wandwerbung („Ghost Signs“) hat Archive und Gemeinschaften: der britische Hand-Painted-Advertising-Katalog (HAT) [3] und das deutsche Projekt ghostsigns.de [4].\n- Rechtliche Rahmen: Fotografieren von Werken im öffentlichen Raum ist nach § 59 UrhG grundsätzlich zulässig (Straßenpanoramafreiheit, nur von öffentlichen Orten aus) [5]; Betreten fremder befriedeter Flächen kann Hausfriedensbruch sein (§ 123 StGB) [6]; eigenes Übermalen oder Beschädigen ist Sachbeschädigung (§ 303 StGB) [7].\n\n## Muster\n1. **Schicht als Zeitachse:** Graffiti überlagern sich; Wandinschriften verblassen. Dokumentation macht Zeit sichtbar. *Gegenargument:* Schichten sind ohne Datierung schwer zu ordnen; Fotos belegen nur den Aufnahmezeitpunkt.\n2. **Kollektiv statt Einzelsammler:** Die Quellen [2][3][4] arbeiten beteiligungsorientiert. *Gegenargument:* Beteiligung ist oft ungleich verteilt, wenige tragen die meiste Arbeit.\n3. **Vergänglichkeit als Motor:** Was verschwindet, erzeugt Dringlichkeit. *Gegenargument:* Dringlichkeit kann zu überhastetem, unsauberem Dokumentieren führen.\n4. **Grenzraum Kunst/Recht:** Graffiti sind Kulturspur und zugleich oft Rechtsverstoß [6][7]. *Gegenargument:* Dokumentieren ist kein Billigen; eine Gruppe muss das ausdrücklich klären.\n\n## Spannungsfelder\n- Dokumentieren (bewahren) gegenüber Respekt vor dem Vergehen (Graffiti sind oft bewusst flüchtig).\n- Offene Veröffentlichung gegenüber Schutz von Urhebern und Orten (Gefahr, Szene-Orte preiszugeben) [5].\n- Bürgerwissenschaftliche Offenheit gegenüber Qualitätsstandards.\n\n## Gemeinschaftspotenziale (Hypothesen)\n- **H1:** Gemeinsame Begehungen mit festem Foto-Protokoll (Ort, Datum, Blickrichtung) schaffen niedrigschwellige Zugehörigkeit.\n- **H2:** Ein gemeinsames Stadtarchiv, das Wiederbesuche derselben Wand erfasst, verbindet Menschen über Zeit.\n\n## Bild\nEin Ghost Sign aus London (CC BY-SA 4.0) zeigt beispielhaft eine verblasste Wandschrift; es belegt das Phänomen, nicht lokale Verhältnisse.\n\n## Offene Fragen an die nächsten Rollen\n- **Format-Entwerfer:** Welche Begegnungsformate (Begehung, Wiederbesuch, Archivabend) passen zu Dokumentieren ohne Eingriff in die Wand?\n- **Beziehungs-Architekt:** Welche Rollen (Fotografierende, Datierende, Archivierende) und welche Regeln zu Ortsangaben und Urheberschaft?\n- **Emotions-Kurator:** Wie lassen sich Neugier und Wehmut über Vergängliches ansprechen, ohne Illegalität zu romantisieren?\n- **Simulations-Choreograph:** Wie sähe die Entwicklung derselben Wand über mehrere Wiederbesuche aus?\n- **Master-Koordinator:** Soll eine spätere Runde lokale Quellen und aktuelle Rechtsprüfung nachholen?\n\n## Quellenverzeichnis\n1. [INGRID, Universität Paderborn](https://www.uni-paderborn.de/forschungsprojekte/ingrid)\n2. [Lingscape](https://lingscape.app/about.html)\n3. [HAT Ghost Signs Katalog](https://www.hatads.org.uk/catalogue/ghostsigns.aspx)\n4. [ghostsigns.de](https://ghostsigns.de/about/)\n5. [§ 59 UrhG](https://www.gesetze-im-internet.de/urhg/__59.html)\n6. [§ 123 StGB](https://www.gesetze-im-internet.de/stgb/__123.html)\n7. [§ 303 StGB](https://www.gesetze-im-internet.de/stgb/__303.html)\n", "geliefert": true}, {"datei": "2-format.md", "rolle": "Format-Entwerfer", "text": "# lauf6 – Format-Entwurf: Urbane Spurensuche\n\n**Rolle:** Format-Entwerfer | **Lauf:** lauf6 | **attempt:** format-v1-d731da35 | **Knotentyp:** Interessen\n**Interessen-Set:** „Urbane Spurensuche – Gemeinsames Dokumentieren von Graffiti-Schichten und verblassten Wandinschriften in der Stadt“\n**Vorarbeit:** `1-analytiker.md` (lauf6) und ein Bild, gelesen. **Bild dieser Rolle:** 1 (Lissabon, siehe Abschnitt 5).\n\n**Erkenntnisgrenzen:** Das Zeitbudget beträgt 3 Minuten. Ich habe keine Quelle neu abgerufen. Die Quellen [1]–[7] stammen aus der Vorarbeit, die sich ihrerseits auf eine Prüfung in lauf3 beruft; hier sind sie also **nicht live geprüft**. **[Entwurf]** kennzeichnet meine eigenen Vorschläge. Eine soziale Wirkung wird nirgends behauptet.\n\n## 1. Kritische Prüfung der Vorarbeit\n- Die Aussagen zu INGRID [1], Lingscape [2], HAT [3] und ghostsigns.de [4] tragen nur das Interesse an gemeinsamer Schrift- und Wanddokumentation, nicht ein bestimmtes Format. Das Format ist jeweils mein Entwurf.\n- „Fotografieren ist nach § 59 UrhG grundsätzlich zulässig“ [5] ist zu glatt. § 59 gilt für *bleibende* Werke an öffentlichen Wegen; ob übermalte oder kurzlebige Graffiti darunter fallen, ist offen. Rechtsfolgen für Weitergabe und Veröffentlichung sind damit nicht geklärt. Ich unterscheide deshalb Aufnahme, interne Ablage und Veröffentlichung.\n- Hypothesen H1/H2 (Zugehörigkeit durch Begehungen, Verbindung über Wiederbesuche) bleiben Hypothesen; meine Formate sind Testanordnungen dafür.\n- Lingscape ist laut Vorarbeit eine App der Beteiligung; eine geschützte private Ablage ist nicht belegt. Sie taugt nicht als interne Ablage.\n- INGRID ist ein Forschungsprojekt, kein belegter Ort für Bürgerbeiträge.\n\n## 2. Gemeinsames Minimum je Beobachtung [Entwurf]\nZeit (grob), grober Ort (Straße oder Viertel, keine Koordinaten als Standard), Beobachtung „was liegt über was“, Sicherheit der Aussage (sicher/vermutet/unklar), Rechte-Stufe. Eine Papierkarte ist gleichwertig zur App.\n**Rechte-Stufen:** *A* geklärt (Fotoerlaubnis, Werkrechte, Personen- und Ortsschutz geprüft); *B* ungeklärt, dann **nur Textnotiz oder Skizze, kein Foto**; *C* nicht dokumentieren (erkennbare Personen, private Bereiche, Hinweise auf Szene-Orte). Ein Gruppenbeschluss ersetzt keine Rechtsklärung.\n\n## 3. Formate\n\n### Format 1 – Spurengang (Begehung)\n**Interessen:** Schichten lesen, Lokalgeschichte, Typografie, Stadtflanieren.\n**Ablauf [Entwurf], ca. 120 Min.:** 15 Min. Einführung („nur schauen, nicht berühren, nicht betreten“); Rundweg von etwa 1,2 km auf barrierearmen öffentlichen Wegen mit 4 vorab gesichteten Stationen; je Station 12 Min. gemeinsam beschreiben, dann notieren; 20 Min. Abschluss mit offenen Fragen und vorläufigen Stufen; Puffer.\n**Rahmen:** 6–12 Personen, Sitzgelegenheiten, Papierkarten, Smartphone nicht nötig.\n**Ergebnis:** Textnotizen nach Minimum, Fotos nur bei Stufe A, Liste offener Fragen.\n**Risiken → Gegenmaßnahmen:** Konflikt mit Anwohnenden → kurze Halte, Gehwegregel, Abbruch bei Beschwerde; Romantisierung von Illegalität → beide Lesarten (Kulturspur, Regelverstoß) an jeder Station zulassen; Personen im Bild → Stufe C.\n**Alternative:** Sitzstationen an zwei öffentlichen Orten mit Blick auf eine Wand; sinnvoll bei Mobilitätsgrenzen oder großer Gruppe, nicht wetterfest.\n\n### Format 2 – Wiederbesuch (befristete Wiederholungsfotografie)\n**Interessen:** Vergänglichkeit, Mehrzeitigkeit, gemeinsames Archiv (H2 der Vorarbeit).\n**Ablauf [Entwurf]:** höchstens 10 unproblematische Wände; Standpunkt in Worten festhalten („gegenüberliegender Gehweg, Laternenmast 2“); höchstens einmal im Monat wiederbesuchen, **Ende nach 6 Monaten**, dann ausdrückliche Entscheidung über Verlängerung. Nur von Hand fotografiert; **keine fest installierten Kameras und keine Auswertung fremder Überwachungsbilder**.\n**Ergebnis:** Zeitreihe je Wand, als Foto nur bei Stufe A, sonst als Text und Skizze.\n**Risiken → Gegenmaßnahmen:** wirkt wie Überwachung einer Szene → Fokus auf verblasste Wandschrift, Frist, keine Personenbilder, Ortsauswahl begründen; Ermüdung → kleines Kontingent, Tauschregel; unklare Werkrechte → Text- und Skizzenreihe.\n**Alternative:** einmalige Vorher/Nachher-Dokumentation bei angekündigter Sanierung; sinnvoll, wenn niemand sechs Monate zusagen kann.\n\n### Format 3 – Archivabend (Prüfwerkstatt, analog und digital)\n**Interessen:** Schichten ordnen, Qualität gegenüber Offenheit, Datierung.\n**Ablauf [Entwurf], ca. 2 Std. in einem barrierefreien Raum:** Beiträge sammeln (Papier oder Bildschirm); Paar-Prüfung gegen das Minimum; Schichtschema zeichnen (unten nach oben) mit markierter Unsicherheit; Rechte-Runde nur für den Klärungsweg von B-Fällen; Entscheidung, was wo gezeigt wird.\n**Ergebnis:** geprüfte Beobachtungen, Schichtschemata, Liste geklärter und ungeklärter Rechtefälle.\n**Risiken → Gegenmaßnahmen:** Überforderung → nur fünf Minimumfelder verpflichtend; subjektive oder hierarchische Auswahl → Paar-Prüfung, dokumentierte Kriterien, Widerspruch; ungeklärtes „rutscht“ in die Veröffentlichung → Standard ist Zurückhaltung.\n**Alternative:** asynchrone Prüfrunde an Textnotizen; sinnvoll bei verstreuten Beteiligten, mit analoger Abgabestelle.\n\n## 4. Prinzipien [Entwurf]\n1. Dokumentieren, nie verändern (kein Berühren, Reinigen, Übermalen; Grenze § 303 StGB [7]).\n2. Öffentlicher Blick, kein Betreten (§ 123 StGB [6]), Aufnahmen auf Augenhöhe, ohne Leitern und Drohnen (praktische Regel, keine Rechtsauslegung).\n3. Zurückhaltung bei ungeklärten Rechten: Textnotiz statt Foto.\n4. Orte grob statt genau; Wand statt Mensch.\n5. Analoger und digitaler Beitrag sind gleichwertig.\n6. Unsicherheit sichtbar machen: Datierung und Reihenfolge der Schichten tragen eine Sicherheitsstufe.\n7. Dokumentieren heißt nicht billigen; die Gruppe klärt das ausdrücklich.\n\n**Messgrößen ohne Zielwerte:** Anteil Beobachtungen mit vollständigem Minimum; Verteilung auf A/B/C; Anteil analoger Beiträge; geplante gegenüber erfolgten Wiederbesuchen; Konflikte und deren Bearbeitung.\n\n## 5. Bild\n![Graffiti-Schichten, LX Factory Lissabon](bilder/lissabon_graffiti_schichten.jpg)\nDas Foto (Dale Cruse, CC BY 4.0, [Wikimedia Commons](https://commons.wikimedia.org/wiki/File:Weathered_Mural_and_Graffiti_Layers_%E2%80%93_LX_Factory,_Lisbon_(54709876316).jpg)) zeigt übereinander liegende Graffiti-Schichten. Es belegt das Phänomen, nicht lokale Verhältnisse und nicht die Wirkung der Formate.\n\n## 6. Offene Fragen an den Beziehungs-Architekten (nur Fragen)\n- Wer dokumentiert die Klärung eines B-Falls, und wie läuft ein Widerspruch?\n- Wer entscheidet über Verlängerung oder Ende von Format 2?\n- Welche interne Ablage mit welchen Zugriffsregeln, und wer löscht Stufe-C-Material?\n- Wie wird die Spannung zwischen Bewahren und Respekt vor dem Vergehen verhandelt?\n\n## 7. Quellen (aus der Vorarbeit, nicht neu abgerufen)\n[1] [INGRID, Universität Paderborn](https://www.uni-paderborn.de/forschungsprojekte/ingrid) · [2] [Lingscape](https://lingscape.app/about.html) · [3] [HAT Ghost Signs Katalog](https://www.hatads.org.uk/catalogue/ghostsigns.aspx) · [4] [ghostsigns.de](https://ghostsigns.de/about/) · [5] [§ 59 UrhG](https://www.gesetze-im-internet.de/urhg/__59.html) · [6] [§ 123 StGB](https://www.gesetze-im-internet.de/stgb/__123.html) · [7] [§ 303 StGB](https://www.gesetze-im-internet.de/stgb/__303.html)\n", "geliefert": true}, {"datei": "3-katalog.md", "rolle": "Beziehungs-Architekt", "text": "lauf6 – Ergebnis Beziehungs-Architekt\n\nLaufname: lauf6 · attempt_id: architektur-v1-5b1ec8b3 · Bildgrenze: Min 1, Max 1 (genutzt: 1)\nKnotentyp: Interessen · Set: Urbane Spurensuche – Gemeinsames Dokumentieren von Graffiti-Schichten und verblassten Wandinschriften in der Stadt\n\nQuellenbezug: ausschließlich lauf6/1-analytiker.md (Quellen [1]–[7]) und lauf6/2-format.md. Die Quellen sind in diesem Lauf nicht neu abgerufen, die Prüfung stammt laut Vorarbeit aus lauf3 (Zeitbudget 3 Minuten, keine eigene Recherche). [Entwurf] und Modellierung kennzeichnen Entscheidungen der Vorrollen bzw. meine; eine soziale Wirkung wird nicht behauptet. Rechtliches nur als Orientierung laut Vorarbeit, keine Rechtsberatung.\n\n## Knoten\n\n### N1 – Schichten lesen\n- Text: Interesse, Überlagerungen von Graffiti und Wandschrift in ihrer Reihenfolge zu beschreiben.\n- Beleg: 1-analytiker.md Muster 1 (Schicht als Zeitachse); 2-format.md Format 1 und 3, Prinzip 6; Bild bilder/wandbild_baugrube_rephoto.jpg zeigt dieselbe Wand in zwei Zuständen.\n- Gegenargument: Ohne Datierung entsteht Schein-Chronologie; Fotos belegen nur den Aufnahmezeitpunkt (1-analytiker.md Muster 1, Gegenargument).\n\n### N2 – Verblasste Wandschrift (Ghost Signs) entdecken\n- Text: Interesse an handgemalter, verblassender Wandwerbung als Spur von Gewerbe und Stadtwandel.\n- Beleg: 1-analytiker.md Belegte Grundlagen, Quellen [3][4]; 2-format.md Format 1 (Lokalgeschichte, Typografie).\n- Gegenargument: Die Rahmung als Heritage kann aktuelle Graffiti-Praxis abwerten (2-format.md Format 1, Risiko Romantisierung).\n\n### N3 – Vergänglichkeit dokumentieren\n- Text: Interesse, verschwindende Wandspuren festzuhalten, bevor sie überdeckt oder entfernt werden.\n- Beleg: 1-analytiker.md Muster 3 (Vergänglichkeit als Motor); 2-format.md Format 2, Alternative Vorher/Nachher; Bild bilder/wandbild_baugrube_rephoto.jpg.\n- Gegenargument: Dringlichkeit kann zu überhastetem, unsauberem Dokumentieren führen (1-analytiker.md Muster 3).\n\n### N4 – Wiederbesuch derselben Wand\n- Text: Interesse, höchstens zehn Wände höchstens monatlich über sechs Monate erneut aufzunehmen.\n- Beleg: 2-format.md Format 2 [Entwurf]; 1-analytiker.md Hypothese H2 (Stadtarchiv mit Wiederbesuchen).\n- Gegenargument: Wirkt wie Überwachung einer Szene; H2 ist eine Hypothese, die Methode ist nicht belegt (2-format.md Abschnitt 1 und Format 2).\n\n### N5 – Gemeinsam gehen und beschreiben\n- Text: Interesse an der Begehung mit vorab gesichteten Stationen: erst gemeinsam beschreiben, dann notieren.\n- Beleg: 2-format.md Format 1 [Entwurf]; 1-analytiker.md Hypothese H1 (Begehungen mit Foto-Protokoll).\n- Gegenargument: Konflikt mit Anwohnenden und Mobilitätsgrenzen; H1 ist eine Hypothese (2-format.md Format 1, Risiken).\n\n### N6 – Kollektives Archiv aufbauen\n- Text: Interesse, Beobachtungen vieler in einem gemeinsamen, geprüften Bestand zu sammeln.\n- Beleg: 1-analytiker.md Muster 2, Quellen [2][3][4]; 2-format.md Format 3 (Archivabend).\n- Gegenargument: Beteiligung ist ungleich verteilt, wenige tragen die Arbeit (1-analytiker.md Muster 2, Gegenargument).\n\n### N7 – Datierung und Unsicherheit sichtbar machen\n- Text: Interesse daran, Reihenfolge und Alter von Schichten mit einer Sicherheitsstufe (sicher, vermutet, unklar) zu führen.\n- Beleg: 2-format.md Prinzip 6 und Abschnitt 2 (Minimum); 1-analytiker.md Muster 1, Gegenargument zur Datierung.\n- Gegenargument: Zusätzlicher Aufwand kann Einsteiger abschrecken (2-format.md Format 3, Risiko Überforderung).\n\n### N8 – Lokalgeschichte und Typografie\n- Text: Interesse, Wandschrift nach Schriftform und Gewerbegeschichte des Viertels zu deuten.\n- Beleg: 2-format.md Format 1 (Interessen Lokalgeschichte, Typografie); 1-analytiker.md Quellen [3][4].\n- Gegenargument: Deutungen können Vermutungen zu Fakten machen; ohne Quellenangabe nicht belegt (2-format.md Abschnitt 7, nicht neu abgerufen).\n\n### N9 – Rechte und Schutz klären\n- Text: Interesse, Aufnahme, interne Ablage und Veröffentlichung getrennt zu behandeln: Stufe A geklärt, B nur Textnotiz oder Skizze, C nicht dokumentieren.\n- Beleg: 2-format.md Abschnitt 1 und 2; 1-analytiker.md Quellen [5][6][7]. § 59 UrhG für übermalte Graffiti ist laut 2-format.md offen; Gruppenbeschluss ersetzt keine Rechtsklärung.\n- Gegenargument: Strenge Stufen bremsen Beiträge, B-Fälle bleiben lange ungeklärt (Modellierung, keine Rechtsberatung).\n\n### N10 – Bewahren und Respekt vor dem Vergehen\n- Text: Interesse, die Spannung zwischen Dokumentieren und bewusster Flüchtigkeit von Graffiti auszuhalten und zu besprechen.\n- Beleg: 1-analytiker.md Spannungsfelder 1 und Muster 4; 2-format.md Prinzip 7 (Dokumentieren heißt nicht billigen).\n- Gegenargument: Das Thema kann Gruppen lähmen, wenn es nie entschieden wird (Modellierung, 2-format.md Abschnitt 6).\n\n### N11 – Offenheit und Qualität abwägen\n- Text: Interesse, bürgerwissenschaftliche Offenheit mit einem fünffeldrigen Qualitätsminimum zu verbinden.\n- Beleg: 1-analytiker.md Spannungsfeld 3; 2-format.md Abschnitt 2 und Format 3 (Paar-Prüfung).\n- Gegenargument: Prüfung kann subjektiv oder hierarchisch werden; Wirkung nicht belegt (2-format.md Format 3).\n\n### N12 – Schrift im Stadtraum erforschen\n- Text: Interesse an Wandschrift als Teil der sprachlichen Landschaft der Stadt.\n- Beleg: 1-analytiker.md Quellen [1][2]; 2-format.md Abschnitt 1 (INGRID nur Forschungsprojekt, Lingscape ohne belegte private Ablage).\n- Gegenargument: Weder INGRID noch Lingscape sind als Ablage für Gruppenbeiträge belegt (2-format.md Abschnitt 1).\n\n## Kanten\n\n| ID | Von | Nach | Bedeutung, Beleg, Gegenargument |\n|---|---|---|---|\n| E1 | N2 | N3 | Verblassende Wandschrift ist ein Anlass zur Dokumentation von Verlust (1-analytiker.md Muster 3, Quellen [3][4]). Gegen: nicht jeder Fund ist bedroht. |\n| E2 | N1 | N7 | Schichtenlesen braucht Datierung mit Sicherheitsstufe (1-analytiker.md Muster 1, Gegenargument; 2-format.md Prinzip 6). |\n| E3 | N3 | N4 | Wiederbesuche halten Veränderung fest (2-format.md Format 2). Modellierung; Wirkung nicht belegt. |\n| E4 | N4 | N1 | Mehrere Zeitpunkte ergänzen die Schichtenlesung im Einzelbild, ersetzen sie nicht (2-format.md Format 2, Format 3). Gegen: Zwischen Besuchen bleibt Veränderung undatiert. |\n| E5 | N5 | N1 | Der Spurengang bietet Stationen, an denen gemeinsam Schichten beschrieben werden (2-format.md Format 1). |\n| E6 | N8 | N2 | Lokalgeschichte und Typografie geben verblasster Wandschrift Bedeutung (2-format.md Format 1; 1-analytiker.md Quellen [3][4]). |\n| E7 | N12 | N8 | Wandschrift als sprachliche Landschaft stützt die Deutung von Schrift (1-analytiker.md Quellen [1][2]). Gegen: Quellen tragen nur das Interesse, nicht ein Format. |\n| E8 | N6 | N11 | Ein offenes Archiv braucht ein Minimum, sonst sinkt die Qualität (1-analytiker.md Spannungsfeld 3; 2-format.md Abschnitt 2). |\n| E9 | N7 | N11 | Unsicherheitsangaben sind Teil des Minimums (fünf Felder) (2-format.md Abschnitt 2). |\n| E10 | N11 | N6 | Paar-Prüfung und dokumentierte Kriterien machen den Bestand tragfähig (2-format.md Format 3). Gegen: kann hierarchisch werden. |\n| E11 | N9 | N6 | Rechte-Stufen legen fest, was ins Archiv darf; B bleibt Textnotiz oder Skizze (2-format.md Abschnitt 2, Format 3 Rechte-Runde). |\n| E12 | N9 | N4 | Fotoreihe nur bei Stufe A, sonst Text- und Skizzenreihe (2-format.md Format 2, Risiko unklare Werkrechte). |\n| E13 | N10 | N3 | Spannung: Der Drang zu bewahren steht gegen den Respekt vor bewusster Flüchtigkeit (1-analytiker.md Spannungsfeld 1). Beide Lesarten zulassen. |\n| E14 | N10 | N9 | Dokumentieren ist nicht billigen; die Gruppe klärt das ausdrücklich und trennt es von der Rechtsklärung (2-format.md Prinzip 7, Abschnitt 2). |\n| E15 | N12 | N6 | Forschungsprojekte sind nur methodisches Vorbild; ein Beitragsweg ist nicht belegt (2-format.md Abschnitt 1). Spannung zwischen Vorbild und eigener Gruppenablage. |\n\n## Cluster\n\n- **K1 – Wand lesen** (N1, N2, N7, N12): Interessen, die direkt auf Schrift und Schichtfolge der Wand zielen (1-analytiker.md Muster 1, Quellen [1]–[4]). Gegen: Analyse und Ästhetik ziehen unterschiedlich.\n- **K2 – Zeit und Verlust** (N3, N4, N10): Vergänglichkeit, Wiederbesuch und die Spannung dazu (1-analytiker.md Muster 3, Spannungsfeld 1; 2-format.md Format 2). Gegen: Verlustnarrativ kann dominieren.\n- **K3 – Gemeinsam beschreiben und deuten** (N5, N8): Begehung und Lokaldeutung als Begegnungsform (2-format.md Format 1). Gegen: Deutungen bleiben Entwurf.\n- **K4 – Beitragen, prüfen, schützen** (N6, N11, N9): Offener Bestand mit Prüfung und Rechte-Stufen (1-analytiker.md Muster 2, Muster 4; 2-format.md Format 3, Abschnitt 2). Gegen: Regeldichte kann abschrecken.\n\n## Formatzuordnung (2-format.md)\n\n- Format 1 Spurengang: N5, N1, N2, N8, N7\n- Format 2 Wiederbesuch: N3, N4, N1, N9\n- Format 3 Archivabend: N6, N11, N7, N9, N1\n\n## Bild\n\n- `bilder/wandbild_baugrube_rephoto.jpg`: Vergleich 2019/2020 desselben gemalten Wandbilds in Dresden vor und hinter einer Baugrube. Es zeigt eine gefährdete Wand in zwei Zuständen und belegt den Anlass für N3 und N4. Es belegt das Phänomen, nicht die Wirkung der Formate (Quelle: [Wikimedia Commons](https://commons.wikimedia.org/wiki/File:2019071302_Vergleich_Graffitti_aufgemalte_Fenster_und_Baugrube_Henrici-_Ecke_Teichstrasse_07-2019-03-2020.jpg), VSchagow, CC BY-SA 4.0).\n\n## Grenzen und offene Fragen\n\n- Offene Governance-Fragen aus 2-format.md Abschnitt 6 sind nicht als Knoten modelliert: wer B-Fälle klärt und wie Widerspruch läuft, wer Format 2 verlängert oder beendet, welche interne Ablage mit welchen Zugriffsregeln gilt, wer Stufe-C-Material löscht.\n- Ungeprüft in diesem Lauf: alle Quellen [1]–[7] (nicht neu abgerufen); Auslegung von „bleibend“ in § 59 UrhG bei übermalten Graffiti; Hilfsmittel- und Drohnenrecht.\n- Hypothesen H1 und H2 bleiben Hypothesen; die Kanten behaupten keine Wirkung.\n- Keine Personen-, Rollen- oder Phasenknoten; die im Analytiker-Text gefragten Rollen (Fotografierende, Datierende, Archivierende) sind bewusst nicht als Knoten modelliert, weil der Knotentyp Interessen ist.\n- Keine eigene Recherche (Zeitbudget 3 Minuten).\n", "geliefert": true}, {"datei": "4-emotionen.md", "rolle": "Emotions-Kurator", "text": "lauf6 – Ergebnis Emotions-Kurator\n\nLaufname: lauf6\nLaufordner: /workspace/labor/Gemeinschaft_Labor_Box/laeufe/lauf6\nattempt_id: emotion-v1-9ad96104\nGrundlage: katalog.json von lauf6 (N1–N12, E1–E15, K1–K4). Keine zusätzliche Recherche wegen 180 s Zeitbudget.\nBild: 1 (lissabon_schichten.jpg, CC BY 4.0, Quelle in bilder.json).\n\n# Klickinhalte\n\n## C1 – Schichten wie Erdgeschichte\n- **IDs:** N1, N7, E2, E4, K1\n- **Eindruck:** Staunendes Freilegen: Übereinanderliegende Schichten werden Lage für Lage gelesen, mit offen gezeigter Sicherheitsstufe.\n- **Beleg:** N1 (Schichten lesen), N7 (Sicherheitsstufe sicher/vermutet/unklar), E2 (Schichtenlesen braucht Datierung), E4 (mehrere Zeitpunkte ergänzen das Einzelbild), Cluster K1. Bild: Lissabon-Wand mit Graffiti-Schichten. „Staunen“ ist Interpretation des Kurators, nicht im Katalog belegt.\n- **Prüfung:** Gegen „archäologisch-sicher“: N1 warnt vor Schein-Chronologie, E4 nennt undatierte Lücken zwischen Besuchen. Gegen „überfordernd-akribisch“: N7 kann Einsteiger abschrecken, daher die Stufen als Spiel mit Unsicherheit statt als Pflicht rahmen.\n\n## C2 – Geisterschrift mit Fragezeichen\n- **IDs:** N2, N8, N12, E6, E7, K1\n- **Eindruck:** Detektivische Neugier: Verblasste Wandschrift wird als Spur von Gewerbe und Stadtwandel entziffert, Deutungen bleiben Hypothesen.\n- **Beleg:** N2 (Ghost Signs entdecken), N8 (Lokalgeschichte und Typografie), N12 (sprachliche Landschaft), E6 (Bedeutung durch Lokalgeschichte), E7 (Wandschrift stützt die Deutung, trägt aber kein Format), Cluster K1. Der Eindruck „detektivisch“ ist Interpretation.\n- **Prüfung:** Gegen „nostalgisch-heimatlich“: N2 warnt, Heritage-Rahmung kann aktuelle Graffiti-Praxis abwerten; N8 warnt vor Vermutungen als Fakten. Neugierig-experimentell bleibt näher am Katalog.\n\n## C3 – Dieselbe Wand, andere Zeit\n- **IDs:** N3, N4, E3, E12, K2\n- **Eindruck:** Geduldige Experimentierlust: Eine Wand wird höchstens monatlich über sechs Monate wieder besucht und der Wandel beobachtet.\n- **Beleg:** N3 (Vergänglichkeit dokumentieren), N4 (Wiederbesuch, höchstens zehn Wände), E3 (Wiederbesuche halten Veränderung fest), E12 (Fotoreihe nur bei Stufe A, sonst Text- und Skizzenreihe), Cluster K2. N4 ist laut Katalog ein Entwurf, Wirkung nicht belegt.\n- **Prüfung:** Gegen „Rettungsdringlichkeit“: N3 warnt vor überhastetem Dokumentieren. Gegen „Überwachungsgefühl“: N4 nennt dieses Risiko ausdrücklich, daher Befristung und Skizzenalternative (E12) betonen.\n\n## C4 – Gemeinsam sehen, dann notieren\n- **IDs:** N5, N1, E5, K3\n- **Eindruck:** Leichte gemeinsame Aufmerksamkeit: Bei der Begehung wird zuerst gemeinsam beschrieben und erst dann notiert.\n- **Beleg:** N5 (gemeinsam gehen und beschreiben), N1 (Schichten lesen), E5 (Spurengang bietet Stationen), Cluster K3. N5 ist Entwurf und Hypothese H1, die Wirkung ist nicht belegt.\n- **Prüfung:** Gegen „Event-Spektakel“: N5 nennt Konflikte mit Anwohnenden und Mobilitätsgrenzen. Gegen „stilles Einzelsammeln“: der Katalog stellt das gemeinsame Beschreiben vor das Notieren.\n\n## C5 – Das gemeinsame Archiv mit Prüfsiegel\n- **IDs:** N6, N11, E8, E9, E10, K4\n- **Eindruck:** Achtsames Ausprobieren: Viele tragen bei, ein Minimum aus fünf Feldern und eine Paar-Prüfung halten den Bestand tragfähig.\n- **Beleg:** N6 (kollektives Archiv), N11 (Offenheit und Qualität), E8 (offenes Archiv braucht Minimum), E9 (Unsicherheitsangaben gehören zum Minimum), E10 (Paar-Prüfung macht tragfähig), Cluster K4. Die Wirkung ist laut Katalog nicht belegt.\n- **Prüfung:** Gegen „behördlich-kontrollierend“: N11 und E10 warnen, dass Prüfung hierarchisch werden kann; die Gruppe muss Kriterien offenlegen. Gegen „Gemeinschaftseuphorie“: N6 nennt ungleiche Verteilung der Arbeit.\n\n## C6 – Dokumentieren heißt nicht billigen\n- **IDs:** N10, N9, E13, E14, K2, K4\n- **Eindruck:** Nachdenkliche Behutsamkeit: Die Spannung zwischen Bewahren und bewusster Flüchtigkeit wird offen besprochen und von der Rechtsklärung getrennt.\n- **Beleg:** N10 (Respekt vor dem Vergehen), N9 (Rechte und Schutz, Stufen A, B, C), E13 (Spannung zu N3, beide Lesarten zulassen), E14 (Dokumentieren ist nicht billigen), Cluster K2 und K4. N9 ist Modellierung und keine Rechtsberatung.\n- **Prüfung:** Gegen „moralisierend-schwer“: N10 warnt, dass ungelöste Debatten die Gruppe lähmen können. Gegen „rebellisch-szenig“: N9 bindet an Rechte-Stufen, E14 trennt Haltung und Recht.\n\n# Stimmung\nNeugierig-experimentell mit behutsamer Zurückhaltung: Schichten und Zeitfenster ausprobieren, Unsicherheit sichtbar lassen, ohne Rettungs-, Kontroll- oder Szene-Pathos. Gegen „melancholisch-rettend“ sprechen N3 und E1 (nicht jeder Fund ist bedroht), gegen „behördlich“ N11 und E10, gegen „rebellisch“ N9 und E14. Die Gefühlswörter sind Interpretation; der Katalog belegt Interessen und Beziehungen, teils nur als Entwurf oder Hypothese.\n", "geliefert": true}, {"datei": "5-simulation.md", "rolle": "Simulations-Choreograph", "text": "# lauf6 – Ergebnis Simulations-Choreograph\n\nLaufname: lauf6 · attempt_id: simulation-v1-954cced8 · Knotentyp: Interessen\nKatalogfassung: lauf6/3-katalog.md und katalog.json des Beziehungs-Architekten (N1–N12, E1–E15, K1–K4)\nBild: bilder/wandbild_baugrube_rephoto.jpg (siehe bilder.json)\n\n## P1 – Schrift im Stadtraum\n- **sichtbar:** N12, N8, N2, E7, E6\n- **text:** Start bei der Schrift: Schrift im Stadtraum erforschen (N12) führt über E7 zu Lokalgeschichte und Typografie (N8), die über E6 verblasste Wandschrift (N2) erklärt. Noch kein Cluster, kein Archiv, keine Veröffentlichung: erst Neugier und Lesen.\n\n## P2 – Wand lesen mit Unsicherheit\n- **sichtbar:** N12, N8, N2, N1, N7, E7, E6, E2, K1\n- **text:** Neu: Schichten lesen (N1) und Datierung und Unsicherheit sichtbar machen (N7), verbunden über E2. Damit sind alle Mitglieder von K1 „Wand lesen“ (N1, N2, N7, N12) sichtbar und die Hülle erscheint. Unsicherheit wird gleich mitgelesen, damit Deutungen nicht als Tatsachen gelten.\n\n## P3 – Zeit, Verlust und Schutz\n- **sichtbar:** N12, N8, N2, N1, N7, N3, N4, N10, N9, E7, E6, E2, E1, E3, E4, E12, E13, E14, K1, K2\n- **text:** Neu: Vergänglichkeit dokumentieren (N3), Wiederbesuch derselben Wand (N4), Bewahren und Respekt vor dem Vergehen (N10) und Rechte und Schutz klären (N9). E1 führt von Wandschrift zu Verlust, E3 zum Wiederbesuch, E4 bringt ihn zurück zu den Schichten. N10 steuert über E13 die Haltung zum Verlust und über E14 den Schutz bei; E12 bindet den Wiederbesuch an geklärte Rechte. K2 „Zeit und Verlust“ erscheint. Recht und Schutz stehen damit vor Archiv und Veröffentlichung.\n\n## P4 – Gemeinsam deuten, archivieren und abwägen\n- **sichtbar:** N1, N2, N3, N4, N5, N6, N7, N8, N9, N10, N11, N12, E1, E2, E3, E4, E5, E6, E7, E8, E9, E10, E11, E12, E13, E14, E15, K1, K2, K3, K4\n- **text:** Neu: Gemeinsam gehen und beschreiben (N5), Kollektives Archiv aufbauen (N6) und Offenheit und Qualität abwägen (N11). E5 speist das Gehen in die Schichtenlesung, E15 und E11 führen Schrift und Rechte ins Archiv, E8 bis E10 koppeln Archiv, Unsicherheit und Offenheit. K3 und K4 schließen das Netz. Endzustand: alle 12 Knoten, 15 Kanten und 4 Cluster aus dem Katalog.\n\n## Hinweis (Prüfung, Risiken, Alternativen)\nPrüfung: Katalogfassung lauf6/3-katalog.md und katalog.json des Beziehungs-Architekten (N1–N12, E1–E15, K1–K4; Knotentyp Interessen); nur IDs dieser Fassung, jede Phase kumulativ, Kanten erst mit beiden Endknoten, Cluster erst mit allen Mitgliedern, Endzustand alle IDs. Keine zusätzliche Recherche wegen 180 s Zeitbudget; Belege stehen in den Vorarbeiten. Risiken: (1) P3 bringt 11 neue Elemente und ist überladen; (2) Schutz und Rechte (N9, N10) erscheinen erst in P3, ein früher Wiederbesuch wäre vorher nicht abgesichert; (3) N7 früh zeigt Unsicherheit, kann Einsteiger bremsen; (4) E8 bis E11 im Endbild sind dicht und schwer lesbar. Alternativen: (A) P3 teilen in Zeit und Verlust (N3, N4, N10) und Rechte und Schutz (N9), dann 5 Phasen; (B) N9 schon in P2 zeigen; (C) N5 mit E5 früher in P2, damit das Gemeinsame vor der Archivierung steht. Technik: Einblenden ca. 400 ms, Kanten als Strichanimation ca. 600 ms, Hüllen mit Deckkraft 0,15, ca. 4 s pro Phase. Bild: ein Beispiel aus einem Fremdarchiv (Dresden, Wandbild 2019/2020), belegt Vergänglichkeit und Wiederbesuch, nicht die Wirkung der Formate.\n", "geliefert": true}, {"datei": "6-gesamtdokument.md", "rolle": "Master-Koordinator (Gesamtdokument)", "text": "# lauf6 – Gesamtdokument: Urbane Spurensuche\n\n**Laufname:** lauf6 · **Knotentyp:** Interessen · **Zeit je Agent:** 180 Sekunden · **Bild-Min/Max:** 1/1\n**Interessen-Set:** „Urbane Spurensuche – Gemeinsames Dokumentieren von Graffiti-Schichten und verblassten Wandinschriften in der Stadt“\n\nDieses Dokument führt die fünf geprüften, veröffentlichten Ergebnisse der Fachrollen unverändert zusammen. Es fügt keine neuen Elemente hinzu und ändert keine Inhalte oder IDs. Alle Quellen wurden in diesem Lauf wegen des 3-Minuten-Budgets nicht neu abgerufen (Prüfung laut Vorarbeit in lauf3).\n\n## Gliederung\n1. Interessen-Analyse (Interessen-Analytiker)\n2. Begegnungsformate und Prinzipien (Format-Entwerfer)\n3. Katalog: Knoten N1–N12, Kanten E1–E15, Cluster K1–K4 (Beziehungs-Architekt)\n4. Emotionen und Klickinhalte C1–C6 (Emotions-Kurator)\n5. Simulationsphasen P1–P4 (Simulations-Choreograph)\n6. Bildnachweise\n\n---\n\n## 1. Interessen-Analyse\n\n# lauf6 – Interessen-Analyse: Urbane Spurensuche\n\n**Interessen-Set:** „Urbane Spurensuche – Gemeinsames Dokumentieren von Graffiti-Schichten und verblassten Wandinschriften in der Stadt“. **Knotentyp:** Interessen.\n\n## Erkenntnisgrenzen\nDie Analyse entstand unter einem Budget von 3 Minuten. Es wurden keine neuen Seiten abgerufen; die Quellen [1]–[7] wurden bereits am 09.11.2026 in einem früheren Lauf (lauf3) geprüft. Aussagen zu lokalen Gruppen sind Hypothesen, keine Empirie.\n\n## Belegte Grundlagen\n- Gemeinsames Dokumentieren von Schrift im Stadtraum ist als Forschungs- und Bürgerprojekt etabliert: Das Paderborner Projekt INGRID untersucht Graffiti und Schrift im Stadtraum [1]; die App Lingscape sammelt Sprach- und Schriftspuren im öffentlichen Raum durch Beteiligung vieler [2].\n- Verblasste Wandwerbung („Ghost Signs“) hat Archive und Gemeinschaften: der britische Hand-Painted-Advertising-Katalog (HAT) [3] und das deutsche Projekt ghostsigns.de [4].\n- Rechtliche Rahmen: Fotografieren von Werken im öffentlichen Raum ist nach § 59 UrhG grundsätzlich zulässig (Straßenpanoramafreiheit, nur von öffentlichen Orten aus) [5]; Betreten fremder befriedeter Flächen kann Hausfriedensbruch sein (§ 123 StGB) [6]; eigenes Übermalen oder Beschädigen ist Sachbeschädigung (§ 303 StGB) [7].\n\n## Muster\n1. **Schicht als Zeitachse:** Graffiti überlagern sich; Wandinschriften verblassen. Dokumentation macht Zeit sichtbar. *Gegenargument:* Schichten sind ohne Datierung schwer zu ordnen; Fotos belegen nur den Aufnahmezeitpunkt.\n2. **Kollektiv statt Einzelsammler:** Die Quellen [2][3][4] arbeiten beteiligungsorientiert. *Gegenargument:* Beteiligung ist oft ungleich verteilt, wenige tragen die meiste Arbeit.\n3. **Vergänglichkeit als Motor:** Was verschwindet, erzeugt Dringlichkeit. *Gegenargument:* Dringlichkeit kann zu überhastetem, unsauberem Dokumentieren führen.\n4. **Grenzraum Kunst/Recht:** Graffiti sind Kulturspur und zugleich oft Rechtsverstoß [6][7]. *Gegenargument:* Dokumentieren ist kein Billigen; eine Gruppe muss das ausdrücklich klären.\n\n## Spannungsfelder\n- Dokumentieren (bewahren) gegenüber Respekt vor dem Vergehen (Graffiti sind oft bewusst flüchtig).\n- Offene Veröffentlichung gegenüber Schutz von Urhebern und Orten (Gefahr, Szene-Orte preiszugeben) [5].\n- Bürgerwissenschaftliche Offenheit gegenüber Qualitätsstandards.\n\n## Gemeinschaftspotenziale (Hypothesen)\n- **H1:** Gemeinsame Begehungen mit festem Foto-Protokoll (Ort, Datum, Blickrichtung) schaffen niedrigschwellige Zugehörigkeit.\n- **H2:** Ein gemeinsames Stadtarchiv, das Wiederbesuche derselben Wand erfasst, verbindet Menschen über Zeit.\n\n## Bild\nEin Ghost Sign aus London (CC BY-SA 4.0) zeigt beispielhaft eine verblasste Wandschrift; es belegt das Phänomen, nicht lokale Verhältnisse.\n\n## Offene Fragen an die nächsten Rollen\n- **Format-Entwerfer:** Welche Begegnungsformate (Begehung, Wiederbesuch, Archivabend) passen zu Dokumentieren ohne Eingriff in die Wand?\n- **Beziehungs-Architekt:** Welche Rollen (Fotografierende, Datierende, Archivierende) und welche Regeln zu Ortsangaben und Urheberschaft?\n- **Emotions-Kurator:** Wie lassen sich Neugier und Wehmut über Vergängliches ansprechen, ohne Illegalität zu romantisieren?\n- **Simulations-Choreograph:** Wie sähe die Entwicklung derselben Wand über mehrere Wiederbesuche aus?\n- **Master-Koordinator:** Soll eine spätere Runde lokale Quellen und aktuelle Rechtsprüfung nachholen?\n\n## Quellenverzeichnis\n1. [INGRID, Universität Paderborn](https://www.uni-paderborn.de/forschungsprojekte/ingrid)\n2. [Lingscape](https://lingscape.app/about.html)\n3. [HAT Ghost Signs Katalog](https://www.hatads.org.uk/catalogue/ghostsigns.aspx)\n4. [ghostsigns.de](https://ghostsigns.de/about/)\n5. [§ 59 UrhG](https://www.gesetze-im-internet.de/urhg/__59.html)\n6. [§ 123 StGB](https://www.gesetze-im-internet.de/stgb/__123.html)\n7. [§ 303 StGB](https://www.gesetze-im-internet.de/stgb/__303.html)\n\n---\n\n## 2. Begegnungsformate und Prinzipien\n\n# lauf6 – Format-Entwurf: Urbane Spurensuche\n\n**Rolle:** Format-Entwerfer | **Lauf:** lauf6 | **attempt:** format-v1-d731da35 | **Knotentyp:** Interessen\n**Interessen-Set:** „Urbane Spurensuche – Gemeinsames Dokumentieren von Graffiti-Schichten und verblassten Wandinschriften in der Stadt“\n**Vorarbeit:** `1-analytiker.md` (lauf6) und ein Bild, gelesen. **Bild dieser Rolle:** 1 (Lissabon, siehe Abschnitt 5).\n\n**Erkenntnisgrenzen:** Das Zeitbudget beträgt 3 Minuten. Ich habe keine Quelle neu abgerufen. Die Quellen [1]–[7] stammen aus der Vorarbeit, die sich ihrerseits auf eine Prüfung in lauf3 beruft; hier sind sie also **nicht live geprüft**. **[Entwurf]** kennzeichnet meine eigenen Vorschläge. Eine soziale Wirkung wird nirgends behauptet.\n\n## 1. Kritische Prüfung der Vorarbeit\n- Die Aussagen zu INGRID [1], Lingscape [2], HAT [3] und ghostsigns.de [4] tragen nur das Interesse an gemeinsamer Schrift- und Wanddokumentation, nicht ein bestimmtes Format. Das Format ist jeweils mein Entwurf.\n- „Fotografieren ist nach § 59 UrhG grundsätzlich zulässig“ [5] ist zu glatt. § 59 gilt für *bleibende* Werke an öffentlichen Wegen; ob übermalte oder kurzlebige Graffiti darunter fallen, ist offen. Rechtsfolgen für Weitergabe und Veröffentlichung sind damit nicht geklärt. Ich unterscheide deshalb Aufnahme, interne Ablage und Veröffentlichung.\n- Hypothesen H1/H2 (Zugehörigkeit durch Begehungen, Verbindung über Wiederbesuche) bleiben Hypothesen; meine Formate sind Testanordnungen dafür.\n- Lingscape ist laut Vorarbeit eine App der Beteiligung; eine geschützte private Ablage ist nicht belegt. Sie taugt nicht als interne Ablage.\n- INGRID ist ein Forschungsprojekt, kein belegter Ort für Bürgerbeiträge.\n\n## 2. Gemeinsames Minimum je Beobachtung [Entwurf]\nZeit (grob), grober Ort (Straße oder Viertel, keine Koordinaten als Standard), Beobachtung „was liegt über was“, Sicherheit der Aussage (sicher/vermutet/unklar), Rechte-Stufe. Eine Papierkarte ist gleichwertig zur App.\n**Rechte-Stufen:** *A* geklärt (Fotoerlaubnis, Werkrechte, Personen- und Ortsschutz geprüft); *B* ungeklärt, dann **nur Textnotiz oder Skizze, kein Foto**; *C* nicht dokumentieren (erkennbare Personen, private Bereiche, Hinweise auf Szene-Orte). Ein Gruppenbeschluss ersetzt keine Rechtsklärung.\n\n## 3. Formate\n\n### Format 1 – Spurengang (Begehung)\n**Interessen:** Schichten lesen, Lokalgeschichte, Typografie, Stadtflanieren.\n**Ablauf [Entwurf], ca. 120 Min.:** 15 Min. Einführung („nur schauen, nicht berühren, nicht betreten“); Rundweg von etwa 1,2 km auf barrierearmen öffentlichen Wegen mit 4 vorab gesichteten Stationen; je Station 12 Min. gemeinsam beschreiben, dann notieren; 20 Min. Abschluss mit offenen Fragen und vorläufigen Stufen; Puffer.\n**Rahmen:** 6–12 Personen, Sitzgelegenheiten, Papierkarten, Smartphone nicht nötig.\n**Ergebnis:** Textnotizen nach Minimum, Fotos nur bei Stufe A, Liste offener Fragen.\n**Risiken → Gegenmaßnahmen:** Konflikt mit Anwohnenden → kurze Halte, Gehwegregel, Abbruch bei Beschwerde; Romantisierung von Illegalität → beide Lesarten (Kulturspur, Regelverstoß) an jeder Station zulassen; Personen im Bild → Stufe C.\n**Alternative:** Sitzstationen an zwei öffentlichen Orten mit Blick auf eine Wand; sinnvoll bei Mobilitätsgrenzen oder großer Gruppe, nicht wetterfest.\n\n### Format 2 – Wiederbesuch (befristete Wiederholungsfotografie)\n**Interessen:** Vergänglichkeit, Mehrzeitigkeit, gemeinsames Archiv (H2 der Vorarbeit).\n**Ablauf [Entwurf]:** höchstens 10 unproblematische Wände; Standpunkt in Worten festhalten („gegenüberliegender Gehweg, Laternenmast 2“); höchstens einmal im Monat wiederbesuchen, **Ende nach 6 Monaten**, dann ausdrückliche Entscheidung über Verlängerung. Nur von Hand fotografiert; **keine fest installierten Kameras und keine Auswertung fremder Überwachungsbilder**.\n**Ergebnis:** Zeitreihe je Wand, als Foto nur bei Stufe A, sonst als Text und Skizze.\n**Risiken → Gegenmaßnahmen:** wirkt wie Überwachung einer Szene → Fokus auf verblasste Wandschrift, Frist, keine Personenbilder, Ortsauswahl begründen; Ermüdung → kleines Kontingent, Tauschregel; unklare Werkrechte → Text- und Skizzenreihe.\n**Alternative:** einmalige Vorher/Nachher-Dokumentation bei angekündigter Sanierung; sinnvoll, wenn niemand sechs Monate zusagen kann.\n\n### Format 3 – Archivabend (Prüfwerkstatt, analog und digital)\n**Interessen:** Schichten ordnen, Qualität gegenüber Offenheit, Datierung.\n**Ablauf [Entwurf], ca. 2 Std. in einem barrierefreien Raum:** Beiträge sammeln (Papier oder Bildschirm); Paar-Prüfung gegen das Minimum; Schichtschema zeichnen (unten nach oben) mit markierter Unsicherheit; Rechte-Runde nur für den Klärungsweg von B-Fällen; Entscheidung, was wo gezeigt wird.\n**Ergebnis:** geprüfte Beobachtungen, Schichtschemata, Liste geklärter und ungeklärter Rechtefälle.\n**Risiken → Gegenmaßnahmen:** Überforderung → nur fünf Minimumfelder verpflichtend; subjektive oder hierarchische Auswahl → Paar-Prüfung, dokumentierte Kriterien, Widerspruch; ungeklärtes „rutscht“ in die Veröffentlichung → Standard ist Zurückhaltung.\n**Alternative:** asynchrone Prüfrunde an Textnotizen; sinnvoll bei verstreuten Beteiligten, mit analoger Abgabestelle.\n\n## 4. Prinzipien [Entwurf]\n1. Dokumentieren, nie verändern (kein Berühren, Reinigen, Übermalen; Grenze § 303 StGB [7]).\n2. Öffentlicher Blick, kein Betreten (§ 123 StGB [6]), Aufnahmen auf Augenhöhe, ohne Leitern und Drohnen (praktische Regel, keine Rechtsauslegung).\n3. Zurückhaltung bei ungeklärten Rechten: Textnotiz statt Foto.\n4. Orte grob statt genau; Wand statt Mensch.\n5. Analoger und digitaler Beitrag sind gleichwertig.\n6. Unsicherheit sichtbar machen: Datierung und Reihenfolge der Schichten tragen eine Sicherheitsstufe.\n7. Dokumentieren heißt nicht billigen; die Gruppe klärt das ausdrücklich.\n\n**Messgrößen ohne Zielwerte:** Anteil Beobachtungen mit vollständigem Minimum; Verteilung auf A/B/C; Anteil analoger Beiträge; geplante gegenüber erfolgten Wiederbesuchen; Konflikte und deren Bearbeitung.\n\n## 5. Bild\n![Graffiti-Schichten, LX Factory Lissabon](bilder/lissabon_graffiti_schichten.jpg)\nDas Foto (Dale Cruse, CC BY 4.0, [Wikimedia Commons](https://commons.wikimedia.org/wiki/File:Weathered_Mural_and_Graffiti_Layers_%E2%80%93_LX_Factory,_Lisbon_(54709876316).jpg)) zeigt übereinander liegende Graffiti-Schichten. Es belegt das Phänomen, nicht lokale Verhältnisse und nicht die Wirkung der Formate.\n\n## 6. Offene Fragen an den Beziehungs-Architekten (nur Fragen)\n- Wer dokumentiert die Klärung eines B-Falls, und wie läuft ein Widerspruch?\n- Wer entscheidet über Verlängerung oder Ende von Format 2?\n- Welche interne Ablage mit welchen Zugriffsregeln, und wer löscht Stufe-C-Material?\n- Wie wird die Spannung zwischen Bewahren und Respekt vor dem Vergehen verhandelt?\n\n## 7. Quellen (aus der Vorarbeit, nicht neu abgerufen)\n[1] [INGRID, Universität Paderborn](https://www.uni-paderborn.de/forschungsprojekte/ingrid) · [2] [Lingscape](https://lingscape.app/about.html) · [3] [HAT Ghost Signs Katalog](https://www.hatads.org.uk/catalogue/ghostsigns.aspx) · [4] [ghostsigns.de](https://ghostsigns.de/about/) · [5] [§ 59 UrhG](https://www.gesetze-im-internet.de/urhg/__59.html) · [6] [§ 123 StGB](https://www.gesetze-im-internet.de/stgb/__123.html) · [7] [§ 303 StGB](https://www.gesetze-im-internet.de/stgb/__303.html)\n\n---\n\n## 3. Katalog\n\nlauf6 – Ergebnis Beziehungs-Architekt\n\nLaufname: lauf6 · attempt_id: architektur-v1-5b1ec8b3 · Bildgrenze: Min 1, Max 1 (genutzt: 1)\nKnotentyp: Interessen · Set: Urbane Spurensuche – Gemeinsames Dokumentieren von Graffiti-Schichten und verblassten Wandinschriften in der Stadt\n\nQuellenbezug: ausschließlich lauf6/1-analytiker.md (Quellen [1]–[7]) und lauf6/2-format.md. Die Quellen sind in diesem Lauf nicht neu abgerufen, die Prüfung stammt laut Vorarbeit aus lauf3 (Zeitbudget 3 Minuten, keine eigene Recherche). [Entwurf] und Modellierung kennzeichnen Entscheidungen der Vorrollen bzw. meine; eine soziale Wirkung wird nicht behauptet. Rechtliches nur als Orientierung laut Vorarbeit, keine Rechtsberatung.\n\n## Knoten\n\n### N1 – Schichten lesen\n- Text: Interesse, Überlagerungen von Graffiti und Wandschrift in ihrer Reihenfolge zu beschreiben.\n- Beleg: 1-analytiker.md Muster 1 (Schicht als Zeitachse); 2-format.md Format 1 und 3, Prinzip 6; Bild bilder/wandbild_baugrube_rephoto.jpg zeigt dieselbe Wand in zwei Zuständen.\n- Gegenargument: Ohne Datierung entsteht Schein-Chronologie; Fotos belegen nur den Aufnahmezeitpunkt (1-analytiker.md Muster 1, Gegenargument).\n\n### N2 – Verblasste Wandschrift (Ghost Signs) entdecken\n- Text: Interesse an handgemalter, verblassender Wandwerbung als Spur von Gewerbe und Stadtwandel.\n- Beleg: 1-analytiker.md Belegte Grundlagen, Quellen [3][4]; 2-format.md Format 1 (Lokalgeschichte, Typografie).\n- Gegenargument: Die Rahmung als Heritage kann aktuelle Graffiti-Praxis abwerten (2-format.md Format 1, Risiko Romantisierung).\n\n### N3 – Vergänglichkeit dokumentieren\n- Text: Interesse, verschwindende Wandspuren festzuhalten, bevor sie überdeckt oder entfernt werden.\n- Beleg: 1-analytiker.md Muster 3 (Vergänglichkeit als Motor); 2-format.md Format 2, Alternative Vorher/Nachher; Bild bilder/wandbild_baugrube_rephoto.jpg.\n- Gegenargument: Dringlichkeit kann zu überhastetem, unsauberem Dokumentieren führen (1-analytiker.md Muster 3).\n\n### N4 – Wiederbesuch derselben Wand\n- Text: Interesse, höchstens zehn Wände höchstens monatlich über sechs Monate erneut aufzunehmen.\n- Beleg: 2-format.md Format 2 [Entwurf]; 1-analytiker.md Hypothese H2 (Stadtarchiv mit Wiederbesuchen).\n- Gegenargument: Wirkt wie Überwachung einer Szene; H2 ist eine Hypothese, die Methode ist nicht belegt (2-format.md Abschnitt 1 und Format 2).\n\n### N5 – Gemeinsam gehen und beschreiben\n- Text: Interesse an der Begehung mit vorab gesichteten Stationen: erst gemeinsam beschreiben, dann notieren.\n- Beleg: 2-format.md Format 1 [Entwurf]; 1-analytiker.md Hypothese H1 (Begehungen mit Foto-Protokoll).\n- Gegenargument: Konflikt mit Anwohnenden und Mobilitätsgrenzen; H1 ist eine Hypothese (2-format.md Format 1, Risiken).\n\n### N6 – Kollektives Archiv aufbauen\n- Text: Interesse, Beobachtungen vieler in einem gemeinsamen, geprüften Bestand zu sammeln.\n- Beleg: 1-analytiker.md Muster 2, Quellen [2][3][4]; 2-format.md Format 3 (Archivabend).\n- Gegenargument: Beteiligung ist ungleich verteilt, wenige tragen die Arbeit (1-analytiker.md Muster 2, Gegenargument).\n\n### N7 – Datierung und Unsicherheit sichtbar machen\n- Text: Interesse daran, Reihenfolge und Alter von Schichten mit einer Sicherheitsstufe (sicher, vermutet, unklar) zu führen.\n- Beleg: 2-format.md Prinzip 6 und Abschnitt 2 (Minimum); 1-analytiker.md Muster 1, Gegenargument zur Datierung.\n- Gegenargument: Zusätzlicher Aufwand kann Einsteiger abschrecken (2-format.md Format 3, Risiko Überforderung).\n\n### N8 – Lokalgeschichte und Typografie\n- Text: Interesse, Wandschrift nach Schriftform und Gewerbegeschichte des Viertels zu deuten.\n- Beleg: 2-format.md Format 1 (Interessen Lokalgeschichte, Typografie); 1-analytiker.md Quellen [3][4].\n- Gegenargument: Deutungen können Vermutungen zu Fakten machen; ohne Quellenangabe nicht belegt (2-format.md Abschnitt 7, nicht neu abgerufen).\n\n### N9 – Rechte und Schutz klären\n- Text: Interesse, Aufnahme, interne Ablage und Veröffentlichung getrennt zu behandeln: Stufe A geklärt, B nur Textnotiz oder Skizze, C nicht dokumentieren.\n- Beleg: 2-format.md Abschnitt 1 und 2; 1-analytiker.md Quellen [5][6][7]. § 59 UrhG für übermalte Graffiti ist laut 2-format.md offen; Gruppenbeschluss ersetzt keine Rechtsklärung.\n- Gegenargument: Strenge Stufen bremsen Beiträge, B-Fälle bleiben lange ungeklärt (Modellierung, keine Rechtsberatung).\n\n### N10 – Bewahren und Respekt vor dem Vergehen\n- Text: Interesse, die Spannung zwischen Dokumentieren und bewusster Flüchtigkeit von Graffiti auszuhalten und zu besprechen.\n- Beleg: 1-analytiker.md Spannungsfelder 1 und Muster 4; 2-format.md Prinzip 7 (Dokumentieren heißt nicht billigen).\n- Gegenargument: Das Thema kann Gruppen lähmen, wenn es nie entschieden wird (Modellierung, 2-format.md Abschnitt 6).\n\n### N11 – Offenheit und Qualität abwägen\n- Text: Interesse, bürgerwissenschaftliche Offenheit mit einem fünffeldrigen Qualitätsminimum zu verbinden.\n- Beleg: 1-analytiker.md Spannungsfeld 3; 2-format.md Abschnitt 2 und Format 3 (Paar-Prüfung).\n- Gegenargument: Prüfung kann subjektiv oder hierarchisch werden; Wirkung nicht belegt (2-format.md Format 3).\n\n### N12 – Schrift im Stadtraum erforschen\n- Text: Interesse an Wandschrift als Teil der sprachlichen Landschaft der Stadt.\n- Beleg: 1-analytiker.md Quellen [1][2]; 2-format.md Abschnitt 1 (INGRID nur Forschungsprojekt, Lingscape ohne belegte private Ablage).\n- Gegenargument: Weder INGRID noch Lingscape sind als Ablage für Gruppenbeiträge belegt (2-format.md Abschnitt 1).\n\n## Kanten\n\n| ID | Von | Nach | Bedeutung, Beleg, Gegenargument |\n|---|---|---|---|\n| E1 | N2 | N3 | Verblassende Wandschrift ist ein Anlass zur Dokumentation von Verlust (1-analytiker.md Muster 3, Quellen [3][4]). Gegen: nicht jeder Fund ist bedroht. |\n| E2 | N1 | N7 | Schichtenlesen braucht Datierung mit Sicherheitsstufe (1-analytiker.md Muster 1, Gegenargument; 2-format.md Prinzip 6). |\n| E3 | N3 | N4 | Wiederbesuche halten Veränderung fest (2-format.md Format 2). Modellierung; Wirkung nicht belegt. |\n| E4 | N4 | N1 | Mehrere Zeitpunkte ergänzen die Schichtenlesung im Einzelbild, ersetzen sie nicht (2-format.md Format 2, Format 3). Gegen: Zwischen Besuchen bleibt Veränderung undatiert. |\n| E5 | N5 | N1 | Der Spurengang bietet Stationen, an denen gemeinsam Schichten beschrieben werden (2-format.md Format 1). |\n| E6 | N8 | N2 | Lokalgeschichte und Typografie geben verblasster Wandschrift Bedeutung (2-format.md Format 1; 1-analytiker.md Quellen [3][4]). |\n| E7 | N12 | N8 | Wandschrift als sprachliche Landschaft stützt die Deutung von Schrift (1-analytiker.md Quellen [1][2]). Gegen: Quellen tragen nur das Interesse, nicht ein Format. |\n| E8 | N6 | N11 | Ein offenes Archiv braucht ein Minimum, sonst sinkt die Qualität (1-analytiker.md Spannungsfeld 3; 2-format.md Abschnitt 2). |\n| E9 | N7 | N11 | Unsicherheitsangaben sind Teil des Minimums (fünf Felder) (2-format.md Abschnitt 2). |\n| E10 | N11 | N6 | Paar-Prüfung und dokumentierte Kriterien machen den Bestand tragfähig (2-format.md Format 3). Gegen: kann hierarchisch werden. |\n| E11 | N9 | N6 | Rechte-Stufen legen fest, was ins Archiv darf; B bleibt Textnotiz oder Skizze (2-format.md Abschnitt 2, Format 3 Rechte-Runde). |\n| E12 | N9 | N4 | Fotoreihe nur bei Stufe A, sonst Text- und Skizzenreihe (2-format.md Format 2, Risiko unklare Werkrechte). |\n| E13 | N10 | N3 | Spannung: Der Drang zu bewahren steht gegen den Respekt vor bewusster Flüchtigkeit (1-analytiker.md Spannungsfeld 1). Beide Lesarten zulassen. |\n| E14 | N10 | N9 | Dokumentieren ist nicht billigen; die Grupp  2020 vor und hinter einer Baugrube; belegt den Anlass Vergänglichkeit und das Prinzip Wiederbesuch (N3, N4), nicht die Wirkung der Formate. | https://commons.wikimedia.org/wiki/File:2019071302_Vergleich_Graffitti_aufgemalte_Fenster_und_Baugrube_Henrici-_Ecke_Teichstrasse_07-2019-03-2020.jpg, VSchagow, CC BY-SA 4.0 |\n| 4-emotion-lissabon_schichten.jpg | Emotions-Kurator | Zeigt übereinander liegende Graffiti-Schichten auf verwitterter Wand; macht den Eindruck von C1 „Schichten wie Erdgeschichte“ sichtbar (Fremdbeispiel aus Lissabon, keine lokale Empirie, derselbe Fund wie im Bild des Format-Entwerfers). | https://commons.wikimedia.org/wiki/File:Weathered_Mural_and_Graffiti_Layers_%E2%80%93_LX_Factory,_Lisbon_(54709876316).jpg, Urheber Dale Cruse, CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/) |\n| 5-simulation-wandbild_baugrube_rephoto.jpg | Simulations-Choreograph | Zeigt dasselbe gemalte Wandbild in Dresden 2019 und 2020 vor und hinter einer Baugrube: belegt Vergänglichkeit und Wiederbesuch (N3, N4) für Phase 3; Beispiel aus einem Fremdarchiv, keine lokale Empirie. | https://commons.wikimedia.org/wiki/File:2019071302_Vergleich_Graffitti_aufgemalte_Fenster_und_Baugrube_Henrici-_Ecke_Teichstrasse_07-2019-03-2020.jpg, Urheber VSchagow, CC BY-SA 4.0 (https://creativecommons.org/licenses/by-sa/4.0/) |\n\nDas Bild des Masters (`bilder/master_lissabon_graffiti_schichten.jpg`) ist eine Kopie des bereits im Lauf liegenden Commons-Bildes des Format-Entwerfers (Dale Cruse, CC BY 4.0), siehe bilder.json im Staging.\n\n![Graffiti-Schichten, LX Factory Lissabon](bilder/master_lissabon_graffiti_schichten.jpg)\n", "geliefert": true}, {"datei": "summary.md", "rolle": "Master-Koordinator (Summary)", "text": "# Management-Summary lauf6 – Urbane Spurensuche\n\n## Aufgabenstellung\nDas Labor für neue menschliche Gemeinschaften erforscht, wie Menschen mit ungewöhnlichen Interessen echte Freundschaften und Gemeinschaften aufbauen können. In diesem Lauf wurde das Interessen-Set „Urbane Spurensuche – Gemeinsames Dokumentieren von Graffiti-Schichten und verblassten Wandinschriften in der Stadt“ mit dem Knotentyp „Interessen“ untersucht. Der Lauf sollte Begegnungsformate, ein Beziehungsmodell, emotionale Zugänge und eine Simulation in Phasen liefern.\n\n## Ergebnis in Kürze\nDie Idee trägt als Gemeinschaftsanlass: Gemeinsames Beschreiben von Wandschichten und verblasster Wandschrift (Ghost Signs) ist als Forschungs- und Bürgerprojekt etabliert, etwa bei INGRID (Paderborn), Lingscape, dem britischen HAT-Katalog und ghostsigns.de.\n\nEntworfen wurden drei Formate. Der Spurengang ist eine Begehung von etwa 120 Minuten mit 6 bis 12 Personen. Der Wiederbesuch fotografiert höchstens zehn Wände höchstens monatlich und endet nach 6 Monaten. Der Archivabend ist eine Prüfwerkstatt mit Paar-Prüfung. Dazu kommen sieben Prinzipien, darunter „dokumentieren, nie verändern“, „Orte grob statt genau“ und „Dokumentieren heißt nicht billigen“.\n\nDas Beziehungsmodell hat 12 Interessen-Knoten, 15 Kanten und 4 Cluster. Die Emotionen sind in sechs Klickinhalten gefasst, Stimmung „neugierig-experimentell mit behutsamer Zurückhaltung“. Die Simulation zeigt vier Phasen: Schrift im Stadtraum, Wand lesen mit Unsicherheit, Zeit, Verlust und Schutz, gemeinsam deuten, archivieren und abwägen.\n\n## Risiken mit Gegenmaßnahmen\n- **Recht:** Ob das Fotografieren kurzlebiger oder übermalter Graffiti unter § 59 UrhG fällt, ist offen. Gegenmaßnahme: Rechte-Stufen A, B und C. Bei ungeklärten Rechten gibt es nur Textnotiz oder Skizze, bei erkennbaren Personen oder Szene-Orten keine Dokumentation. Das Modell ist keine Rechtsberatung.\n- **Überwachungsgefühl und Konflikte mit Anwohnenden:** Gegenmaßnahmen sind Befristung auf 6 Monate, keine fest installierten Kameras, kurze Halte und Abbruch bei Beschwerde.\n- **Romantisierung von Illegalität oder Abwertung aktueller Graffiti-Praxis:** Gegenmaßnahme ist, beide Lesarten (Kulturspur und Regelverstoß) zuzulassen und Haltung und Recht zu trennen.\n- **Schein-Chronologie:** Ohne Datierung ist die Schichtfolge unsicher. Jede Beobachtung trägt eine Sicherheitsstufe (sicher, vermutet, unklar).\n- **Ungleiche Beteiligung und hierarchische Prüfung im Archiv:** Gegenmaßnahmen sind fünf Pflichtfelder, Paar-Prüfung und offengelegte Kriterien.\n\n## Schwache Beleglage und ungeprüfte Annahmen\n- Die Quellen wurden wegen des 3-Minuten-Budgets in diesem Lauf nicht neu abgerufen. Ihre Prüfung stammt laut Vorarbeit aus lauf3.\n- Eine soziale Wirkung der Formate ist nirgends belegt. Die Hypothesen H1 (Begehungen schaffen Zugehörigkeit) und H2 (Wiederbesuche verbinden über Zeit) sind ungetestet, die Formate sind Testanordnungen.\n- Aussagen zu lokalen Gruppen sind Hypothesen. Die Bilder stammen aus Fremdarchiven (London, Lissabon, Dresden) und belegen nur das Phänomen.\n- Gefühlswörter der Emotionen sind Interpretation des Kurators.\n- Die Simulation nennt eigene Risiken: Phase 3 ist mit 11 neuen Elementen überladen, Recht und Schutz erscheinen erst dort, und das Endbild ist dicht. Als Alternativen werden genannt: Phase 3 teilen, Rechte und Schutz (N9) früher zeigen, Gemeinsames (N5) vor das Archiv ziehen.\n\n## Offene Entscheidungen\n- Wer dokumentiert die Klärung eines B-Falls, und wie läuft ein Widerspruch?\n- Wer entscheidet über Verlängerung oder Ende des Wiederbesuchs nach 6 Monaten?\n- Welche interne Ablage mit welchen Zugriffsregeln gilt, und wer löscht Material der Stufe C?\n- Soll eine spätere Runde lokale Quellen und eine aktuelle Rechtsprüfung nachholen?\n- Welche der genannten Simulations-Alternativen wird übernommen?\n", "geliefert": true}, {"datei": "bilder.md", "rolle": "Bildliste aller Bots", "text": "| Dateiname | Rolle | Begründung | Quelle |\n| --- | --- | --- | --- |\n| 1-analytiker-ghostsign_tottenham.jpg | Interessen-Analytiker | Verblasstes handgemaltes Wandwerbeschild (Ghost Sign) im Stadtraum: zeigt Vergänglichkeit von Wandschrift und Schichtung. Beispiel aus einem Fremdarchiv, keine lo lder/1-analytiker-Faded_wall_sign_-_geograph_org_uk_-_2090550_jpg.jpg, bilder/1-analytiker-img2019-09-26_Faded_painted_ghost_sign_on_the_Post_Office_High.jpg, bilder/1-analytiker-Faded_sign_Victoria_Road_-_geograph_org_uk_-_4038490_jpg.jpg, bilder/1-analytiker-Ghost_sign_painted_wall_advert_Tottenham_High_Road_London_jp.jpg, bilder/1-analytiker-Ghost_sign_in_Poznan_jpg.jpg, bilder/1-analytiker-Wills_s_Gold_Flake_cigarettes_Ghost_sign_painted_wall_advert.jpg, bilder/1-analytiker-Weathered_Mural_and_Graffiti_Layers_LX_Factory_Lisbon_54709876316_jpg.jpg, bilder/1-analytiker-34thStreetWall_PeelingPaint_jpg.jpg (Bilder: 11)"}, {"zeit": "2026-11-10T00:18:34+01:00", "revision": 7, "ereignis": "rolle_gestartet", "rolle": "format", "text": "Versuch 1/2, Rollenfrist 2026-11-10T00:23:34+01:00"}, {"zeit": "2026-11-10T00:19:01+01:00", "revision": 8, "ereignis": "auftrag_bestaetigt", "rolle": "format", "text": "format-v1-7b87daa4"}, {"zeit": "2026-11-10T00:19:38+01:00", "revision": 9, "ereignis": "lauf_aborted", "rolle": null, "text": "Abbruch durch Master: Read verweigert Zugriff auf geprüfte Vorarbeit E:\\Drive\\KI\\Grok\\Gemeinschaft_Labor\\laeufe\\lauf4\\1-analytiker.md: Path is outside the allowed local-exec root. Keine Umgehung; Inhaltsprüfung und Integration blockiert."}], "fehlerbericht": "fehlerbericht.md"}, "katalog.json": null, "klick.json": null, "phasen.json": null}, "md": [{"datei": "1-analytiker.md", "rolle": "Interessen-Analytiker", "text": "# lauf4 – Interessen-Analytiker\r\n**Lauf:** lauf4  \r\n**Knotentyp:** Interessen  \r\n**Interessen-Set:** Urbane Spurensuche – Gemeinsames Dokumentieren von Graffiti-Schichten und verblassten Wandinschriften in der Stadt  \r\n**Attempt:** analytiker-v2-7800e01c  \r\n**Abrufdatum Quellen:** 10.11.2026 (Europe/Berlin)  \r\n**Hinweis:** Eigenstaendige Facharbeit; Hypothesen sind als solche markiert. Keine Bindungsversprechen, keine erfundenen Personae, keine Ausarbeitung anderer Rollen.\r\n\r\n## 1. Kurzanalyse des Interessen-Sets\r\nDas Set verbindet zwei verwandte, aber nicht identische Beobachtungsgegenstaende: (a) **Graffiti-Schichten** (Uebermalungen, Tags, Pieces, Stencil als zeitliche Sedimente an Waenden) und (b) **verblasste Wandinschriften / Ghost Signs** (historische Fassadenwerbung und handgemalte Schrift, die durch Verwitterung und Umbauten lesbar bleibt oder verschwindet). Gemeinsam ist das Interesse an **Sichtbarkeit, Vergaenglichkeit und Schichtigkeit** urbaner Schrift. Das gemeinschaftliche Dokumentieren zielt auf geteilte Praxis (Foto, Annotation, Kartierung), nicht auf Besitz der Orte selbst.\r\n\r\n**Tatsache:** Citizen-Science- und Archivprojekte fuer Linguistic Landscapes bzw. Ghost Signs existieren bereits und bieten methodische Anker [1][2][3][4].  \r\n**Hypothese (Eigeninterpretation):** Ein gemeinschaftliches Format, das Graffiti-Schichten *und* Ghost Signs bewusst parallel fuehrt, kann Spannungen zwischen Subkultur-Dokumentation und Heritage-Aesthetik produktiv machen – sofern Rechte, Sicherheit und Publikationsregeln klar getrennt werden.\r\n\r\n## 2. Muster (4)\r\n### Muster A – Vergaenglichkeit als gemeinsamer Takt\r\nGhost Signs und Graffiti-Schichten teilen den Zeitdruck: Renovierung, Abriss und Uebermalung loeschen Spuren. HAT betont, dass viele Zeichen jaehrlich verschwinden und Dokumentation der Verlustvermeidung dient [3]. Ghostsigns.de beschreibt Relikte, die durch Renovierung und Abriss seltener werden [4].  \r\n**Gegenargument:** Vergaenglichkeit kann Motivationskiller sein („eh bald weg“) oder umgekehrt fetischisieren (Ruin-Porn), statt sorgfaeltige Dokumentation zu foerdern.\r\n\r\n### Muster B – Schichtung als Lesetechnik\r\nINGRID ermoeglicht systematische Forschung zu Bildaesthetik, Schriftbildlichkeit und stadtraeumlicher Verortung ueber lange Zeitraeume anhand grosser Korpora [2]. Lingscape betont, dass Crowdsourcing nie ein vollstaendiges Abbild liefert, sondern ein „linguistic crowdscape“ der Wahrnehmung [1].  \r\n**Hypothese:** Gemeinsames Dokumentieren braucht explizite Schicht-Annotation (was liegt ueber/unter was; Datum; Lesbarkeit), sonst entstehen nur schoene Einzelbilder ohne vergleichbare Daten.\r\n\r\n### Muster C – Typografie und Handwerk als Bruecke\r\nHistorische Signwriting-Aesthetik (Ghost Signs) und Graffiti-Schriftlichkeit teilen Interesse an Buchstabe, Flaeche, Kontrast – bei unterschiedlichen sozialen Codes. HAT nennt Typografie und Lettering als Evidenzfelder [3].  \r\n**Gegenargument:** Eine zu starke „Schoenschrift“-Rahmenung kann illegale oder konflikthafte Graffiti-Praxis aesthetisieren und rechtliche/ethische Risiken ausblenden.\r\n\r\n### Muster D – Partizipation braucht Infrastruktur, nicht nur Begeisterung\r\nLingscape bietet App, Karte, Satellitenprojekte und Repository [1]; INGRID bietet annotierte Forschungsdaten und Linked-Data-Zugang [2].  \r\n**Gegenargument:** Infrastruktur allein erzeugt keine Gemeinschaft; ohne klare Rollen, Moderationsregeln und lokale Treffpunkte droht reine Upload-Isolation.\r\n\r\n## 3. Spannungsfelder\r\n1. **Dokumentation vs. Illegalitaet:** Fotografieren an oeffentlich einsehbaren Orten ist nicht dasselbe wie Herstellen oder Foerdern von Sachbeschaedigung. In DE sind u. a. §§ 123, 303 StGB (Hausfriedensbruch, Sachbeschaedigung) relevant; das Interesse „Dokumentieren“ darf nicht als Aufforderung zu illegalem Sprayen gelesen werden (Rechtsorientierung, keine Rechtsberatung).  \r\n2. **Panoramafreiheit vs. Werkrechte:** § 59 UrhG erlaubt unter Voraussetzungen die Abbildung bleibend an oeffentlichen Wegen/Strassen/Plaetzen befindlicher Werke (aeusserere Ansicht bei Bauwerken) [5]. **Wichtig:** Ein legaler Aufnahmeort bedeutet nicht automatisch eine freie Publikationslizenz fuer Dritte; Foto-Urheberrecht und ggf. Rechte am abgebildeten Werk bleiben zu trennen.  \r\n3. **Heritage vs. Subkultur:** Ghost-Sign-Archive [3][4] wirken bewahrend; Graffiti-Dokumentation kann als Ueberwachung oder als Hommage empfunden werden.  \r\n4. **Vollstaendigkeit vs. Wahrnehmung:** Lingscape markiert explizit die Luecke zwischen Stadt und dem, was Teilnehmende *bemerken* [1].\r\n\r\n## 4. Gemeinschaftspotenziale\r\n- **Geteilte Feldpraxis:** Spaziergaenge mit klaren Dokumentationsregeln (Motivwahl, Metadaten, Sicherheit).  \r\n- **Vergleichbare Annotation:** Schicht, Sprache/Schrift, Zustand, Ort, Datum – angelehnt an Linguistic-Landscape- und Graffiti-Forschungsdaten [1][2].  \r\n- **Lokale Fokusgebiete:** Wiederholte Besuche derselben Wand machen Zeitachsen sichtbar (Hypothese: Stabilitaet der Gruppe steigt mit wiederkehrenden Orten).  \r\n- **Lernressource:** Lingscape nennt Schulen/Unis als Lernkontext [1]; uebertragbar auf Stadtteilinitiativen (Hypothese).\r\n\r\n**Gegenargument zum Potenzial:** Ohne klare Trennung von „Beobachten/Fotografieren“ und „Eingreifen in die Wand“ riskiert die Gemeinschaft Reputations- und Rechtsprobleme; ohne Kuratierung droht Datenmuell.\r\n\r\n## 5. Alternativen und Risiken (knapp)\r\n- **Alternative A:** Nur Ghost Signs (niedrigeres Konfliktpotenzial, Heritage-Frame) – Risiko: Graffiti-Interessierte springen ab.  \r\n- **Alternative B:** Nur digitale Sammlung ohne Treffen – Risiko: schwache Bindung.  \r\n- **Risiko C:** Veroeffentlichung von Adressen frischer illegaler Werke kann Escalation/Polizeiinteresse ausloesen.  \r\n- **Risiko D:** Lizenzchaos bei Upload (Foto vs. Werk vs. Marke).\r\n\r\n## 6. Rechtsorientierung DE (knapp, keine Beratung)\r\n- **§ 59 UrhG:** Abbildung bestimmter bleibend oeffentlicher Werke unter Voraussetzungen zulaessig; Bauwerke nur aeussere Ansicht; Vervielfaeltigungen nicht an Bauwerken vornehmen [5].  \r\n- **§§ 123 / 303 StGB:** Hausfriedensbruch bzw. Sachbeschaedigung – Dokumentation ersetzt keine Erlaubnis zum Betreten/Veraendern.  \r\n- **Legal fotografieren ≠ freie Weitergabe-Lizenz:** Community-Publikation braucht eigene Rechteklaerung (Foto-Urheber, ggf. Werk, Persoenlichkeits-/Sicherheitsaspekte).\r\n\r\n## 7. Offene Fragen an naechste Rollen\r\n**Beziehungs-Architekt:** Welche Rollen (Feldgaenger:in, Annotator:in, Rechte-Check, Kuratierung) verhindern Upload-Isolation ohne Hierarchieueberhang?  \r\n**Emotions-Kurator:** Wie wird der Ambivalenzraum zwischen Nostalgie (Ghost Signs) und Adrenalin/Subkultur (Graffiti) gehalten, ohne Moralisieren oder Verharmlosen?  \r\n**Simulations-Choreograph:** Welches Szenario testet Schicht-Annotation an *einer* wiederkehrenden Wand ueber mehrere Wochen?  \r\n**Format-Entwerfer:** Welches Minimal-Metadaten-Schema (Ort, Datum, Schichtnotiz, Lesbarkeit, Rechtehinweis) ist alltagstauglich?  \r\n**Master-Koordinator:** Welche Guardrails (keine Anleitungen zu illegalem Sprayen; keine Adress-Doxxing frischer illegaler Werke) gelten laufuebergreifend?\r\n\r\n## 8. Erkenntnisgrenzen\r\n- Kurzfristige Live-Abrufe; keine Vollrechtspruefung, keine Feldbegehung.  \r\n- Commons-API zeitweise HTTP 429; Bildauswahl daher begrenzt, aber mindestens 10 passende Motive mit Lizenznachweis.  \r\n- Hypothesen zu Gruppenbindung und Parallelfuehrung Ghost Sign/Graffiti sind interpretativ, nicht empirisch in diesem Lauf getestet.  \r\n- INGRID-Bestand quantitativ projektiert („mehr als 100.000“) laut Projektseite [2]; eigene Nachzaehlung nicht erfolgt.\r\n\r\n## Quellenverzeichnis\r\n[1] Lingscape – About: [https://lingscape.app/about.html](https://lingscape.app/about.html) (Abruf 10.11.2026)  \r\n[2] INGRID – Universitaet Paderborn: [https://www.uni-paderborn.de/forschungsprojekte/ingrid](https://www.uni-paderborn.de/forschungsprojekte/ingrid) (Abruf 10.11.2026)  \r\n[3] History of Advertising Trust – Ghostsigns Catalogue: [https://www.hatads.org.uk/catalogue/ghostsigns.aspx](https://www.hatads.org.uk/catalogue/ghostsigns.aspx) (Abruf 10.11.2026)  \r\n[4] Ghostsigns.de – Ueber den Blog: [https://ghostsigns.de/about/](https://ghostsigns.de/about/) (Abruf 10.11.2026)  \r\n[5] § 59 UrhG – Werke an oeffentlichen Plaetzen: [https://www.gesetze-im-internet.de/urhg/__59.html](https://www.gesetze-im-internet.de/ur
